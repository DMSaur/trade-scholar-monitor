<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贸易学者动向 · 每日监控</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --border:#e5e2d8; --ink:#1c1b17;
  --sub:#6b675c; --accent:#0e5f5b; --accent-soft:#e3efee;
  --top5:#8a2b23; --nber:#1e3a5f; --scholar:#0e5f5b; --tweet:#4a4a48;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65; font-size:15px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 60px}
header{padding:34px 0 8px}
h1{font-size:25px;font-weight:700;letter-spacing:.5px}
.subtitle{color:var(--sub);font-size:13.5px;margin-top:4px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:3px 12px;color:var(--sub);
}
.chip b{color:var(--ink);font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.top5{background:var(--top5)}.dot.nber{background:var(--nber)}
.dot.scholar{background:var(--scholar)}.dot.tweet{background:var(--tweet)}
.toolbar{
  position:sticky;top:0;z-index:10;background:var(--bg);
  padding:14px 0 10px;border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{
  border:1px solid var(--border);background:var(--card);color:var(--sub);
  border-radius:8px;padding:5px 12px;font-size:13.5px;cursor:pointer;
}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .n{font-size:11.5px;opacity:.75;margin-left:3px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{
  border:0;background:var(--card);color:var(--sub);padding:5px 12px;
  font-size:13px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#search{
  flex:1;min-width:160px;border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink);
  outline:none;
}
#search:focus{border-color:var(--accent)}
#scholarFilter{
  border:1px solid var(--border);border-radius:8px;padding:6px 8px;
  font-size:13px;background:var(--card);color:var(--ink);max-width:170px;
}
.datehead{
  margin:26px 0 10px;font-size:13px;font-weight:700;color:var(--sub);
  letter-spacing:1px;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;
}
.card:hover{border-color:#cfcaba}
.card-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{
  font-size:11px;font-weight:700;color:#fff;border-radius:5px;
  padding:1.5px 7px;letter-spacing:.3px;
}
.badge.top5{background:var(--top5)}.badge.nber{background:var(--nber)}
.badge.scholar{background:var(--scholar)}.badge.tweet{background:var(--tweet)}
.venue{font-size:12px;color:var(--sub)}
.card h2{font-size:15.5px;font-weight:600;line-height:1.5;margin:2px 0;
  overflow-wrap:anywhere}
.card h2 a{color:var(--ink);text-decoration:none}
.card h2 a:hover{color:var(--accent);text-decoration:underline}
.authors{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.title-en{font-size:12.5px;color:var(--sub);margin:-2px 0 4px;line-height:1.45;
  overflow-wrap:anywhere}
.title-en a{color:var(--sub);text-decoration:none}
.title-en a:hover{color:var(--accent)}
.summary-zh{
  font-size:13.8px;color:#333;border-left:3px solid var(--accent-soft);
  padding-left:10px;margin:6px 0;overflow-wrap:anywhere;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  border-radius:4px;padding:1px 8px;cursor:pointer;
}
.sub-info{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.tweet-text{font-size:14px;white-space:pre-wrap;margin:6px 0;
  word-break:break-word;overflow-wrap:anywhere}
.rt-mark{font-size:11.5px;color:var(--sub);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:14px}
footer{margin-top:44px;color:var(--sub);font-size:12.5px;border-top:1px solid var(--border);padding-top:14px}
footer a{color:var(--sub)}
.roster-note{font-size:13px;color:var(--sub);margin:14px 0 10px}
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.scard-name{font-weight:700;font-size:14.5px;line-height:1.4}
.scard-aff{color:var(--sub);font-size:12.5px;margin:2px 0 4px}
.scard-meta{font-size:11.5px;color:var(--sub);margin-bottom:7px}
.scard-links{display:flex;flex-wrap:wrap;gap:6px}
.slink{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.slink:hover{border-color:var(--accent)}
.suggest{margin-top:26px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.suggest h3{font-size:15.5px;margin-bottom:4px}
.sg-hint{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.sform{display:grid;gap:8px}
.sform input,.sform textarea{
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font:inherit;font-size:13.5px;width:100%;background:var(--bg);color:var(--ink);
}
.sform input:focus,.sform textarea:focus{outline:none;border-color:var(--accent)}
.sg-btns{display:flex;gap:8px}
.sbtn{
  border:0;background:var(--accent);color:#fff;border-radius:8px;
  padding:7px 16px;font:inherit;font-size:13.5px;cursor:pointer;
}
.sbtn-ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.sg-ok{font-size:12.5px;color:var(--accent)}
@media (max-width:640px){
  h1{font-size:21px}
  .toolbar{position:static}
  #scholarFilter{max-width:none;flex:1}
}
</style>
</head>

": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112388091851776156", "date": "2026-10-20", "abstract": "Caixin: \"The yuan accounts for 6% to 7% of global payments when transactions through China’s cross-border payment system and internal banking networks are included, making it the world’s third-most-used currency by that measure, PBOC Governor Pan Gongsheng said Monday.\"\nhttps://t.co/AZCj7NCTTz", "summary_zh": "潘功胜称，计入中国跨境支付系统及内部银行网络后，人民币占全球支付6%至7%，为全球第三大使用货币。", "title_zh": "", "tags": ["其他"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 52, "retweets": 6, "views": 9664, "created_at": "2026-10-20T03:39:02+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112387618054803707", "source": "tweet", "title": "Caixin: \"China’s central bank and 10 other government departments issued guidelines Monday to expand financial support for three internation", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112387618054803707", "date": "2026-10-20", "abstract": "Caixin: \"China’s central bank and 10 other government departments issued guidelines Monday to expand financial support for three international science and technology innovation centers anchored by Beijing, Shanghai and the Guangdong-Hong Kong-Macao Greater Bay Area.\"\nhttps://t.co/gZ8Tjko3qe", "summary_zh": "央行等11部门周一发布指引，扩大对北京、上海、粤港澳大湾区三大国际科技创新中心的金融支持。", "title_zh": "", "tags": ["产业政策"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 35, "retweets": 2, "views": 6902, "created_at": "2026-10-20T03:37:09+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112386826594070555", "source": "tweet", "title": "Caixin: \"Nominal GDP, which measures output at current prices, grew 6% year-on-year in the third quarter — its fastest pace since the first ", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112386826594070555", "date": "2026-10-20", "abstract": "Caixin: \"Nominal GDP, which measures output at current prices, grew 6% year-on-year in the third quarter — its fastest pace since the first quarter of 2022 — according to Caixin calculations.\"\nhttps://t.co/IlARSTnp2m", "summary_zh": "财新测算：中国三季度名义GDP同比增长6%，为2022年一季度以来最快。", "title_zh": "", "tags": ["其他"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 33, "retweets": 2, "views": 7302, "created_at": "2026-10-20T03:34:00+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112383326203847159", "source": "tweet", "title": "Xinhua: \"Manufacturing accounted for 25.7 percent of GDP in the first three quarters, up 0.6 percentage points from a year earlier. Meanwhil", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112383326203847159", "date": "2026-10-20", "abstract": "Xinhua: \"Manufacturing accounted for 25.7 percent of GDP in the first three quarters, up 0.6 percentage points from a year earlier. Meanwhile, German automobile giant Volkswagen, is shifting its strategy from \"in China, for China\" to \"in China, beyond China,\" with cars produced in China already exported to the Middle East and Central Asia.\"\nhttps://t.co/V3JFNiZ1S2", "summary_zh": "中国制造业占GDP25.7%、同比升0.6个百分点；大众转向“在中国，为全球”，中国产车出口中东和中亚。", "title_zh": "", "tags": ["全球价值链", "供应链"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 59, "retweets": 7, "views": 9415, "created_at": "2026-10-20T03:20:05+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112085693581389918", "source": "tweet", "title": "FT: \"“The key macroeconomic message is that China’s economy is still supply/production-side driven,” said Yuhan Zhang, principal economist a", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112085693581389918", "date": "2026-10-19", "abstract": "FT: \"“The key macroeconomic message is that China’s economy is still supply/production-side driven,” said Yuhan Zhang, principal economist at the Conference Board’s China Center.\"\nhttps://t.co/btVl1odOqP", "summary_zh": "FT引述张玉涵观点：关键宏观信号是，中国经济仍由供给/生产侧驱动。", "title_zh": "", "tags": ["产业政策"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 77, "retweets": 13, "views": 9809, "created_at": "2026-10-19T07:37:24+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112084844993773574", "source": "tweet", "title": "NYT: \"Surging exports and the industrial production needed to sustain them kept China’s economy growing over the past three months, even as ", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112084844993773574", "date": "2026-10-19", "abstract": "NYT: \"Surging exports and the industrial production needed to sustain them kept China’s economy growing over the past three months, even as consumer spending stagnated and investment plunged. The result is an economy increasingly dependent on selling goods abroad, even as domestic demand deteriorates.\"\n\nNYT's Keith Bradsher gets this right. Many other analysts have been presenting this year's economic data as describing a two-track economy, with a sluggish domestic economy being balanced by a brilliant export economy.\n\nBut that is a very poor description of what is actually happening. Yes, net exports are surging, but this isn't a sign of a viable export sector. If the export sector were very profitable, it might make sense to describe it this way, but exports aren't especially profitable except in relation to domestic sales, where except in a few sectors businesses are struggling to make any profit at all, and once direct and indirect subsidies are backed out, much of China's exports are net value destroyers for the economy, with the losses capitalized on balance sheets in the form of surging debt.\n\nWhen an economy produces far more than it can absorb through domestic consumption or investment, it must either export the balance or close down domestic production. Given how high real unemployment is, especially among the young, Beijing has no choice but to force the former, even if this comes at an economic cost.\n\nThe surge in China's net exports, in other words, is not a sigh of a strong and profitable export sector. If it takes rising debt, continued subsidies, and growing exports in order to prevent a contraction in domestic production, the surge in net exports is simply another way of describing weak domestic demand.\n\nSurging exports are usually a good sign for an economy. Surging net exports usually are not.\nhttps://t.co/yWXprpdixG", "summary_zh": "佩蒂斯称中国净出口激增并非健康出口部门，扣除补贴多为价值毁灭，损失靠债务，内需疲弱下被迫出口。", "title_zh": "", "tags": ["产业政策", "劳动力市场", "其他"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 249, "retweets": 56, "views": 27147, "created_at": "2026-10-19T07:34:02+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2112026092743667994", "source": "tweet", "title": "None of the data that came out today gives us a different picture of the Chinese economy from what we’ve seen all year. The economy is still", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2112026092743667994", "date": "2026-10-19", "abstract": "None of the data that came out today gives us a different picture of the Chinese economy from what we’ve seen all year. The economy is still heavily focused on boosting production and is still struggling with boosting demand. \n\nGDP grew 4.5% year on year in the third quarter of 2026, slightly higher than expected, from 5.0% in the first quarter and 4.3% in the second quarter. Year to date GDP has grown 4.6%, just above the bottom of the GDP growth target for 2026.\n\nIn September, industrial output went up by 5.5% year on year, or 5.3% for the first nine months. Meanwhile retail sales increased by 1.1% in September, or 2.6% for the first nine months.\n\nThe gap between domestic production and domestic consumption, in other words, continues to widen rather than narrow, with the gap much wider in September than it has been over the rest of the year. This can only be balanced by rising investment or a rising trade surplus.\n\nAnd it clearly isn’t being balanced by rising investment. Fixed asset investment in the first nine months of 2026 was down 7.2% year on year, or 4.2% with property investment deducted.\n\nThe decline in overall investment was driven by an even sharper decline in private investment, which was down by 10.4% year on year, or 6.7% with property investment deducted. Disaggregated by sector, investment in infrastructure declined by 4.2% year on year, manufacturing by 2.1%, and real estate development by 20.6%. The good news is that the decline in investment may finally be bottoming out, with fixed asset investment in September, rising by 0.07% month on month.\n\nWe will probably see fiscal expansion in the last quarter of this year, although I think it would be a good thing if Beijing let growth come in at the bottom of the target, especially if they lower the target further in 2027. Debt is simply growing too fast, and it is growing fast only because of the urgent desire to meet politically-determined GDP growth targets. The longer this goes on, the more difficult the ultimate adjustment will be.\nhttps://t.co/NB7JruTd3w", "summary_zh": "三季度GDP增4.5%，9月工业增5.5%但零售仅1.1%、投资降7.2%，生产强需求弱、供需缺口扩大。", "title_zh": "", "tags": ["其他"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 177, "retweets": 34, "views": 21673, "created_at": "2026-10-19T03:40:34+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2111893995819323471", "source": "tweet", "title": "Helen Branswell, a leading reporter on infectious diseases who wrote with foresight, urgency and clarity about the emerging danger of the Co", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2111893995819323471", "date": "2026-10-18", "abstract": "Helen Branswell, a leading reporter on infectious diseases who wrote with foresight, urgency and clarity about the emerging danger of the Covid-19 pandemic, ahead of the vast majority of journalists and even many medical experts, died on Tuesday in Ottawa. She was 69.\n\nhttps://t.co/IajalWGUGg", "summary_zh": "传染病记者海伦·布兰斯韦尔周二在渥太华去世，享年69岁；她曾以远见和清晰提前警示新冠风险，早于多数记者和许多医学专家。", "title_zh": "", "tags": ["其他"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 4, "retweets": 0, "views": 858, "created_at": "2026-10-18T18:55:40+00:00", "scholar_name": "Chad Bown"}}, {"uid": "tweet:2111726482745680176", "source": "tweet", "title": "RT @farmerrf: That’s a question for the philosophy of science. My friend Axel Leijonhufvud had a metaphor of science as a tree with many br…", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2111726482745680176", "date": "2026-10-18", "abstract": "RT @farmerrf: That’s a question for the philosophy of science. My friend Axel Leijonhufvud had a metaphor of science as a tree with many br…", "summary_zh": "转推讨论科学哲学，借莱琼霍夫德“科学如多枝之树”的比喻回应问题。", "title_zh": "", "tags": ["方法论"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": true, "is_reply": false, "likes": 0, "retweets": 11, "views": 1957, "created_at": "2026-10-18T07:50:02+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2111679251229393276", "source": "tweet", "title": "SCMP: \"“The EU should not fantasise about gaining benefits through pressure, nor should it underestimate China’s determination and ability t", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2111679251229393276", "date": "2026-10-18", "abstract": "SCMP: \"“The EU should not fantasise about gaining benefits through pressure, nor should it underestimate China’s determination and ability to safeguard its own interests,” read a Ministry of Commerce statement on Friday.\"\n https://t.co/s9xWo8sWuj via @scmpnews", "summary_zh": "中国商务部警告欧盟勿幻想施压获利，也不要低估中国维护自身利益的决心与能力。", "title_zh": "", "tags": ["贸易政策", "贸易战"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 88, "retweets": 14, "views": 16523, "created_at": "2026-10-18T04:42:21+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2111320005891719596", "source": "tweet", "title": "Yicai: \"Last year, China’s basic research spending ranked second worldwide after the United States and was about 2.3 times that of third-ran", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2111320005891719596", "date": "2026-10-17", "abstract": "Yicai: \"Last year, China’s basic research spending ranked second worldwide after the United States and was about 2.3 times that of third-ranked Japan and 2.8 times that of fourth-ranked South Korea, the report also showed.\"\nhttps://t.co/1xDWMi07av", "summary_zh": "报告显示，去年中国基础研究支出全球第二、仅次于美国，约为日本2.3倍、韩国2.8倍。", "title_zh": "", "tags": ["产业政策"], "extra": {"handle": "michaelxpettis", "name": "Michael Pettis", "is_retweet": false, "is_reply": false, "likes": 108, "retweets": 18, "views": 13520, "created_at": "2026-10-17T04:54:50+00:00", "scholar_name": "Michael Pettis"}}, {"uid": "tweet:2111319978205225155", "source": "tweet", "title": "Reuters: \"Changing diets at home and Beijing’s emphasis on food security have pushed companies to invest in technology and expansion. Now, t", "authors": "@michaelxpettis", "venue": "X (Twitter)", "url": "https://x.com/michaelxpettis/status/2111319978205225155", "date": "2026-10-17", "abstract": "     <span class="chip"><span class="dot nber"></span>NBER <b id="c-nber">0</b></span>
    <span class="chip"><span class="dot scholar"></span>学者论文 <b id="c-scholar">0</b></span>
    <span class="chip"><span class="dot tweet"></span>推文 <b id="c-tweet">0</b></span>`;

  const names = new Map();
  DATA.items.forEach(it => {
    const n = it.extra && it.extra.scholar_name;
    if(n) names.set(n, (names.get(n)||0)+1);
  });
  const sel = document.getElementById('scholarFilter');
  [...names.keys()].sort((a,b)=>a.localeCompare(b,'zh')).forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = `${n} (${names.get(n)})`;
    sel.appendChild(opt);
  });
})();

/* 板块 tab（计数随筛选联动） */
(function initTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = SOURCES.map(s => `
    <button class="tab" role="tab" data-tab="${s.key}"
      aria-pressed="${s.key===state.tab}">
      ${s.label}<span class="n"></span></button>`).join('');
  tabs.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    state.tab = btn.dataset.tab;
    tabs.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'));
    render();
  });
})();

document.getElementById('rangeSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  state.range = +btn.dataset.range;
  document.querySelectorAll('#rangeSeg button').forEach(b =>
    b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'));
  render();
});
document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase(); render();
});
document.getElementById('scholarFilter').addEventListener('change', e => {
  state.scholar = e.target.value; render();
});

function matchBase(it){
  /* 时间范围 + 搜索 + 学者筛选（不含板块） */
  const d = daysAgo(it.date);
  if(isNaN(d) || d > state.range || d < 0) return false;
  if(state.scholar && (!it.extra || it.extra.scholar_name !== state.scholar)) return false;
  if(state.q){
    const e = it.extra || {};
    const hay = [it.title, it.authors, it.venue, it.summary_zh,
                 it.abstract || '', (it.tags||[]).join(' '),
                 e.scholar_name || '', e.handle || '', e.nber_id || '',
                 e.journal_short || ''].join(' ').toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function cardHTML(it){
  const e = it.extra || {};
  let badges = '';
  let venueInfo = '';
  if(it.source === 'top5'){
    const js = e.journal_short || '';
    badges = `<span class="badge top5">${js}</span>`;
    venueInfo = `<span class="venue">${it.venue||''}</span>`;
  }else if(it.source === 'nber'){
    badges = `<span class="badge nber">NBER</span>`;
    venueInfo = `<span class="venue">NBER Working Paper ${e.nber_id||''}</span>`;
  }else if(it.source === 'scholar'){
    const who = e.scholar_name || '';
    badges = `<span class="badge scholar">学者论文</span>` +
      (who ? `<span class="venue">${who}</span>` : '');
    venueInfo = `<span class="venue">${it.venue||e.work_type||''}</span>`;
  }else{
    const rt = e.is_retweet ? ' <span class="rt-mark">转发</span>' : '';
    badges = `<span class="badge tweet">@${e.handle||''}</span>${rt}`;
    venueInfo = `<span class="venue">${e.name||''}</span>`;
  }
  const stats = it.source === 'tweet'
    ? `<div class="sub-info"><span>赞 ${e.likes||0}</span><span>转 ${e.retweets||0}</span><span>浏览 ${e.views||0}</span></div>`
    : '';
  const text = it.source === 'tweet'
    ? `<p class="tweet-text">${esc(it.abstract||'')}</p>` : '';
  // 推文正文已经完整展示；论文标题有中文翻译时中文为主、原文为副
  const showTitle = !(it.source === 'tweet' && it.abstract);
  const zh = it.title_zh || '';
  const mainTitle = showTitle ? (zh || it.title || it.summary_zh || '(无标题)') : '';
  const titleHTML = !mainTitle ? '' : (it.url
    ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(mainTitle)}</a>`
    : esc(mainTitle));
  const titleEn = (showTitle && zh && it.title && zh !== it.title)
    ? `<p class="title-en">${it.url
        ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
        : esc(it.title)}</p>` : '';
  const summary = it.summary_zh && it.summary_zh !== '（非贸易领域）'
    ? `<p class="summary-zh">${esc(it.summary_zh)}</p>` : '';
  const authors = it.authors && it.source !== 'tweet'
    ? `<p class="authors">${esc(it.authors)}</p>` : '';
  const tags = (it.tags||[]).length
    ? `<div class="tags">${it.tags.map(t =>
        `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : '';
  return `<article class="card">
    <div class="card-top">${badges}${venueInfo}</div>
    ${titleHTML ? `<h2>${titleHTML}</h2>` : ''}
    ${titleEn}
    ${authors}${text}${summary}${stats}${tags}
  </article>`;
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function rangeLabel(r){
  return r === 180 ? '近半年' : (r === 7 ? '近 7 天' : '近 30 天');
}

function groupLabel(dateStr){
  /* 半年视图按月分组，其余按日分组 */
  if(!dateStr) return '日期未知';
  if(state.range > 60){
    const dt = new Date(dateStr + 'T00:00:00');
    return `${dt.getFullYear()}年${dt.getMonth()+1}月`;
  }
  return fmtDate(dateStr);
}

function rosterHTML(){
  const cards = DATA.scholars.map(s => {
    const links = [];
    if(s.homepage) links.push(`<a class="slink" href="${esc(s.homepage)}" target="_blank" rel="noopener">主页</a>`);
    if(s.twitter) links.push(`<a class="slink" href="https://x.com/${esc(s.twitter)}" target="_blank" rel="noopener">@${esc(s.twitter)}</a>`);
    if(s.openalex) links.push(`<a class="slink" href="https://openalex.org/${esc(s.openalex)}" target="_blank" rel="noopener">OpenAlex</a>`);
    if(s.s2) links.push(`<a class="slink" href="https://www.semanticscholar.org/author/${esc(s.s2)}" target="_blank" rel="noopener">S2</a>`);
    return `<div class="scard">
      <div class="scard-name">${esc(s.name)}</div>
      <div class="scard-aff">${esc(s.affiliation)}</div>
      <div class="scard-meta">近半年 ${s.items} 条动态</div>
      <div class="scard-links">${links.join('')}</div>
    </div>`;
  }).join('');
  return `<p class="roster-note">共收录 ${DATA.scholars.length} 位学者，「动态」为近半年条目数。</p>
    <div class="roster-grid">${cards}</div>
    <div class="suggest">
      <h3>建议新增学者</h3>
      <p class="sg-hint">填写后点「打开邮件」发到维护者邮箱，或点「复制内容」粘贴到任意渠道。</p>
      <div class="sform">
        <input id="sg-name" placeholder="学者姓名（必填）">
        <input id="sg-org" placeholder="所在机构">
        <input id="sg-tw" placeholder="X 账号（如 @ChadBown）">
        <input id="sg-hp" placeholder="个人主页">
        <textarea id="sg-why" rows="2" placeholder="推荐理由（可选）"></textarea>
        <div class="sg-btns">
          <button class="sbtn" id="sg-send">打开邮件</button>
          <button class="sbtn sbtn-ghost" id="sg-copy">复制内容</button>
        </div>
        <p class="sg-ok" id="sg-ok" hidden>已复制到剪贴板。</p>
      </div>
    </div>`;
}

function suggestText(){
  const v = id => (document.getElementById(id).value || '').trim();
  const line = (label, val) => val ? `${label}：${val}\n` : '';
  return line('学者姓名', v('sg-name')) + line('所在机构', v('sg-org')) +
    line('X 账号', v('sg-tw')) + line('个人主页', v('sg-hp')) +
    line('推荐理由', v('sg-why')) + '\n来自「贸易学者动向」页面的建议';
}

function bindRoster(root){
  root.addEventListener('click', e => {
    if(e.target.id === 'sg-send'){
      const name = (document.getElementById('sg-name').value || '').trim();
      const subject = `建议新增贸易学者：${name || '（未填姓名）'}`;
      window.location.href =
        `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(suggestText())}`;
    }else if(e.target.id === 'sg-copy'){
      const done = () => {
        const ok = document.getElementById('sg-ok');
        ok.hidden = false;
        setTimeout(() => { ok.hidden = true; }, 2500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(suggestText()).then(done).catch(() => {});
      }else{
        const ta = document.createElement('textarea');
        ta.value = suggestText();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    }
  });
}

function renderRoster(){
  const list = document.getElementById('list');
  list.innerHTML = rosterHTML();
  bindRoster(list);
}

function render(){
  const list = document.getElementById('list');
  if(state.tab === 'roster'){
    document.getElementById('footMeta').textContent =
      `学者名单共 ${DATA.scholars.length} 人（不含已停用条目）。`;
    renderRoster();
    return;
  }
  const base = DATA.items.filter(matchBase);

  /* 板块 tab 计数与顶部统计随筛选联动 */
  const perSource = {top5:0, nber:0, scholar:0, tweet:0};
  base.forEach(it => perSource[it.source]++);
  document.querySelectorAll('#tabs .tab').forEach(btn => {
    const k = btn.dataset.tab;
    const n = k === 'all' ? base.length
      : (k === 'roster' ? DATA.scholars.length : perSource[k]);
    btn.querySelector('.n').textContent = n;
  });
  ['top5','nber','scholar','tweet'].forEach(k => {
    document.getElementById('c-'+k).textContent = perSource[k];
  });
  document.getElementById('footMeta').textContent =
    `当前筛选 ${rangeLabel(state.range)}，共 ${base.length} 条；数据共覆盖近半年。`;

  const items = state.tab === 'all' ? base
    : base.filter(it => it.source === state.tab);
  if(!items.length){
    list.innerHTML = '<p class="empty">该筛选条件下暂无条目。</p>';
    return;
  }
  let html = '', lastGroup = '';
  items.forEach(it => {
    const g = groupLabel(it.date);
    if(g !== lastGroup){
      lastGroup = g;
      html += `<div class="datehead">${g}</div>`;
    }
    html += cardHTML(it);
  });
  list.innerHTML = html;
}

document.getElementById('list').addEventListener('click', e => {
  const tag = e.target.closest('.tag');
  if(!tag) return;
  const input = document.getElementById('search');
  input.value = tag.dataset.tag;
  state.q = tag.dataset.tag.toLowerCase();
  render();
});

render();
</script>
