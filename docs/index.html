。产业政策的回归受到地缘政治紧张加剧、环境危机升级以及对不受监管市场效率日益增长的怀疑的推动。产业政策的支持者认为，政府干预可以解决由规模经济、市场势力和环境外部性导致的市场失灵。然而，这一复兴值得批判性审视。反对产业政策的传统论点以第一福利定理为依据，该定理断言，在完全竞争、无外部性和无摩擦市场为特征的新古典环境中，仅靠市场力量就能产生有效率的结果。然而在实践中，经济显著偏离这一理论基准。各种摩擦和外部性使现实世界经济无法在生产可能性边界上运行，从而为产业政策干预提供了经济学依据。尽管如此，政府纠正这些市场失灵的努力是否有效，仍是持续争论的主题。现在正是停下来，使用一个能够反映现代经济体现实的框架来批判性重新评估产业政策的适当时机。当今经济体在国际上相互融合，并在复杂而广泛的供应链中运行。而且，产业政策不再局限于国内问题，还以国际问题和全球市场失灵为目标，例如气候变化。政策制定者必须在国内福利收益与意外的全球后果之间把握微妙的平衡，即使政策措施主要旨在纠正国内经济中的失灵。该理论框架为批判性审视关于产业政策结果的最新经验证据提供了基础，例如韩国的重化工业（HCI）推动以及中国所采取的各种干预措施。较新的研究脉络采用前瞻性的、基于模型的方法。以经验估计参数为基础的结构模型可用于预测最优或约束最优政策的潜在收益。总体而言，现有文献对产业政策作出了细致入微的评估。像韩国重化工业（HCI）推进计划这样的历史事件常被引用为成功范例，而证据的总体权衡为该观点提供了一定支持。然而，当充分计入非预期后果时，此类政策的总体有效性就变得更加模糊。此外，当今更高程度的全球经济一体化给产业政策的实施带来了新的复杂性。在贸易一体化加剧的时代，单边政策行动能否复制过去取得的成果日益不确定。近期研究强调协调努力日益重要，至少在区域层面如此——这一观点得到关于欧盟竞争力的“德拉吉报告”的呼应；该报告由欧盟委员会主席委托，并由马里奥·德拉吉于2024年发布。", "tags": ["产业政策", "贸易政策", "供应链"], "extra": {"scholar_name": "Ahmad Lashkaripour", "work_type": "reference-entry", "doi": "10.1093/acrefore/9780190625979.013.1014"}}, {"uid": "oa:W4417226563", "source": "scholar", "title": "Forecasting the Impact of the EU Deforestation Regulation (EUDR) on Asia-Pacific Forest Product Trade", "authors": "Yuanhui Hu, Qian Meng, Neng Chen, Yuan Mei, Jie Xia", "venue": "American Journal of Environmental and Resource Economics", "url": "https://doi.org/10.11648/j.ajere.20251004.14", "date": "2025-12-09", "abstract": "This study provides a comprehensive, quantitative forecast of the dynamic impact of the European Union Deforestation Regulation (EUDR) on forest product exports from nine major Asia-Pacific economies to the EU market. To address the complexity of this policy shock, we develop a novel two-stage forecasting framework that integrates LASSO regression for high-dimensional variable selection with OLS modeling. This approach generates dynamic monthly projections from October 2025 to December 2027, simulating the policy’s effect by combining a historical proxy from the European Union Timber Regulation (EUTR) with a calibrated “intensity multiplier” based on the EUDR country-risk classification. Our projections reveal a distinct multi-phase adjustment process across the region: an immediate, sharp contraction in Q4 2025, followed by a period of significant volatility and supply chain disruption throughout 2026, and an uneven recovery in 2027. The findings underscore substantial heterogeneity in impacts driven by the EUDR risk-based framework. Standard-risk countries, such as Indonesia and Malaysia, are projected to face severe volatility and suppressed growth trajectories, with Malaysia’s exports showing particular vulnerability. In contrast, some smaller, low-risk nations like the Philippines may capitalize on a substitution effect, gaining market share as larger suppliers struggle with compliance. The study concludes that the EUDR acts as a powerful disruptive force, reshaping competitive dynamics and necessitating urgent policy responses, including enhanced traceability infrastructure and strategic market diversification, for Asia-Pacific exporters.", "summary_zh": "构建LASSO-OLS两阶段预测框架，模拟EUDR对九大亚太经济体林产品对欧出口的动态影响，发现先收缩、后波动、再分化复苏。", "title_zh": "预测欧盟森林砍伐条例（EUDR）对亚太林产品贸易的影响", "abstract_zh": "本研究对欧盟毁林法规（EUDR）对九个亚太经济体向欧盟市场林产品出口的动态影响进行了全面的量化预测。为应对这一政策冲击的复杂性，我们构建了一个新颖的两阶段预测框架，将用于高维变量选择的LASSO回归与OLS建模相结合。该方法生成了2025年10月至2027年12月的动态月度预测，通过将来自欧盟木材法规（EUTR）的历史代理变量与基于EUDR国家风险分类校准的“强度乘数”相结合，模拟该政策的效果。我们的预测揭示了该地区一个明显的多阶段调整过程：2025年第四季度立即急剧收缩，随后2026年全年出现显著波动和供应链中断，并在2027年出现不均衡复苏。研究结果强调了由EUDR基于风险的框架所驱动的影响的显著异质性。标准风险国家，如印度尼西亚和马来西亚，预计将面临严重波动和受抑制的增长轨迹，其中马来西亚的出口尤其脆弱。相比之下，一些较小的低风险国家，如菲律宾，可能利用替代效应，在较大供应国难以合规时获得市场份额。研究得出结论，EUDR是一股强大的颠覆性力量，重塑竞争动态，并使得亚太出口商亟需采取紧急政策应对，包括加强可追溯性基础设施和战略性市场多元化。", "tags": ["贸易政策", "供应链", "方法论"], "extra": {"scholar_name": "梅源", "work_type": "article", "doi": "10.11648/j.ajere.20251004.14"}}, {"uid": "oa:W7202116870", "source": "scholar", "title": "Productivism: New Industrial Policy and New Thinking in Global Economic Governance", "authors": "Dani Rodrik", "venue": "Research in Government and Economics", "url": "https://doi.org/10.26599/rge.2025.9720105", "date": "2025-12-01", "abstract": "Abstract The global economy is grappling with deep structural strains. Decades of reliance on market liberalization and globalization have left many countries with fragile employment growth, industrial hollowing-out, and widening inequality. At the same time, intensifying disputes over industrial policy and technology have eroded trust in multilateral institutions and pushed the global trading system into gridlock. This paper advances productivism as a framework for rethinking economic governance. Productivism underscores the joint role of states and markets in building productive capacity and expanding employment opportunities. Unlike neoliberal approaches that cast the state as a corrective actor, productivism views governments as integral market participants—designing institutions, shaping incentives, and aligning economic outcomes with broader social objectives. The analysis suggests that productivist strategies can foster domestic upgrading and social welfare while also easing international tensions. By promoting transparency in policy justification and creating mechanisms for cross-border coordination, productivism offers both a viable policy paradigm for national development and a practical foundation for rebuilding global economic governance.", "summary_zh": "针对全球经济结构性压力与贸易体系僵局，论文提出生产主义框架，强调国家与市场共同建设生产能力，可促进国内升级并缓和国际紧张。", "title_zh": "生产主义：新产业政策与全球经济治理新思维", "abstract_zh": "摘要 全球经济正艰难应对深层的结构性压力。数十年来对市场自由化和全球化的依赖，使许多国家面临脆弱的就业增长、产业空心化和不断扩大的不平等。与此同时，围绕产业政策和技术的争端不断加剧，削弱了对多边机构的信任，并使全球贸易体系陷入僵局。本文提出以生产主义作为重新思考经济治理的框架。生产主义强调国家和市场在建设生产能力和扩大就业机会中的共同作用。与新自由主义路径将国家视为矫正性行为主体不同，生产主义将政府视为不可或缺的市场参与者——设计制度、塑造激励，并使经济结果与更广泛的社会目标相一致。分析表明，生产主义战略能够促进国内升级和社会福利，同时也有助于缓解国际紧张。通过提高政策论证的透明度并建立跨境协调机制，生产主义既为国家发展提供了可行的政策范式，也为重建全球经济治理提供了务实基础。", "tags": ["产业政策", "贸易政策"], "extra": {"scholar_name": "Dani Rodrik", "work_type": "article", "doi": "10.26599/rge.2025.9720105"}}, {"uid": "oa:W7128979812", "source": "scholar", "title": "From MFN to “reciprocal tariffs”", "authors": "Kevin O’Rourke", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://openalex.org/W7128979812", "date": "2025-12-01", "abstract": "International audience", "summary_zh": "梳理最惠国待遇向对等关税转变的贸易政策史，分析关税制度演变及其影响。", "title_zh": "从最惠国待遇到“对等关税”", "abstract_zh": "国际受众", "tags": ["关税", "贸易政策", "贸易史"], "extra": {"scholar_name": "Kevin O'Rourke", "work_type": "book-chapter", "doi": ""}}, {"uid": "oa:W7116887476", "source": "scholar", "title": "How Good is International Risk Sharing? Stepping Outside the Shadow of the Welfare Theorems", "authors": "Mark Aguiar, Oleg Itskhoki, Dmitry Mukhin", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34587", "date": "2025-12-01", "abstract": "We revisit whether global output is (Pareto) efficiently distributed across countries over time. The efficient allocation of goods across regions requires that the relative marginal utilities of consumption across countries comoves with the relative costs of the country-specific consumption bundles. Standard approaches to evaluating this property exploit the Welfare Theorems and equate the observed real exchange rate with the social relative costs of consumption. Given the large literature documenting the disconnect between exchange rates, relative prices faced by consumers in a given market, and relative quantities consumed, we develop a methodology that measures relative costs that is robust to this disconnect. We find that relative consumption growth across regions is significantly more correlated with our computed shadow prices than it is with observed real exchange rates, suggesting an allocation closer to efficient risk sharing. Moreover, we provide a decentralization that matches observed prices and quantities, enabling us to rationalize the better implied risk sharing with the failure of the standard correlations. The decentralization involves a combination of segmented foreign exchange markets and pricing-to-market behavior in goods markets. The model implies that consumption allocations are insulated from excess fluctuations in the exchange rate via the equilibrium pricing behavior of exporters. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "重估全球产出分配效率，构建对汇率脱节稳健的影子价格，发现风险分担更接近有效且可由市场分割与依市定价解释。", "title_zh": "国际风险分担有多好？走出福利定理的阴影", "abstract_zh": "我们重新考察全球产出是否随时间在各国之间实现（帕累托）有效分配。商品在各地区之间的有效配置要求，各国消费的相对边际效用与国别特定消费篮子的相对成本共同变动。评估这一性质的标准方法利用福利定理，并将观察到的实际汇率等同于消费的社会相对成本。鉴于大量文献记录了汇率、特定市场中消费者面临的相对价格与相对消费数量之间的脱节，我们开发了一种衡量相对成本的方法，该方法对这种脱节具有稳健性。我们发现，各地区的相对消费增长与我们计算出的影子价格的相关性显著高于其与观察到的实际汇率的相关性，这表明配置更接近有效的风险分担。此外，我们提供了一种与观察到的价格和数量相匹配的分散化方案，使我们能够用标准相关关系的失效来合理化更好的隐含风险分担。这种分散化涉及分割的外汇市场与商品市场中的按市场定价行为的结合。该模型意味着，通过出口商的均衡定价行为，消费配置免受汇率过度波动的影响。NBER工作论文系列的机构订阅者及发展中国家居民可在www.nber.org免费下载本文，无需额外费用。", "tags": ["汇率", "方法论"], "extra": {"scholar_name": "Oleg Itskhoki", "work_type": "report", "doi": "10.3386/w34587"}}, {"uid": "oa:W7112679110", "source": "scholar", "title": "Problemas com as tarifas de Trump", "authors": "Paúl Krugman", "venue": "DSpace (Federal University of Santa Catarina)", "url": "https://openalex.org/W7112679110", "date": "2025-12-01", "abstract": "Em 2 de abril — o “Dia da Libertação” — Donald Trump impôs tarifas altíssimas a dezenas de países, incluindo nossos aliados mais próximos, bem como ilhas habitadas apenas por pinguins . De uma só vez, ele reverteu 90 anos de liberalização comercial dos EUA e violou acordos internacionais solenes. Trump não tentou aprovar suas tarifas no Congresso (que, por mais submissos que os republicanos sejam, não as teria aprovado).", "summary_zh": "评述特朗普高关税政策，认为其逆转美国90年贸易自由化并违反国际协定。", "title_zh": "特朗普关税的问题", "abstract_zh": "4月2日——“解放日”——唐纳德·特朗普对数十个国家加征了极高关税，其中包括我们最亲密的盟友，以及仅有企鹅栖息的岛屿。他一下子逆转了美国90年的贸易自由化，并违反了庄严的国际协定。特朗普没有试图让国会批准其关税（无论共和党人多顺从，国会也不会批准这些关税）。", "tags": ["关税", "贸易政策", "贸易战"], "extra": {"scholar_name": "Paul Krugman", "work_type": "other", "doi": ""}}, {"uid": "oa:W4417285764", "source": "scholar", "title": "Playing with Blocs", "authors": "Barthélémy Bonadio, Zhen Huo, Elliot Kang, Andrei A. Levchenko, Nitya Pandalai-Nayar, Hiroshi Toma", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9798229034029.001", "date": "2025-12-01", "abstract": "We adopt a data-driven approach to measure trade decoupling over 2015-2023. Countries are classified into three groups according to changes in their data-inferred trade costs with the US and China: those shifting toward the US bloc, those shifting toward the China bloc, and those with no change in alignment. We document that while cross-bloc trade costs rose, they were accompanied by falling within-bloc trade costs, with average trade costs falling marginally in line with global trade resilience. We use a quantitative model to compute the real income effects of this reconfiguration of trade costs. Model simulations suggest that real income in the median country in the world, and the median country within each bloc, rose by 0.4-0.6%. Finally, we find a modest amount of bloc misalignment: the median country would be better off switching blocs. These results suggest that trade decoupling may not follow trade-driven economic interests.", "summary_zh": "用数据与量化模型测度2015—2023年贸易脱钩，发现跨集团贸易成本上升、集团内下降，实际收入小幅增加。", "title_zh": "与集团博弈", "abstract_zh": "我们采用数据驱动的方法衡量2015-2023年的贸易脱钩。根据其数据推断的与美国和中国的贸易成本变化，国家被分为三组：向美国阵营转移的国家、向中国阵营转移的国家，以及阵营归属未发生变化的国家。我们记录到，虽然跨阵营贸易成本上升，但伴随而来的是阵营内贸易成本下降，平均贸易成本仅小幅下降，与全球贸易韧性相一致。我们使用一个定量模型计算这种贸易成本重构的实际收入效应。模型模拟表明，世界的中位国家以及每个阵营内的中位国家的实际收入上升了0.4-0.6%。最后，我们发现存在适度规模的阵营错配：中位国家如果转换阵营会变得更好。这些结果表明，贸易脱钩可能并不遵循贸易驱动的经济利益。", "tags": ["贸易政策", "供应链", "方法论"], "extra": {"scholar_name": "Andrei Levchenko", "work_type": "article", "doi": "10.5089/9798229034029.001"}}, {"uid": "oa:W4417138609", "source": "scholar", "title": "Accommodating Emerging Giants in the Global Economy", "authors": "Zhuokai Huang, Benny Kleinman, Ernest Liu, Stephen J. Redding", "venue": "IMF Economic Review", "url": "https://doi.org/10.1057/s41308-026-00312-6", "date": "2025-12-01", "abstract": "How has aggregate income and welfare in the United States been affected by globalization and rapid productivity growth in emerging economies?We use the class of constant elasticity trade models to provide quantitative evidence on these questions.We find that reductions in worldwide trade frictions over the period from 1960-2020 reduced the share of the United States in global GDP but raised its aggregate welfare.Similarly, productivity growth in Japan and China led to a decline in the relative income of the United States, but brought aggregate welfare gains from the resulting expansion in global production possibilities.Trade integration and foreign productivity growth have relatively modest effects on domestic income and welfare compared to domestic productivity growth.", "summary_zh": "用恒定弹性贸易模型量化全球化与中日生产率增长对美国的影响，发现美国相对收入下降但总福利上升。", "title_zh": "在全球经济中容纳新兴大国", "abstract_zh": "全球化以及新兴经济体生产率的快速增长如何影响了美国的总体收入和福利？我们使用常弹性贸易模型这一类模型，就这些问题提供定量证据。我们发现，1960—2020年期间全球贸易摩擦的减少降低了美国在全球GDP中的份额，但提高了其总体福利。类似地，日本和中国的生产率增长导致美国相对收入下降，但由此带来的全球生产可能性扩张带来了总体福利收益。与国内生产率增长相比，贸易一体化和外国生产率增长对国内收入和福利的影响相对温和。", "tags": ["贸易弹性", "方法论", "其他"], "extra": {"scholar_name": "Stephen Redding", "work_type": "article", "doi": "10.1057/s41308-026-00312-6"}}, {"uid": "oa:W4416694456", "source": "top5", "title": "Firm Responses and Wage Effects of Foreign Demand Shocks with Fixed Labor Costs and Monopsony", "authors": "Emmanuël Dhyne, Ayumu Ken Kikkawa, Toshiaki Komatsu, Magne Mogstad, Felix Tintelnot", "venue": "American Economic Review", "url": "https://doi.org/10.1257/aer.20220948", "date": "2025-11-26", "abstract": "We quantify the firm responses and real wage effects of foreign demand shocks. We use Belgian microdata to construct firm-specific measures of demand shocks, which capture that firms pass on foreign demand shocks to domestic suppliers. Our estimates of firm responses to these shocks suggest that firms face upward-sloping labor supply curves and have sizable fixed labor costs. We specify a general equilibrium model with these features to quantify the aggregate effects of simulated tariff shocks on wages. We find that ignoring fixed labor costs substantially underestimates aggregate effects on wages, whereas incorporating upward-sloping labor supply appears less consequential. (JEL D22, F13, F16, J22, J31, J42, L25)", "summary_zh": "用比利时微观数据构建需求冲击，结合一般均衡模型量化关税冲击的工资效应，发现忽视固定劳动成本会低估工资总效应。", "title_zh": "固定劳动成本与买方垄断下外国需求冲击的企业反应及工资效应", "abstract_zh": "我们量化外国需求冲击的企业反应和实际工资效应。我们使用比利时微观数据构建企业特定的需求冲击度量，该度量捕捉了企业将外国需求冲击传递给国内供应商的情况。我们对企业对这类冲击反应的估计表明，企业面临向上倾斜的劳动供给曲线，并具有可观的固定劳动成本。我们构建了一个包含这些特征的一般均衡模型，以量化模拟关税冲击对工资的总体效应。我们发现，忽略固定劳动成本会显著低估对工资的总体效应，而纳入向上倾斜的劳动供给似乎影响较小。（JEL D22, F13, F16, J22, J31, J42, L25）", "tags": ["关税", "劳动力市场", "企业异质性"], "extra": {"journal_short": "AER", "keyword_hit": "tariff", "doi": "10.1257/aer.20220948"}}, {"uid": "oa:W4416609093", "source": "scholar", "title": "A Geospatial Approach to Measuring Economic Activity", "authors": "Anton Yang, Jianwei Ai, Costas Arkolakis", "venue": "Research Square", "url": "https://doi.org/10.21203/rs.3.rs-8051642/v1", "date": "2025-11-25", "abstract": "", "summary_zh": "论文提出用地理空间方法测度经济活动；因无摘要，具体发现难以概括。", "title_zh": "一种测度经济活动的空间方法", "abstract_zh": "", "tags": ["方法论", "其他"], "extra": {"scholar_name": "Costas Arkolakis", "work_type": "preprint", "doi": "10.21203/rs.3.rs-8051642/v1"}}, {"uid": "oa:W4416586736", "source": "scholar", "title": "How Businesses Set Prices—In Their Own Words", "authors": "Wändi Bruine de Bruin, Keshav Dogra, Sebastian Heise, Edward S. Knotek, Brent Meyer, Robert W. Rich", "venue": "报告", "url": "https://doi.org/10.59576/lse.20251124", "date": "2025-11-24", "abstract": "There has been a lot of interest in firms’ pricing decisions in the past few years—both during the inflation surge of 2021-23 and in the more recent rounds of tariff increases. In this post, we let firms speak for themselves about what factors they consider when adjusting prices in response to various shocks. The analysis is based on an ongoing research project, joint with the Atlanta and Cleveland Federal Reserve Banks, on how businesses set prices and the extent of passthrough of cost increases. In particular, we leverage the qualitative portion of the study based on open-ended interviews with senior decision-makers on how they approach pricing decisions in their firms. Rather than a uniform approach, a very nuanced picture emerges of businesses trying to balance competing objectives while keeping an eye on demand conditions for their products as well as on their direct competitors’ behavior in the market.", "summary_zh": "基于企业高管访谈分析其应对通胀与关税冲击的定价及成本转嫁，发现企业需权衡多重目标。", "title_zh": "企业如何定价——以他们自己的话", "abstract_zh": "过去几年，人们对企业的定价决策产生了很大兴趣——无论是在2021—23年通胀飙升期间，还是在最近几轮关税上调期间。在这篇文章中，我们让企业自己发声，说明它们在应对各种冲击调整价格时考虑了哪些因素。该分析基于一个正在进行的研究项目，该项目与亚特兰大联邦储备银行和克利夫兰联邦储备银行合作，研究企业如何定价以及成本上升的转嫁程度。特别是，我们利用了该研究中的定性部分，该部分基于与高级决策者的开放式访谈，内容涉及他们如何在本企业处理定价决策。出现的并非一种统一的方法，而是一幅非常细致的图景：企业试图平衡相互竞争的目标，同时关注其产品的需求状况以及直接竞争对手在市场中的行为。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Sebastian Heise", "work_type": "report", "doi": "10.59576/lse.20251124"}}, {"uid": "oa:W2589095345", "source": "scholar", "title": "Exchange Rate Disconnect", "authors": "Oleg Itskhoki, Dmitry Mukhin", "venue": "Oxford Research Encyclopedia of Economics and Finance", "url": "https://doi.org/10.1093/acrefore/9780190625979.013.951", "date": "2025-11-18", "abstract": "Abstract Exchange rates are at the heart of international economics, yet their disconnect from other macroeconomic variables—including prices (the purchasing power parity and Mussa puzzles), consumption (the Backus–Smith puzzle), interest rates and asset prices (the uncovered interest parity puzzle), and a random-walk-like dynamics (the Meese–Rogoff puzzle)—is one of the key stumbling blocks for the open-economy macro literature. The recent empirical literature complements these classical puzzles with new stylized facts about the long-run properties of exchange rates, their comovement with disaggregated prices and quantities, and differences across periods and countries with different monetary regimes. Current frontier theories of exchange rates emphasize two crucial ingredients for resolving these puzzles: financial risk-sharing shocks and muted exchange rate transmission into prices and quantities. The latter can result from trade costs, home bias in preferences, firms pricing to market, nominal rigidities, and gradual export adjustment. Much progress has been made recently in measuring these complementary mechanisms in the data and quantifying them in calibrated models. In contrast, despite empirical support for different theories of financial shocks, there is little consensus on their relative contributions. These include models with news shocks and long-run expectations, discount factor shocks and convenience yields, segmented markets, and noise traders. At the same time, specific microfoundations of financial shocks are a central input for normative analysis, as some theories suggest significant deviations from market efficiency, particularly where the classical Trilemma does not apply, and a floating exchange rate with an inward-focused monetary policy is no longer optimal. Consequently, partial, crawling and full pegs sustained by active monetary and FX interventions, or credible promises of such, may emerge as desirable policy choices.", "summary_zh": "综述汇率与价格、消费、利率等脱节谜题，指出金融风险冲击与低汇率传递是关键机制，但金融冲击贡献仍无共识。", "title_zh": "汇率脱节", "abstract_zh": "汇率是国际经济学研究的核心，然而汇率与其他宏观经济变量之间的脱节——包括价格（购买力平价之谜和穆萨之谜）、消费（巴克斯—史密斯之谜）、利率与资产价格（未抛补利率平价之谜）以及类似随机游走的动态（米斯—罗戈夫之谜）——是开放经济宏观文献的主要障碍之一。近期实证文献以关于汇率长期属性、汇率与分项价格和数量的共同变动，以及不同时期和具有不同货币制度国家之间差异的新典型事实，补充了这些经典之谜。当前汇率前沿理论强调解决这些之谜的两个关键要素：金融风险分担冲击以及汇率向价格和数量传导的减弱。后者可能源于贸易成本、偏好中的本国偏向、企业按市场定价、名义刚性和出口的逐步调整。近来，在数据中衡量这些互补机制并在校准模型中对其进行量化方面已取得很大进展。相反，尽管不同金融冲击理论得到了经验支持，但关于它们的相对贡献却鲜有共识。这些理论包括含有新闻冲击和长期预期的模型、含有贴现因子冲击和便利收益的模型、分割市场以及噪声交易者。与此同时，金融冲击的具体微观基础是规范分析的核心投入，因为一些理论表明存在对市场效率的显著偏离，尤其是在经典三难困境不适用，且采用内向型货币政策的浮动汇率不再是最优的情况下。因此，由积极的货币与外汇干预或对此类干预的可信承诺所维持的部分钉住、爬行钉住和完全钉住，可能成为合意的政策选择。", "tags": ["汇率"], "extra": {"scholar_name": "Oleg Itskhoki", "work_type": "reference-entry", "doi": "10.1093/acrefore/9780190625979.013.951"}}, {"uid": "oa:W4416383267", "source": "top5", "title": "Diversification, Market Entry, and the Global Internet Backbone", "authors": "El Hadi Caoui, Andrew Steck", "venue": "The Review of Economic Studies", "url": "https://doi.org/10.1093/restud/rdaf097", "date": "2025-11-08", "abstract": "Abstract In many industries, buyers diversify their supplier base to manage supplier disruption risk. We investigate the importance of such diversification as a determinant of demand and supplier entry in the context of the internet backbone, the worldwide network of undersea fibre-optic cables that underpins the internet. We specify a model of international bandwidth demand and cable operators’ dynamic entry and supply choices. The model is estimated using novel data on cross-border data flows, prices, cable characteristics, and disruptions. Counterfactual analysis reveals that supplier diversification accounts for a large share of entry and surplus created between 2005 and 2021. Relative to the socially optimal level of entry, distortions due to suppliers’ inability to capture fully the social benefits of diversity are as large as distortions due to business stealing.", "summary_zh": "构建国际带宽需求与光缆运营商动态进入模型，发现供应商多元化显著促进市场进入与剩余。", "title_zh": "多元化、市场进入与全球互联网骨干", "abstract_zh": "摘要：在许多行业中，买方通过多元化其供应商基础来管理供应商中断风险。我们考察这种多元化作为需求和供应商进入的决定因素在互联网骨干网——支撑互联网的全球海底光纤电缆网络——背景下的重要性。我们设定了一个国际带宽需求以及电缆运营商动态进入与供给选择的模型。该模型使用关于跨境数据流、价格、电缆特征和中断的新颖数据进行估计。反事实分析表明，供应商多元化在2005年至2021年间创造的进入和剩余中占很大份额。相对于社会最优的进入水平，由于供应商无法充分获取多样性所带来的社会收益而造成的扭曲，与由于商业窃取而造成的扭曲一样大。", "tags": ["供应链", "其他"], "extra": {"journal_short": "REStud", "keyword_hit": "import", "doi": "10.1093/restud/rdaf097"}}, {"uid": "oa:W4415848145", "source": "scholar", "title": "Follow thy neighbor: The role of first exporters", "authors": "Hao Fe, Yang Liang, Mary E. Lovely", "venue": "Journal of Urban Economics", "url": "https://doi.org/10.1016/j.jue.2025.103813", "date": "2025-11-01", "abstract": "Exporting to foreign markets offers new opportunities for growth and expansion, but also comes with inherent challenges and risks. To mitigate these uncertainties, firms often learn from neighboring firms that are geographically close (Koenig et al. 2010; Silvente and Giménez 2007). Accounting for endogenous sorting of firms across space within cities, we present novel evidence of export spillovers at finely detailed spatial scales. Our findings suggest that firms located in the immediate vicinity of a local first exporter – a firm initiating a new seller-market – are 38% more likely to enter the same market the following year, compared to firms that lack a nearby first exporter. This effect is twice as large as export spillovers from later exporters in the same area. Our mechanism analysis suggests that the spillover effect is likely driven by the flow of information, facilitated by close proximity.", "summary_zh": "利用企业空间排序考察本地首家出口企业的出口溢出，发现邻近企业次年进入同一市场概率高38%。", "title_zh": "追随你的邻居：首家出口企业的作用", "abstract_zh": "向外国市场出口为企业带来增长与扩张的新机会，但也伴随固有挑战与风险。为缓解这些不确定性，企业常常向地理上邻近的邻近企业学习（Koenig et al. 2010; Silvente and Giménez 2007）。在考虑企业在城市内跨空间的内生排序后，我们提供了关于在高度精细空间尺度上出口溢出的新证据。我们的研究结果表明，位于本地首家出口商——即开创一个新卖方—市场的企业——紧邻地区的企业，与附近没有首家出口商的企业相比，次年进入同一市场的可能性高出38%。这一效应是同一地区后来出口商所产生的出口溢出的两倍大。我们的机制分析表明，这种溢出效应可能由信息流动驱动，而近距离促进了信息流动。", "tags": ["企业异质性", "其他"], "extra": {"scholar_name": "Mary Lovely", "work_type": "article", "doi": "10.1016/j.jue.2025.103813"}}, {"uid": "oa:W4415700285", "source": "top5", "title": "International Trade Responses to Labor Market Regulations", "authors": "Mathilde Muñoz", "venue": "American Economic Review", "url": "https://doi.org/10.1257/aer.20231531", "date": "2025-10-30", "abstract": "This paper demonstrates that labor market regulations, such as minimum wages or payroll taxes, shape trade competition in labor-intensive activities. I exploit data from a large European trade program where firms from different countries supply labor services at the same location but face different payroll taxes and minimum wage rules. Country case studies and model-consistent gravity estimates show large trade responses to tax and regulatory reforms, with an elasticity of trade in services to labor costs larger than one. The results imply that absent regulatory and fiscal harmonization, export competitiveness depends, in part, on domestic labor market policies. (JEL F14, F16, F42, H25, J22, J23, K31)", "summary_zh": "利用欧洲跨境服务贸易数据与引力估计，发现最低工资和工资税显著影响服务贸易，劳动力成本贸易弹性大于1。", "title_zh": "国际贸易对劳动力市场规制的反应", "abstract_zh": "本文表明，最低工资或工资税等劳动力市场规制会塑造劳动密集型活动中的贸易竞争。我利用一个大型欧洲贸易项目的数据，在该项目中，来自不同国家的企业在同一地点提供劳动服务，但面临不同的工资税和最低工资规则。国别案例研究和与模型一致的引力估计表明，贸易对税收和监管改革有显著反应，其中服务贸易对劳动力成本的弹性大于1。结果表明，若无监管与财政协调，出口竞争力部分取决于国内劳动力市场政策。（JEL F14, F16, F42, H25, J22, J23, K31）", "tags": ["劳动力市场", "贸易弹性", "贸易政策"], "extra": {"journal_short": "AER", "keyword_hit": "international trade", "doi": "10.1257/aer.20231531"}}, {"uid": "oa:W4415679543", "source": "scholar", "title": "China’s Journey in Embracing Economic Openness", "authors": "Shang‐Jin Wei, Xinding Yu", "venue": "Cambridge University Press eBooks", "url": "https://doi.org/10.1017/9781009649339.008", "date": "2025-10-30", "abstract": "This chapter examines China’s transformation from economic isolation to deep global integration. The authors identify three distinct phases in China’s trade openness: a corrective phase (1980–1992) that raised openness from below-norm levels; an expansion phase (1992–2006) where trade openness and a growing trade surplus exceeded international norms; and a normalization phase (2006–2021) with a gradual reduction toward a typical openness level. The analysis extends beyond traditional measures by evaluating export sophistication – revealing a significant post-2006 surge in the technological complexity of China’s export bundle – and by proposing a broader openness index that integrates FDI-related value-added activities. The chapter also discusses structural factors behind persistent trade imbalances, including financial system imperfections and competitive savings motives, and contextualizes these trends within the framework of China’s “dual circulation” strategy. Overall, the study provides insights into the evolving quality and quantity of China’s economic openness and its implications for future global integration amid rising geopolitical tensions and domestic policy shifts.", "summary_zh": "本文梳理中国从封闭到深度融入全球经济的三个阶段，评估出口复杂度并构建含FDI增加值的开放指数，揭示开放质量与贸易失衡成因。", "title_zh": "中国拥抱经济开放的历程", "abstract_zh": "本章考察中国从经济孤立向深度全球一体化的转变。作者识别出中国贸易开放度的三个不同阶段：纠正阶段（1980—1992年），该阶段将开放度从低于常态的水平提升；扩张阶段（1992—2006年），其间贸易开放度和不断扩大的贸易顺差超过国际常态水平；以及正常化阶段（2006—2021年），开放度逐步下降至典型开放水平。该分析超越传统衡量方法，通过评估出口复杂度——揭示2006年后中国出口商品篮子的技术复杂度显著上升——并提出一个纳入与FDI相关增加值活动的更广泛开放度指数。本章还讨论了持续贸易失衡背后的结构性因素，包括金融体系不完善和竞争性储蓄动机，并将这些趋势置于中国“双循环”战略框架中加以分析。总体而言，该研究提供了关于中国经济开放不断演变的质量和数量及其在日益加剧的地缘政治紧张和国内政策转变背景下对未来全球一体化影响的洞见。", "tags": ["贸易政策", "全球价值链"], "extra": {"scholar_name": "魏尚进", "work_type": "book-chapter", "doi": "10.1017/9781009649339.008"}}, {"uid": "oa:W4415623274", "source": "top5", "title": "Efficiency and Redistribution in Environmental Policy: An Equilibrium Analysis of Agricultural Supply Chains", "authors": "Tomás Domínguez-Iino", "venue": "Journal of Political Economy", "url": "https://doi.org/10.1086/739325", "date": "2025-10-28", "abstract": "", "summary_zh": "构建农业供应链均衡模型，揭示环境政策效率与再分配权衡。", "title_zh": "环境政策中的效率与再分配：农业供应链的均衡分析", "abstract_zh": "", "tags": ["供应链", "其他"], "extra": {"journal_short": "JPE", "keyword_hit": "supply chain", "doi": "10.1086/739325"}}], "themes": [{"tag": "贸易政策", "n": 7}, {"tag": "其他", "n": 5}, {"tag": "供应链", "n": 5}, { 77432", "items": 1}], "events": [{"conf_id": "n1181434", "title": "International Trade and Investment Program Meeting, Spring 2027", "type_name": "Program Meeting", "start_date": "2027-04-02", "end_date": "", "display_date": "April 2-3, 2027", "location": "Royal Sonesta Hotel, Edwin H. Land Blvd., Cambridge, MA", "organizers": "Stephen J. Redding", "url": "https://www.nber.org/conferences/international-trade-and-investment-program-meeting-spring-2027", "agenda": "empty", "papers": []}, {"conf_id": "n1271077", "title": "Tariffs and Economic Performance, Spring 2027", "type_name": "Conference", "start_date": "2027-04-01", "end_date": "", "display_date": "April 1, 2027", "location": "Royal Sonesta Hotel, 40 Edwin H. Land Blvd.,Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/tariffs-and-economic-performance-spring-2027", "agenda": "empty", "papers": []}, {"conf_id": "n1356637", "title": "International Finance and Macroeconomics Program Meeting, Spring 2027", "type_name": "Program Meeting", "start_date": "2027-03-19", "end_date": "", "display_date": "March 19, 2027", "location": "Federal Reserve Bank of San Francisco, 101 Market Street, San Francisco, CA", "organizers": "", "url": "https://www.nber.org/conferences/international-finance-and-macroeconomics-program-meeting-spring-2027", "agenda": "empty", "papers": []}, {"conf_id": "n1185515", "title": "International Trade and Investment Program Meeting, Fall 2026", "type_name": "Program Meeting", "start_date": "2026-11-20", "end_date": "2026-11-21", "display_date": "November 20-21, 2026", "location": "SIEPR, Stanford University, Koret-Taube Conference Center, 366 Galvez Street, Stanford, CA", "organizers": "Stephen J. Redding", "url": "https://www.nber.org/conferences/international-trade-and-investment-program-meeting-fall-2026", "agenda": "done", "papers": [{"title": "Tariff and Trade Deficits", "title_zh": "", "authors": [{"name": "Lorenzo Caliendo", "aff": "Yale University and NBER"}, {"name": "Samuel S. Kortum", "aff": "Yale University"}, {"name": "Fernando Parro", "aff": "University of Rochester and NBER"}], "discussants": [], "schedule": "2026-11-20 9:30 am", "tags": ["关税", "贸易政策", "方法论"], "abstract": "We develop a dynamic multi-country Ricardian trade model with aggregate uncertainty, where trade imbalances emerge as countries exchange goods and assets. We introduce a method for computing counterfactuals in this setting, which does not require specifying the stochastic process of shocks or solving for asset prices. Applying the model to tariff shocks, we quantify their effects on prices, income, spending, and trade imbalances. We find that higher U.S. tariffs reduce the U.S. trade deficit through general equilibrium adjustments, but raise domestic prices and lower real consumption. Our findings highlight that movements in trade imbalances are shaped by the structure of global trade and finance, and that attempts to influence external balances through changes in trade barriers carry significant implications for real economic outcomes.", "abstract_zh": "我们构建了一个带有总量不确定性的动态多国李嘉图贸易模型，其中贸易失衡随着各国交换商品和资产而出现。我们提出一种在该设定下计算反事实的方法，该方法不需要设定冲击的随机过程，也不需要求解资产价格。将模型应用于关税冲击，我们量化了其对价格、收入、支出和贸易失衡的影响。我们发现，更高的美国关税通过一般均衡调整减少了美国贸易赤字，但提高了国内价格并降低了实际消费。我们的发现强调，贸易失衡的变动由全球贸易和金融结构所塑造，并且通过改变贸易壁垒来影响外部平衡的尝试会对实际经济结果产生重大影响。", "intro_zh": "构建含总体不确定性的动态多国李嘉图模型，在无需设定冲击过程或求解资产价格的反事实方法下评估关税冲击。发现提高美国关税可通过一般均衡调整缩小贸易赤字，但推高国内价格并降低实际消费。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252135/f252135.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "A Dynamic Theory of Optimal Tariffs", "title_zh": "", "authors": [{"name": "Eduardo Dávila", "aff": "Yale University and NBER"}, {"name": "Andrés Rodríguez-Clare", "aff": "University of California, Berkeley and NBER"}, {"name": "Andreas Schaab", "aff": "University of California, Berkeley and NBER"}, {"name": "Stacy Tan", "aff": "Yale University"}], "discussants": [], "schedule": "2026-11-20 10:45 am", "tags": ["关税", "贸易弹性", "贸易政策"], "abstract": "The classic tariff formula states that the optimal unilateral tariff equals the inverse of the foreign export supply elasticity.We generalize this result and show that an intertemporal tariff formula characterizes the efficient tariff in a large class of dynamic heterogeneous agent (HA) economies with multiple goods.Intertemporal export supply elasticities and relative tariff revenue weights are sufficient statistics for the optimal tariff that decentralizes the efficient allocation.We also develop a general theory of second-best optimal tariffs.In dynamic HA incomplete markets economies, Ramsey optimal tariffs trade off intertemporal terms of trade manipulation against production efficiency, risk-sharing, and redistribution.Intertemporal export supply elasticities and relative tariff revenue weights remain sufficient statistics for the intertemporal terms of trade manipulation motive of second-best optimal tariffs.We apply our results to a quantitative heterogeneous agent New Keynesian (HANK) model with trade.", "abstract_zh": "经典关税公式表明，最优单边关税等于外国出口供给弹性的倒数。我们推广了这一结果，并表明一个跨期关税公式刻画了一大类具有多种商品的动态异质性代理人（HA）经济中的有效关税。跨期出口供给弹性和相对关税收入权重是最优关税的充分统计量，而该最优关税分散化有效配置。我们还发展了一般次优最优关税理论。在动态HA不完全市场经济中，拉姆齐最优关税在跨期贸易条件操纵与生产效率、风险分担和再分配之间进行权衡。跨期出口供给弹性和相对关税收入权重仍然是次优最优关税的跨期贸易条件操纵动机的充分统计量。我们将我们的结果应用于一个带有贸易的定量异质性代理人新凯恩斯（HANK）模型。", "intro_zh": "论文将经典最优关税公式推广到动态异质代理人多商品经济，提出以跨期出口供给弹性与相对关税收入权重为充分统计量的跨期最优关税公式，并发展次优关税理论，在HANK模型中权衡贸易条件操纵与效率、风险分担和再分配。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252117/f252117.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w33898", "state": "oa"}, {"title": "When Competition Compels Change: Trade, Management, and Productivity", "title_zh": "", "authors": [{"name": "Ananya Kotia", "aff": "Stanford University"}], "discussants": [], "schedule": "2026-11-20 12:00 pm", "tags": ["贸易政策", "企业异质性", "劳动力市场"], "abstract": "Competition reallocates resources toward more productive firms, raising aggregate productivity. In this paper, I show that competition also operates within firms, inducing organizational change that raises managerial efficiency. I exploit a product-specific import competition shock in India, assembling novel data on family-managed firms—the predominant form of corporate governance worldwide—with tenure records and family ties for over 6 million company executives and directors. Using an event-study design, I show that exposed firms respond to import competition by replacing family managers with non-family, professional executives. Firms that professionalize experience productivity gains of over 30 percent. To quantify the aggregate implications of these managerial adjustments, I develop a quantitative model embedding a management choice within a model of heterogeneous firms with monopolistic competition. Firms trade off the non-pecuniary private benefits associated with family management against the profit gains from professionalization. Using my model, I estimate that import liberalization increased aggregate productivity in India by 12 percent, with within-firm improvements in managerial allocation explaining nearly 30 percent of this increase.", "abstract_zh": "竞争将资源重新配置到生产率更高的企业，从而提高总量生产率。在本文中，我表明竞争也在企业内部发挥作用，引发提高管理效率的组织变革。我利用印度一项针对特定产品的进口竞争冲击，构建了关于家族管理企业——全球范围内公司治理的主要形式——的新颖数据，涵盖超过600万名公司高管和董事的任职记录与家族关系。采用事件研究设计，我表明受冲击企业通过用非家族的专业高管替换家族管理者来应对进口竞争。实现专业化的企业获得超过30%的生产率提升。为了量化这些管理调整的总量影响，我构建了一个定量模型，将管理选择嵌入具有垄断竞争的异质性企业模型。企业在与家族管理相关的非货币性私人收益与专业化带来的利润增益之间进行权衡。使用我的模型，我估计进口自由化使印度的总量生产率提高了12%，其中企业内部管理配置的改善解释了这一增幅的近30%。", "intro_zh": "研究印度进口竞争冲击下家族企业是否以职业经理人替代家族管理者；利用600万高管数据的事件研究，发现专业化企业生产率提升超30%；量化估计进口自由化使印度加总生产率提高12%，其中近30%源于企业管理配置改善。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252020/f252020.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.21953/researchonline.lse.ac.uk.00138874", "state": "oa"}, {"title": "The Global Impact of the Shale Boom", "title_zh": "", "authors": [{"name": "Andrei A. Levchenko", "aff": "University of Michigan and NBER"}, {"name": "Liugang Sheng", "aff": "The Chinese University of Hong Kong (CUHK)"}, {"name": "Wei Xiang", "aff": "University of Michigan"}], "discussants": [], "schedule": "2026-11-20 2:00 pm", "tags": ["全球价值链", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "研究美国页岩革命对全球油价、OPEC市场势力、生产区位、实际收入和排放的影响。构建多国投入产出贸易模型并估计供给弹性，发现页岩革命压低油价和OPEC加成，提升美国收入、降低OPEC收入并增加全球CO2。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252149/f252149.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "The Distributional Impacts of Decarbonization Policies", "title_zh": "", "authors": [{"name": "Rafael Dix-Carneiro", "aff": "Duke University and NBER"}, {"name": "Saverio Spinella", "aff": "New York University"}, {"name": "Jeffrey E. Sun", "aff": "University of Toronto"}, {"name": "Sharon Traiberman", "aff": "New York University and NBER"}], "discussants": [], "schedule": "2026-11-20 3:15 pm", "tags": ["劳动力市场", "产业政策"], "abstract": "Decarbonization policies can impose highly uneven costs across workers, industries, and regions, making their distributional consequences central to both policy design and political feasibility. We quantify these effects using a dynamic spatial general-equilibrium model of the United States with 48 states and 33 sectors. The model integrates costly trade, input-output linkages, imperfect worker mobility, irreversible capital accumulation, and an electricity sector with renewable and fossil-fuel generation connected through an interstate transmission network. We compare two uses of the revenues from a 20\\% carbon tax: uniform rebates to workers and subsidies to renewable electricity. Both policies reduce fossil-fuel production by about 35\\% within five years and by 38--42\\% in the long run, but generate different trade-offs. Renewable subsidies produce a larger shift toward clean electricity and smaller aggregate consumption losses, whereas uniform rebates substantially reduce workers' welfare losses. Losses are concentrated in fossil-fuel-producing regions and carbon-intensive industries, and regional dispersion of impacts is substantially larger under the renewable subsidy. Workers initially employed in fossil fuels experience some of the largest lifetime welfare losses, but these losses vary substantially across locations because workers differ in their outside employment opportunities and the mobility costs they face.", "abstract_zh": "脱碳政策可能在劳动者、行业和地区之间造成高度不均衡的成本，使其分配后果对政策设计和政治可行性都至关重要。我们使用一个包含48个州和33个部门的美国动态空间一般均衡模型来量化这些效应。该模型整合了有成本的贸易、投入产出联系、不完全的劳动者流动性、不可逆资本积累，以及一个通过州际输电网络连接可再生能源发电和化石燃料发电的电力部门。我们比较20%碳税收入的两种用途：对劳动者的统一返还和对可再生电力的补贴。两项政策都在五年内使化石燃料生产减少约35%，并在长期减少38--42%，但产生不同的权衡取舍。可再生补贴带来向清洁电力的更大转变和更小的总消费损失，而统一返还大幅降低劳动者的福利损失。损失集中在化石燃料生产地区和碳密集型行业，并且在可再生补贴下，影响的区域分散程度显著更大。最初受雇于化石燃料行业的工人会遭受一些最大的终身福利损失，但这些损失在不同地点之间差异很大，因为工人的外部就业机会和所面临的流动成本各不相同。", "intro_zh": "构建美国48州33部门动态空间一般均衡模型，比较20%碳税收入用于统一返款与可再生能源补贴。两者均大幅削减化石燃料，但补贴更促清洁电力、区域分化更大，返款显著降低工人福利损失。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252129/f252129.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Quantifying the Sensitivity of Quantitative Trade Models", "title_zh": "", "authors": [{"name": "Habib Ansari", "aff": "Birkbeck, University of London"}, {"name": "Dave Donaldson", "aff": "Massachusetts Institute of Technology and NBER"}, {"name": "Edward Wiles", "aff": "Harvard University"}], "discussants": [], "schedule": "2026-11-20 4:30 pm", "tags": ["方法论", "贸易弹性"], "abstract": "", "abstract_zh": "", "intro_zh": "研究量化贸易模型对生产率分布假设的敏感性，推导所有可能分布下贸易收益的界，并对接近基准分布的情形数值刻画；发现收益界很宽，最大约四倍、最小为零。", "journal": "", "pdf_url": "https://edwardwiles.github.io/storage/papers/CDW.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "The Great Game: A Model of Geoeconomic Competition", "title_zh": "", "authors": [{"name": "Christopher Clayton", "aff": "Yale University and NBER"}, {"name": "Matteo Maggiori", "aff": "Stanford University and NBER"}, {"name": "Jesse Schreger", "aff": "Columbia University and NBER"}], "discussants": [], "schedule": "2026-11-21 9:00 am", "tags": ["贸易政策", "出口管制", "供应链"], "abstract": "We build a model of two hegemons that have valuable trading relationships with eachother and at the same time compete in exerting geoeconomic power over countries inthe rest of the world. When the hegemons trade with each other their optimal policy isshaped both by classic economic considerations - the profitability of that specific trade- and by geoeconomic competition - how the trade affects the power of each hegemonvis-a-vis the rest of the world. We show that containment, a policy mix in which anhegemon attempts to limits sales of its inputs to the rival hegemon and uses its powerto demand that the rest of the world shifts away from sourcing from the rival hegemon,arises when the two hegemons offer relatively substitutable exports since a stronger rivalwould offer a better outside option to the targeted countries. Accommodation betweenthe hegemons, instead, occurs when power motives are small and the two hegemonsfocus on purely economic profit motives. We characterize how the rest of the countrieswelfare depends on the contain/accommodate regime of the hegemons.", "abstract_zh": "我们构建了一个模型，其中两个霸权国彼此之间存在有价值的贸易关系，同时又在向世界其他国家施加地缘经济权力方面展开竞争。当两个霸权国相互贸易时，其最优政策既由经典经济考量——该特定贸易的盈利能力——塑造，也由地缘经济竞争——该贸易如何影响每个霸权国相对于世界其他国家的权力——塑造。我们表明，当两个霸权国提供相对可替代的出口品时，遏制就会出现；遏制是一种政策组合，其中霸权国试图限制其投入品向竞争霸权国的销售，并利用其权力要求世界其他国家转向不再从竞争霸权国采购，因为更强的竞争国会为目标国家提供更好的外部选择。相反，当权力动机较小且两个霸权国关注纯粹经济利润动机时，霸权国之间的容纳就会出现。我们刻画了世界其他国家的福利如何取决于霸权国的遏制/容纳体制。", "intro_zh": "本文构建两个霸权国模型，它们彼此贸易并争夺对世界其他国家的经济权力。研究发现，当出口较可替代时出现遏制，权力动机较小时则转向妥协，并分析对其他国家福利的影响。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252043/f252043.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.6460778", "state": "oa"}, {"title": "Supply Chain Risk, Trade and Economic Fragility", "title_zh": "供应链风险、贸易与经济脆弱性", "authors": [{"name": "Juanma Castro-Vincenzi", "aff": "The University of Chicago and NBER"}, {"name": "Adry Gracio", "aff": "University of Texas at Austin"}, {"name": "Gaurav Khanna", "aff": "University of California, San Diego and NBER"}, {"name": "Nitya Pandalai-Nayar", "aff": "University of Texas at Austin and NBER"}], "discussants": [], "schedule": "2026-11-21 10:15 am", "tags": ["供应链", "全球价值链"], "abstract": "We study how equilibrium patterns of production, trade, and input sourcing in complex supply chains are shaped by aggregate risk.We develop a quantitative multi-country model with multisourcing across stages.We show that sourcing shares equal an input's expected output elasticityits expected marginal contribution to output across states of the world.Risk has a positional effect on sourcing and welfare, operating through offsetting cross-stage complementarity and withinstage substitutability; which one dominates is a quantitative question.An increase in a country's own risk always lowers its welfare; risk elsewhere has ambiguous, sometimes positive, effects through relative prices.We also show analytically that risk attenuates comparative advantage, as countries shift sourcing away from their most productive suppliers.Quantifying the model for 50 countries and 3 production stages, we show that supply-chain complexity lowers volatility for the riskiest countries, and rising Chinese-origin risk reallocates production and lowers welfare unevenly across the chain.", "abstract_zh": "我们研究复杂供应链中生产、贸易和投入品采购的均衡模式如何由总体风险塑造。我们构建了一个具有跨阶段多源采购的定量多国模型。我们表明，采购份额等于某投入品的预期产出弹性，即其在各种世界状态下对产出的预期边际贡献。风险对采购和福利具有位置效应，其作用通过相互抵消的跨阶段互补性与阶段内替代性发挥；哪一者占主导是一个定量问题。一国自身风险的上升总是降低其福利；其他地方的风险通过相对价格产生不确定的、有时是正向的效应。我们还通过解析表明，风险会削弱比较优势，因为各国将采购从生产率最高的供应商处转移开。对50个国家和3个生产阶段进行模型量化后，我们表明供应链复杂性降低了风险最高国家的波动性，而中国来源风险的上升会在整条供应链上不均衡地重新配置生产并降低福利。", "intro_zh": "论文研究复杂供应链中总体风险如何影响生产、贸易、采购与福利。构建多国多阶段一般均衡模型，发现采购由预期产出弹性决定，风险重塑比较优势和福利，供应链复杂度与中国来源风险影响不均。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f250625/f250625.pdf", "slides_url": "", "wp_num": "w35496", "pub_url": "https://www.nber.org/papers/w35496", "state": "matched"}, {"title": "Export Controls and the Economics of National Security", "title_zh": "出口管制与国家安全经济学", "authors": [{"name": "Jingting Fan", "aff": "Cheung Kong Graduate School of Business"}, {"name": "Kyle Handley", "aff": "University of California, San Diego and NBER"}, {"name": "Nuno Limão", "aff": "Georgetown University and NBER"}], "discussants": [], "schedule": "2026-11-21 11:30 am", "tags": ["出口管制", "贸易政策", "全球价值链"], "abstract": "", "abstract_zh": "", "intro_zh": "本文结合美国出口管制分类与许可数据，构建含两用生产、投入产出联系和军民支出的量化一般均衡模型，估计管制壁垒。研究发现多边管制比单边更能减少受控出口并提升相对安全。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f252153/f252153.pdf", "slides_url": "", "wp_num": "w35898", "pub_url": "https://www.nber.org/papers/w35898", "state": "matched"}]}, {"conf_id": "n1248161", "title": "International Finance and Macroeconomics Program Meeting, Fall 2026", "type_name": "Program Meeting", "start_date": "2026-10-23", "end_date": "2026-10-23", "display_date": "October 23, 2026", "location": "Royal Sonesta Hotel, Riverfront Room, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/international-finance-and-macroeconomics-program-meeting-fall-2026", "agenda": "done", "papers": [{"title": "A Model of Global Firms and Capital Markets", "title_zh": "", "authors": [{"name": "Loukas Karabarbounis", "aff": "University of Minnesota and NBER"}, {"name": "Bruno Pellegrino", "aff": "Columbia University and NBER"}, {"name": "Juliana Salomao", "aff": "University of Minnesota and NBER"}], "discussants": [{"name": "Ṣebnem Kalemli-Özcan", "aff": "Brown University and NBER"}], "schedule": "2026-10-23 8:30 am", "tags": ["企业异质性", "其他"], "abstract": "We develop a general-equilibrium model of the global economy that integrates heterogeneous firms competing in product markets with countries that allocate capital around the world. Combining a hedonic demand system on the product side with a mean-variance portfolio system on the asset side, we obtain almost closed-form solutions for the equilibrium of the model. We use firm-level data on balance sheets, geographic breakdowns of revenue and employment, and business descriptions along with country-level data on bilateral equity holdings and trade costs to quantify the model to a cross section of roughly 23,000 listed firms in 48 countries. We use the model to evaluate the reallocation and welfare effects of globalization. Both financial and trade liberalization concentrate activity among the largest firms and raise welfare, with gains being larger in emerging and mid-sized open economies respectively. Product- and capital-market frictions amplify each other, meaning that liberalizing one market reduces the gains from liberalizing the other. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "我们构建一个全球经济的一般均衡模型，该模型将产品市场中竞争的异质性企业与在世界各地配置资本的国家整合在一起。将产品侧的享乐需求系统与资产侧的均值-方差投资组合系统相结合，我们得到该模型均衡的近乎闭式解。我们使用企业层面的资产负债表、收入和就业的地理分布以及业务描述数据，连同双边股权持有和贸易成本的国别数据，将模型量化到48个国家约23,000家上市公司的横截面。我们使用该模型评估全球化的再配置效应和福利效应。金融自由化和贸易自由化都将活动集中于最大的企业并提高福利，其中收益分别在新兴经济体和中等规模开放经济体中更大。产品和资本市场摩擦相互放大，这意味着使一个市场自由化会减少使另一个市场自由化所带来的收益。NBER工作论文系列的机构订户以及发展中国家居民可在www.nber.org无需额外费用下载本文。", "intro_zh": "构建一般均衡模型，将异质性企业产品市场竞争与全球资本配置结合，量化48国约2.3万家上市企业，评估全球化效应。贸易与金融自由化使活动集中于大型企业并提升福利；产品与资本市场摩擦相互放大。", "journal": "CESifo", "pdf_url": "https://conference.nber.org/conf_papers/f250263/f250263.pdf", "slides_url": "", "wp_num": "w35652", "pub_url": "https://doi.org/10.3386/w35652", "state": "oa"}, {"title": "A Macroeconomic Model of the Cross-Section of Currencies", "title_zh": "", "authors": [{"name": "Aleksei Oskolkov", "aff": "Princeton University"}, {"name": "Diego Perez", "aff": "New York University and NBER"}], "discussants": [{"name": "Charles Engel", "aff": "University of Wisconsin - Madison and NBER"}], "schedule": "2026-10-23 9:45 am", "tags": ["汇率", "方法论"], "abstract": "", "abstract_zh": "", "intro_zh": "本文构建含异质国家、分割资产市场和风险厌恶中介的宏观经济模型，研究双边汇率横截面。模型给出美元与大宗商品两因子结构，并以实证因子估计量化；发现美元资产与大宗商品敞口使各国汇率驱动因素显著异质。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f250626/f250626.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Tariffs, Investment, and the Missing Trade Collapse", "title_zh": "关税、投资与缺失的贸易崩塌", "authors": [{"name": "Michael E. Waugh", "aff": "Federal Reserve Bank of Minneapolis and NBER"}, {"name": "Andrea Prestipino", "aff": "Federal Reserve Board of Governors"}, {"name": "Andrea Raffo", "aff": "Federal Reserve Bank of Minneapolis"}, {"name": "Francesco Ferrante", "aff": "Federal Reserve Board of Governors"}], "discussants": [{"name": "George A. Alessandria", "aff": "University of Rochester and NBER"}], "schedule": "2026-10-23 11:00 am", "tags": ["关税", "贸易政策", "方法论"], "abstract": "U.S. tariff rates in 2025 rose to levels not seen since the Great Depression, yet imports increased.To account for the missing trade collapse, we develop an open-economy New Keynesian model with tariff heterogeneity, inventories, and shocks to investment that capture the AI-driven boom.The model matches the untargeted paths of imports, output, and inflation; we use it to decompose the effects of tariffs and the investment boom.Absent the investment boom, imports would have fallen by 10 percent and activity would have contracted by 0.7 percent.The effects of tariffs depend on which goods are tariffed: tariffs on consumption and intermediates act like shocks to supply; tariffs on capital goods act like shocks to demand.The concentration of the 2025 tariff increases on consumption goods and the relative sparing of capital goods limited the damage to output while amplifying the inflationary impulse.", "abstract_zh": "2025年美国关税税率升至自大萧条以来未见过的水平，但进口却增加了。为解释这一缺失的贸易崩溃，我们构建了一个包含关税异质性、库存以及捕捉AI驱动繁荣的投资冲击的开放经济新凯恩斯模型。该模型匹配了进口、产出和通胀的未设目标路径；我们用它分解关税和投资繁荣的影响。如果没有投资繁荣，进口将下降10%，经济活动将收缩0.7%。关税的影响取决于哪些商品被征收关税：对消费品和中间品征收关税的作用类似于供给冲击；对资本品征收关税的作用类似于需求冲击。2025年关税上调集中于消费品以及资本品相对免受关税影响，限制了对产出的损害，同时放大了通胀冲动。", "intro_zh": "研究2025年美国高关税下进口反增的“贸易崩溃缺失”之谜。作者构建含关税异质性、库存与AI投资冲击的开放经济新凯恩斯模型，匹配进口、产出和通胀路径并分解关税与投资繁荣效应。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f251067/f251067.pdf", "slides_url": "", "wp_num": "w35630", "pub_url": "https://www.nber.org/papers/w35630", "state": "matched"}, {"title": "Precautionary Sourcing and the Macroeconomics of De-Risking", "title_zh": "", "authors": [{"name": "Ester Faia", "aff": "Goethe University Frankfurt"}], "discussants": [{"name": "Doireann Fitzgerald", "aff": "Federal Reserve Bank of Minneapolis"}], "schedule": "2026-10-23 1:00 pm", "tags": ["关税", "全球价值链", "供应链"], "abstract": "This paper assesses the efficiency and welfare costs of retrenchment from international suppliers due to tariff and geopolitical risk. Using a sector-level (Census data) and firm-level (Panjiva firm input-output data) exposure-weighted event-study analysis, I find marked retrenchment and reallocation that went beyond tariffed goods and, through an anticipation design using geopolitical-risk and trade-policy-uncertainty indices, can be attributed to heightened uncertainty rather than tariff levels. I build an input-output network model in which firms, facing \\textit{uninsurable productivity and currency risk}, optimally choose suppliers (severing very risky ones, albeit productive) and embed it in a dynamic macro model, where consumer-workers share the risk of the firms to which they are attached through a limited-commitment wage contract. I derive a risk-misallocation wedge that emerges only under an endogenous network and incomplete markets: it vanishes in the fixed-network benchmark (Baqaee and Farhi) or under complete markets. I simulate the model under a counterfactual tariff shock (to mimic the 2018 and 2025 events) and validate it against the empirical patterns. The efficiency cost of precautionary severing of the Chinese links is modest (0.065% of consumption) but scales with exposure to the full set of tariffed suppliers (0.31%); within the risk wedge the currency-uncertainty component is larger than the tariff-uncertainty component; and the consumption cost borne by workers sharing their firm's risk exceeds the pure misallocation cost by roughly three orders of magnitude and falls overwhelmingly on the poorest households, who bear some twenty-seven times the cost of the richest.", "abstract_zh": "本文评估因关税和地缘政治风险而从国际供应商处回撤所带来的效率与福利成本。我使用部门层面（Census数据）和企业层面（Panjiva企业投入产出数据）的暴露加权事件研究分析，发现显著的回撤与再配置，其范围超出了被征收关税的商品；并且，通过使用地缘政治风险和贸易政策不确定性指数的预期设计，这种回撤与再配置可归因于不确定性上升，而非关税水平。我构建了一个投入产出网络模型，在该模型中，面临不可保险的生产率风险和货币风险的企业最优地选择供应商（切断风险极高但具有生产率的供应商），并将其嵌入一个动态宏观模型；在该动态宏观模型中，消费者—工人通过有限承诺工资合同分担其所属企业的风险。我推导出一个仅在内生网络和不完全市场下出现的风险错配楔子：在固定网络基准（Baqaee and Farhi）中或在完全市场下，该楔子消失。我在反事实关税冲击下模拟该模型（以模仿2018年和2025年事件），并对照实证模式对其进行验证。预防性切断与中国联系所带来的效率成本并不大（占消费的0.065%），但会随着对全部被征收关税供应商的敞口而上升（0.31%）；在风险楔子中，货币不确定性成分大于关税不确定性成分；而分担企业风险的工人所承担的消费成本，比纯粹的错配成本高出约三个数量级，并且绝大部分落在最贫困家庭身上，这些家庭承担的成本约为最富裕家庭的二十七倍。", "intro_zh": "本文研究关税与地缘政治风险下企业预防性收缩国际采购的效率与福利成本。结合事件研究和投入产出网络宏观模型，发现不确定性驱动断链与再配置，福利成本主要落在低收入劳动者。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f251296/f251296.pdf", "slides_url": "https://conference.nber.org/conf_papers/f251296/f251296.slides.pdf", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The Very Long-Run Costs of Financial Crises", "title_zh": "", "authors": [{"name": "Karsten Müller", "aff": "National University of Singapore"}, {"name": "Chenzi Xu", "aff": "University of California, Berkeley and NBER"}, {"name": "Mohamed Lehbib", "aff": "National University of Singapore"}], "discussants": [{"name": "Sanjay R. Singh", "aff": "Federal Reserve Bank of San Francisco and UC Davis"}], "schedule": "2026-10-23 2:15 pm", "tags": ["其他"], "abstract": "", "abstract_zh": "", "intro_zh": "论文利用新构建的全球宏观数据库，考察金融危机后数十年的产出动态，发现银行危机使实际GDP相对危机前趋势收缩约10%并持续五十年，人力与物质资本积累及财政状况也长期受损。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f251320/f251320.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Foreign Exchange Risk Management Spillovers Across the Production Network", "title_zh": "", "authors": [{"name": "Wentong Chen", "aff": "Santa Clara University"}], "discussants": [{"name": "Adrien Verdelhan", "aff": "Massachusetts Institute of Technology and NBER"}], "schedule": "2026-10-23 3:30 pm", "tags": ["汇率", "供应链"], "abstract": "", "abstract_zh": "", "intro_zh": "研究企业外汇对冲通过生产网络对供应商和客户的溢出效应。作者手工收集美国公司10-K衍生品数据并匹配供应链关系，结合校准模型发现：客户或供应商开始对冲会降低企业销售或销货成本波动，且中心供应商影响最大。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f251340/f251340.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.7590643", "state": "bare"}]}, {"conf_id": "n1231450", "title": "SI 2026 Macroeconomics Within and Across Borders", "type_name": "Summer Institute Workshop", "start_date": "2026-07-20", "end_date": "2026-07-20", "display_date": "July 20, 2026", "location": "Parkview, Royal Sonesta Hotel, Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-macroeconomics-within-and-across-borders", "agenda": "done", "papers": [{"title": "A Macroeconomic Model of the Cross-Section of Currencies", "title_zh": "", "authors": [{"name": "Aleksei Oskolkov", "aff": "Princeton University"}, {"name": "Diego J. Perez", "aff": "New York University and NBER"}], "discussants": [{"name": "Adrien Verdelhan", "aff": "Massachusetts Institute of Technology and NBER"}], "schedule": "2026-07-20 9:00 am", "tags": ["汇率", "方法论"], "abstract": "We study the cross-section of currencies using a quantitative macroeconomic model with heterogeneous countries, segmented asset markets, and risk-averse financial intermediaries. The model admits a two-factor structure of changes in bilateral exchange rates, where the factors reflect a combination of shocks to global output and risk premia. Country exposures to these factors are heterogeneous and determined by the incidence of commodity production and dollar asset holdings. We estimate this factor structure empirically and use these estimates to discipline the model. Our results indicate substantial heterogeneity in exchange rate drivers across countries, which is primarily determined by countries' exposure to risk. Riskier currencies are those of high-commodity countries that are exposed to global business cycle risk and low-dollar countries that are exposed to US-originated fluctuations in the dollar value. Increases in risk premia depreciate all currencies relative to the dollar, with larger depreciations in risky ones. Currencies of countries with high dollar assets and low commodity exports tend to move less relative to the dollar, and their fluctuations are mostly determined by idiosyncratic shocks.", "abstract_zh": "我们使用一个包含异质性国家、分割的资产市场和风险厌恶型金融中介的定量宏观经济模型来研究货币的横截面。该模型容许双边汇率变动具有双因子结构，其中因子反映全球产出冲击与风险溢价的组合。各国对这些因子的暴露是异质的，并由商品生产的分布和美元资产持有情况决定。我们对该因子结构进行实证估计，并利用这些估计来约束模型。我们的结果表明，各国汇率驱动因素存在显著异质性，而这主要取决于各国对风险的暴露。风险较高的货币是高商品国家的货币，这些国家暴露于全球商业周期风险；风险较高的货币也是低美元国家的货币，这些国家暴露于源自美国的美元价值波动。风险溢价上升会使所有货币相对美元贬值，而风险较高货币的贬值幅度更大。美元资产较高且商品出口较低的国家，其货币相对于美元的波动往往较小，而这些波动主要由特质性冲击决定。", "intro_zh": "本文用异质国家、资产市场分割和风险厌恶中介的定量宏观模型研究货币横截面。模型将双边汇率变动分解为全球产出与风险溢价两因子，并由商品生产和美元资产暴露校准；发现风险暴露是汇率驱动异质性的主因。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245593/f245593.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Breaking Parity: Equilibrium Exchange Rates and Currency Premia", "title_zh": "", "authors": [{"name": "Mai C. Dao", "aff": "International Monetary Fund"}, {"name": "Pierre-Olivier Gourinchas", "aff": "University of California, Berkeley and NBER"}, {"name": "Oleg Itskhoki", "aff": "Harvard University and NBER"}], "discussants": [{"name": "Ṣebnem Kalemli-Özcan", "aff": "Brown University and NBER"}], "schedule": "2026-07-20 10:15 am", "tags": ["汇率", "方法论"], "abstract": "We offer a unifying empirical model of covered and uncovered currency premia, interest rates and spot and forward exchange rates, both in the cross section and time series of currencies. We find that the rich empirical patterns are in line with a partial equilibrium model of the currency market, where hedged and unhedged currency is supplied by intermediary banks subject to value-at-risk balance-sheet constraints, emphasizing the frictional nature of equilibrium currency premia and exchange rate dynamics. In the cross section, the excess supply of local-currency savings is the key determinant of low relative interest rates, negative covered and uncovered currency premia, cheap forward dollars; and vice versa. In the time series, covered currency premia change infrequently and in concert across currencies, driven by aggregate financial market conditions. In contrast, uncovered currency premia move frequently in response to currency-specific demand shocks, which we capture with the dynamics of net currency futures positions of dealer banks. Exchange rate depreciations in response to negative shifts in currency demand are followed by small persistent appreciations that generate predictable expected returns necessary to ensure intermediation of currency demand shocks, irrespective of their financial or macroeconomic origin. Changes in net futures positions of dealer banks account for most of the variation in the spot exchange rate for every currency.", "abstract_zh": "我们提出了一个统一的实证模型，用以刻画货币横截面与时间序列中的抛补与未抛补货币溢价、利率以及即期与远期汇率。我们发现，丰富的实证模式与一个外汇市场局部均衡模型相一致；在该模型中，对冲和未对冲货币由受在险价值资产负债表约束的中介银行供给，这强调了均衡货币溢价和汇率动态的摩擦性质。在横截面上，本币储蓄的过度供给是相对利率偏低、抛补与未抛补货币溢价为负、远期美元便宜的关键决定因素；反之亦然。在时间序列上，抛补货币溢价不频繁变化，并在各货币间协同变化，由总体金融市场状况驱动。相比之下，未抛补货币溢价频繁变动，以响应特定货币需求冲击，我们借助交易商银行净货币期货头寸的动态来刻画这种冲击。应对货币需求负向变动而出现的汇率贬值之后，会跟随小幅持续升值，这些升值产生了可预测的预期回报，而这些回报是为确保货币需求冲击的中介化所必需的，不论这些冲击的金融或宏观经济来源为何。交易商银行净期货头寸的变化解释了每种货币即期汇率变化的大部分。", "intro_zh": "论文构建统一实证模型，考察抵补与非抵补货币溢价、利率及即远期汇率的横截面与时间序列。以受VaR约束的银行中介框架解释，发现本地储蓄超额供给驱动横截面溢价与远期美元，交易商净期货头寸变化解释多数即期汇率变动。", "journal": "", "pdf_url": "https://itskhoki.com/papers/BreakingParityFX.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34443", "state": "oa"}, {"title": "Technological Change and Career Ladders", "title_zh": "", "authors": [{"name": "Hassan Afrouzi", "aff": "Columbia University and NBER"}, {"name": "Andres Blanco", "aff": "Federal Reserve Bank of Atlanta"}, {"name": "Andrés Drenik", "aff": "University of Texas at Austin and NBER"}, {"name": "Erik Hurst", "aff": "The University of Chicago and NBER"}], "discussants": [{"name": "Guido Menzio", "aff": "New York University and NBER"}], "schedule": "2026-07-20 11:30 am", "tags": ["劳动力市场", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "论文构建连续时间一般均衡模型，研究自动化如何通过任务学习影响职业动态、人力资本与福利；发现高学习能力经济有双稳态，技术降价在高学习均衡提升福利，在低学习均衡则导致人力资本陷阱。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f247283/f247283.pdf", "slides_url": "https://conference.nber.org/conf_papers/f247283/f247283.slides.pdf", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Tariff Wars and Net Foreign Assets", "title_zh": "", "authors": [{"name": "Mark A. Aguiar", "aff": "Princeton University and NBER"}, {"name": "Manuel Amador", "aff": "University of Minnesota and NBER"}, {"name": "Doireann Fitzgerald", "aff": "Federal Reserve Bank of Minneapolis"}], "discussants": [{"name": "Ina Simonovska", "aff": "University of California, Davis and NBER"}], "schedule": "2026-07-20 1:30 pm", "tags": ["关税", "贸易战", "汇率"], "abstract": "We examine whether and how international financial claims accumulated during a period of free trade can be settled without default once a tariff war erupts. Our key insight is that tariff-induced shifts in international relative prices revalue gross asset positions such that net financial claims can be zeroed out even without trade. In a multi-good model, when both countries hold gross claims on each other of the same sign, autarky is always an equilibrium for high enough tariffs. In a dynamic interpretation, domestic interest rates and the real exchange rate decouple under a severe tariff war: interest rates align with their autarkic values while international relative prices revalue net foreign assets to zero. We explore a two-good version of the model to show that when liabilities are denominated in domestic goods, autarky is the unique equilibrium for high enough tariffs, though a continuum of balanced-trade equilibria with positive trade flows may also exist at moderate tariff levels. When liabilities are denominated in foreign goods, sunspot-driven multiplicity arises: the direction of trade determines which country is impoverished. We provide a quantitative exploration of how the impact of a tariff war depends on the nature of ex-ante portfolios in a model calibrated to the US foreign asset position in 2023.", "abstract_zh": "我们考察在自由贸易时期积累的国际金融债权，一旦关税战爆发，能否以及如何在不违约的情况下得到清偿。我们的关键洞见是，关税引发的国际相对价格变动会重估总资产头寸，使得即使没有贸易，净金融债权也可以被清零。在一个多商品模型中，当两国彼此持有的总债权具有相同符号时，只要关税足够高，自给自足就始终是一个均衡。在动态解释中，在严重的关税战下，国内利率与实际汇率会脱钩：利率与其自给自足值一致，而国际相对价格将净外国资产重估为零。我们探讨该模型的两商品版本，以表明当负债以本国商品计价时，只要关税足够高，自给自足就是唯一均衡，尽管在中等关税水平下也可能存在一个连续统的、具有正贸易流量的贸易平衡均衡。当负债以外国商品计价时，会出现太阳黑子驱动的多重性：贸易方向决定哪个国家陷入贫困。我们在一个根据2023年美国对外资产头寸校准的模型中，定量考察了关税战的影响如何取决于事前投资组合的性质。", "intro_zh": "研究关税战下，自由贸易期积累的国际金融债权能否无违约清算。多商品模型显示，关税通过改变国际相对价格重估总资产头寸，高关税下自给自足可为均衡；动态中净国外资产被重估为零。并基于2023年美国对外资产头寸量化。", "journal": "", "pdf_url": "https://www.markaguiar.com/files/tariff_deficits.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w33743", "state": "oa"}, {"title": "Fiscal and Monetary Unions", "title_zh": "", "authors": [{"name": "Rafael Berriel", "aff": "Stanford University"}, {"name": "Eugenia Gonzalez-Aguado", "aff": "Toulouse School of Economics"}, {"name": "Patrick J. Kehoe", "aff": "Stanford University and NBER"}, {"name": "Elena Pastorino", "aff": "Stanford University and NBER"}], "discussants": [{"name": "Rishabh Kirpalani", "aff": "University of Wisconsin - Madison"}], "schedule": "2026-07-20 2:45 pm", "tags": ["其他"], "abstract": "How should fiscal policies be delegated within a monetary union, and how does enlargement affect the case for centralization? Two forces compete. The fiscal federalism view favors decentralization: local authorities hold superior information about local conditions. The macroeconomic view favors centralization: decentralized governments issuing nominal debt ignore the inflationary spillovers their borrowing imposes on others, generating an endogenous fiscal externality. We model a monetary union with a finite number of countries---rather than the standard continuum---which produces nontrivial debt dynamics requiring new viscosity solution techniques. Our key result: the fiscal externality grows with union size while the informational advantage of decentralization remains constant, yielding a threshold. Small unions prefer decentralization; large ones prefer centralization. Highly indebted unions hit this threshold sooner. Adding many small countries worsens free-riding and tilts toward centralization. Our framework speaks directly to the fiscal governance debate as the European Monetary Union expands.", "abstract_zh": "财政政策应如何在货币联盟内进行授权，以及联盟扩大如何影响集中化的理由？有两股力量相互竞争。财政联邦主义观点支持分权：地方政府掌握关于本地条件的更优信息。宏观经济观点支持集中化：分散化政府发行名义债务时，忽视其借款对他人造成的通胀溢出，从而产生内生的财政外部性。我们构建一个由有限数量国家（而非标准连续统）组成的货币联盟模型，这产生了需要新的粘性解技术的非平凡债务动态。我们的关键结果是：财政外部性随联盟规模增长，而分权的信息优势保持不变，从而形成一个阈值。小型联盟偏好分权；大型联盟偏好集中化。高负债联盟会更早达到这一阈值。加入许多小国将加剧搭便车并使其倾向于集中化。随着欧洲货币联盟扩张，我们的框架直接回应财政治理争论。", "intro_zh": "研究货币联盟内财政政策应分权还是集权，以及扩员如何影响这一取舍。模型含有限国家、名义债务与通胀溢出，采用新粘性解技术。核心发现是财政外部性随联盟扩大而增强，形成阈值：小联盟偏分权，大联盟偏集权。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245236/f245236.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Accounting for Credibility: Fiscal-Monetary Interactions and the Credibility of Central Bank Mandates", "title_zh": "", "authors": [{"name": "Luigi Bocola", "aff": "Stanford University and NBER"}, {"name": "Gastón Chaumont", "aff": "University of Rochester"}, {"name": "Alessandro Dovis", "aff": "University of Pennsylvania and NBER"}, {"name": "Rishabh Kirpalani", "aff": "University of Wisconsin - Madison"}], "discussants": [{"name": "Ludwig Straub", "aff": "Harvard University and NBER"}], "schedule": "2026-07-20 4:00 pm", "tags": ["其他"], "abstract": "We develop a model for fiscal and monetary policy determination in the tradition of Sargent and Wallace (1981). Ex-ante, the government has incentives to delegate monetary policy to a central bank with an inflation targeting mandate. Ex-post, however, the government faces temptations to revoke the mandate to generate seigniorage revenues. The likelihood that the government will adhere to its commitment depends on shocks to fiscal fundamentals and the costs of reneging on the mandate. The economy endogenously transitions between a “monetary-dominant” regime where monetary policy adheres to its commitment and a “fiscal-dominant” regime where the fiscal authority interferes with monetary policy. These two regimes sharply differ in their implications for the comovement of inflation and debt-to-GDP ratios. We use the model as a measurement device to interpret the fiscal and monetary history in Colombia, Chile, and the U.S. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "我们沿袭Sargent and Wallace（1981）的传统，构建了一个用于分析财政与货币政策决定的模型。事前，政府有动机将货币政策委托给一家具有通胀目标制授权的中央银行。然而，事后政府面临撤销该授权以获取铸币税收入的诱惑。政府坚持其承诺的可能性取决于对财政基本面的冲击以及违背该授权的成本。经济内生地在“货币主导”体制与“财政主导”体制之间转换；在前者中货币政策遵守其承诺，在后者中财政当局干预货币政策。这两种体制对通胀与债务与GDP之比共同变动的含义截然不同。我们将该模型用作度量工具，以解释哥伦比亚、智利和美国的财政与货币历史。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "intro_zh": "构建财政与货币政策互动模型，分析政府事前授权、事后撤销通胀目标制的激励。模型内生切换货币主导与财政主导体制，并用其解读哥伦比亚、智利和美国的财政货币史。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f240471/f240471.pdf", "slides_url": "", "wp_num": "w35691", "pub_url": "https://doi.org/10.3386/w35691", "state": "oa"}]}, {"conf_id": "n1231439", "title": "SI 2026 International Economics and Geopolitics", "type_name": "Summer Institute Workshop", "start_date": "2026-07-16", "end_date": "2026-07-16", "display_date": "July 16, 2026", "location": "Serrano Ballroom, Hotel Marlowe, 25 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-international-economics-and-geopolitics", "agenda": "done", "papers": [{"title": "A Network Approach to Geopolitics", "title_zh": "", "authors": [{"name": "Ernest Liu", "aff": "Princeton University and NBER"}, {"name": "Stephen J. Redding", "aff": "Stanford University and NBER"}, {"name": "Bennett Smith-Worthington", "aff": "Princeton University"}, {"name": "David Y. Yang", "aff": "Harvard University and NBER"}], "discussants": [{"name": "Christopher Clayton", "aff": "Yale University and NBER"}], "schedule": "2026-07-16 9:00 am", "tags": ["方法论", "其他"], "abstract": "We develop a tractable framework for analyzing geopolitics as a network of coordination and strategic influence. Countries choose geopolitical actions that trade off domestic interests against incentives to align with connected countries. Prior to policy choice, they can make costly bilateral investments to influence one another, with effects that propagate directly and indirectly through the geopolitical network. We show that the equilibrium mapping from domestic interests to geopolitical actions admits a spectral representation, allowing international disagreements to be decomposed into latent geopolitical cleavages. We further establish that the covariance matrices of domestic interests and geopolitical actions identify the underlying geopolitical network through its eigencomponents. We implement the framework using data on countries’ domestic interests and geopolitical actions. The inferred network is low-dimensional, aligns with external measures of geopolitical ties, and recovers well-known historical cleavages, from the Cold War division between the Western and Soviet blocs to the contemporary U.S.–China divide. Counterfactual exercises show that geopolitical actions are determined not only by domestic interests and national capabilities, but also by countries’ positions in the geopolitical network and by the direct and indirect propagation of strategic influence.", "abstract_zh": "我们构建了一个易于处理的框架，用于将地缘政治作为协调与战略影响的网络加以分析。国家选择地缘政治行动，在国内利益与同相联系国家结盟的激励之间进行权衡。在政策选择之前，它们可以进行成本高昂的双边投资以相互施加影响，其效应通过地缘政治网络直接和间接传播。我们表明，从国内利益到地缘政治行动的均衡映射具有谱表示，从而可以将国际分歧分解为潜在的地缘政治分野。我们进一步确立，国内利益与地缘政治行动的协方差矩阵通过其特征分量识别潜在的地缘政治网络。我们利用关于各国国内利益和地缘政治行动的数据实施该框架。推断出的网络是低维的，与地缘政治联系的外部度量相一致，并复原了众所周知的历史分野，从冷战时期西方集团与苏联集团之间的分裂到当代美中分歧。反事实练习表明，地缘政治行动不仅由国内利益和国家能力决定，还由各国在地缘政治网络中的位置以及战略影响的直接和间接传播决定。", "intro_zh": "构建地缘政治网络框架，刻画国家在国内利益与结盟激励间的权衡及双边战略投资的网络传播。均衡具谱表示，协方差可识别底层网络；实证恢复冷战分裂与中美分歧，反事实揭示网络位置与影响传播的作用。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f242639/f242639.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Hegemonic Competition with Carrots and Sticks", "title_zh": "", "authors": [{"name": "Timothy Meyer", "aff": "Columbia University"}, {"name": "Nicolas Wesseler", "aff": "University of British Columbia"}], "discussants": [{"name": "Alberto Martin", "aff": "Centre de Recerca en Economia Internacional (CREI)"}], "schedule": "2026-07-16 10:15 am", "tags": ["制裁", "贸易政策", "其他"], "abstract": "Hegemonic powers use economic tools to influence the geopolitical alignment of third countries. We develop a model in which two competing hegemons use direct payments (carrots) and economic threats (sticks) to influence third countries. Guided by the model, we measure carrots and sticks using historical data from the Cold War. We use our measures to empirically estimate the effects of carrots and sticks on geopolitical alignment. These tools create political alignment, but are expensive. We combine the model with the empirical estimates to compute the geopolitical benefit-cost ratio of foreign aid and evaluate the consequences of the USAID shutdown for the modern U.S.–China competition.", "abstract_zh": "霸权国家利用经济工具影响第三国的地缘政治对齐。我们构建了一个模型，其中两个相互竞争的霸权国利用直接支付（胡萝卜）和经济威胁（大棒）来影响第三国。在该模型的指导下，我们利用冷战时期的历史数据衡量胡萝卜和大棒。我们使用这些衡量指标实证估计胡萝卜和大棒对地缘政治对齐的影响。这些工具会促成政治对齐，但代价高昂。我们将该模型与实证估计结果相结合，计算对外援助的地缘政治效益成本比，并评估USAID停运对当代美中竞争的影响。", "intro_zh": "构建双霸权“胡萝卜—大棒”模型，用冷战数据测度并估计其对第三国地缘对齐的影响。工具能促成对齐但成本高昂；结合模型评估对外援助的地缘政治成本收益及USAID关闭对美中竞争的影响。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f239007/f239007.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Optimal Tariffs under Geopolitical Risk: A Theory of Strategic De-risking", "title_zh": "", "authors": [{"name": "Ina Simonovska", "aff": "University of California, Davis and NBER"}, {"name": "Ahmad Lashkaripour", "aff": "Indiana University"}], "discussants": [{"name": "Matilde Bombardini", "aff": "University of California, Berkeley and NBER"}], "schedule": "2026-07-16 11:30 am", "tags": ["关税", "贸易政策", "供应链"], "abstract": "We develop a strategic theory of optimal tariffs based on geopolitical risk. Our framework rationalizes tariffs as a policy instrument for reducing excessive dependence on a single, potentially adversarial foreign supplier. Private import-sourcing decisions fail to internalize that an adversarial country’s export policy responds to aggregate import dependence. This generates a strategic-dependence externality: individual firms’ sourcing decisions collectively determine aggregate import dependence and exposure to policy-driven supply disruptions, such as export restrictions, imposing costs on other firms. We show that the optimal tariff comprises two components: a standard terms-of-trade term that is uniform across sectors, and a geopolitical-risk component that targets sectors with high aggregate import dependence. Calibrating the model to the U.S. and EU economies, we find that the geopolitical-risk component creates substantial cross-industry tariff variation. This variation explains the structure of the 2018 U.S. tariffs on China, which are difficult to explain using terms-of-trade considerations alone.", "abstract_zh": "我们提出一种基于地缘政治风险的最优关税战略理论。我们的框架将关税合理化为一种政策工具，用于减少对单一且可能具有对抗性的外国供应商的过度依赖。私人进口采购决策未能内部化这样一个事实：对抗性国家的出口政策会对总进口依赖作出反应。这产生了一种战略依赖外部性：单个企业的采购决策共同决定了总进口依赖以及面对政策驱动的供应中断（如出口限制）的风险暴露，从而给其他企业带来成本。我们表明，最优关税由两个部分组成：一个在各部门间统一的标准化贸易条件项，以及一个针对具有高总进口依赖的部门的地缘政治风险项。将模型校准至美国和欧盟经济体，我们发现地缘政治风险项造成了显著的跨行业关税差异。这种差异解释了2018年美国对华关税的结构，而仅用贸易条件考量难以解释该结构。", "intro_zh": "本文提出地缘政治风险下的最优关税理论：企业采购未内部化总进口依赖引致的战略依赖外部性；最优关税含统一贸易条件项与针对高依赖行业的地缘风险项。美欧校准显示后者解释2018年美国对华关税结构。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f247078/f247078.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Digital Chokepoints", "title_zh": "", "authors": [{"name": "Michael Porcellacchia", "aff": "Kiel Institute for the World Economy"}, {"name": "Christoph Trebesch", "aff": "Kiel Institute for the World Economy"}, {"name": "Benjamin Wache", "aff": "CPB Netherlands Bureau for Economic Policy Analysis"}], "discussants": [{"name": "Chenzi Xu", "aff": "University of California, Berkeley and NBER"}], "schedule": "2026-07-16 1:30 pm", "tags": ["供应链", "方法论", "其他"], "abstract": "Global data flows sustain the digital economy, from AI and cloud computing to finance, yet they are routed through a network of just a few hundred physical subsea cables. The economic consequences of disrupting this critical infrastructure have never been quantified. We make three contributions to study vulnerability and strategic dependence in the global telecommunications network: (i) GlobeTel, a new dataset covering every international submarine telecom cable laid since 1850; (ii) a traffic-assignment model with endogenous congestion and rerouting; and (iii) sufficient statistics for the welfare costs of disruption requiring only observed flow shares and latency changes, validated against traceroutes, prices, and lit capacity. We find that global data flows are far more geographically concentrated than commonly understood, passing through the same maritime chokepoints that have shaped trade flows for centuries. Severing just 15 cables in the English Channel or off the US East Coast disrupts 20 to 25% of global data flows. Island economies such as Taiwan are particularly exposed, facing large potential welfare losses despite satellite access. Using our 175-year dataset, we also show that hegemons have long exploited network dominance for coercion and surveillance, and that cable investment responds systematically to geopolitical tensions.", "abstract_zh": "全球数据流支撑着数字经济，从人工智能和云计算到金融，然而它们却通过一个仅由几百条物理海底电缆构成的网络进行路由。中断这一关键基础设施的经济后果从未被量化。我们作出三项贡献，以研究全球电信网络中的脆弱性和战略依赖：（i）GlobeTel，一个涵盖自1850年以来铺设的每一条国际海底电信电缆的新数据集；（ii）一个具有内生拥塞和重路由的流量分配模型；以及（iii）中断福利成本的充分统计量，仅需观测到的流量份额和延迟变化，并用路由追踪、价格和已启用容量进行验证。我们发现，全球数据流在地理上远比通常理解得更为集中，经过几个世纪以来塑造贸易流的同一批海上咽喉要道。仅切断英吉利海峡或美国东海岸附近的15条电缆，就会中断20%至25%的全球数据流。台湾等岛屿经济体尤其暴露，尽管可接入卫星，仍面临巨大的潜在福利损失。使用我们175年的数据集，我们还表明，霸权国长期以来利用网络主导地位进行胁迫和监控，并且电缆投资会对地缘政治紧张局势作出系统性反应。", "intro_zh": "研究海底电缆中断的经济后果与战略依赖，构建1850年以来全球海缆数据集和流量重路由模型，提出福利充分统计量；发现切断少数关键电缆可扰动20%—25%全球数据流，岛屿经济体尤为脆弱。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245079/f245079.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Geopolitical Payoffs", "title_zh": "", "authors": [{"name": "Andrei A. Levchenko", "aff": "University of Michigan and NBER"}, {"name": "Nitya Pandalai-Nayar", "aff": "University of Texas at Austin and NBER"}, {"name": "Henry Young", "aff": "University of Michigan"}], "discussants": [{"name": "Jesús Fernández-Villaverde", "aff": "University of Pennsylvania and NBER"}], "schedule": "2026-07-16 2:45 pm", "tags": ["贸易史", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "论文利用1962—1989年冷战时期双边援助与贸易数据，估计外援对捐助国市场准入的影响，并用贸易模型量化福利收益。发现援助显著提高捐助国对受援国出口，福利收益约为援助成本的27%—29%。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f244844/f244844.pdf", "slides_url": "https://conference.nber.org/conf_papers/f244844/f244844.slides.pdf", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Critical Minerals, Geopolitics, and the Green Transition", "title_zh": "关键矿产、地缘政治与绿色转型", "authors": [{"name": "Tomas Dominguez-Iino", "aff": "The University of Chicago"}, {"name": "Jonathan T. Elliott", "aff": "Johns Hopkins University"}, {"name": "Allan Hsiao", "aff": "Stanford University and NBER"}], "discussants": [{"name": "Laura Alfaro", "aff": "Harvard University and NBER"}], "schedule": "2026-07-16 4:00 pm", "tags": ["供应链", "产业政策", "贸易政策"], "abstract": "The green energy transition will be powered by the mining and processing of lithium, nickel, and cobalt, which are critical for the production of advanced batteries.These minerals are concentrated geographically but traded globally, allowing key mining countries to exercise market power through policy intervention.Advanced batteries use multiple minerals in combination, and this joint use creates interdependence across mineral markets.We study the geopolitical implications of these forces and their consequences for green technology adoption worldwide.We quantify supply chain vulnerability, international policy spillovers, and the potential for mineral cartels.", "abstract_zh": "绿色能源转型将由锂、镍和钴的开采与加工提供动力，这些矿物对先进电池的生产至关重要。这些矿物在地理上集中分布，但在全球范围内进行贸易，使主要采矿国能够通过政策干预行使市场势力。先进电池组合使用多种矿物，而这种联合使用造成了各矿物市场之间的相互依赖。我们研究这些力量的地缘政治影响及其对全球绿色技术采用的影响。我们量化供应链脆弱性、国际政策溢出效应以及矿物卡特尔的可能性。", "intro_zh": "研究关键矿产地理集中但全球贸易背景下，关键矿业国政策干预的地缘政治影响及其对全球绿色技术采用的后果。论文强调上游资源集中与下游技术选择会带来供应链脆弱性、跨矿产市场政策溢出及矿产卡特尔风险。", "journal": "", "pdf_url": "https://tdomingueziino.github.io/critical_minerals.pdf", "slides_url": "", "wp_num": "w35654", "pub_url": "https://www.nber.org/papers/w35654", "state": "matched"}]}, {"conf_id": "n1231440", "title": "SI 2026 International Finance & Macroeconomics", "type_name": "Summer Instit
