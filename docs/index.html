<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 60px}
header{padding:34px 0 8px}
h1{font-size:25px;font-weight:700;letter-spacing:.5px}
.subtitle{color:var(--sub);font-size:13.5px;margin-top:4px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.themes-label{font-size:12px;color:var(--sub);margin-right:4px}
.theme-chip{
  font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--border);border-radius:20px;padding:3px 12px;
  cursor:pointer;font-family:inherit;line-height:1.5;
}
.theme-chip b{color:var(--accent);font-weight:600;margin-left:4px}
.theme-chip:hover{border-color:var(--accent);color:var(--accent)}
.theme-chip[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.theme-chip[aria-pressed="true"] b{color:#fff}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:3px 12px;color:var(--sub);
}
.chip b{color:var(--ink);font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.top5{background:var(--top5)}.dot.nber{background:var(--nber)}
.dot.scholar{background:var(--scholar)}.dot.tweet{background:var(--tweet)}
.dot.event{background:var(--event)}
.toolbar{
  position:sticky;top:0;z-index:10;background:var(--bg);
  padding:14px 0 10px;border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{
  border:1px solid var(--border);background:var(--card);color:var(--sub);
  border-radius:8px;padding:5px 12px;font-size:13.5px;cursor:pointer;
}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .n{font-size:11.5px;opacity:.75;margin-left:3px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{
  border:0;background:var(--card);color:var(--sub);padding:5px 12px;
  font-size:13px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#search{
  flex:1;min-width:160px;border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:13.5px;background:var(--card);color:var(--ink);
  outline:none;
}
#search:focus{border-color:var(--accent)}
#scholarFilter{
  border:1px solid var(--border);border-radius:8px;padding:6px 8px;
  font-size:13px;background:var(--card);color:var(--ink);max-width:170px;
}
.datehead{
  margin:26px 0 10px;font-size:13px;font-weight:700;color:var(--sub);
  letter-spacing:1px;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;
}
.card:hover{border-color:#cfcaba}
.card-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.badge{
  font-size:11px;font-weight:700;color:#fff;border-radius:5px;
  padding:1.5px 7px;letter-spacing:.3px;
}
.badge.top5{background:var(--top5)}.badge.nber{background:var(--nber)}
.badge.scholar{background:var(--scholar)}.badge.tweet{background:var(--tweet)}
.badge.event{background:var(--event)}
.estatus{
  font-size:11px;font-weight:700;border-radius:5px;padding:1.5px 7px;
  letter-spacing:.3px;background:var(--event-soft);color:var(--event);
}
.venue{font-size:12px;color:var(--accent);font-style:italic}
.who{font-size:12px;color:var(--ink);font-weight:600}
.card h2{font-size:15.5px;font-weight:600;line-height:1.5;margin:2px 0;
  overflow-wrap:anywhere}
.card h2 a{color:var(--ink);text-decoration:none}
.card h2 a:hover{color:var(--accent);text-decoration:underline}
.authors{font-size:13px;color:#3d3a31;margin-bottom:6px}
.title-en{font-size:12.5px;color:var(--sub);margin:-2px 0 4px;line-height:1.45;
  overflow-wrap:anywhere}
.title-en a{color:var(--sub);text-decoration:none}
.title-en a:hover{color:var(--accent)}
.summary-zh{
  font-size:13.8px;color:#333;border-left:3px solid var(--accent-soft);
  padding-left:10px;margin:6px 0;overflow-wrap:anywhere;
}
details.abs{margin:6px 0 2px;font-size:12.8px}
details.abs>summary{
  cursor:pointer;color:var(--accent);font-size:12px;user-select:none;
  list-style:none;
}
details.abs>summary::before{content:"▸ ";font-size:10px}
details.abs[open]>summary::before{content:"▾ "}
details.abs>summary:hover{text-decoration:underline}
.abs-body{
  margin-top:6px;padding:8px 10px;background:#faf9f5;
  border:1px solid var(--border);border-radius:6px;color:#444;
}
.abs-zh{overflow-wrap:anywhere}
.abs-en{margin-top:8px;color:var(--sub);overflow-wrap:anywhere}
.abs-lang{
  display:block;font-size:10.5px;color:var(--sub);letter-spacing:1px;
  margin-bottom:2px;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  border-radius:4px;padding:1px 8px;cursor:pointer;
}
.sub-info{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.tweet-text{font-size:14px;white-space:pre-wrap;margin:6px 0;
  word-break:break-word;overflow-wrap:anywhere}
.tweet-media{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.tweet-media img{max-height:220px;max-width:100%;border-radius:8px;
  border:1px solid var(--border);object-fit:cover}
.lcards{display:grid;gap:6px;margin:8px 0 2px}
.lcard{display:flex;gap:10px;align-items:center;border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;text-decoration:none;background:var(--bg)}
.lcard:hover{border-color:var(--accent)}
.lcard-img{width:60px;height:60px;object-fit:cover;border-radius:6px;flex:none}
.lcard-body{display:flex;flex-direction:column;min-width:0}
.lcard-host{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.lcard-title{font-size:13px;color:var(--ink);line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt-mark{font-size:11.5px;color:var(--sub);border:1px solid var(--border);border-radius:4px;padding:0 6px}

details.papers{margin-top:10px}
details.papers>summary{
  cursor:pointer;color:var(--event);font-size:12.5px;font-weight:600;
  user-select:none;list-style:none;
}
details.papers>summary::before{content:"▸ ";font-size:10px}
details.papers[open]>summary::before{content:"▾ "}
details.papers>summary:hover{text-decoration:underline}
.plist{margin-top:10px;border-top:1px solid var(--border)}
.epaper{padding:12px 2px;border-bottom:1px solid var(--border)}
.eptitle{font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.eptitle a{color:var(--ink);text-decoration:none}
.eptitle a:hover{color:var(--accent);text-decoration:underline}
.eaff{font-style:normal;color:var(--sub);font-size:12px}
.epub{font-size:11.5px;font-weight:600;border-radius:4px;padding:0 7px}
.epub.wp{background:var(--nber);color:#fff}
.epub.journal{background:var(--accent-soft);color:var(--accent)}
.epub.none{color:var(--sub);border:1px solid var(--border);font-weight:400}
.elink{font-size:12px;color:var(--accent);text-decoration:none}
.elink:hover{text-decoration:underline}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:14px}
footer{margin-top:44px;color:var(--sub);font-size:12.5px;border-top:1px solid var(--border);padding-top:14px}
footer a{color:var(--sub)}

  cursor:pointer;border:1px solid var(--border);background:var(--card);
  border-radius:20px;padding:3px 14px;font:inherit;font-size:12.5px;
  color:var(--accent);

#rosterBtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.roster-note{font-size:13px;color:var(--sub);margin:14px 0 10px}
.roster-table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px}
.roster-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.roster-table th{

.roster-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.roster-table tbody tr:last-child td{border-bottom:0}
.roster-table tbody tr:hover td{background:var(--bg)}
.roster-name{font-weight:700;white-space:nowrap}
.roster-aff{color:var(--sub)}
.roster-num{text-align:right;font-variant-numeric:tabular-nums}

.roster-links{display:flex;flex-wrap:wrap;gap:6px}
.slink{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.slink:hover{border-color:var(--accent)}
.suggest{margin-top:26px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.roster-filter{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.fchip{
  border:1px solid var(--border);background:var(--card);color:var(--sub);
  border-radius:20px;padding:2px 12px;font-size:12.5px;cursor:pointer;
}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.field-chip{
  display:inline-block;font-size:11.5px;color:var(--accent);
  background:var(--accent-soft);border-radius:4px;padding:1px 8px;white-space:nowrap;
}
.suggest h3{font-size:15.5px;margin-bottom:4px}
.sg-hint{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.sform{display:grid;gap:8px}
.sform input,.sform textarea{
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font:inherit;font-size:13.5px;width:100%;background:var(--bg);color:var(--ink);
}
.sform input:focus,.sform textarea:focus{outline:none;border-color:var(--accent)}
.sg-btns{display:flex;gap:8px}
.sbtn{
  border:0;background:var(--accent);color:#fff;border-radius:8px;
  padding:7px 16px;font:inherit;font-size:13.5px;cursor:pointer;
}
.sbtn-ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.sg-ok{font-size:12.5px;color:var(--accent)}
@media (max-width:640px){
  h1{font-size:21px}
  .toolbar{position:static}
  #scholarFilter{max-width:none;flex:1}
}
</style>

/yy0SD222yQ\n\n- Harvard University, Oct 29: https://t.co/6cSuTdO6LI\n\n- Dartmouth College, Oct 30: https://t.co/n73rjHVUdf", "summary_zh": "如何赢得一场贸易战……下周又要启程了！！！\n\n世界大学巡讲 | 2026年秋季\n\n如果你在这些地点，请在下方注册——@SoumayaKeynes 和我迫不及待想见到你们！！！\n\n- 普林斯顿大学（Princeton University），10月26日：\n\n- 哥伦比亚大学（Columbia University），10月27日\n\n- 耶鲁大学（Yale University），10月28日：\n\n- 哈佛大学（Harvard University），10月29日：\n\n- 达特茅斯学院（Dartmouth College），10月30日：", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 4, "retweets": 0, "views": 934, "created_at": "2026-10-22T21:11:23+00:00", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVQ5jH0WkAEkEps.jpg"}], "links": [{"tco": "https://t.co/1WDF6X2eW7", "url": "https://www.princeton.edu/events/2026/how-win-trade-war-talk-chad-bown-and-soumaya-keynes", "title": "", "domain": "princeton.edu", "image": ""}, {"tco": "https://t.co/yy0SD222yQ", "url": "https://tobin.yale.edu/events/2026/book-talk-how-win-trade-war-soumaya-keynes-and-chad-bown", "title": "Book Talk: How to Win a Trade War with Soumaya Keynes and Chad Bown", "domain": "Tobin Center for Economic Policy", "image": "https://tobin.yale.edu/sites/default/files/styles/social_media/public/2026-10/How%20to%20win%20a%20trade%20war.png?h=00f0d0b6&amp;itok=u_NUqxbg"}, {"tco": "https://t.co/6cSuTdO6LI", "url": "https://www.hks.harvard.edu/events/how-win-trade-war", "title": "How to Win A Trade War", "domain": "hks.harvard.edu", "image": "https://www.hks.harvard.edu/sites/default/files/styles/open_graph_image/public/images/event/068Pp00000k7X9kIAE.jpg?itok=dS3oNsM2"}, {"tco": "https://t.co/n73rjHVUdf", "url": "https://pep.dartmouth.edu/events/event?event=82274", "title": "Event Detail | Political Economy Project", "domain": "pep.dartmouth.edu", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "oa:W7223205767", "source": "scholar", "title": "Understanding migration responses to local shocks", "authors": "Борусяк Кирилл Константинович, Rafael Dix-Carneiro, Brian K. Kovak", "venue": "报告", "url": "https://doi.org/10.1920/wp.ifs.2026.6326", "date": "2026-10-22", "abstract": "", "summary_zh": "研究迁移如何响应地方经济冲击，并识别劳动力空间调整机制。", "title_zh": "理解迁移对地方冲击的反应", "abstract_zh": "", "tags": ["劳动力市场"], "extra": {"scholar_name": "Rafael Dix-Carneiro", "work_type": "report", "doi": "10.1920/wp.ifs.2026.6326"}}, {"uid": "tweet:2113053211162820936", "source": "tweet", "title": "CÓMO GANAR UNA GUERRA COMERCIAL  Today is the launch of the Spanish translation of HOW TO WIN A TRADE WAR, my new book with @SoumayaKeynes. ", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2113053211162820936", "date": "2026-10-21", "abstract": "CÓMO GANAR UNA GUERRA COMERCIAL\n\nToday is the launch of the Spanish translation of HOW TO WIN A TRADE WAR, my new book with @SoumayaKeynes.\n\nWoop!\n\nhttps://t.co/pKJFb04LfG https://t.co/DRK5vPz52t", "summary_zh": "如何赢得一场贸易战\n\n今天是与@SoumayaKeynes合著的新书《如何赢得一场贸易战》（HOW TO WIN A TRADE WAR）西班牙语译本的首发日。\n\n哇呼！", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 2, "retweets": 0, "views": 262, "created_at": "2026-10-21T23:41:58+00:00", "links": [{"tco": "https://t.co/pKJFb04LfG", "url": "https://www.planetadelibros.com/libro-como-ganar-una-guerra-comercial/458964", "title": "Cómo ganar una guerra comercial - Soumaya Keynes y Chad P. Bown | PlanetadeLibros", "domain": "Planetadelibros", "image": "https://www.planetadelibros.com/assets/images/logos/planeta-de-libros-desktop.svg"}, {"tco": "https://t.co/DRK5vPz52t", "skip": 1, "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "oa:W7223242374", "source": "top5", "title": "How New Products Enter Markets: Social Networks, Consumer Imports, and Retailer Learning", "authors": "David Argente, Esteban Méndez, Diana Van Patten", "venue": "The Quarterly Journal of Economics", "url": "https://doi.org/10.1093/qje/qjag052", "date": "2026-10-20", "abstract": "Abstract This paper studies how new varieties enter markets and become locally available. We provide causal evidence of demand externalities that operate in two steps. First, information about new varieties diffuses directly through real-world social ties among consumers. Second, early purchases generate an indirect spillover to firms: local retailers learn from “pioneer” consumers which new varieties are most likely to succeed and adjust their product offerings accordingly. We study this process in the context of direct-to-consumer imports. Using customs records on individuals’ purchases matched to population-wide social networks, international migrant links, and retailer catchment areas, we document economically meaningful demand externalities. Product-specific expenditure shocks abroad transmit through migrant networks and shift which varieties consumers purchase. Leveraging these shocks as a plausibly exogenous source of local demand variation, we show strong peer effects: prior purchases by close neighbors, coworkers, or friends increase an individual’s likelihood of purchasing the same variety, especially for premium and visible goods. We leverage this result to identify an indirect spillover from consumers to firms: retailers are more likely to add a variety to their assortment when it becomes popular among consumers in their catchment area. Combining the instrument with linked consumer–retailer data and a self-conducted retailer survey, we show that this response reflects learning about latent demand for varieties not yet stocked locally. Together, social diffusion and retailer learning generate demand multipliers that reshape local product availability and expand access to global variety.", "summary_zh": "研究消费者进口新品经社会网络扩散与零售商学习进入本地市场，用海关与网络数据识别需求外部性。", "title_zh": "新产品如何进入市场：社会网络、消费者进口与零售商学习", "abstract_zh": "摘要 本文研究新品种如何进入市场并在当地变得可获得。我们提供了需求外部性的因果证据，这种外部性通过两个步骤发挥作用。第一，关于新品种的信息直接通过消费者之间现实世界的社会关系扩散。第二，早期购买对企业产生间接溢出：本地零售商从“先驱”消费者那里了解到哪些新品种最有可能成功，并据此调整其产品供给。我们在直接面向消费者的进口情境中研究这一过程。利用个人购买的海关记录，并将其与覆盖全体人口的社会网络、国际移民联系以及零售商辐射区域相匹配，我们记录了具有经济意义的需求外部性。海外特定产品的支出冲击通过移民网络传导，并改变消费者购买哪些品种。我们将这些冲击作为本地需求变动的一个可信外生来源加以利用，表明存在强烈的同群效应：近邻、同事或朋友的先前购买会提高个体购买同一品种的可能性，尤其是对高端商品和可见商品而言。我们利用这一结果识别出从消费者到企业的间接溢出：当某一品种在其商圈内的消费者中变得流行时，零售商更可能将该品种加入其商品组合。将这一工具变量与消费者—零售商关联数据以及自行开展的零售商调查相结合，我们表明，这一反应反映的是对当地尚未备货品种的潜在需求的学习。社会扩散与零售商学习共同产生需求乘数，这些需求乘数重塑本地产品可得性，并扩大对全球品种的可及性。", "tags": ["其他"], "extra": {"journal_short": "QJE", "keyword_hit": "import", "doi": "10.1093/qje/qjag052", "versions": ["nber"]}}, {"uid": "oa:W7222924039", "source": "scholar", "title": "Foreign Ownership and Occupational Safety: Evidence from France", "authors": "Beata Smarzynska Javorcik, Alessia Lo Turco, Daniela Maggioni, Gianluca Santoni", "venue": "CESifo", "url": "https://doi.org/10.65864/9zizf1dh6a", "date": "2026-10-19", "abstract": "This paper examines whether and how foreign acquisitions improve occupational safety. Using linked administrative data on French manufacturing plants over 2003-2017 and event studies on a matched sample, we find that foreign acquisitions reduce accident rates and workdays lost. Safety gains coincide with expanded managerial hierarchies, greater technical-manager presence, foreign manager hiring, and worker training. We find little evidence supporting automation, task reallocation, or outsourcing as alternative explanations. Moreover, domestic acquisitions do not generate comparable improvements. Our findings are consistent with foreign acquisitions improving workplace safety through the transfer of managerial and organisational practices, highlighting a benefit of multinational activity beyond conventional measures of firm performance.", "summary_zh": "利用法国制造业匹配数据与事件研究，发现外资并购通过管理实践转移降低事故率与损失工日。", "title_zh": "外资所有权与职业安全：来自法国的证据", "abstract_zh": "本文考察外资收购是否以及如何改善职业安全。使用2003-2017年法国制造工厂的关联行政数据以及对匹配样本的事件研究，我们发现外资收购降低了事故率和损失工作日。安全改善与扩大的管理层级、更多技术经理的存在、外籍经理招聘以及工人培训同时出现。我们几乎找不到证据支持自动化、任务重新配置或外包作为替代解释。此外，国内收购并未产生可比的改善。我们的发现与外资收购通过转移管理和组织实践来改善工作场所安全相一致，并凸显了跨国活动在传统企业绩效衡量指标之外的益处。", "tags": ["企业异质性", "劳动力市场"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "report", "doi": "10.65864/9zizf1dh6a"}}, {"uid": "tweet:2111893995819323471", "source": "tweet", "title": "Helen Branswell, a leading reporter on infectious diseases who wrote with foresight, urgency and clarity about the emerging danger of the Co", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2111893995819323471", "date": "2026-10-18", "abstract": "Helen Branswell, a leading reporter on infectious diseases who wrote with foresight, urgency and clarity about the emerging danger of the Covid-19 pandemic, ahead of the vast majority of journalists and even many medical experts, died on Tuesday in Ottawa. She was 69.\n\nhttps://t.co/IajalWGUGg", "summary_zh": "海伦·布兰斯韦尔（Helen Branswell），一位顶尖的传染病记者，在绝大多数记者、甚至许多医学专家之前，就以远见、紧迫感和清晰性报道了 Covid-19 大流行正在显现的危险，于周二在渥太华去世。享年69岁。", "title_zh": "", "abstract_zh": "", "tags": ["其他"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 4, "retweets": 0, "views": 858, "created_at": "2026-10-18T18:55:40+00:00", "links": [{"tco": "https://t.co/IajalWGUGg", "url": "https://www.nytimes.com/2026/10/17/health/helen-branswell-dead.html", "title": "nytimes.com", "domain": "nytimes.com", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2111199694324179439", "source": "tweet", "title": "RT @fbermingham: Confirmed: von der Leyen tells press conference following the European Council the EU will develop a new weapon to \"immedi…", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2111199694324179439", "date": "2026-10-16", "abstract": "RT @fbermingham: Confirmed: von der Leyen tells press conference following the European Council the EU will develop a new weapon to \" "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2108167587532349915", "source": "tweet", "title": "If you are in Brussels today and free at 17h and desperate to learn HOW TO WIN A TRADE WAR well then👇🤓👇", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2108167587532349915", "date": "2026-10-08", "abstract": "If you are in Brussels today and free at 17h and desperate to learn HOW TO WIN A TRADE WAR well then👇🤓👇", "summary_zh": "如果你今天在布鲁塞尔（Brussels），17点有空，而且迫切想了解如何赢得一场贸易战，那好吧👇🤓👇", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 6, "retweets": 2, "views": 924, "created_at": "2026-10-08T12:08:15+00:00", "scholar_name": "Chad Bown"}}, {"uid": "tweet:2107438533841678687", "source": "tweet", "title": "‼️NEW LOCATION‼️  Jacques Delors Institute 17 rue d’Antin, 4e étage Paris 75002  17:00 TODAY (Tuesday, October 6) https://t.co/2MeMwatzrR", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2107438533841678687", "date": "2026-10-06", "abstract": "‼️NEW LOCATION‼️\n\nJacques Delors Institute\n17 rue d’Antin, 4e étage\nParis\n75002\n\n17:00 TODAY (Tuesday, October 6) https://t.co/2MeMwatzrR", "summary_zh": "‼️新地点‼️\n\n雅克·德洛尔研究所（Jacques Delors Institute）\n安坦街17号（17 rue d'Antin），4楼\n巴黎\n75002\n\n今天17:00（10月6日，星期二）", "title_zh": "", "abstract_zh": "", "tags": ["其他"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 3, "retweets": 0, "views": 1158, "created_at": "2026-10-06T11:51:15+00:00", "links": [{"tco": "https://t.co/2MeMwatzrR", "skip": 1, "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "s2:292728405", "source": "scholar", "title": "How Fast Do Tariffs Pass Through into Consumer Prices?", "authors": "M. Amiti, Sebastian Heise, D. Weinstein", "venue": "Liberty Street Economics (Federal Reserve Bank of New York)", "url": "https://doi.org/10.59576/lse.20261006", "date": "2026-10-06", "abstract": "There has been a lot of interest in how tariffs affect consumer prices (for example, Cavallo et al. 2021, 2025). In this post, we present results from our new research paper that estimates the effects of the 2025-26 tariffs on retail consumer prices. We find that for every percentage point increase in average tariffs, consumer goods prices increase by about a quarter of a percent after one year. Roughly two-thirds of the effect arises because tariffs raise the prices of imported consumer goods. The remaining third arises indirectly: tariffs increase the prices of goods made in the U.S. because producers pay more for imported parts and materials, and because producers raise their markups when competing imports cost more. The effects differ in their timing. Prices of imported goods respond quickly to tariffs, while prices of U.S.-made goods adjust over six to twelve months as higher costs move through the supply chain.", "summary_zh": "估计2025-26年关税转嫁，发现平均关税每升1个百分点一年后消费品价格约升0.25%，进口品快于美国产品。", "title_zh": "关税向消费者价格传导的速度有多快？", "abstract_zh": "人们对关税如何影响消费者价格一直很感兴趣（例如，Cavallo 等，2021，2025）。在本文中，我们介绍我们新研究论文的结果，该论文估计了 2025-26 年关税对零售消费者价格的影响。我们发现，平均关税每提高一个百分点，一年后消费品价格约上涨四分之一个百分点。大约三分之二的影响源于关税提高了进口消费品的价格。其余三分之一则间接产生：关税提高了美国制造商品的价格，因为生产者为进口零部件和材料支付更多费用，并且因为当竞争性进口商品成本更高时，生产者会提高其加成。这些影响在时间上有所不同。进口商品价格对关税反应迅速，而美国制造商品的价格则在六到十二个月内调整，随着更高成本在供应链中传导。", "tags": ["关税", "贸易政策", "供应链"], "extra": {"scholar_name": "Mary Amiti", "versions": ["scholar"]}}, {"uid": "oa:W7220727620", "source": "scholar", "title": "Human capital accumulation across space", "authors": "Klaus Desmet A, Dávid Krisztián Nagy, Esteban Rossi‐Hansberg", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104341", "date": "2026-10-06", "abstract": "", "summary_zh": "研究人力资本在空间上的积累过程，强调地理与迁移对人力资本分布的作用。", "title_zh": "跨空间的人力资本积累", "abstract_zh": "", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "Esteban Rossi-Hansberg", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104341", "versions": ["scholar"]}}, {"uid": "tweet:2107214347017523271", "source": "tweet", "title": "Thanks so much to  @RebeccaZandberg for the invitation to join CBC Radio’s Ottawa Morning to chat about HOW TO WIN A TRADE WAR and 🇨🇦 Canada", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2107214347017523271", "date": "2026-10-05", "abstract": "Thanks so much to \n@RebeccaZandberg for the invitation to join CBC Radio’s Ottawa Morning to chat about HOW TO WIN A TRADE WAR and 🇨🇦 Canada 🇨🇦!!!\n\n🎙️ https://t.co/Xebi03T1Oa https://t.co/aDy2g8y4c8", "summary_zh": "非常感谢 @RebeccaZandberg 邀请我参加 CBC Radio 的《Ottawa Morning》节目，聊聊“如何赢得一场贸易战”以及 🇨🇦 加拿大 🇨🇦！！！🎙️", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 2, "retweets": 0, "views": 975, "created_at": "2026-10-05T21:00:25+00:00", "links": [{"tco": "https://t.co/Xebi03T1Oa", "url": "https://www.cbc.ca/listen/live-radio/1-100-ottawa-morning/clip/16241181-how-win-trade-war", "title": "", "domain": "cbc.ca", "image": ""}, {"tco": "https://t.co/aDy2g8y4c8", "skip": 1, "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2107103121398771920", "source": "tweet", "title": "HOW TO WIN A TRADE WAR...in Paris!!! Tuesday, October 6 17:00-18:00  Join us at SciencesPo Registrar here 👇 https://t.co/MICMgXUrfS", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2107103121398771920", "date": "2026-10-05", "abstract": "HOW TO WIN A TRADE WAR...in Paris!!!\nTuesday, October 6\n17:00-18:00\n\nJoin us at SciencesPo\nRegistrar here 👇\nhttps://t.co/MICMgXUrfS", "summary_zh": "如何在贸易战中取胜……在巴黎！！！\n10月6日，星期二\n17:00-18:00\n\n请到巴黎政治学院（SciencesPo）加入我们\n在此报名 👇", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 4, "retweets": 0, "views": 2050, "created_at": "2026-10-05T13:38:26+00:00", "links": [{"tco": "https://t.co/MICMgXUrfS", "url": "https://www.sciencespo.fr/psia/events/how-to-win-a-trade-war/", "title": "How to Win a Trade War", "domain": "Paris School of International Affairs", "image": "https://www.sciencespo.fr/psia/static/4b9816e0a7585e8c118c04089e3131f9/271d2/shutterstock_Sunday_Stock_44f439079b.jpg"}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2106386980103741702", "source": "tweet", "title": "\"I'm having a hard time finding the optimism... HOW does a country like Canada WIN A TRADE WAR???\"  After spending much of this week in Otta", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2106386980103741702", "date": "2026-10-03", "abstract": "\"I'm having a hard time finding the optimism... HOW does a country like Canada WIN A TRADE WAR???\"\n\nAfter spending much of this week in Ottawa, a huge thanks to David Cochrane for the invitation to join @CBC's Power & Politics to talk about the lessons for Canada from HOW TO WIN A TRADE WAR, my new book with @SoumayaKeynes.\n\nFull video [YouTube]: https://t.co/gth89vx5rg", "summary_zh": "作者：@ChadBown\n推文原文：“我很难找到乐观情绪……像加拿大这样的国家究竟要如何赢得一场贸易战？？？”\n\n本周大部分时间我都在渥太华度过，非常感谢 David Cochrane 邀请我参加 @CBC 的《Power & Politics》，讨论加拿大可以从《如何赢得贸易战》（HOW TO WIN A TRADE WAR）中吸取的教训——这是我与 @SoumayaKeynes 合著的新书。\n\n完整视频 [YouTube]：", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 12, "retweets": 2, "views": 3624, "created_at": "2026-10-03T14:12:45+00:00", "links": [{"tco": "https://t.co/gth89vx5rg", "url": "https://youtu.be/xB7n1RIahj8?si=PdG9BWPt5nS0Tki1", "title": "", "domain": "youtube.com", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2106124022333259896", "source": "tweet", "title": "RT @janycemcgregor: Been a minute since I wrote a trade story for online... https://t.co/Kf1RwpLgE6", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2106124022333259896", "date": "2026-10-02", "abstract": "RT @janycemcgregor: Been a minute since I wrote a trade story for online... https://t.co/Kf1RwpLgE6", "summary_zh": "RT @janycemcgregor：有一阵子没为线上写过贸易报道了……", "title_zh": "", "abstract_zh": "", "tags": ["其他"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": true, "is_reply": false, "likes": 0, "retweets": 3, "views": 102, "created_at": "2026-10-02T20:47:51+00:00", "links": [{"tco": "https://t.co/Kf1RwpLgE6", "url": "https://www.cbc.ca/news/politics/lng-expansion-chinese-steel-9.7366745?__vfz=medium%3Dsharebar", "title": "LNG Canada to use Chinese steel on $33B expansion project in Kitimat, B.C. | CBC News", "domain": "CBC", "image": "https://i.cbc.ca/ais/c2d72329-a333-42f2-ae4f-5dd71dac8842,1790949321185/full/max/0/default.jpg?im=Crop%2Crect%3D%280%2C174%2C3333%2C1874%29%3BResize%3D620"}], "scholar_name": "Chad Bown"}}, {"uid": "tweet:2106080112630460677", "source": "tweet", "title": "Thanks to the amazing Meredith Lilly and @CAGlobalAffairs  for an incredibly deep conversation about Canadian uniqueness and Ottawa's bespok", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2106080112630460677", "date": "2026-10-02", "abstract": "Thanks to the amazing Meredith Lilly and @CAGlobalAffairs  for an incredibly deep conversation about Canadian uniqueness and Ottawa's bespoke strategy for HOW TO WIN A TRADE WAR. https://t.co/ItjLBkmQTi", "summary_zh": "感谢了不起的 Meredith Lilly 和 @CAGlobalAffairs，就加拿大的独特性以及渥太华为如何赢得一场贸易战量身定制的策略，进行了一场极其深入的对话。", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 9, "retweets": 2, "views": 1705, "created_at": "2026-10-02T17:53:22+00:00", "links": [{"tco": "https://t.co/ItjLBkmQTi", "skip": 1, "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "oa:W7222971842", "source": "scholar", "title": "Home-Foreign Elasticity Functions and the Gains from Trade", "authors": "Jonathan Vogel", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35906", "date": "2026-10-01", "abstract": "Gains from trade are typically calculated using a constant trade elasticity estimated from substitution across foreign countries.For general homothetic preferences, we show how to calculate these gains from the initial domestic expenditure share and the home-foreign elasticity function along a price path to autarky.While this function generally depends on the specific price path, under weak separability it does not.We provide conditions for its nonparametric identification and estimate sector-level elasticity functions using tariff changes implied by trade agreements.Across WIOD and OECD ICIO data, estimated home-foreign elasticities generally rise with domestic expenditure shares.Using estimated elasticity functions in a multi-sector model with intermediate inputs, the median gain across the WIOD countries is 19.37 log points, compared with 24.43 when each country-sector elasticity is held fixed at its initial value.", "summary_zh": "构建本国-外国弹性函数测算贸易收益，用贸易协定关税变化估计部门弹性，发现多部门模型中收益低于固定弹性。", "title_zh": "本国-外国弹性函数与贸易收益", "abstract_zh": "贸易收益通常使用一个由外国之间替代估计出的常数贸易弹性来计算。对于一般位似偏好，我们展示了如何根据初始国内支出份额以及沿通向自给自足的价格路径的本国-外国弹性函数来计算这些收益。虽然该函数通常取决于具体价格路径，但在弱可分性下则不取决于。我们给出了其非参数识别的条件，并利用贸易协定所隐含的关税变化估计部门层面的弹性函数。在WIOD和OECD ICIO数据中，估计的本国-外国弹性通常随国内支出份额上升。在包含中间投入的多部门模型中使用估计的弹性函数时，WIOD国家的收益中位数为19.37个对数点，而将每个国家-部门弹性固定在其初始值时为24.43个对数点。", "tags": ["贸易弹性", "贸易协定", "全球价值链"], "extra": {"scholar_name": "Jonathan Vogel", "work_type": "report", "doi": "10.3386/w35906", "versions": ["nber"]}}, {"uid": "oa:W7222933627", "source": "scholar", "title": "Export Controls and the Economics of National Security", "authors": "Jingting Fan, Kyle Handley, Nuno Limão", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35898", "date": "2026-10-01", "abstract": "", "summary_zh": "从经济学角度分析出口管制作为国家安全工具的逻辑、政策权衡与贸易影响。", "title_zh": "出口管制与国家安全经济学", "abstract_zh": "", "tags": ["出口管制", "贸易政策"], "extra": {"scholar_name": "Kyle Handley", "work_type": "report", "doi": "10.3386/w35898", "versions": ["nber"]}}, {"uid": "oa:W7221679395", "source": "scholar", "title": "How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing", "authors": "Pinelopi Koujianou Goldberg, Réka Juhász, Giulia Lo Forte, Jeff Thurk", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35879", "date": "2026-10-01", "abstract": "We are grateful to Shrikant Lohokare and Jessica Mueller at the Global Semiconductor Alliance for providing the data used to estimate the model, and several", "summary_zh": "利用半导体制造数据估计模型，考察知识如何跨境；摘要未给出核心发现。", "title_zh": "知识如何跨越国界：来自半导体制造的证据", "abstract_zh": "我们感谢全球半导体联盟的 Shrikant Lohokare 和 Jessica Mueller 提供用于估计模型的数据，以及若干", "tags": ["全球价值链", "供应链", "方法论"], "extra": {"scholar_name": "Pinelopi Goldberg", "work_type": "report", "doi": "10.3386/w35879", "versions": ["scholar"]}}, {"uid": "oa:W7221511041", "source": "scholar", "title": "Finances of the Nation: Tariffs, Retaliation, and Canada's Exposure to US Trade Policy Changes", "authors": "Trevor Tombe", "venue": "Canadian Tax Journal/Revue fiscale canadienne", "url": "https://doi.org/10.32721/ctj.2026.74.3.fn", "date": "2026-10-01", "abstract": "The second Trump administration moved the United States from a broadly low-tariff economy to one with average tariff rates not seen in generations. For Canada, this was a serious economic shock. This article traces the major Canada-US trade policy developments from early 2025 through 2026 and quantifies how large the shock was, who was most exposed, and what Canada's response cost. Average US tariffs on Canadian exports were roughly 4 percent by early 2026. That is low compared with many other countries, largely because roughly 90 percent of Canada-US trade now claims preferential treatment under the Canada-United States-Mexico Agreement. But the average masks large differences across products, sectors, and provinces. The article estimates that US trade policy is roughly as restrictive as a uniform 14 percent tariff. Canada's own retaliation raised about $4 billion in additional revenue over six months, but reduced affected imports by roughly 20 percent and imposed real welfare costs on Canadians.", "summary_zh": "量化美加关税与报复冲击，发现美关税约相当于14%统一税率，加方报复减少进口并造成福利损失", "title_zh": "国家财政：关税、报复与加拿大对美贸易政策变化的敞口", "abstract_zh": "第二届特朗普政府将美国从总体低关税经济体转变为平均关税税率达到数代人未见水平的经济体。对加拿大而言，这是一次严重的经济冲击。本文追溯2025年初至2026年加拿大—美国贸易政策的重大发展，并量化这一冲击的规模、谁暴露最大，以及加拿大的回应付出了什么成本。到2026年初，美国对加拿大出口的平均关税约为4%。与其他许多国家相比，这一水平较低，主要因为约90%的加美贸易现在根据《加拿大—美国—墨西哥协定》申请优惠待遇。但平均值掩盖了产品、部门和省份之间的巨大差异。文章估计，美国贸易政策的限制性大致相当于统一14%的关税。加拿大自身的报复措施在六个月内带来了约40亿美元的额外收入，但使受影响进口减少约20%，并给加拿大人造成了实际福利成本。", "tags": ["关税", "贸易政策", "贸易战"], "extra": {"scholar_name": "Trevor Tombe", "work_type": "article", "doi": "10.32721/ctj.2026.74.3.fn"}}, {"uid": "oa:W7220415274", "source": "scholar", "title": "A Framework for Integrating Climate Goals into Trade Agreements", "authors": "Farid Farrokhi, Ahmad Lashkaripour, Homa Taheri", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35834", "date": "2026-10-01", "abstract": "A critical tension in global governance is that trade agreements have evolved largely in isolation from climate policy.This paper shows that the two domains generate systematic cross-externalities: larger gains from trade are associated with greater climate externalities imposed on partners, while linking carbon taxes to trade agreements produces distributive externalities that undermine the balance of trade concessions.To address this tension, we present a framework to integrate harmonized carbon pricing into the WTO subject to institutional and political-feasibility constraints.We explore two linkage designs.The first is a centralized Climate Fund, where all members apply a common demand-side carbon tax and contribute a portion of the revenues to the fund, capped by fiscal constraints.The Fund then reallocates these contributions to balance the tax burden across countries, subject to informational constraints.Quantitative analysis shows that even a simple fund allocation rule can sustain a carbon price of $138 per ton of CO2, reducing global emissions by 54%.The main binding constraint is informational: knowing the precise incidence of the carbon tax across countries ex ante would raise the feasible price to $265.The second is a decentralized design without transfers.Each member meets a carbon tax revenue floor but retains full discretion over its mix of demand-side and supply-side taxes.Energy exporters choose supply-side taxes while energy importers opt for demand-side taxes.These choices organically balance the tax burden and yield a 47% reduction in global emissions, almost rivaling the centralized Climate Fund.", "summary_zh": "针对贸易与气候政策割裂，提出将协调碳定价纳入WTO的框架，量化发现集中基金可实现高碳价与显著减排。", "title_zh": "将气候目标纳入贸易协定的框架", "abstract_zh": "全球治理中的一个关键矛盾是，贸易协定在很大程度上脱离气候政策而演变。本文表明，这两个领域会产生系统性的交叉外部性：更大的贸易收益与对伙伴施加的更大气候外部性相关联，而将碳税与贸易协定挂钩会产生分配性外部性，从而削弱贸易减让的平衡。为应对这一矛盾，我们提出一个在制度约束和政治可行性约束下将统一碳定价纳入WTO的框架。我们探讨了两种挂钩设计。第一种是集中式气候基金，其中所有成员实施共同的需求侧碳税，并将一部分收入缴纳给该基金，缴纳额受财政约束上限限制。该基金随后重新分配这些缴款，以平衡各国间的税收负担，但受信息约束。定量分析表明，即使是一个简单的基金分配规则，也能维持每吨CO2 138美元的碳价，使全球排放量减少54%。主要的约束是信息约束：事前了解碳税在各国的精确归宿将d将可行价格提高到265美元。第二种是无转移支付的分散化设计。每个成员都满足碳税收入下限，但对其需求侧税与供给侧税的组合保留完全自主权。能源出口国选择供给侧税，而能源进口国选择需求侧税。这些选择有机地平衡了税负，并使全球排放减少47%，几乎可与集中式气候基金相媲美。", "tags": ["贸易协定", "贸易政策"], "extra": {"scholar_name": "Ahmad Lashkaripour", "work_type": "report", "doi": "10.3386/w35834", "versions": ["nber"]}}, {"uid": "oa:W7216354877", "source": "scholar", "title": "EU Trade Diversification Through Regional Trade Agreements", "authors": "Francesca G. Caselli, Alen Mulabdić, Michèle Ruta", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9798229064187.001", "date": "2026-10-01", "abstract": "This paper evaluates the effects of the European Union’s (EU) regional trade agreements (RTAs) on trade patterns, with a particular focus on diversification. Using a structural gravity model with data for 170 industries, we exploit variation in RTA depth, measured by the number of legally enforceable provisions, to estimate the effects of deep trade agreements, allowing for heterogeneity across sectors. We then use these estimates to evaluate recent and prospective EU agreements, including EU–Mercosur and EU–India, by analyzing their legal texts and constructing novel measures of agreement depth. The results show that deeper RTAs significantly increase bilateral trade, with substantial sectoral heterogeneity, and promote diversification across products and trading partners. Counterfactual general equilibrium simulations indicate that new agreements further strengthen diversification by reducing import concentration, including in green and strategic sectors, thereby enhancing supply chain resilience.", "summary_zh": "用结构引力模型评估欧盟区域贸易协定深度对贸易模式与多样化的影响，发现更深协定促进双边贸易与多样化并增强供应链韧性。", "title_zh": "欧盟通过区域贸易协定的贸易多元化", "abstract_zh": "本文评估欧洲联盟（EU）区域贸易协定（RTA）对贸易模式的影响，特别关注多样化。使用包含170个行业数据的结构引力模型，我们利用以具有法律约束力的条款数量衡量的RTA深度差异，来估计深度贸易协定的效应，并允许跨行业异质性。然后，我们利用这些估计值评估欧盟近期和未来协定，包括欧盟—南方共同市场和欧盟—印度，通过分析其法律文本并构建新的协定深度指标。结果表明，更深的RTA显著增加双边贸易，并具有显著的行业异质性，同时促进产品和贸易伙伴的多样化。反事实一般均衡模拟表明，新协定通过降低进口集中度（包括绿色和战略行业）进一步加强多样化，从而增强供应链韧性。", "tags": ["贸易协定", "供应链", "贸易政策"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.5089/9798229064187.001"}}, {"uid": "nber:w35897", "source": "nber", "title": "Inverted Gravity", "authors": "James Anderson, Mario Larch, Yoto Yotov", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35897", "date": "2026-10-01", "abstract": "We invert structural gravity to recover trade cost changes delivering targeted outcomes.For attainable welfare targets, one instrument per target yields a unique solution.At unchanged producer prices and to first order, each instrument must change by the welfare target divided by its own expenditure share; the required domestic change is about the size of the target, while the import change is several times larger.Inverting observed trade flows gives a separate trade cost change for each of the two directions in which a pair of countries trades.Applications to NAFTA and world trade illustrate the benefits of our approach.", "summary_zh": "提出倒置结构引力模型，反推实现目标福利所需的贸易成本变化，一目标一工具可得唯一解，并应用于NAFTA和世界贸易。", "title_zh": "倒置引力", "abstract_zh": "我们反演结构引力，以还原能够实现既定目标的贸易成本变化。对于可实现的福利目标，每个目标对应一种工具会得到唯一解。在生产者价格不变且按一阶近似时，每种工具的变动幅度必须等于福利目标除以其自身的支出份额；所需的国内变动约为目标规模，而进口变动则要大数倍。对观测到的贸易流进行反演，会为一对国家之间双向贸易的每一个方向分别给出一个贸易成本变化。对NAFTA和世界贸易的应用说明了我们方法的优势。", "tags": ["方法论", "贸易政策", "贸易协定"], "extra": {"nber_id": "W35897", "keyword_hit": "import"}}, {"uid": "nber:w35864", "source": "nber", "title": "From Importer to Exporter: Oil Shocks and the U.S. Economy", "authors": "Diego R. Känzig, James H. Stock, Luca Zanotti", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35864", "date": "2026-10-01", "abstract": "We study how the shale revolution and the U.S. transition from petroleum importer to net exporter have changed the macroeconomic effects of oil shocks.Using oil supply news shocks identified from OPEC announcements, a time-varying model of the U.S. macroeconomy shows that the contractionary effects weakened over time and eventually became expansionary.State-dependent local projections link this change to the U.S. petroleum trade balance.The improvement goes beyond mechanical net export effects: as the terms-of-trade response turns more favorable, consumption, equity valuations, and activity strengthen broadly across sectors and regions, pointing to general-equilibrium income and wealth effects.A counterfactual analysis of the 2022 oil price surge implies sharply different paths for U.S. activity, prices, and monetary policy under the propagation mechanisms prevailing before the shale boom vs. the early 2020s.", "summary_zh": "研究页岩革命与美国由石油进口国转为净出口国后石油冲击宏观效应的变化，发现收缩效应减弱并转为扩张。", "title_zh": "从进口国到出口国：石油冲击与美国经济", "abstract_zh": "我们研究页岩革命以及美国从石油进口国向净出口国的转变如何改变了石油冲击的宏观经济效应。使用从OPEC公告中识别的石油供给新闻冲击，一个美国宏观经济时变模型显示，收缩性效应随时间减弱，并最终变为扩张性。状态依赖的局部投影将这一变化与美国石油贸易平衡联系起来。这种改善超出了机械的净出口效应：随着贸易条件反应变得更加有利，消费、股权估值和经济活动在各行业和各地区广泛增强，指向一般均衡的收入和财富效应。对2022年油价飙升的反事实分析表明，在页岩繁荣之前与2020年代初盛行的传导机制下，美国经济活动、价格和货币政策路径截然不同。", "tags": ["其他"], "extra": {"nber_id": "W35864", "keyword_hit": "export"}}, {"uid": "oa:W7215098180", "source": "scholar", "title": "The Treatment of Import and Export Prices in International Comparisons of GDP", "authors": "Robert C. Feenstra, Robert Inklaar, Ninghui Li", "venue": "Review of International Economics", "url": "https://doi.org/10.1111/roie.70091", "date": "2026-09-30", "abstract": "ABSTRACT The year 2025 marked the 50th anniversary of the Penn World Table (PWT). A key question in the construction of these international accounts is how the value of imports and exports for each country is converted into a common currency. PWT currently measures real GDP on the output side by using disaggregate, quality‐adjusted prices of imports and exports to construct PPP exchange rates that convert imports and exports into US$. In contrast, the International Comparison Program (ICP) of the World Bank uses the nominal exchange rates to convert trade balances into US$. Implementing the ICP approach in PWT data, we find that it results in real GDP that is somewhat higher than the output‐based measure in PWT for all but three countries—China, Japan and South Korea—and very close to PWT for these three and various other countries. When measuring global inequality with per‐capita real GDP, the ICP approach gives nearly identical results to the output‐based measure in PWT. Since the ICP approach is quite simple to compute, it will be included in future revisions of PWT.", "summary_zh": "比较PWT与ICP对进出口价格和贸易余额的汇率转换方法，发现ICP法下多数国家实际GDP略高，但全球不平等结果几乎一致。", "title_zh": "GDP国际比较中进出口价格的处理", "abstract_zh": "摘要：2025年是佩恩世界表（Penn World Table，PWT）的50周年。构建这些国际账户的一个关键问题是，如何将每个国家的进口和出口价值换算成一种共同货币。PWT目前通过使用分项、经质量调整的进口和出口价格来构建购买力平价汇率，将进口和出口换算成美元，从而在产出侧衡量实际GDP。相比之下，世界银行的国际比较项目（ICP）使用名义汇率将贸易差额换算成美元。在PWT数据中实施ICP方法，我们发现，除中国、日本和韩国外，所有国家得到的实际GDP都略高于PWT中基于产出的衡量结果，而对于这三个国家以及其他多个国家，结果与PWT非常接近。在用人均实际GDP衡量全球不平等时，ICP方法得到的结果与PWT中基于产出的衡量结果几乎相同。由于ICP方法计算起来相当简单，它将被纳入PWT的未来修订版。", "tags": ["汇率", "方法论"], "extra": {"scholar_name": "Robert Feenstra", "work_type": "article", "doi": "10.1111/roie.70091", "versions": ["scholar"]}}, {"uid": "oa:W7214436587", "source": "scholar", "title": "Reconciling Aggregate And Firm-Level Tariff Pass-Through: Evidence From The 2018–2019 Us Tariffs On China", "authors": "Haichao Fan, Lixin Tang, Wei Tian, Caiyun Wu, Miaojie Yu", "venue": "The Economic Journal", "url": "https://doi.org/10.1093/ej/ueag118", "date": "2026-09-25", "abstract": "Abstract Research finds complete tariff pass-through at the product level during the 2018-2019 US-China trade war. Using firm-level customs data, we find a significant decrease in Chinese firms’ ex-tariff prices in response to US tariffs, which indicates incomplete pass-through. A one-percentage-point tariff increase reduces prices by 0.172 percentage points for the highest-priced 25% of exporters while having negligible effects on firms with below-median prices. US tariffs increase Chinese exporters’ probability of exiting the US market, with larger effects for lower-priced firms. The product-level complete pass-through results from two offsetting forces—price reduction by incumbents and market exits by lower-priced firms.", "summary_zh": "基于企业级海关数据，发现对华关税在企业层面为不完全传递，产品层面完全传递由在位者降价与低价企业退出相互抵消所致。", "title_zh": "调和总体与企业层面关税传递：来自2018—2019年美国对华关税的证据", "abstract_zh": "摘要 研究发现，在2018—2019年中美贸易战期间，产品层面上存在完全的关税传递。使用企业层面海关数据，我们发现中国企业的不含关税价格对美国关税作出显著下降反应，这表明存在不完全传递。关税每提高1个百分点，价格最高的25%出口商的价格下降0.172个百分点，而对价格低于中位数的企业影响可忽略不计。美国关税提高了中国出口商退出美国市场的概率，且对价格较低企业的影响更大。产品层面的完全关税传递源于两种相互抵消的力量——现有企业降价和价格较低企业退出市场。", "tags": ["关税", "贸易战", "企业异质性"], "extra": {"scholar_name": "樊海潮", "work_type": "article", "doi": "10.1093/ej/ueag118"}}, {"uid": "oa:W7214420745", "source": "scholar", "title": "SNOW: a general equilibrium model of Structural Network Organization of theWorld economy", "authors": "Davide Suverato, Lionel Fontagné, Riccardo Norbiato, Mathieu Parenti, Gianluca Santoni, Balthazar de Vaulchier", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://openalex.org/W7214420745", "date": "2026-09-22", "abstract": "We introduce SNOW (Structural Network Organization of the World economy), a next-generation quantitative trade model, network-based general equilibrium framework designed to capture the complex propagation of shocks through global value chains (GVCs). Unlike existing models, SNOW integrates micro-founded selection of products at the input-output level, country-and product-specific CES technologies with fully endogenous input cost shares, and a four-dimensional representation of trade barriers and policy shocks that vary by origin, destination, sourcing sector, and using sector. By preserving the full nonlinear structure of general equilibrium responses, SNOW can simulate large shocks and conduct structural counterfactual analysis of policy. By treating the observed input-output network as the equilibrium outcome of an underlying production system, SNOW provides a counterfactual data-generating process for GVCs, allowing shocks to trade costs, technologies, and policies to generate counterfactual endogenous responses in production, input sourcing, trade, and value added.", "summary_zh": "构建网络一般均衡定量贸易模型SNOW，刻画全球价值链冲击传导与政策反事实。", "title_zh": "SNOW：世界经济结构网络组织的一般均衡模型", "abstract_zh": "我们引入SNOW（世界经济结构网络组织），这是一个下一代定量贸易模型、基于网络的一般均衡框架，旨在捕捉冲击通过全球价值链（GVCs）的复杂传导。与现有模型不同，SNOW整合了投入产出层面基于微观基础的产品选择、具有完全内生投入成本份额的国别和产品特定CES技术，以及随来源地、目的地、采购部门和使用的部门而变化的贸易壁垒和政策冲击的四维表示。通过保留一般均衡响应的完整非线性结构，SNOW能够模拟大冲击并对政策进行结构性反事实分析。通过将观察到的投入产出网络视为基础生产系统的均衡结果，SNOW为GVCs提供了一个反事实数据生成过程，使对贸易成本、技术和政策的冲击能够在生产、投入品采购、贸易和增加值中产生反事实的内生响应。", "tags": ["全球价值链", "方法论", "供应链"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "preprint", "doi": ""}}, {"uid": "oa:W7214065994", "source": "scholar", "title": "Quantifying Non-Tariff Barriers: Brexit, Input Sourcing and Firm Performance", "authors": "Gustaf Dillner, Rebecca Freeman, Kalina B. Manova, Thomas Sampson", "venue": "CESifo", "url": "https://doi.org/10.65864/wn6xsu2byg", "date": "2026-09-21", "abstract": "How successful is European integration in removing non-tariff trade barriers? We study how Brexit affected UK firms' input sourcing and sales. The post-Brexit Trade and Cooperation Agreement (TCA) reduced sales and input expenditure at firms with higher pre-Brexit EU trade exposure. It also caused firms to switch towards domestic and non-EU inputs. Through the lens of a trade model, the switch in input sourcing implies the TCA increased trade costs on EU imports by 21% and raised unit production costs by 3.1% for the average UK importer. Our results indicate EU membership secures large reductions in trade costs.", "summary_zh": "研究脱欧后TCA对英国企业投入采购与销售的影响，贸易模型估算对欧进口贸易成本升21%、单位成本升3.1%。", "title_zh": "量化非关税壁垒：英国脱欧、投入品采购与企业绩效", "abstract_zh": "欧洲一体化在消除非关税贸易壁垒方面有多成功？我们研究英国脱欧如何影响英国企业的投入品采购和销售。脱欧后的《贸易与合作协议》（TCA）降低了脱欧前欧盟贸易暴露度较高企业的销售额和投入品支出。它还促使企业转向国内和非欧盟投入品。通过贸易模型的视角，投入品采购的转变意味着，TCA使欧盟进口的贸易成本提高了21%，并使平均英国进口商的单位生产成本提高了3.1%。我们的结果表明，欧盟成员国身份确保了贸易成本的大幅下降。", "tags": ["贸易政策", "供应链", "企业异质性"], "extra": {"scholar_name": "Kalina Manova", "work_type": "report", "doi": "10.65864/wn6xsu2byg"}}, {"uid": "oa:W7213555062", "source": "scholar", "title": "Trade distortions and investment decisions of private equity funds", "authors": "Simon J. Evenett, Stefan Morkoetter, Dominic Rainsborough", "venue": "Journal of Corporate Finance", "url": "https://doi.org/10.1016/j.jcorpfin.2026.103092", "date": "2026-09-18", "abstract": "We examine how variation in trade distortions across countries and industries is associated with the investment behavior of private equity funds, taking explicit account of their country and industry mandates. We use a sample of 9142 transactions across 60 countries and 52 industries completed by 1623 PE funds during 2010–2020. Overall, we find a negative and statistically significant association between trade policies that restrict imports in a given country-industry combination and the odds of a PE fund investment in that market. This association differs by trade policy instrument. We observe a positive and statistically significant link between tariffs and the likelihood of investment in the affected country-industry combination. In contrast, subsidies to import-competing firms are negatively associated with investment.", "summary_zh": "本文实证考察各国各行业贸易扭曲与私募股权基金投资行为的关系，发现进口限制性贸易政策降低投资概率，且关税与补贴影响不同。", "title_zh": "贸易扭曲与私募股权基金的投资决策", "abstract_zh": "我们考察各国和各行业间贸易扭曲的差异如何与私募股权基金的投资行为相关联，并明确考虑其国家和行业授权。我们使用2010—2020年间由1623只PE基金完成的、跨越60个国家和52个行业的9142笔交易样本。总体而言，我们发现，在给定的国家—行业组合中限制进口的贸易政策与PE基金在该市场投资的几率之间存在负向且统计显著的关联。这种关联因贸易政策工具而异。我们观察到，关税与在受影响的国家—行业组合中投资的可能性之间存在正向且统计显著的联系。相反，对进口竞争企业的补贴与投资负相关。", "tags": ["贸易政策", "关税", "产业政策"], "extra": {"scholar_name": "Simon Evenett", "work_type": "article", "doi": "10.1016/j.jcorpfin.2026.103092"}}, {"uid": "tweet:2099494221883273354", "source": "tweet", "title": "Ominous indeed: an “unexpected” consequence of the brutal five-year-long war in Europe is that the most cruel dictatorship of the 21st centu", "authors": "@itskhoki", "venue": "X (Twitter)", "url": "https://x.com/itskhoki/status/2099494221883273354", "date": "2026-09-14", "abstract": "Ominous indeed: an “unexpected” consequence of the brutal five-year-long war in Europe is that the most cruel dictatorship of the 21st century develops the leading weapon technology  \n\nhttps://t.co/al3EFn5mdF", "summary_zh": "确实不祥：欧洲这场残酷的五年战争的一个“意外”后果是，21世纪最残酷的独裁政权发展出了领先的武器技术", "title_zh": "", "abstract_zh": "", "tags": ["其他"], "extra": {"handle": "ItsKhoki", "name": "Oleg Itskhoki", "is_retweet": false, "is_reply": false, "likes": 18, "retweets": 3, "views": 6726, "created_at": "2026-09-14T13:43:23+00:00", "links": [{"tco": "https://t.co/al3EFn5mdF", "url": "https://youtu.be/ZNtevnJe_8k?is=4Eg6IQf-TlVTTtp9", "title": "", "domain": "youtube.com", "image": ""}], "scholar_name": "Oleg Itskhoki"}}, {"uid": "oa:W7221249512", "source": "scholar", "title": "Confusing US tariff announcements doubled the decline in trade", "authors": "Kalina B. Manova, Dennis Novy, Thomas Sampson, Aaron Tang", "venue": "London School of Economics and Political Science Research Online (London School of Economics and Political Science)", "url": "https://openalex.org/W7221249512", "date": "2026-09-14", "abstract": "During 2025 the US administration made more than 50 tariff-related announcements. In new research, Kalina Manova, Dennis Novy, Thomas Sampson and Aaron Tang examine how the complexity of these announcements disrupted US imports. They find that tariff confusion stemming from the way these policy changes were made doubled their negative impact on imports.", "summary_zh": "考察美国关税公告混乱如何扰乱进口，发现公告方式造成的困惑使关税对进口的负面影响翻倍。", "title_zh": "混乱的美国关税公告使贸易降幅翻倍", "abstract_zh": "2025年期间，美国政府发布了50多项与关税相关的公告。在一项新研究中，Kalina Manova、Dennis Novy、Thomas Sampson和Aaron Tang考察了这些公告的复杂性如何扰乱美国进口。他们发现，源于这些政策变化制定方式的关税困惑使其对进口的负面影响翻倍。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Kalina Manova", "work_type": "other", "doi": ""}}, {"uid": "oa:W7213405200", "source": "scholar", "title": "Beneath the Surface: Deep Trade Agreements and the Potential of a Deeper AfCFTA", "authors": "Lionel Fontagné, Anthonin Levelu, Jean–Christophe Maur, Nadia Rocha, Gianluca Santoni", "venue": "World Bank, Washington, DC eBooks", "url": "https://doi.org/10.1596/1813-9450-11449", "date": "2026-09-14", "abstract": "This paper examines what makes some trade agreements more effective at promoting trade than others and applies this question to the case of the African continent. The analysis uses a clustering algorithm to classify worldwide trade agreements into three categories and estimates their trade effects within a structural gravity framework. This allows ranking clusters according to their estimated trade effects as shallow, medium, and deep. The analysis then uses feature-attribution methods and counterfactual policy combinations to identify the provisions and policy configurations most strongly associated with deep classification and applies this approach to the African Continental Free Trade Area. The ambition of this agreement is to harmonize existing regional agreements into a single continent-wide market: it is currently classified as medium in this paper's baseline. The general-equilibrium counterfactual analysis shows that, if implemented as a deep agreement, the African Continental Free Trade Area would generate substantial additional trade gains, along with an average gross domestic product gain of 0.7 percent for the African economies in the sample. The classification analysis further indicates that tighter disciplines on trade-defense instruments, stronger legal enforceability, and visa-related provisions are among the policies most closely associated with deep agreements.", "summary_zh": "本文用聚类与结构引力模型评估贸易协定深度，发现深化非洲大陆自贸区可显著增加贸易并带来约0.7%的GDP增益。", "title_zh": "表面之下：深度贸易协定与深化非洲大陆自贸区的潜力", "abstract_zh": "本文考察是什么使一些贸易协定在促进贸易方面比其他协定更有效，并将这一问题应用于非洲大陆的案例。分析使用聚类算法将全球贸易协定分为三类，并在结构引力框架内估计其贸易效应。这允许根据估计的贸易效应将各聚类排序为浅层、中层和深层。分析随后使用特征归因方法和反事实政策组合，识别与深层分类关联最强的条款和政策配置，并将这一方法应用于非洲大陆自由贸易区。该协定的雄心是将现有区域协定协调统一为一个全大陆市场：在本文基准情形中，它目前被归类为中层。一般均衡反事实分析表明，如果作为深层协定实施，非洲大陆自由贸易区将带来可观的额外贸易收益，并使样本中的非洲经济体平均获得0.7%的国内生产总值增长。分类分析进一步表明，对贸易防御工具更严格的纪律、更强的法律可执行性以及签证相关条款，属于与深度协定关联最为密切的政策之列。", "tags": ["贸易协定", "贸易政策"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "report", "doi": "10.1596/1813-9450-11449"}}, {"uid": "oa:W7221180641", "source": "scholar", "title": "Gravity redux : measuring international trade costs with panel data", "authors": "Dennis Novy", "venue": "University of Warwick", "url": "https://doi.org/10.82444/warw.33661186", "date": "2026-09-12", "abstract": "Barriers to international trade are known to be large. But have they become smaller over time? Building on the gravity framework by Anderson and van Wincoop (2003), I derive an analytical solution for time-varying and observable multilateral resistance variables. This solution gives rise to a micro-founded gravity equation from which bilateral trade costs can be directly inferred. This approach is easy to implement and obviates the need to impose arbitrary trade cost functions. As an illustration, I show that U.S. trade costs with major trading partners declined on average by about 40 percent between 1970 and 2000, with Mexico and Canada experiencing the biggest reductions.", "summary_zh": "构建可观测多边阻力的微观引力方程，用面板数据测度双边贸易成本，发现1970—2000年美国贸易成本均降约40%。", "title_zh": "引力模型再探讨：用面板数据测度国际贸易成本", "abstract_zh": "已知国际贸易壁垒很大。但它们是否随时间推移而变小了？基于 Anderson 和 van Wincoop（2003）的引力框架，我推导出一个针对随时间变化且可观测的多边阻力变量的解析解。该解产生了一个具有微观基础的引力方程，从中可以直接推断双边贸易成本。这种方法易于实施，并且避免了施加任意贸易成本函数的必要性。作为例证，我表明，1970 年至 2000 年间，美国与主要贸易伙伴的贸易成本平均下降约 40%，其中墨西哥和加拿大的降幅最大。", "tags": ["方法论", "其他"], "extra": {"scholar_name": "Dennis Novy", "work_type": "conference-paper", "doi": "10.82444/warw.33661186", "versions": ["scholar"]}}, {"uid": "oa:W7221174563", "source": "scholar", "title": "International trade without CES : estimating translog gravity", "authors": "Dennis Novy", "venue": "University of Warwick", "url": "https://doi.org/10.82444/warw.33661672", "date": "2026-09-12", "abstract": "This paper derives a micro-founded gravity equation in general equilibrium based on a translog demand system that allows for endogenous markups and substitution patterns across goods. In contrast to standard CES-based gravity equations, trade is more sensitive to trade costs if the exporting country only provides a small share of the destination country’s imports. As a result, trade costs have a heterogeneous impact across country pairs, with some trade flows predicted to be zero. I test the translog gravity equation and find strong empirical support in its favor. Alternative version: Novy, Dennis (2011). International trade and monopolistic competition without CES : estimating translog gravity. European Regional Science Association Congress 2011. Barcelona, 31 Aug-02 Sep 2011.Novy, Dennis (2011). International trade and monopolistic competition without CES : estimating translog gravity. Die Ordnung der Weltwirtschaft : Lektionen aus der Krise. Frankfurt am Main, 4-7 Sep 2011.Novy, Dennis (2011). International trade and monopolistic competition without CES : estimating translog gravity. Invited Speaker : Paris Trade Seminar. Paris, 22 Nov 2011.Novy, Dennis (2011). International trade and monopolistic competition without CES : estimating translog gravity. Invited Speaker : Central European University. Budapest, 6 May 2011.Novy, Dennis. (2012) International trade without CES : estimating translog gravity. Working Paper. Coventry, UK: Department of Economics, University of Warwick. (CAGE Online Working Paper Series, No.101/2012).http://wrap.warwick.ac.uk/id/eprint/57898Novy, D. (2010). International trade without CES : estimating translog gravity. Working Paper. Coventry: Department of Economics, University of Warwick. (CAGE Online Working Paper Series, No.31).http://wrap.warwick.ac.uk/id/eprint/57575Novy, D. (2010). International trade and monopolistic competition withoutCES : estimating translog gravity. Coventry: Department of Economics, University of Warwick. (The Warwick Economics Research Paper Series no. 929). http://wrap.warwick.ac.uk/id/eprint/3531Novy, Dennis. (2013) International trade without CES : estimating translog gravity. Journal of International Economics, 89 (2). pp. 271-282. ISSN 0022-1996http://wrap.warwick.ac.uk/id/eprint/50192", "summary_zh": "基于超越对数需求推导一般均衡引力方程，允许内生加成，发现贸易成本影响异质并获实证支持。", "title_zh": "不使用CES的国际贸易：估计超越对数引力模型", "abstract_zh": "本文推导了一个一般均衡下基于超越对数需求系统的微观基础引力方程，该需求系统允许内生加成和商品间替代模式。与标准的基于CES的引力方程不同，如果出口国仅提供目的地国进口的较小份额，贸易对贸易成本更为敏感。因此，贸易成本对国家对具有异质性影响，其中一些贸易流被预测为零。我检验了超越对数引力方程，并发现强有力的经验证据支持它。替代版本：Novy, Dennis (2011)。没有CES的国际贸易与垄断竞争：估计超越对数引力。2011年欧洲区域科学协会大会。巴塞罗那，2011年8月31日-9月2日。Novy, Dennis (2011)。没有CES的国际贸易与垄断竞争：估计超越对数引力。世界经济秩序：来自危机的教训。美因河畔法兰克福，2011年9月4-7日。Novy, Dennis (2011)。没有CES的国际贸易与垄断竞争：估计超越对数引力。特邀演讲者：巴黎贸易研讨会。巴黎，2011年11月22日。Novy, Dennis (2011)。不使用CES的国际贸易与垄断竞争：估计超越对数引力。特邀演讲者：Central European University。布达佩斯，2011年5月6日。Novy, Dennis.（2012）不使用CES的国际贸易：估计超越对数引力。工作论文。英国考文垂：华威大学经济系。（CAGE在线工作论文系列，第101/2012号）。http://wrap.warwick.ac.uk/id/eprint/57898 Novy, D.（2010）。不使用CES的国际贸易：估计超越对数引力。工作论文。考文垂：华威大学经济系。（CAGE在线工作论文系列，第31号）。http://wrap.warwick.ac.uk/id/eprint/57575 Novy, D.（2010）。不使用CES的国际贸易与垄断竞争：估计超越对数引力。考文垂：华威大学经济系。（The Warwick Economics Research Paper Series no. 929）。http://wrap.warwick.ac.uk/id/eprint/3531 Novy, Dennis.（2013）不使用CES的国际贸易：估计超越对数引力。Journal of International Economics，89（2）。第271-282页。ISSN 0022-1996 http://wrap.warwick.ac.uk/id/eprint/50192", "tags": ["贸易弹性", "方法论"], "extra": {"scholar_name": "Dennis Novy", "work_type": "conference-paper", "doi": "10.82444/warw.33661672"}}, {"uid": "oa:W7221119703", "source": "scholar", "title": "Is the international border effect larger than the domestic border effect? Evidence from U.S. trade", "authors": "Cletus C. Coughlin, Dennis Novy", "venue": "University of Warwick", "url": "https://doi.org/10.82444/warw.33661216", "date": "2026-09-12", "abstract": "Many studies have found that international borders represent large barriers to trade. But how do international borders compare to domestic border barriers? We investigate international and domestic border barriers in a unified framework. We consider a unique data set of exports from individual U.S. states to foreign countries and combine it with trade flows within and between U.S. states. After controlling for distance and country size, we find that relative to state-to-state trade, crossing an individual U.S. state’s domestic border entails a larger trade barrier than crossing the international U.S. border. This finding highlights the concentration of trade flows at the local level and the importance of factors such as informational barriers and transportation costs even for the relatively short distances associated with state-to-state trade. Alternative version: Coughlin, Cletus C. and Novy, Dennis (2009). Is the international border effect larger than the domestic border effect? Evidence from U.S. trade. CESifo Economic Studies Conference on Measuring Economic Integration. CESifo Conference Centre, Munich, 18-19 Feb 2011.", "summary_zh": "利用美国州际与州对外出口数据，在统一框架下比较国内外边界壁垒，发现州际边界壁垒大于国际边界。", "title_zh": "国际边界效应是否大于国内边界效应？来自美国贸易的证据", "abstract_zh": "许多研究发现，国际边界构成贸易的重大壁垒。但国际边界与国内边界壁垒相比如何？我们在一个统一框架中考察国际和国内边界壁垒。我们采用一套独特的美国各州向外国出口的数据集，并将其与美国各州内部及州际贸易流相结合。在控制距离和国家规模后，我们发现，相对于州际贸易，跨越美国单个州的国内边界所涉及的贸易壁垒大于跨越美国国际边界。这一发现凸显了贸易流在地方层面的集中，以及即使对于与州际贸易相关的相对较短距离，信息壁垒和运输成本等因素的重要性。替代版本：Coughlin, Cletus C. and Novy, Dennis (2009).《国际边界效应是否大于国内边界效应？来自美国贸易的证据》。CESifo 经济研究会议：衡量经济一体化。CESifo 会议中心，慕尼黑，2011年2月18-19日。", "tags": ["其他", "方法论"], "extra": {"scholar_name": "Dennis Novy", "work_type": "conference-paper", "doi": "10.82444/warw.33661216"}}, {"uid": "oa:W1576834105", "source": "scholar", "title": "Why is trade so volatile? The great trade collapse of 2008/09", "authors": "Dennis Novy, Alan M. Taylor", "venue": "University of Warwick", "url": "https://doi.org/10.82444/warw.33661648", "date": "2026-09-12", "abstract": "The recent global economic crisis has been characterized by sharp declines in economic output. However, the accompanying declines in international trade were even sharper, in some cases up to 50 percent. Standard models of international macroeconomics and international trade fail to account for the severity of the trade collapse. In this paper, we attempt to explain why international trade is so volatile in response to economic shocks. On the theoretical side, we combine the uncertainty shock approach by Bloom (2009) with a model of international trade. Bloom’s (2009) real-options approach is motivated by high-profile events that trigger an increase in uncertainty about the future path of the economy, for example the 9/11 terrorist attacks or the collapse of Lehman Brothers. In the wake of such events, firms adopt a ‘wait-and-see’ approach, slowing down their hiring and investment activities. Bloom (2009) shows that large uncertainty shocks typically lead to sharp recessions. Once the degree of uncertainty subsides, firms revert to their normal hiring and investment patterns and the economy recovers. Alternative version: Novy, Dennis and Taylor, Alan M. (2011). Why is trade so volatile? The great trade collapse of 2008/09. Latin American and Caribbean Economic Association (LACEA) & Latin American Meeting of the Econometric Society (LAMES) Meetings. Santiago, Chile, 10-12 Nov 2011.", "summary_zh": "结合不确定性冲击与国际贸易模型，解释2008/09年贸易大崩溃及贸易对经济冲击的高度波动性。", "title_zh": "为什么贸易如此波动？2008/09年贸易大崩溃", "abstract_zh": "最近的全球经济危机以经济产出急剧下降为特征。然而，与之相伴的国际贸易下降更为急剧，在某些情形下高达50%。标准的国际宏观经济学与国际贸易模型未能解释贸易崩溃的严重程度。本文试图解释为什么国际贸易对经济冲击的反应如此波动剧烈。在理论方面，我们将Bloom（2009）的不确定性冲击方法与一个国际贸易模型相结合。Bloom（2009）的实物期权方法受到备受瞩目的事件启发，这些事件引发对未来经济走势的不确定性上升，例如9/11恐怖袭击或雷曼兄弟倒闭。在此类事件之后，企业采取“观望”策略，放缓其招聘和投资活动。Bloom（2009）表明，大幅不确定性冲击通常会导致急剧衰退。一旦不确定性程度消退，企业恢复到正常的招聘和投资模式，经济随之复苏。替代版本：Novy, Dennis and Taylor, Alan M.（2011）。贸易为何如此波动？2008/09年贸易大崩溃。拉丁美洲和加勒比经济协会（LACEA）与计量经济学会拉丁美洲会议（LAMES）会议。智利圣地亚哥，2011年11月10—12日。", "tags": ["贸易弹性", "方法论"], "extra": {"scholar_name": "Dennis Novy", "work_type": "conference-paper", "doi": "10.82444/warw.33661648"}}, {"uid": "oa:W1566464450", "source": "scholar", "title": "Domestic and international border effects : state size matters", "authors": "Cletus C. Coughlin, Dennis Novy", "venue": "University of Warwick", "url": "https://doi.org/10.82444/warw.33661645", "date": "2026-09-12", "abstract": "Alternative version: Coughlin, Cletus C. and Novy, Dennis (2010). Domestic and international border effects : state size matters. Kiel International Economics Meeting : Globalization, Finance and Firm Dynamic. Kiel, Germany, 27-28 May 2011.Coughlin, Cletus C. and Novy, Dennis (2011). Domestic and international border effects : state size matters. European Trade Study Group Conference 2011. Copenhagen Business School, University of Copenhagen, 8-10 Sep 2011.Coughlin, Cletus C. and Novy, Dennis (2011). Domestic and international border effects : state size matters. Latin American and Caribbean Economic Association (LACEA) & Latin American Meeting of the Econometric Society (LAMES) Meetings. Santiago, Chile, 10-12 Nov 2011.", "summary_zh": "研究州级国内与国际边界效应，基于引力模型估计，发现州规模影响边界效应大小。", "title_zh": "国内与国际边界效应：州规模很重要", "abstract_zh": "另一版本：Coughlin, Cletus C. 与 Novy, Dennis（2010）。《国内与国际边界效应：州规模很重要》。基尔国际经济会议：全球化、金融与企业动态。德国基尔，2011年5月27-28日。Coughlin, Cletus C. 与 Novy, Dennis（2011）。《国内与国际边界效应：州规模很重要》。2011年欧洲贸易研究组会议。哥本哈根商学院、哥本哈根大学，2011年9月8-10日。Coughlin, Cletus C. 与 Novy, Dennis（2011）。《国内与国际边界效应：州规模很重要》。拉丁美洲和加勒比经济协会（LACEA）与计量经济学会拉丁美洲会议（LAMES）会议。智利圣地亚哥，2011年11月10-12日。", "tags": ["方法论", "其他"], "extra": {"scholar_name": "Dennis Novy", "work_type": "conference-paper", "doi": "10.82444/warw.33661645"}}, {"uid": "oa:W7208813176", "source": "scholar", "title": "Guns for butter: Trade effects of arms transfers", "authors": "Penglong Zhang, Tianhan Liu, Yushan Hu", "venue": "Economic Inquiry", "url": "https://doi.org/10.1111/ecin.70088", "date": "2026-09-05", "abstract": "Abstract Using a global dyadic panel from 1950 to 2021, we find a positive association between arms transfers from an exporter to an importer and general goods exports to that partner. The effects are short‐run: export responses peak around the transfer and fade within a few years. The arms‐trade linkage is smaller among highly institutionalized, high‐income partnerships and larger where security and commerce are more tightly bundled, especially in dyads linked by overseas military presence. Consistent with a political‐alignment channel, arms transfers are followed by lower United Nations voting disagreement. The associated trade increase does not reflect a symmetric improvement in relations.", "summary_zh": "利用1950—2021年全球双边面板，发现武器转让短期提升出口国对受让国的一般商品出口，政治对齐是可能渠道。", "title_zh": "枪炮换黄油：武器转让的贸易效应", "abstract_zh": "摘要：利用1950年至2021年的全球二元面板数据，我们发现，出口国向进口国的武器转让与该进口国对出口国的一般商品出口之间存在正相关关系。这种效应是短期的：出口反应在武器转让前后达到峰值，并在几年内消退。武器—贸易关联在高度制度化、高收入伙伴关系之间较小，而在安全与商业更紧密捆绑的地方较大，尤其是在由海外军事存在联系起来的二元组中。与政治结盟渠道一致，武器转让之后伴随的是更低程度的联合国投票分歧。相关的贸易增长并不反映双边关系的对称改善。", "tags": ["其他"], "extra": {"scholar_name": "张鹏龙", "work_type": "article", "doi": "10.1111/ecin.70088"}}, {"uid": "oa:W7210848052", "source": "scholar", "title": "Assessing risk: a toolkit for measuring regional supply-chain exposure to global shocks", "authors": "Richard Baldwin, Rebecca Freeman, Angelos Theodorakopoulos", "venue": "Journal of Economic Geography", "url": "https://doi.org/10.1093/jeg/lbag065", "date": "2026-09-04", "abstract": "Abstract This article sheds light on the complexities of global supply chains’ (GSCs) subnational dimensions, including how international shocks propagate spatially. It develops a systematic approach or toolkit for analyzing how global shocks affect the regional distribution of GSCs. Using the toolkit, it derives a family of GSC indicators that distinguish between import- and export-side exposure, direct (face-value) and indirect (hidden exposure) linkages, and gross versus value-added flows. The article then applies the indicators to multiregional input–output data to highlight how global shocks propagate unevenly across regions and how impacts vary with the nature of the shock and a region’s type of exposure.", "summary_zh": "构建区域供应链暴露度工具包，用多区域投入产出数据测度进口/出口、直接/间接、总值/增加值暴露，揭示全球冲击在区域间不均传导。", "title_zh": "评估风险：衡量区域供应链对全球冲击暴露度的工具包", "abstract_zh": "摘要 本文阐释了全球供应链（GSCs）次国家维度的复杂性，包括国际冲击如何在空间上传导。本文开发了一种系统方法或工具箱，用于分析全球冲击如何影响GSCs的区域分布。利用该工具箱，本文推导出一组GSC指标，这些指标区分进口侧与出口侧暴露、直接（面值）与间接（隐性暴露）联系，以及总值流与增加值流。随后，本文将这些指标应用于多区域投入产出数据，以突出全球冲击如何在各区域间不均衡传导，以及影响如何随冲击的性质和区域的暴露类型而变化。", "tags": ["全球价值链", "供应链", "方法论"], "extra": {"scholar_name": "Richard Baldwin", "work_type": "article", "doi": "10.1093/jeg/lbag065"}}, {"uid": "oa:W7214668269", "source": "scholar", "title": "Evaluating the Spatial Consequences of a Climate Tipping Point", "authors": "José-Luis Cruz, Klaus Desmet A, Esteban Rossi‐Hansberg", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35811", "date": "2026-09-01", "abstract": "The Atlantic Meridional Overturning Circulation (AMOC) is a system of ocean currents that plays a key role in regulating global climate, including moderating temperatures in Europe and the North Atlantic.Its potential collapse due to global warming is widely considered one of the more likely climate tipping points.This paper examines the economic implications of such a collapse using a dynamic spatially integrated assessment model (S-IAM) of the world economy.Scandinavia and parts of Russia are predicted to experience significant losses in GDP and welfare, while southern Europe, northern Africa, and Brazil benefit from slightly colder temperatures.S-IAMs generally predict that global warming is especially harmful to low-income regions, but an AMOC collapse could mitigate some of these negative impacts in parts of the developing world while instead harming some of the more advanced economies.This lowers spatial inequality, but global welfare drops by 1.9% by 2200 under an intermediate-emissions scenario.", "summary_zh": "用空间动态综合评估模型模拟AMOC崩溃，发现区域GDP与福利分化、全球福利到2200年降1.9%。", "title_zh": "评估一个气候临界点的空间后果", "abstract_zh": "大西洋经向翻转环流（AMOC）是一个洋流系统，在调节全球气候方面发挥关键作用，包括调节欧洲和北大西洋的气温。其因全球变暖而可能发生的崩溃被广泛认为是更可能出现的气候临界点之一。本文使用世界经济的动态空间综合评估模型（S-IAM）考察这种崩溃的经济影响。预计斯堪的纳维亚和俄罗斯部分地区将经历国内生产总值和福利的显著损失，而南欧、北非和巴西则从略低的气温中受益。S-IAM通常预测全球变暖对低收入地区尤其有害，但AMOC崩溃可能缓解发展中世界部分地区的某些负面影响，同时反而损害一些较发达经济体。这会降低空间不平等，但在中等排放情景下，到2200年全球福利将下降1.9%。", "tags": ["其他"], "extra": {"scholar_name": "Esteban Rossi-Hansberg", "work_type": "report", "doi": "10.3386/w35811", "versions": ["scholar"]}}, {"uid": "oa:W7213904344", "source": "scholar", "title": "The Remains of the Trade: The U.S.–China Trade War and its Aftermath", "authors": "Pol Antràs, Adrian Kulesza, Andrea Presbitero", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35785", "date": "2026-09-01", "abstract": "A preliminary version of this paper was prepared for the 2nd Annual AlUla Conference for Emerging Market Economies, held in AlUla, Saudi Arabia on February 8-9, 2026.We are grateful to Yipei Zhang for research assistance, and to Roberto Cardarelli, Shushanik Hakobyan, Neil Meads and participants at the 2nd IMF MENA Economic Research Conference (Rabat, 2026) and the 3rd Kiel-Gottingen-CEPR Conference on China in the Global", "summary_zh": "研究美中贸易战及其余波，梳理贸易政策冲击与后续调整（摘要未提供方法及发现）。", "title_zh": "贸易的残骸：美中贸易战及其余波", "abstract_zh": "本文的初步版本是为2026年2月8日至9日在沙特阿拉伯AlUla举行的第二届年度AlUla新兴市场经济体会议准备的。我们感谢Yipei Zhang提供研究协助，并感谢Roberto Cardarelli、Shushanik Hakobyan、Neil Meads以及参加第二届IMF MENA经济研究会议（Rabat，2026年）和第三届Kiel-Gottingen-CEPR关于全球中的中国会议的人员。", "tags": ["贸易战", "关税", "贸易政策"], "extra": {"scholar_name": "Pol Antras", "work_type": "report", "doi": "10.3386/w35785", "versions": ["nber", "scholar"]}}, {"uid": "oa:W7213532273", "source": "scholar", "title": "Barriers Within Borders", "authors": "Federico Diez, Trevor Tombe, Yuanchen Yang", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9798229059633.001", "date": "2026-09-01", "abstract": "Domestic markets can be far from fully integrated within a country: Canada's interprovincial trade is half the size of its international trade. We estimate internal trade costs using bilateral flows across hundreds of products and sectors and decompose them into geographic and non-geographic components. Embedding these estimates in a multi-region, multi-sector general equilibrium model with input–output linkages and interprovincial migration, we find that removing all non-distance barriers raises real GDP by 6.8 percent in our baseline scenario, with the largest gains accruing to smaller provinces. We also identify services as the sectors generating the largest liberalization gains. Further, sequential provincial liberalization can generate a virtuous cycle, where a province's liberalization increases the gains from (and incentives for) subsequent liberalization for most other following provinces. Finally, we show that the potential gains from domestic market integration can offset the GDP losses from increases in external trade costs.", "summary_zh": "估计加拿大省际贸易成本并嵌入多区域多部门一般均衡模型，发现消除非距离壁垒可提升实际GDP 6.8%。", "title_zh": "境内壁垒", "abstract_zh": "一国内部的国内市场可能远未实现完全一体化：加拿大的省际贸易规模仅为其国际贸易的一半。我们利用数百种产品和部门的双边流动来估计内部贸易成本，并将其分解为地理成分和非地理成分。将这些估计嵌入一个包含投入产出联系和省际迁移的多区域、多部门一般均衡模型后，我们发现，在我们的基准情景中，消除所有非距离壁垒可使实际GDP提高6.8%，其中最大收益归于较小省份。我们还识别出服务业是产生最大自由化收益的部门。此外，序贯的省级自由化能够形成良性循环，其中，一个省的自由化会增加大多数其他跟随省份从后续自由化中获得的收益（以及后续自由化的激励）。最后，我们表明，国内市场一体化的潜在收益可以抵消外部贸易成本上升带来的GDP损失。", "tags": ["贸易政策", "方法论"], "extra": {"scholar_name": "Trevor Tombe", "work_type": "article", "doi": "10.5089/9798229059633.001"}}, {"uid": "oa:W7212290025", "source": "scholar", "title": "Which states are most exposed to tariff increases? A new measure based on the consumption channel", "authors": "Nick Heyman, Colin Hottman, Ryan Monarch", "venue": "FEDS Notes", "url": "https://doi.org/10.17016/2380-7172.4157", "date": "2026-09-01", "abstract": "This note examines the heterogeneous exposure of states in terms of their consumption of direct consumer goods imports, which is an important channel through which states are exposed to increases in trade costs such as tariffs. Building on the methodology that Hottman and Monarch (2020) and Hottman and Monarch (2026) used to construct a similar measure for U.S. income deciles and other demographic groups, we construct a new state-level measure using a recent year of data.", "summary_zh": "构建州级消费渠道关税暴露指标，衡量各州直接消费品进口的异质性暴露。", "title_zh": "哪些州最容易受到关税上调影响？基于消费渠道的新衡量指标", "abstract_zh": "本文考察各州在直接消费品进口消费方面的异质性暴露，这是各州受到关税等贸易成本上升影响的一个重要渠道。借鉴 Hottman and Monarch（2020）以及 Hottman and Monarch（2026）用于为美国收入十分位组和其他人口统计群体构建类似指标的方法，我们使用最近一年的数据构建了一个新的州级指标。", "tags": ["关税", "贸易政策", "方法论"], "extra": {"scholar_name": "Ryan Monarch", "work_type": "article", "doi": "10.17016/2380-7172.4157"}}, {"uid": "nber:w35829", "source": "nber", "title": "Importers, Market Power and Optimal Tariffs", "authors": "Jonathan Becker, Corina Boar, Virgiliu Midrigan", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35829", "date": "2026-09-01", "abstract": "Importers are few and large, have higher labor productivity and pass through cost changes to prices incompletely.We study optimal tariffs in a model consistent with these facts.Firms pay a fixed cost to import and charge markups that increase with size.Market power implies that importers are too few and too small relative to the efficient allocations.Tariffs amplify this distortion.We derive a formula that relates the optimal tariff not only to the foreign export supply elasticity but also to how much distortions amplify the effect of trade costs on welfare.In our calibrated economy the optimal tariff is negative and decreases with country size.", "summary_zh": "构建进口商具有市场势力的模型研究最优关税，校准发现最优关税为负并随国家规模下降。", "title_zh": "进口商、市场势力与最优关税", "abstract_zh": "进口商数量少且规模大，具有更高的劳动生产率，并且将成本变化不完全地传导到价格中。我们在一个与这些事实相一致的模型中研究最优关税。企业为进口支付固定成本，并收取随规模增加而上升的加成。市场势力意味着，相对于有效配置，进口商过少且规模过小。关税会放大这一扭曲。我们推导出一个公式，该公式将最优关税不仅与外国出口供给弹性相联系，还与扭曲在多大程度上放大贸易成本对福利的影响相联系。在我们校准的经济中，最优关税为负，并随国家规模增大而下降。", "tags": ["关税", "贸易政策", "企业异质性"], "extra": {"nber_id": "W35829", "keyword_hit": "tariff"}}, {"uid": "nber:w35812", "source": "nber", "title": "Transportation Bottlenecks and Aggregate Shocks", "authors": "Giulia Brancaccio, Myrto Kalouptsidi, Theodore Papageorgiou, Yixin Zhou", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35812", "date": "2026-09-01", "abstract": "Do transportation disruptions affect aggregate outcomes?We develop a tractable model of the transportation sector to study its impact on prices and international trade.By casting maritime transportation as a queueing network, the model identifies where the transportation bottlenecks lie and delivers a simple and easy-to compute measure of transportation capacity over time.We calibrate the model using shipping and trade data and use it to evaluate the resilience of the shipping sector during the last 20 years.During the Great Supply Chain Disruption, port bottlenecks raised commodity prices and caused shortages, but a contemporaneous contraction in commodity supply reduced shipping demand and thereby dampened these effects.By contrast, insufficient shipping capacity was a key driver of price increases during the 2000s Commodity Supercycle.", "summary_zh": "用海运排队网络模型分析运输瓶颈对价格与国际贸易的影响，发现港口瓶颈在大供应链中断中推高商品价格。", "title_zh": "运输瓶颈与总体冲击", "abstract_zh": "运输中断会影响总体结果吗？我们构建了一个易于处理的运输部门模型，以研究其对价格和国际贸易的影响。通过将海运设定为排队网络，该模型识别出运输瓶颈所在，并给出一个简单且易于计算的、随时间变化的运输能力指标。我们使用航运和贸易数据校准该模型，并用其评估过去20年航运部门的韧性。在大供应链中断期间，港口瓶颈抬高了大宗商品价格并造成短缺，但同期大宗商品供给收缩降低了航运需求，从而抑制了这些影响。相比之下，航运能力不足是2000年代大宗商品超级周期期间价格上涨的关键驱动因素。", "tags": ["供应链", "方法论"], "extra": {"nber_id": "W35812", "keyword_hit": "international trade"}}, {"uid": "nber:w35808", "source": "nber", "title": "Shipping to America", "authors": "Xiwen Bai, Jesús Fernández‐Villaverde, Yiliang Li, Ricardo Marto, Francesco Zanetti", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35808", "date": "2026-09-01", "abstract": "We study the macroeconomic and trade-policy implications of disruptions to U.S.-bound shipping routes.Standard models treat them as iceberg-cost shocks, conflating the shock with the response to it.Using satellite vessel-tracking data, we construct route-level measures of potential and effectiv
