m China invoiced in RMB surged rapidly to nearly 50% – displacing the US dollar, which had previously accounted for virtually all invoicing. Following the presidential election of late 2023, as macroeconomic policies changed and the dollar shortage eased, invoicing in RMB declined. We explore the mechanisms behind this aggregate pattern, using rich firm-level data on imports, bank-firm loan relationships, and bank balance sheets. Our results indicate that banks played a key role, in line with the dollar shortage narrative. First, firms with pre-existing relationships to banks with limited US dollar loans were more likely to switch to RMB. Second, firms borrowing from a Chinese state-owned bank were significantly more likely to use RMB. We also document firm-level spillovers, with RMB use for imports from China increasing the likelihood of RMB use for imports from other countries. Finally, we observe an effect on trade volumes. Firms switching to RMB saw increased total imports", "summary_zh": "基于阿根廷2023年人民币互换政策与企业进口数据，发现银行关系推动人民币计价并影响贸易量。", "title_zh": "如何培育一种计价货币：来自阿根廷的微观证据", "abstract_zh": "一种货币如何实现更广泛的国际使用？我们借助阿根廷一项独特的政策实验，研究中国人民币（RMB）的国际化。2023年，在严重的美元短缺中，阿根廷扩大了与中国人民银行的货币互换额度。在随后几个月里，从中国进口中以人民币计价的份额迅速飙升至近50%，取代了此前几乎占全部计价的美元。2023年末总统选举之后，随着宏观经济政策变化和美元短缺缓解，以人民币计价的比例下降。我们利用关于进口、银行—企业贷款关系和银行资产负债表的丰富企业层面数据，探讨这一总体模式背后的机制。我们的结果表明，银行发挥了关键作用，这与美元短缺的叙事一致。第一，与美元贷款有限的银行已有关系的企业更可能转向人民币。第二，从一家中国国有银行借款的企业显著更可能使用人民币。我们还记录了企业层面的溢出效应：从中国进口时使用人民币会提高从其他国家进口时使用人民币的可能性。最后，我们观察到对贸易量的影响。转向使用人民币的企业总进口有所增加。", "tags": ["汇率", "企业异质性"], "extra": {"scholar_name": "Dennis Novy", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104290"}}, {"uid": "oa:W7166526698", "source": "scholar", "title": "Immigration, Innovation, and the Geography of Growth", "authors": "Costas Arkolakis, Sun Kyoung Lee, Michael Peters", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35392", "date": "2026-06-01", "abstract": "Between 1880 and 1920, more than 20 million immigrants settled in the United States. We study how this migration wave affected innovation and growth. Using a newly constructed dataset linking individual census records to historical immigration records and the universe of US patents, we highlight a new channel through which immigrants contributed to growth: they disproportionately settled in urban innovation hubs. To quantify the aggregate and regional effects of this mass migration episode, we develop a new spatial growth model in which skilled workers have a comparative advantage in innovation and sort endogenously across space. We find that international arrivals after 1880 raised US income per capita by 8.2% by 1940. Removing the subsequent immigration restrictions of the 1920s would have raised income per capita by a further 1.7% by 2000. Immigrants' skill composition and their concentration in urban hubs are key drivers of these effects. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "研究1880—1920年美国移民潮如何通过城市创新中心促进创新与增长，并用空间增长模型量化收入效应。", "title_zh": "移民、创新与增长的地理分布", "abstract_zh": "在1880年至1920年间，超过2000万移民在美国定居。我们研究这一移民浪潮如何影响创新与增长。利用一个新构建的数据集——该数据集将个人人口普查记录与历史移民记录以及美国专利全集相链接——我们强调了一条移民促进增长的新渠道：他们不成比例地集中定居于城市创新中心。为了量化这一大规模移民事件的总量与区域效应，我们构建了一个新的空间增长模型，其中技术工人在创新方面具有比较优势，并在空间上内生地进行排序。我们发现，1880年之后的国际移民到1940年使美国人均收入提高了8.2%。取消20世纪20年代随后的移民限制本会到2000年使人均收入进一步提高1.7%。移民的技能构成及其在城市中心的集中是这些效应的关键驱动因素。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "Costas Arkolakis", "work_type": "report", "doi": "10.3386/w35392", "versions": ["nber"]}}, {"uid": "oa:W7165888465", "source": "scholar", "title": "Negotiating a Win-Win End to the Lose-Lose US-China Trade War over Technology and Critical Minerals", "authors": "Chad P. Bown", "venue": "Journal of World Trade", "url": "https://doi.org/10.54648/trad2026015", "date": "2026-06-01", "abstract": "The United States and China put parts of the global economy at risk in 2025 through their trade war over critical minerals and technology. A series of escalatory tariffs and export restrictions led to shortages of essential inputs, nearly forcing automakers worldwide to shut down production. The costly policies reflected uncoordinated and uncommunicated efforts by both countries to reduce their mutual economic dependence. This paper explores a novel path for the United States and China to \"cooperate\" over how they reduce their dependence on each other in technology and critical minerals, with the aim of limiting future escalation risks and avoiding unnecessary costs. The proposal draws on a version of the reciprocal approach to negotiations developed under the General Agreement on Tariffs and Trade, modified to accommodate a mutual reduction in each country's market dominance in key sectors.", "summary_zh": "针对美中技术与关键矿产贸易战，论文借鉴GATT互惠谈判提出双方合作减少依赖、限制升级风险的双赢方案。", "title_zh": "为美中技术与关键矿产两败俱伤贸易战谈判双赢结局", "abstract_zh": "美国和中国在2025年围绕关键矿产和技术的贸易战使全球经济的部分领域面临风险。一系列不断升级的关税和出口限制导致关键投入品短缺，几乎迫使全球汽车制造商停止生产。这些代价高昂的政策反映出两国在降低相互经济依赖方面所作的努力缺乏协调和沟通。本文探讨了一条新颖路径，使美国和中国就如何降低彼此在技术和关键矿产上的依赖开展“合作”，旨在限制未来升级风险并避免不必要的成本。该提议借鉴了《关税与贸易总协定》下形成的谈判互惠方法的一个版本，并对其加以修改，以适应相互降低各自在关键部门的市场主导地位。", "tags": ["贸易战", "贸易政策", "出口管制"], "extra": {"scholar_name": "Chad Bown", "work_type": "article", "doi": "10.54648/trad2026015"}}, {"uid": "oa:W7163075284", "source": "scholar", "title": "Trade in AI-Related Products", "authors": "Michael Waugh", "venue": "Quarterly Review", "url": "https://doi.org/10.21034/qr.4612", "date": "2026-06-01", "abstract": "", "summary_zh": "研究AI相关产品贸易；无摘要，方法与核心发现未知。", "title_zh": "人工智能相关产品贸易", "abstract_zh": "", "tags": ["其他"], "extra": {"scholar_name": "Michael Waugh", "work_type": "article", "doi": "10.21034/qr.4612", "versions": ["nber", "scholar"]}}, {"uid": "nber:w35386", "source": "nber", "title": "Openness, Integration, and the International Monetary Order", "authors": "Tarek A. Hassan, Thomas M. Mertens, Jingye Wang, Tony Zhang", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35386", "date": "2026-06-01", "abstract": "This paper develops a calibrated general-equilibrium model to study how different configurations of trade and financial policy reshape the hierarchy of global currencies—and the U.S. dollar's position at its anchor. Currency safety and anchor status arise endogenously from each economy's 'effective size'—the weight its domestic shocks carry in setting world prices. Tariffs reduce this effective size on the goods side; capital controls do the same on the financial side. A unifying result emerges: The economy that maintains the deepest integration with the global trading network retains the largest safety premium and gains anchor status. We use this framework to evaluate the effects of three policy levers for Europe that affect the effective size of the euro: internal harmonization and enlargement, trade openness, and capital-account openness. The stakes are large: In our model, shifts in currencies' safety can redirect global capital flows and alter sovereign borrowing costs by hundreds of billions of dollars annually. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "用一般均衡模型分析关税与资本管制如何重塑全球货币层级，深度贸易一体化决定锚货币地位。", "title_zh": "开放、一体化与国际货币秩序", "abstract_zh": "本文构建一个经过校准的一般均衡模型，研究贸易与金融政策的不同组合如何重塑全球货币层级——以及美元在货币层级锚点上的地位。货币安全性和锚货币地位内生于各经济体的“有效规模”——即其国内冲击在决定世界价格中所承载的权重。关税在商品侧降低这一有效规模；资本管制在金融侧产生同样效果。一个具有统一性的结果显现：与全球贸易网络保持最深一体化的经济体保留最大的安全溢价并获得锚货币地位。我们使用这一框架评估欧洲三个影响欧元有效规模的政策杠杆的效应：内部协调与扩大、贸易开放以及资本账户开放。利害关系重大：在我们的模型中，货币安全性的变动可以重新引导全球资本流动，并使主权借贷成本每年变动数千亿美元。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["关税", "贸易政策", "汇率"], "extra": {"nber_id": "W35386", "keyword_hit": "tariff"}}, {"uid": "nber:w35307", "source": "nber", "title": "Are carbon tariffs climate policy?", "authors": "Gregory Casey, Kyle Meng, Ivan Rudik", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35307", "date": "2026-06-01", "abstract": "Carbon import tariffs, traditionally considered a complement to domestic climate policy, are increasingly proposed as standalone policies.We build a quantitative trade model to compare U.S. carbon tariffs with and without a domestic carbon tax, each applied to a set of carbon-intensive, trade-exposed sectors.We find three main results.First, a U.S. carbon tariff increases U.S. emissions, lowers foreign emissions, and on net achieves half the global emissions reductions of the combined policy, which lowers both U.S. and foreign emissions.Second, both approaches increase U.S. GDP and welfare, but the combined policy has a larger effect due to terms of trade improvements.Third, global emissions reductions from multilateral tariff-only agreements are modest and do not increase monotonically with greater membership, whereas under combined policies they scale considerably with membership.", "summary_zh": "构建量化贸易模型比较美国碳关税与国内碳税组合政策，发现仅碳关税会推高美国排放且全球减排有限。", "title_zh": "碳关税是气候政策吗？", "abstract_zh": "碳进口关税传统上被视为国内气候政策的补充，但越来越被提议作为独立政策。我们构建了一个定量贸易模型，比较美国碳关税在有和没有国内碳税情况下的情形，二者分别适用于一组碳密集且贸易暴露的部门。我们发现三个主要结果。第一，美国碳关税增加美国排放，降低外国排放，并且净实现组合政策全球减排量的一半；组合政策同时降低美国和外国排放。第二，两种方法都提高美国GDP和福利，但由于贸易条件改善，组合政策的效果更大。第三，多边仅关税协定带来的全球减排幅度不大，且不随成员增加而单调增加；而在组合政策下，减排随成员增加显著扩大。", "tags": ["关税", "贸易政策"], "extra": {"nber_id": "W35307", "keyword_hit": "tariff"}}, {"uid": "nber:w35303", "source": "nber", "title": "Falling Dominoes? The Impact of the US Exit from Free Trade on the Sustainability of Trade Cooperation", "authors": "Barthélémy Bonadio, Andrei A. Levchenko, Nitya Pandalai-Nayar", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35303", "date": "2026-06-01", "abstract": "This paper quantitatively evaluates other countries' optimal tariffs and the prospects of sustaining international trade cooperation when a large player—the United States—exits the cooperative trade regime. To guide the analysis, we rely on an analytical characterization of the optimal tariff in a simplified multi-country trade model with endogenous labor supply. A country's optimal import tariffs are a function of its trade partners' expenditure shares on its goods, and the trade and labor supply elasticities. In both the simplified model and the full quantitative multi-country, multi-sector global network model, the impact of the US withdrawal from free trade on other countries' optimal tariffs and the sustainability of the cooperative trade regime is minimal. This is because quantitatively, the key determinants of these objects—domestic and international trade shares of other countries—change little from the US withdrawal. This main finding is not sensitive to the trade or labor supply elasticities. Thus, the fall of the US free trade domino is unlikely to cause further dominoes to fall. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "通过多国模型评估美国退出自由贸易对他国最优关税与贸易合作可持续性的影响，发现影响很小。", "title_zh": "多米诺骨牌倒下？美国退出自由贸易对贸易合作可持续性的影响", "abstract_zh": "本文定量评估当一个大参与者——美国——退出合作贸易体制时，其他国家的最优关税以及维持国际贸易合作的前景。为引导分析，我们依赖于一个包含内生劳动供给的简化多国贸易模型中对最优关税的解析刻画。一国的最优进口关税是其贸易伙伴对其商品的支出份额以及贸易和劳动供给弹性的函数。在简化模型和完整的定量多国、多部门全球网络模型中，美国退出自由贸易对其他国家最优关税以及合作贸易体制可持续性的影响都极小。这是因为从定量上看，这些对象的关键决定因素——其他国家的国内贸易份额和国际贸易份额——因美国退出而变化很小。这一主要发现对贸易弹性或劳动供给弹性不敏感。因此，美国自由贸易多米诺骨牌的倒下不太可能导致更多多米诺骨牌倒下。NBER工作论文系列的机构订阅者以及发展中国家居民可在 www.nber.org 无需额外付费下载本文。", "tags": ["关税", "贸易政策", "贸易协定"], "extra": {"nber_id": "W35303", "keyword_hit": "international trade"}}, {"uid": "oa:W7162788892", "source": "scholar", "title": "Trade Diversion and Third-Country Adjustment in the U.S.–China Trade War", "authors": "Kyle Feinstein, Stephen J. Redding, Stanford University", "venue": "Stanford Digital Repository", "url": "https://doi.org/10.25740/bj264qz0014", "date": "2026-05-29", "abstract": "This paper examines whether the U.S.–China trade war generated within-product substitution toward third countries. I focus on Brazil and use a product-level difference-in-differences framework with bilateral trade data at the HS6 level to compare changes in Brazil’s export performance relative to competing suppliers. Despite large declines in U.S. imports from China after 2018, there is no evidence of systematic substitution toward Brazil. Brazil does not gain relative market share within affected product categories in either the U.S. or Chinese markets. A triple-difference specification using tariffed products only confirms this null. This aggregate result masks substantial sectoral heterogeneity: Brazil expands in agriculture—most notably soybeans, where its comparative advantage is strongest—but loses ground in manufacturing, where countries such as Vietnam capture reallocated demand. These findings show that trade reallocation is selective and shaped by comparative advantage, rather than a broadly shared opportunity across countries and sectors.", "summary_zh": "本文用产品级双重差分研究美中贸易战对巴西的贸易转移，发现总体无系统替代但行业异质。", "title_zh": "贸易转移与美中贸易战中的第三国调整", "abstract_zh": "本文考察中美贸易战是否在同类产品内部产生了向第三国的替代。我聚焦巴西，并使用产品层面的双重差分框架，结合HS6层面的双边贸易数据，比较巴西相对于竞争性供应国的出口表现变化。尽管2018年后美国自中国进口大幅下降，但没有证据表明出现了系统性地向巴西替代。巴西在美国或中国市场的受影响产品类别中均未获得相对市场份额。仅使用被征收关税产品的三重差分设定证实了这一零结果。这一总体结果掩盖了显著的行业异质性：巴西在农业——尤其是其比较优势最强的大豆——扩张，但在制造业失去阵地，越南等国获取了重新分配的需求。这些发现表明，贸易再分配具有选择性，并受比较优势塑造，而不是各国和各行业广泛共享的机会。", "tags": ["贸易战", "关税", "贸易政策"], "extra": {"scholar_name": "Stephen Redding", "work_type": "article", "doi": "10.25740/bj264qz0014"}}, {"uid": "oa:W7162778886", "source": "scholar", "title": "The Battle over Knowledge: Multinationals, Diffusion, and Governance", "authors": "Laura Alfaro, Maggie Chen, Beata Smarzynska Javorcik", "venue": "报告", "url": "https://doi.org/10.18235/0014056", "date": "2026-05-28", "abstract": "Multinational corporations (MNCs) are the dominant institutions for creating and distributing knowledge across borders. Their activities generate geopolitical externalities when cross-border knowledge spillovers enhance a rival states strategic capabilities in ways neither internalized by firms nor priced by markets. This review examines MNC-mediated knowledge creation and diffusion and the governance regime that has emerged in response. We distinguish three types of knowledge codified, tacit, and organizational that differ in their transmission channels and governability, and trace how each is created within MNC networks, diffused within and across firm boundaries, and targeted by policy instruments. Evidence shows that controls induce compensating responses, including redirected innovation, supply-chain reconfiguration, and organizational restructuring, with uncertain net effects. Linking the theory of the multinational firm to the economics of geopolitical rivalry, the review highlights the trade-offs that knowledge governance imposes on the global economy.", "summary_zh": "综述跨国公司跨境知识扩散与治理，分析管制引发供应链重构及组织调整。", "title_zh": "知识之战：跨国公司、扩散与治理", "abstract_zh": "跨国公司（MNCs）是跨境创造和分配知识的主导性制度。当跨境知识溢出以既未被企业内部化、也未被市场定价的方式增强竞争国家的战略能力时，其活动便产生了地缘政治外部性。本文综述以跨国公司为中介的知识创造与扩散，以及由此形成的治理制度。我们区分编码化知识、隐性知识和组织知识三种类型，它们在传播渠道和可治理性上各不相同，并追溯每一种知识如何在跨国公司网络内部被创造、在企业边界之内和跨企业边界扩散，以及如何成为政策工具的目标。证据表明，管制会引发补偿性反应，包括创新转向、供应链重构和组织重组，其净效应不确定。本文将跨国公司理论同地缘政治竞争经济学联系起来，突出知识治理对全球经济施加的权衡取舍。", "tags": ["出口管制", "供应链"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "report", "doi": "10.18235/0014056"}}, {"uid": "tweet:2059257003789177142", "source": "tweet", "title": "HOW TO WIN A TRADE WAR is officially published in the US today!!!  Last week was so incredibly amazing but also so busy @SoumayaKeynes and I", "authors": "@ChadBown", "venue": "X (Twitter)", "url": "https://x.com/ChadBown/status/2059257003789177142", "date": "2026-05-26", "abstract": "HOW TO WIN A TRADE WAR\nis officially published in the US today!!!\n\nLast week was so incredibly amazing\nbut also so busy\n@SoumayaKeynes and I\nhad some serious Lady Gaga vibes https://t.co/K82hmyfd5z", "summary_zh": "《如何赢得贸易战》（HOW TO WIN A TRADE WAR）今天在美国正式出版！！！\n\n上周真是无比精彩，\n但也非常忙碌，\n@SoumayaKeynes 和我\n有着强烈的 Lady Gaga 风范", "title_zh": "", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"handle": "ChadBown", "name": "Chad P. Bown", "is_retweet": false, "is_reply": false, "likes": 39, "retweets": 9, "views": 11795, "created_at": "2026-05-26T12:55:03+00:00", "links": [{"tco": "https://t.co/K82hmyfd5z", "skip": 1, "url": "", "title": "", "domain": "", "image": ""}], "scholar_name": "Chad Bown"}}, {"uid": "oa:W3144067810", "source": "top5", "title": "Technology Transfer and Early Industrial Development: Evidence from the Sino-Soviet Alliance", "authors": "Michela Giorcelli, Bo Li", "venue": "The Review of Economic Studies", "url": "https://doi.org/10.1093/restud/rdag047", "date": "2026-05-20", "abstract": "Abstract This paper studies the long-term effects of technology and know-how transfers on structural transformations. In the 1950s, the Soviet Union supported the construction of the 156 Projects, which were large-scale, capital-intensive industrial clusters in China. These projects included a technology transfer, consisting of state-of-the-art Soviet machinery and equipment, and a know-how transfer, via the training of Chinese engineers, production supervisors, and high-skilled technicians by Soviet experts. We use newly assembled data that follow steel plants for over four decades, and we exploit natural variation in the transfers they eventually received. We find that, while production advantages stemming from Soviet technology faded away if not complemented with training, the know-how transfer had a long-lasting impact on plant performance, stimulated technology upgrade when China was a closed economy, and increased exports to the Western world when China engaged in international trade. The know-how transfer also generated productivity and technology spillovers onto complementary establishments.", "summary_zh": "利用中苏156项目钢铁厂四十年数据，研究苏联技术与诀窍转移的长期影响，发现诀窍转移提升绩效并促进出口。", "title_zh": "技术转移与早期工业发展：来自中苏同盟的证据", "abstract_zh": "摘要 本文研究技术转移和专有技术转移对结构转型的长期影响。20世纪50年代，苏联支持建设了156项工程，这些工程是中国大规模、资本密集型的产业集群。这些工程包括技术转移，即提供最先进的苏联机器设备，以及专有技术转移，即由苏联专家培训中国的工程师、生产主管和高技能技师。我们使用新构建的数据，这些数据跟踪钢铁厂四十多年，并利用这些工厂最终获得的转移中的自然变异。我们发现，如果没有培训作为补充，源自苏联技术的生产优势会逐渐消失；而专有技术转移对工厂绩效具有长期持久的影响，在中国处于封闭经济时期促进了技术升级，并在中国参与国际贸易时增加了对西方世界的出口。专有技术转移还对互补性企业产生了生产率和技术的溢出。", "tags": ["贸易史", "产业政策"], "extra": {"journal_short": "REStud", "keyword_hit": "international trade", "doi": "10.1093/restud/rdag047"}}, {"uid": "oa:W7161129841", "source": "scholar", "title": "Greening the implementation of the African Continental Free Trade Area Agreement", "authors": "Lionel Fontagné, Stephen Njuguna Karingi, Simon Mevel, Cristina Mitaritonna, Yu Zheng", "venue": "Energy Economics", "url": "https://doi.org/10.1016/j.eneco.2026.109387", "date": "2026-05-15", "abstract": "The African Continental Free Trade Area (AfCFTA) seeks to establish a single market for goods and services, enhance intra-African trade, and promote sustainable socioeconomic development. However, achieving these goals must be carefully balanced against the continent’s persistent challenges, including climate change and limited electricity access. This paper explores the trade–climate–energy nexus in Africa using MIRAGE-Power, a dynamic computable general equilibrium (CGE) model which captures interactions between trade and energy systems. We evaluate several scenarios: the standalone implementation of AfCFTA, as well as combinations of AfCFTA with climate policy measures such as the adoption of countries’ Nationally Determined Contributions (NDCs), a carbon pricing scheme based on the IMF’s international carbon price floor, and a coordinated mitigation effort proportional to national emissions. Our results indicate that aligning trade and climate policies, particularly through power sector decarbonization and regional grid integration, can generate mutually reinforcing benefits. While climate policies pose trade-offs with economic growth and energy access, a well-designed, equitable carbon pricing framework can mitigate these tensions. Reinvesting carbon revenues in renewable energy and cross-border electricity infrastructure can further support Africa’s green transition while improving energy access across the continent.", "summary_zh": "用CGE模型评估AfCFTA与气候政策协同，发现绿色电力与区域电网整合可兼顾贸易、减排与能源可及。", "title_zh": "非洲大陆自由贸易区协议的绿色实施", "abstract_zh": "非洲大陆自由贸易区（AfCFTA）旨在建立商品和服务单一市场，增强非洲内部贸易，并促进可持续社会经济发展。然而，实现这些目标必须与非洲大陆持续存在的挑战——包括气候变化和有限的电力可及性——谨慎平衡。本文使用MIRAGE-Power探讨非洲的贸易—气候—能源关系，该模型是一个动态可计算一般均衡（CGE）模型，能够捕捉贸易与能源系统之间的相互作用。我们评估若干情景：单独实施AfCFTA，以及AfCFTA与气候政策措施的多种组合，例如采纳各国的国家自主贡献（NDCs）、基于国际货币基金组织（IMF）国际碳价下限的碳定价方案，以及与国家排放成比例的协同减排努力。我们的结果表明，协调贸易与气候政策，特别是通过电力部门脱碳和区域电网一体化，能够产生相互强化的效益。尽管气候政策与经济增长和能源可及性之间存在权衡取舍，但一个设计良好、公平的碳定价框架可以缓解这些紧张关系。将碳收入再投资于可再生能源和跨境电力基础设施，可以进一步支持非洲的绿色转型，同时改善整个非洲大陆的能源可及性。", "tags": ["贸易协定", "贸易政策"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "article", "doi": "10.1016/j.eneco.2026.109387"}}, {"uid": "oa:W4413114716", "source": "scholar", "title": "Global Production Networks and Imperfect Competition", "authors": "Hanwei Huang, Kalina B. Manova, Oscar Perelló, Frank Pisch", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104315", "date": "2026-05-15", "abstract": "How do global production networks and market structure interact to shape the gains from trade and competition policy? We develop a quantifiable model with two-sided firm heterogeneity, matching frictions, and imperfect competition. More productive buyers match with more suppliers, which spurs tougher competition, lowers input costs, and raises profits. Reduced-form evidence confirms that larger French and Chilean firms import higher quantities at lower prices as more Chinese suppliers enter, and that suppliers charge diversified buyers lower markups. We estimate the model by extending recent methods for combinatorial discrete-choice problems. Counterfactuals reveal that entry upstream benefits primarily high-productivity buyers, while lower trade or matching costs favor mid-productivity firms. Moreover, the interaction between endogenous networks and markups significantly amplifies the welfare gains from entry upstream, as well as from packaging trade liberalization with reductions in matching or entry costs.", "summary_zh": "构建含企业异质性、匹配摩擦与不完全竞争的可量化模型，发现生产网络与加成率互动放大上游进入及贸易自由化的福利收益。", "title_zh": "全球生产网络与不完全竞争", "abstract_zh": "全球生产网络与市场结构如何相互作用，以塑造贸易和竞争政策的收益？我们构建了一个可量化的模型，包含双边企业异质性、匹配摩擦和不完全竞争。生产率更高的买方会与更多供应商匹配，这会激发更激烈的竞争、降低投入成本并提高利润。简约式证据证实，随着更多中国供应商进入，规模更大的法国和智利企业会以更低价格进口更高数量，并且供应商会向多元化买方收取更低的加成。我们通过扩展近期用于组合离散选择问题的方法来估计该模型。反事实分析表明，上游进入主要使高生产率买方受益，而更低的贸易成本或匹配成本则有利于中等生产率企业。此外，内生网络与加成之间的相互作用显著放大了上游进入带来的福利收益，也显著放大了将贸易自由化与匹配成本或进入成本下降相组合所带来的福利收益。", "tags": ["全球价值链", "企业异质性", "贸易政策"], "extra": {"scholar_name": "Kalina Manova", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104315"}}, {"uid": "oa:W7167824505", "source": "scholar", "title": "Mind the Break-Up: When Policy Disrupts Firms' Supply Chains", "authors": "Holger Breinlich Y, Elsa Leromain, Martina Magli", "venue": "CESifo", "url": "https://doi.org/10.65864/ldtnd7qid9", "date": "2026-05-13", "abstract": "This paper examines how policy-induced supply-chain shocks affect firms' performances, using the UK-EU Trade and Cooperation Agreement (TCA) as a source of exogenous variation. Using UK microdata on firm-level goods and services trade linked to firm's outcomes and employer-employee records, we document a sharp decline in firms’ imports of intermediate goods from the EU after 2021. We then show that firms more exposed to EU input sourcing experience declines in employment and sales, with corresponding effects on workers’ hours and pay. These impacts are heterogeneous across occupations, with larger losses concentrated among lower-skilled roles. Interestingly, we find that firms' services activities play an important role in mediating the impact of GVCs disruptions. On the one hand, these firms experience smaller declines in intermediate inputs imports; on the other hand, they experience stronger negative reactions to the overall GVC shock.", "summary_zh": "本文以英欧TCA为准自然实验，用英国企业微观数据发现政策冲击致中间品进口下降并拖累就业与销售。", "title_zh": "警惕断裂：当政策扰乱企业供应链", "abstract_zh": "本文考察政策引发的供应链冲击如何影响企业绩效，并将《英欧贸易与合作协定》（TCA）作为外生变化的来源。利用将企业层面的货物和服务贸易与企业的结果及雇主—雇员记录相连接的英国微观数据，我们记录了2021年后企业从欧盟进口中间产品的急剧下降。随后我们表明，从欧盟采购投入品程度更高的企业在就业和销售方面出现下降，并对工人的工作时间和工资产生相应影响。这些影响在不同职业之间存在异质性，较大的损失集中在低技能岗位。有趣的是，我们发现企业的服务活动在调节全球价值链（GVCs）中断的影响方面发挥重要作用。一方面，这些企业的中间投入品进口下降幅度较小；另一方面，它们对整体GVC冲击的负面反应更强。", "tags": ["贸易政策", "全球价值链", "供应链"], "extra": {"scholar_name": "Holger Breinlich", "work_type": "report", "doi": "10.65864/ldtnd7qid9"}}, {"uid": "oa:W7161175545", "source": "top5", "title": "Input Sourcing under Climate Risk: Evidence from U.S. Manufacturing Firms", "authors": "Joaquin Blaum, Federico Esposito, Sebastian Heise", "venue": "The Review of Economic Studies", "url": "https://doi.org/10.1093/restud/rdag031", "date": "2026-05-13", "abstract": "Abstract We study the effect of risk on how firms organize their supply chains. We use transaction-level data on U.S. manufacturing imports to construct a novel measure of input sourcing risk based on the historical volatility of ocean shipping times. Our measure isolates the unexpected component of shipping times that is induced by weather conditions along more than 331,000 maritime routes. We first document that unexpected shipping delays significantly reduce importers’ sales, profits, and employment. We then show that firms actively diversify weather risk by using more routes and foreign suppliers, although their import values decline. To rationalize these findings, we introduce shipping time risk into a general equilibrium model of importing with firm heterogeneity. Our quantitative analysis predicts substantial costs for the U.S. economy associated with supply chain risk.", "summary_zh": "基于美国制造业进口交易与海运时间波动，发现意外延误损害企业绩效，企业通过多路线多供应商分散风险，并量化供应链风险成本。", "title_zh": "气候风险下的投入品采购：来自美国制造业企业的证据", "abstract_zh": "摘要 我们研究风险如何影响企业组织其供应链。我们使用美国制造业进口的交易层面数据，基于海运时间的历史波动率构建了一种新的投入品采购风险度量。我们的度量分离出由超过331,000条海上航线沿线天气状况所引致的运输时间中未预期成分。我们首先表明，未预期的运输延误显著降低进口商的销售额、利润和就业。然后我们表明，企业通过使用更多航线和外国供应商积极分散天气风险，尽管其进口额下降。为解释这些发现，我们将运输时间风险引入一个具有企业异质性的进口一般均衡模型。我们的定量分析预测，供应链风险给美国经济带来巨大成本。", "tags": ["供应链", "企业异质性"], "extra": {"journal_short": "REStud", "keyword_hit": "import", "doi": "10.1093/restud/rdag031"}}, {"uid": "oa:W7161910377", "source": "scholar", "title": "Trade wars: a brief history", "authors": "Ryan Monarch", "venue": "Edward Elgar Publishing eBooks", "url": "https://doi.org/10.4337/9781035327508.00052", "date": "2026-05-12", "abstract": "This article describes what constitutes a “trade war” and analyzes two of the most significant trade wars in modern economic history: the trade war of the 1930s and the 2018–2019 trade war. The background conditions leading up to each of these trade wars are summarized, and the evolution of trade policy during the trade war is presented. The economic and political consequences of each are also examined. The chapter argues that one key difference between these two major trade wars is that while the negative economic effects from the 1930s trade war pushed the international community to focus on ways to reduce trade barriers, the aftermath of the 2018–2019 trade war featured far greater acceptance of the economic consequences, especially by the United States, a development that set the stage for additional trade conflagrations into the future.", "summary_zh": "通过历史比较分析1930年代与2018—2019年贸易战的背景、政策演变及后果，发现后者对经济代价的接受度更高。", "title_zh": "贸易战简史", "abstract_zh": "本文阐述了“贸易战”的构成，并分析了现代经济史上两场最重大的贸易战：20世纪30年代的贸易战和2018—2019年贸易战。文中概述了导致每场贸易战的背景条件，并呈现了贸易战期间贸易政策的演变。文中还考察了每场贸易战的经济和政治后果。本章认为，这两场重大贸易战的一个关键区别在于：20世纪30年代贸易战的负面经济影响推动国际社会关注降低贸易壁垒的方式，而2018—2019年贸易战的后果则表现为对经济后果的接受程度要高得多，尤其是美国，这一发展态势为未来发生更多贸易冲突铺平了道路。", "tags": ["贸易战", "贸易政策", "贸易史"], "extra": {"scholar_name": "Ryan Monarch", "work_type": "reference-entry", "doi": "10.4337/9781035327508.00052"}}, {"uid": "oa:W7161834087", "source": "scholar", "title": "Trade policy under firm heterogeneity", "authors": "Alan C. Spearot", "venue": "Edward Elgar Publishing eBooks", "url": "https://doi.org/10.4337/9781035327508.00051", "date": "2026-05-12", "abstract": "", "summary_zh": "基于企业异质性框架分析贸易政策；无摘要，具体方法与发现未提供。", "title_zh": "企业异质性下的贸易政策", "abstract_zh": "", "tags": ["贸易政策", "企业异质性"], "extra": {"scholar_name": "Alan Spearot", "work_type": "reference-entry", "doi": "10.4337/9781035327508.00051"}}, {"uid": "oa:W7161807627", "source": "scholar", "title": "The effects of trade policy uncertainty", "authors": "Kyle Handley, Nuno Limão", "venue": "Edward Elgar Publishing eBooks", "url": "https://doi.org/10.4337/9781035327508.00042", "date": "2026-05-12", "abstract": "", "summary_zh": "综述贸易政策不确定性对贸易与企业决策的影响，梳理测度方法及福利含义。", "title_zh": "贸易政策不确定性的影响", "abstract_zh": "", "tags": ["贸易政策", "企业异质性"], "extra": {"scholar_name": "Kyle Handley", "work_type": "reference-entry", "doi": "10.4337/9781035327508.00042"}}, {"uid": "oa:W7161785415", "source": "scholar", "title": "Economic geography and trade", "authors": "Kerem Coşar", "venue": "Edward Elgar Publishing eBooks", "url": "https://doi.org/10.4337/9781035327508.00013", "date": "2026-05-12", "abstract": "", "summary_zh": "无摘要，无法确定方法与发现；题名显示其讨论经济地理与贸易的关系。", "title_zh": "经济地理与贸易", "abstract_zh": "", "tags": ["其他"], "extra": {"scholar_name": "Kerem Cosar", "work_type": "reference-entry", "doi": "10.4337/9781035327508.00013"}}, {"uid": "oa:W7160941499", "source": "scholar", "title": "Globalization and Its Future: Do We Need a New World Trading System?", "authors": "Robert W. Staiger", "venue": "The MIT Press eBooks", "url": "https://doi.org/10.7551/mitpress/15822.003.0037", "date": "2026-05-12", "abstract": "", "summary_zh": "无摘要；论文从国际经贸规则视角讨论全球化前景与是否需要新的世界贸易体系。", "title_zh": "全球化及其未来：我们是否需要新的世界贸易体系？", "abstract_zh": "", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Robert Staiger", "work_type": "book-chapter", "doi": "10.7551/mitpress/15822.003.0037"}}, {"uid": "oa:W7160912863", "source": "scholar", "title": "Some Thoughts on the Future of Globalization", "authors": "Pol Antràs", "venue": "The MIT Press eBooks", "url": "https://doi.org/10.7551/mitpress/15822.003.0036", "date": "2026-05-12", "abstract": "", "summary_zh": "围绕全球化未来走向，从国际贸易与全球价值链视角讨论趋势与政策含义。", "title_zh": "关于全球化未来的一些思考", "abstract_zh": "", "tags": ["全球价值链", "贸易政策"], "extra": {"scholar_name": "Pol Antras", "work_type": "book-chapter", "doi": "10.7551/mitpress/15822.003.0036"}}, {"uid": "oa:W7166655558", "source": "scholar", "title": "The multilateral trading system: resilience, erosion, and the role of middle power", "authors": "Ralph Ossa", "venue": "Zurich Open Repository and Archive (University of Zurich)", "url": "https://doi.org/10.5167/uzh-434770", "date": "2026-05-01", "abstract": "The multilateral trading system is widely perceived to be in crisis, undermined by geopolitical tensions, unilateral trade policies, and growing skepticism toward global cooperation. Yet this paper argues that such narratives are both overstated and insufficiently precise. While the system faces real and structural pressures, it continues to govern the majority of global trade and to deliver significant economic value. Drawing on economic theory and policy practice, the paper disentangles resilience from erosion. It shows that core mechanisms – non-discrimination, reciprocity, and binding commitments – still anchor global trade, even as negotiation, implementation, and dispute settlement have weakened. At the same time, new fault lines have emerged: unresolved development tensions, the rise of state-driven competition, sustainability-related regulation, and the rapid expansion of digital trade. Rather than calling for a wholesale reinvention, the paper outlines a pragmatic reform agenda focused on adapting rules and processes to contemporary realities. Central to this vision is a shift in political economy: with great powers less willing to underwrite cooperation, middle powers must assume a more active role in sustaining and renewing the system.", "summary_zh": "论文基于经济理论与政策实践，辨析多边贸易体系的韧性与侵蚀，主张中等国家推动务实改革。", "title_zh": "多边贸易体系：韧性、侵蚀与中等国家的作用", "abstract_zh": "多边贸易体系被广泛认为处于危机之中，受到地缘政治紧张、单边贸易政策以及对全球合作日益增长的怀疑的削弱。然而，本文认为此类叙事既言过其实，也不够准确。尽管该体系面临真实且结构性的压力，它仍治理着全球贸易的多数，并带来显著的经济价值。本文借鉴经济理论与政策实践，将韧性与侵蚀区分开来。它表明，核心机制——非歧视、互惠和约束性承诺——仍支撑着全球贸易，即便谈判、实施和争端解决已经弱化。与此同时，新的断层线已经出现：未解决的发展紧张、国家驱动竞争的兴起、与可持续性相关的监管，以及数字贸易的迅速扩张。本文并未呼吁进行全盘再造，而是勾勒了一项务实改革议程，重点在于使规则和程序适应当代现实。这一愿景的核心是政治经济格局的转变：随着大国越来越不愿为合作提供支撑，中等强国必须在维持和更新该体系方面发挥更积极的作用。", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Ralph Ossa", "work_type": "report", "doi": "10.5167/uzh-434770"}}, {"uid": "oa:W7164986133", "source": "scholar", "title": "Trade policy: Then and now", "authors": "Robert W. Staiger", "venue": "Canadian Journal of Economics/Revue canadienne d économique", "url": "https://doi.org/10.1111/caje.70063", "date": "2026-05-01", "abstract": "", "summary_zh": "通过历史比较梳理贸易政策的演变逻辑与当代特征，未提供摘要故无具体结论。", "title_zh": "贸易政策：过去与现在", "abstract_zh": "", "tags": ["贸易政策", "贸易史"], "extra": {"scholar_name": "Robert Staiger", "work_type": "article", "doi": "10.1111/caje.70063"}}, {"uid": "oa:W7161175759", "source": "scholar", "title": "Multilateral Export Control Regimes and Aggregate Exports", "authors": "Jingting Fan, Kyle Handley, Nuno Limão", "venue": "AEA Papers and Proceedings", "url": "https://doi.org/10.1257/pandp.20261070", "date": "2026-05-01", "abstract": "Export controls have become a central instrument of international economic policy, governing trade in dual-use and sensitive technologies among allies and rivals alike. Despite their prominence, little is known about how multilateral export control regimes affect trade between participating countries. Using long-run gravity estimates for 1965–2010, we show sizable increases in bilateral trade among joint members in multilateral export control regimes relative to nonmembers. The effects are heterogeneous across regimes and comparable in magnitude to preferential trade agreements. Our findings highlight export controls as institutions of regulatory coordination that shape aggregate trade patterns in modern global production networks.", "summary_zh": "基于1965—2010年长期引力估计，发现多边出口管制机制显著促进成员间双边贸易，效应因机制而异且与优惠贸易协定相当。", "title_zh": "多边出口管制制度与总出口", "abstract_zh": "出口管制已成为国际经济政策的核心工具，规范着盟友与对手之间两用技术和敏感技术的贸易。尽管其地位突出，但关于多边出口管制制度如何影响参与国之间的贸易，人们所知甚少。利用1965—2010年的长期引力估计，我们发现，相对于非成员，多边出口管制制度共同成员之间的双边贸易大幅增加。这些效应在不同制度间存在异质性，其规模与优惠贸易协定相当。我们的发现凸显了出口管制作为监管协调制度的作用，其塑造了现代全球生产网络中的总体贸易格局。", "tags": ["出口管制", "贸易政策"], "extra": {"scholar_name": "Kyle Handley", "work_type": "article", "doi": "10.1257/pandp.20261070"}}, {"uid": "oa:W7161167119", "source": "scholar", "title": "Sustaining International Rules in a Multipolar World", "authors": "Cecília Carvalho, Nícolas Goulart, Daniel Monte, Emanuel Ornelas", "venue": "AEA Papers and Proceedings", "url": "https://doi.org/10.1257/pandp.20261016", "date": "2026-05-01", "abstract": "We study the sustainability of international trading rules in a multipolar world. A rules-based equilibrium is shaped by three forces. A static temptation to exploit market power undermines cooperation, while two dynamic forces support it: the efficiency gains from rules and the cost of reestablishing the regime once a country becomes hegemonic. When multipolarity is short-lived and involves few coleaders, a strong enough prospect of future hegemony ensures rules cooperation. However, in a more fragmented world, the sustainability of rules is more likely if shared leadership is expected to persist, to ensure long-lasting efficiency gains.", "summary_zh": "研究多极世界贸易规则可持续性，构建合作模型，发现少数共同领导且未来霸权可期时规则合作可维持。", "title_zh": "多极世界中维持国际规则", "abstract_zh": "我们研究多极世界中国际贸易规则的可持续性。基于规则的均衡由三种力量塑造。利用市场势力的静态诱惑会削弱合作，而两种动态力量则支持合作：来自规则的效率收益，以及一旦某国成为霸权国后重建该制度的成本。当多极性是短暂的且涉及少数共同领导者时，足够强的未来霸权前景可确保规则合作。然而，在更加碎片化的世界中，如果预期共同领导将持续，以确保长期的效率收益，那么规则的可持续性更有可能。", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Emanuel Ornelas", "work_type": "article", "doi": "10.1257/pandp.20261016", "versions": ["scholar"]}}, {"uid": "oa:W7161144429", "source": "scholar", "title": "The Rare-Earth Footprint of the Global Economy: Input-Output Evidence", "authors": "Laura Alfaro, Harald Fadinger, Jan Schymik, Gede Virananda", "venue": "AEA Papers and Proceedings", "url": "https://doi.org/10.1257/pandp.20261068", "date": "2026-05-01", "abstract": "Rare earth elements (REEs) are essential inputs in advanced manufacturing and green technologies, yet their role in global production networks remains difficult to quantify due to data limitations. This paper develops a methodology, following Alfaro et al. (2024), to embed REE use into a standard input-output framework by augmenting the 2017 US supply-use table. This enables the measurement of industry-level total requirements of REE. Validation using firm-level business descriptions confirms that this measure captures economically meaningful REE dependence. We further develop a country-level index of geoeconomic exposure to REE supply risks, highlighting vulnerabilities among advanced manufacturing economies.", "summary_zh": "构建嵌入稀土的投入产出法，测度行业稀土总需求并发现先进制造经济体供应链风险较高。", "title_zh": "全球经济的稀土足迹：投入产出证据", "abstract_zh": "稀土元素（REEs）是先进制造业和绿色技术的关键投入，但由于数据限制，其全球生产网络中的作用仍难以量化。本文遵循 Alfaro et al. (2024)，开发一种方法，通过扩展2017年美国供给使用表，将稀土元素使用嵌入标准投入产出框架。这使得能够测量行业层面的稀土元素总需求量。使用企业层面业务描述进行的验证确认，该指标捕捉了具有经济意义的稀土元素依赖。我们进一步开发了一个国家层面的稀土元素供应风险地缘经济暴露指数，突显了先进制造业经济体中的脆弱性。", "tags": ["全球价值链", "供应链", "方法论"], "extra": {"scholar_name": "Harald Fadinger", "work_type": "article", "doi": "10.1257/pandp.20261068"}}, {"uid": "oa:W7161136843", "source": "scholar", "title": "Can Sanctions Deter Wars? The Russia-Ukraine Case", "authors": "Thierry Mayer B, Isabelle Méjean, Mathias Thoenig", "venue": "AEA Papers and Proceedings", "url": "https://doi.org/10.1257/pandp.20261071", "date": "2026-05-01", "abstract": "Our paper simulates a model of trade, diplomacy, and wars, calibrated to be relevant for analyzing the conflict between Russia and Ukraine. The quantitative results show that Ukraine’s decoupling from Russia after the 2014 annexation of Crimea reduced its economic exposure to war but also increased the likelihood of conflict by lowering its opportunity cost of war. We then simulate sanction scenarios and find that the 2024 package, if credibly announced in 2021 and made contingent on further aggression, would have significantly raised Russia’s cost of war and could have deterred the 2022 invasion.", "summary_zh": "构建贸易-外交-战争模型模拟俄乌冲突，发现乌俄脱钩提高冲突概率，提前可信制裁可威慑入侵。", "title_zh": "制裁能阻止战争吗？俄乌案例", "abstract_zh": "我们的论文模拟了一个贸易、外交与战争模型，并对其进行校准，使其适用于分析俄罗斯与乌克兰之间的冲突。定量结果表明，乌克兰在2014年吞并克里米亚后与俄罗斯脱钩，降低了其对战争的经济风险敞口，但也通过降低其战争的机会成本而增加了冲突的可能性。随后我们模拟了制裁情景，并发现，2024年一揽子制裁措施如果在2021年可信地宣布并以进一步侵略为条件，本会显著提高俄罗斯的战争成本，并可能阻止2022年的入侵。", "tags": ["制裁", "贸易政策"], "extra": {"scholar_name": "Thierry Mayer", "work_type": "article", "doi": "10.1257/pandp.20261071"}}, {"uid": "oa:W7161114717", "source": "scholar", "title": "Geopolitics and Shallow Integration", "authors": "Aaditya Mattoo, Michèle Ruta, Robert W. Staiger", "venue": "AEA Papers and Proceedings", "url": "https://doi.org/10.1257/pandp.20261014", "date": "2026-05-01", "abstract": "The GATT/WTO system rests on reciprocity, nondiscrimination (MFN), and shallow integration—focusing on border measures while allowing domestic policy flexibility. Previous literature established the economic logic of these principles absent geopolitics. Mattoo, Ruta, and Staiger (2024) found that reciprocity and MFN may need relaxation under geopolitical rivalry. This paper extends that analysis to shallow integration by incorporating domestic standards alongside tariffs. We demonstrate formally that shallow integration's logic persists under geopolitical rivalry, suggesting the GATT/WTO approach—negotiating tariff bindings for market access while retaining domestic policy flexibility—remains viable for efficient trade cooperation even amid great power competition.", "summary_zh": "将国内标准纳入GATT/WTO浅层一体化模型，论证地缘政治竞争下浅层一体化逻辑仍成立，贸易合作可行。", "title_zh": "地缘政治与浅层一体化", "abstract_zh": "GATT/WTO体系建立在互惠、非歧视（最惠国，MFN）和浅层一体化之上——聚焦于边境措施，同时允许国内政策灵活性。既有文献确立了这些原则在不存在地缘政治时的经济逻辑。Mattoo、Ruta 和 Staiger（2024）发现，在地缘政治竞争下，互惠和MFN可能需要放松。本文通过将国内标准与关税一并纳入，将该分析拓展至浅层一体化。我们从形式上证明，浅层一体化的逻辑在地缘政治竞争下依然成立，这表明GATT/WTO方式——为市场准入谈判关税约束，同时保留国内政策灵活性——即使在大国竞争之中，对于有效率的贸易合作仍然可行。", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Robert Staiger", "work_type": "article", "doi": "10.1257/pandp.20261014"}}, {"uid": "oa:W7160398547", "source": "scholar", "title": "Trade liberalization, wage rigidity, and labor market dynamics with heterogeneous firms", "authors": "Ekaterina Gurkova, Elhanan Helpman, Oleg Itskhoki", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104260", "date": "2026-05-01", "abstract": "", "summary_zh": "构建异质性企业模型，考察贸易自由化与工资刚性对劳动力市场动态的影响。", "title_zh": "贸易自由化、工资刚性与异质性企业的劳动力市场动态", "abstract_zh": "", "tags": ["贸易政策", "企业异质性", "劳动力市场"], "extra": {"scholar_name": "Oleg Itskhoki", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104260"}}, {"uid": "nber:w35285", "source": "nber", "title": "Does the Import Invasion Explain the Mysterious Disappearance of Productivity Growth in U.S. Manufacturing?", "authors": "Robert Gordon, Kenneth Ryu", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35285", "date": "2026-05-01", "abstract": "We are grateful to Bart van Ark", "summary_zh": "检验进口竞争能否解释美国制造业生产率增长消失；摘要仅含致谢，未提供方法与核心发现。", "title_zh": "进口入侵能否解释美国制造业生产率增长的神秘消失？", "abstract_zh": "我们感谢 Bart van Ark", "tags": ["其他"], "extra": {"nber_id": "W35285", "keyword_hit": "import"}}, {"uid": "nber:w35272", "source": "nber", "title": "Geopolitical Fragmentation, Sovereign Debt, and Dollar Dominance", "authors": "Felipe Benguria, Eugenio Rojas, Felipe Saffie", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35272", "date": "2026-05-01", "abstract": "Countries borrow in dollars because dollar debt markets are deep and liquid.This paper develops a theory of when that dominance becomes fragile because countries have inherited dollar liabilities but increasingly earn yuan-linked revenues.In the model, countries begin with dollar-denominated sovereign debt.Geopolitical fragmentation raises their yuan revenue share through two channels: higher trade barriers with dollar-linked markets shift exports toward yuan-linked markets, and higher costs of using dollars in that trade make yuan settlement more attractive.Governments then face a choice: repay dollar debt using revenues that are less dollar-linked, default, or restructure into yuan.The paper identifies a liquidity spillover from restructuring: dollar-to-yuan restructurings deepen yuan debt markets, lowering refinancing costs and encouraging additional restructurings.The model shows when fragmentation produces limited restructuring and when it triggers a selfreinforcing shift from dollar debt to yuan debt.A cascade requires the liquidity feedback from yuan restructuring to be stronger than the dispersion in countries' yuan revenue exposure.", "summary_zh": "构建模型表明，地缘政治碎片化经贸易壁垒与美元结算成本改变收入币种，流动性反馈可触发美元债向人民币债的自强化重组。", "title_zh": "地缘政治碎片化、主权债务与美元主导地位", "abstract_zh": "各国以美元借款，因为美元债务市场深度大且流动性强。本文构建一个理论，说明由于各国继承了美元负债、却越来越多地获得与人民币挂钩的收入，这种主导地位何时会变得脆弱。在模型中，各国起初拥有以美元计价的主权债务。地缘政治碎片化通过两个渠道提高其人民币收入份额：与美元挂钩市场之间更高的贸易壁垒使出口转向与人民币挂钩的市场，而在该贸易中使用美元的成本上升使人民币结算更具吸引力。政府随后面临选择：用与美元挂钩程度较低的收入偿还美元债务、违约，或重组为人民币债务。本文识别出重组带来的流动性溢出：美元转人民币的重组会加深人民币债务市场，降低再融资成本并鼓励更多重组。该模型展示了碎片化何时产生有限重组，以及何时引发从美元债务向人民币债务的自我强化转变。级联要求来自人民币重组的流动性反馈强于各国人民币收入敞口的离散度。", "tags": ["贸易政策", "汇率"], "extra": {"nber_id": "W35272", "keyword_hit": "export"}}, {"uid": "nber:w35252", "source": "nber", "title": "Distribution Costs", "authors": "Cian Ruane, Alessandra Peter", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35252", "date": "2026-05-01", "abstract": "We provide the first direct estimates of distribution expenses incurred by manufacturing plants and quantify their importance for aggregate consumption and measured misallocation.Using a novel measure from the Indian Annual Survey of Industries, we document three facts: distribution expenses amount to over half of labor costs, are over three times larger as a share of sales for plants in the largest decile relative to the smallest, and declined by one third from 2000 to 2010.We develop a model of heterogeneous manufacturing firms that rely on distribution services to sell across space.The improvements in distribution over that time period raised manufacturing consumption by 24.5%.The gains materialize quickly, but unevenly: large firms expand while many small local firms shrink or exit.Distribution costs also matter for measured misallocation: standard TFPR measures generate spurious dispersion and a positive relationship with size.In the ASI, accounting for distribution costs lowers measured TFPR dispersion by 5.1% and the elasticity of TFPR with respect to plant size by 7.0%.", "summary_zh": "利用印度制造业数据估计分销成本，构建异质性企业空间销售模型，发现分销改善提升消费并影响错配测度。", "title_zh": "分销成本", "abstract_zh": "我们提供了对制造工厂所发生的分销费用的首批直接估计，并量化了其对总消费和测度到的错配的重要性。使用来自印度工业年度调查（Indian Annual Survey of Industries）的一种新测度，我们记录了三个事实：分销费用达到劳动力成本的一半以上；最大十分位工厂的分销费用占销售额的比重比最小十分位工厂高出三倍以上；并且从2000年到2010年下降了三分之一。我们构建了一个异质性制造业企业模型，这些企业依赖分销服务进行跨空间销售。该时期内分销的改善使制造业消费提高了24.5%。这些收益迅速实现，但并不均衡：大企业扩张，而许多小型本地企业收缩或退出。分销成本对测度到的错配也很重要：标准TFPR测度会产生虚假的离散度以及与规模的正向关系。在ASI中，计入分销成本使测度到的TFPR离散度降低5.1%，并使TFPR对工厂规模的弹性降低7.0%。", "tags": ["企业异质性", "方法论", "其他"], "extra": {"nber_id": "W35252", "keyword_hit": "import"}}, {"uid": "nber:w35249", "source": "nber", "title": "The Price of Protection: Tariff Incidence and Import Collapse under the Infamous Smoot-Hawley Tariff", "authors": "Kris James Mitchener, Mathieu O. Pedemonte", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35249", "date": "2026-05-01", "abstract": "Using newly digitized monthly data on the quantities and prices of imports as well as product-level data on tariff rates, we estimate that in the first year after the passage of the Smoot-Hawley Tariff Act, imports facing rate increases fell swiftly and dramatically relative to imports not affected by tariffs: for a one-percentage-point increase in the tariff rate, they declined by an average of 4%.We also estimate that the incidence of Smoot-Hawley was almost entirely borne by U.S. importers.Using an open-economy model, we attribute our high measured short-run trade elasticity of greater than 4 to fixed exchange rates that the U.S. maintained with most trade partners in the first 15 months after enactment.Our model also suggests that Smoot-Hawley accounted for 27% of the decline in total US imports in the first year after enactment.Finally, we construct both partial equilibrium and general equilibrium welfare estimates of Smoot-Hawley.Both methods deliver welfare losses of about 0.2% of GDP, reflecting the high measured elasticity of substitution and low US import-GDP ratio.", "summary_zh": "利用新数字化月度进口与关税数据，估计斯姆特-霍利关税的进口下降、关税归宿与福利损失。", "title_zh": "保护的价格：臭名昭著的斯姆特-霍利关税下的关税归宿与进口崩溃", "abstract_zh": "利用新数字化的月度进口数量与价格数据以及产品层面的关税税率数据，我们估计，在《斯穆特-霍利关税法》通过后的第一年，面临税率上调的进口相对于不受关税影响的进口迅速且大幅下降：关税税率每提高一个百分点，这些进口平均下降4%。我们还估计，斯穆特-霍利的税负几乎完全由美国进口商承担。我们使用一个开放经济模型，将我们测得的超过4的较高短期贸易弹性归因于美国在法案颁布后的前15个月内与大多数贸易伙伴维持的固定汇率。我们的模型还表明，在法案颁布后的第一年，斯穆特-霍利占美国总进口下降的27%。最后，我们构建了斯穆特-霍利的部分均衡与一般均衡福利估计。两种方法均得出约占GDP 0.2%的福利损失，反映了测得的高替代弹性和较低的美国进口-GDP比率。", "tags": ["关税", "贸易弹性", "贸易史"], "extra": {"nber_id": "W35249", "keyword_hit": "tariff"}}, {"uid": "nber:w35245", "source": "nber", "title": "How Much Has Shale Gas Saved U.S. Consumers?", "authors": "Dr. Lucas Davis", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35245", "date": "2026-05-01", "abstract": "It may seem like a distant memory now, but as of the mid-2000s, U.S. natural gas production had been flat for a decade, and the U.S. was importing liquefied natural gas (LNG), with plans to import much more. Then shale gas happened. Advances in hydraulic fracturing and horizontal drilling caused U.S. natural gas production to increase significantly, and the U.S. went from being a net importer of natural gas to being the world's largest exporter. This paper calculates how much shale gas has saved U.S. natural gas consumers. Using price differences between the United States, Europe and Japan, we calculate that U.S. natural gas consumers have saved $3.1-$4.3 trillion between 2007 and 2025, equivalent to $164-$227 billion annually. Access to low-price U.S. natural gas has been particularly valuable during major supply shocks such as the war in Ukraine, and the benefits of shale gas have been experienced broadly across sectors and states. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "利用美欧日天然气价差测算2007—2025年页岩气使美国消费者节省3.1—4.3万亿美元。", "title_zh": "页岩气为美国消费者节省了多少？", "abstract_zh": "现在这或许看似遥远的记忆，但截至2000年代中期，美国天然气产量已连续十年持平，美国当时正在进口液化天然气（LNG），并计划进口更多。随后页岩气出现了。水力压裂和水平钻井的进步使美国天然气产量显著增加，美国也从天然气净进口国转变为世界最大出口国。本文计算了页岩气为美国天然气消费者节省了多少费用。利用美国、欧洲和日本之间的价格差异，我们计算出，2007年至2025年间，美国天然气消费者共节省了3.1万亿至4.3万亿美元，相当于每年1640亿至2270亿美元。在乌克兰战争等重大供应冲击期间，获得低价美国天然气尤其宝贵，页岩气带来的益处已在各个行业和州广泛体现。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org无需额外付费下载本文。", "tags": ["其他"], "extra": {"nber_id": "W35245", "keyword_hit": "export"}}, {"uid": "nber:w35242", "source": "nber", "title": "Comparative Advantage and Openness under Global Fragmentation: Lessons from the Past 65 Years", "authors": "Joshua Aizenman, Hiro Ito, Jamel Saadaoui", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35242", "date": "2026-05-01", "abstract": "This paper asks why openness has been such a strong catalyst for catch-up growth in some regions or countries, while in others openness has been followed by stalled convergence, divergence, or stagnation.We conclude that \"openness\" in today's geoeconomically fragmented world is much more than trade intensity or trade integration.Positioning in trade networks, trade fundamentals, human capital, institutional capacity and stability matters for the potential for trade-induced productivity gains.We explore the global heterogeneity across continents between 1960 and 2024, unbalanced panel of up to 145 economies per year and estimate a growth equation using a dynamic approach for countries and years.We build a baseline equation relating real GDP growth to lagged income and growth.We complement the traditional drivers of growth by contorting for positionings variables the world economy: a proxy for economic integration measuring the number of regional trade arrangements ratified by each economy, a commodity dependence indicator; metrics related to export networks geoeconomic vulnerability (GeoV).measure country's export position with geopolitically distant partnerships; geoeconomic connectivity (GeoC) measuring the degree that trade relationships are across greater spectrum of geopolitics.The GeoC measures external \"connectors\" positioning that may counterbalance costs of geoeconomic fragmentation by securing access to greeter variety of markets and resources.Notably, the Geoeconomic linkages add an important element of \"positioning,\" indicating that the more \"geopolitically\" connected is a country, the greater are the investment-growth links.A greater diverse positioning of countries' economies improves their capacity to transform investment into output in a more diversified setting.This also indicate a lesser dependent growth on \"momentum\" by countries' economy, pointing to a greater shock-absorption capacity, confirming the benefits of diversified structure for growth from investments facing pressures from fragmentation.", "summary_zh": "用1960—2024年145个经济体动态增长模型，发现全球碎片化下地缘经济联结增强开放的投资—增长转化与抗冲击能力。", "title_zh": "全球碎片化下的比较优势与开放：过去65年的教训", "abstract_zh": "本文追问：为什么开放在某些地区或国家一直是追赶增长的如此强劲催化剂，而在另一些地区或国家，开放之后却出现了趋同停滞、分化或停滞。我们得出结论：在当今地缘经济碎片化的世界中，“开放”远不只是贸易强度或贸易一体化。在贸易网络中的定位、贸易基本面、人力资本、制度能力与稳定性，对贸易引致的生产率收益的潜力至关重要。我们考察1960年至2024年间各大洲的全球异质性，使用每年最多145个经济体的非平衡面板，并采用针对国家和年份的动态方法估计增长方程。我们构建一个基准方程，将实际GDP增长与滞后收入和增长联系起来。我们通过控制世界经济中的定位变量来补充传统的增长驱动因素：一个衡量各经济体批准的区域贸易安排数量的经济一体化代理变量、一个商品依赖指标；与出口网络、地缘经济脆弱性（GeoV）相关的指标。衡量一国与地缘政治距离遥远的伙伴关系中的出口地位；地缘经济连...……性（GeoC）衡量贸易关系跨越更广泛地缘政治范围的程度。GeoC衡量外部“连接器”的定位，这种定位可能通过确保获取更多样化的市场和资源来抵消地缘经济碎片化的成本。值得注意的是，地缘经济联系增添了“定位”这一重要要素，表明一个国家在地缘政治上的联系越紧密，投资—增长关联就越强。各国经济更加多样化的定位提高了其在更加多样化的环境中将投资转化为产出的能力。这也表明各国经济增长对“势头”的依赖程度较低，指向更强的冲击吸收能力，证实了多元化结构对于在面临碎片化压力时从投资中实现增长的好处。", "tags": ["全球价值链", "供应链", "贸易政策"], "extra": {"nber_id": "W35242", "keyword_hit": "comparative advantage"}}, {"uid": "nber:w35209", "source": "nber", "title": "State Dependence of Monetary Policy During Global Supply Chain Disruptions", "authors": "Xiwen Bai, Jesús Fernández‐Villaverde, Yiliang Li, Francesco Zanetti", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35209", "date": "2026-05-01", "abstract": "We study how global supply chain disruptions affect monetary policy transmission.Post-pandemic evidence indicates surging transportation costs, goods-market imbalances, and rising prices.We develop a model in which logistical bottlenecks (upstream slack coexisting with downstream shortages) steepen the aggregate supply curve.This convexity amplifies price responses to monetary policy while dampening output effects.Threshold VAR and Local Projection estimates are consistent with this mechanism: during disruptions, contractionary policy reduces prices more at smaller output cost, easing the stabilization trade-off.", "summary_zh": "研究全球供应链中断下的货币政策传导，构建物流瓶颈模型并用门槛VAR与局部投影，发现紧缩更抑价且产出代价更小。", "title_zh": "全球供应链中断期间货币政策的状态依赖性", "abstract_zh": "我们研究全球供应链中断如何影响货币政策传导。疫情后的证据表明，运输成本飙升、商品市场失衡以及价格上涨。我们构建了一个模型，其中物流瓶颈（上游松弛与下游短缺并存）使总供给曲线更加陡峭。这种凸性放大了货币政策的价格反应，同时抑制了产出效应。阈值VAR和局部投影估计与这一机制一致：在中断期间，紧缩性政策以更小的产出成本使价格下降更多，从而缓解稳定化权衡。", "tags": ["供应链", "方法论"], "extra": {"nber_id": "W35209", "keyword_hit": "global supply chain"}}, {"uid": "nber:w35167", "source": "nber", "title": "On the Negative Consequences of Low-Wage Offshoring for Innovation", "authors": "wulong gu, Alla Lileeva, Daniel Trefler", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35167", "date": "2026-05-01", "abstract": "Conventional wisdom holds that offshoring intermediates to China stimulates innovation. This is not entirely compelling. On the one hand, (a) offshoring lowers marginal costs and expands sales, thereby increasing the returns to innovation, especially for large firms. On the other hand, (b) offshoring low-quality intermediates reduces the costs of older-generation products, thereby reducing the returns to innovating into newer generations. We examine these two opposing forces over 2002-2011 for 6,024 Canadian firms. Our empirical strategy regresses measures of innovation, such as R&D, on imports of intermediate inputs. To address endogeneity, we construct a model-consistent shift-share instrument whose shocks are the often-dramatic improvements in the quality of HS6 Chinese intermediate inputs. We find that greater offshoring reduced R&D spending over 2002-2011 by 15% as (1) firms engaged in R&D in 2002 reduced their expenditures, and (2) firms not initially engaged in R&D were discouraged from starting up new R&D projects. Our model explains these findings: Rising quality of Chinese intermediates is a positive supply shock (rather than a negative China shock) that raises profits for all offshorers, raises innovation for the largest offshorers (channel a above), and lowers innovation for all other offshorers (channel b). These predictions are confirmed in the data. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "基于加拿大企业数据与移份额工具变量，发现对华中间品离岸外包使研发支出下降15%。", "title_zh": "低工资离岸外包对创新的负面后果", "abstract_zh": "传统观点认为，将中间品离岸外包至中国会促进创新。这并不完全令人信服。一方面，（a）离岸外包降低了边际成本并扩大了销售，从而提高了创新回报，尤其是对大企业而言。另一方面，（b）将低质量中间品离岸外包降低了老一代产品的成本，从而降低了创新进入更新世代的回报。我们考察了2002—2011年间6,024家加拿大企业面临的这两种相反力量。我们的实证策略将研发等创新衡量指标对中间投入品进口进行回归。为解决内生性，我们构建了一个模型一致的移动份额工具变量，其冲击是中国HS6中间投入品质量的往往剧烈改善。我们发现，更大规模的离岸外包使2002—2011年间的研发支出减少了15%，因为（1）2002年从事研发的企业减少了其支出，且（2）最初未从事研发的企业被抑制启动新的研发项目。我们的模型解释了这些发现：中国中间品质量的上升是一种正向供给冲击（而非负面的中国冲击），它提高了所有离岸外包企业的利润，提高了最大离岸外包企业的创新（上述渠道a），并降低了所有其他离岸外包企业的创新（渠道b）。这些预测在数据中得到证实。NBER工作论文系列的机构订阅者以及发展中国家居民可在 www.nber.org 免费下载本文。", "tags": ["全球价值链", "供应链", "企业异质性"], "extra": {"nber_id": "W35167", "keyword_hit": "offshoring"}}, {"uid": "nber:w35164", "source": "nber", "title": "How Should Central Banks Respond to Commodity Price Shocks? Optimal Monetary and Exchange Rate Frameworks for Commodity-Exposed Economies", "authors": "Thomas Drechsel, Michael McLeay, Silvana Tenreyro, Enrico D. Turri", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35164", "date": "2026-05-01", "abstract": "We show that the optimal monetary policy and exchange rate framework depend critically on the economy’s commodity exposure. We develop a flexible but tractable model economy with commodity exports and imports, in which international financial conditions may vary with the commodity cycle, and we compute the welfare-optimal policy in the presence of price and wage rigidities. Stabilizing domestic prices is welfare-optimal for commodity exporters, in line with standard open-economy policy prescriptions. But for economies that use commodities as inputs in production, optimal policy largely ‘looks through’ the direct and indirect effects of commodity shocks on domestic prices; this contrasts with some earlier findings and policy practice (which only ‘looks through’ the direct effect). Exchange-rate pegs increase welfare for commodity importers because they stabilize wages and employment, though it is not a robustly optimal policy. In emerging and developing economies, where financial conditions are more tied to the commodity cycle, trade-offs are starker and implementing the optimal policy may be challenging, since it requires enough credibility to keep inflation expectations anchored amidst greater volatility in some nominal variables. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "构建含商品进出口的开放经济模型，发现最优货币与汇率框架取决于经济体商品暴露程度。", "title_zh": "中央银行应如何应对商品价格冲击？商品暴露经济体的最优货币与汇率框架", "abstract_zh": "我们表明，最优货币政策与汇率框架关键取决于经济的大宗商品敞口。我们构建了一个具有大宗商品出口和进口的灵活但易于处理的模型经济，其中，国际金融状况可能随大宗商品周期而变化；并且我们计算了在存在价格和工资刚性时的福利最优政策。稳定国内价格对大宗商品出口国而言是福利最优的，这与标准的开放经济政策处方相一致。但对于将大宗商品作为生产投入的经济体而言，最优政策在很大程度上‘看穿’大宗商品冲击对国内价格的直接和间接影响；这与一些较早的发现和政策实践（其仅‘看穿’直接影响）形成对比。钉住汇率会提高大宗商品进口国的福利，因为它们稳定了工资和就业，尽管它并不是一种稳健最优的政策。在新兴和发展中经济体中，金融状况与商品周期的联系更为紧密，权衡更加严峻，实施最优政策可能颇具挑战性，因为这需要足够的可信度，以在一些名义变量波动性更大的情况下保持通胀预期锚定。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文，无需额外付费。", "tags": ["汇率", "其他"], "extra": {"nber_id": "W35164", "keyword_hit": "export"}}, {"uid": "oa:W4322604059", "source": "scholar", "title": "The Eurasian roundabout: Trade flows into Russia through the Caucasus and Central Asia", "authors": "Maxim Chupilkin, Beata Smarzynska Javorcik, Alexander Plekhanov", "venue": "European Economic Review", "url": "https://doi.org/10.1016/j.euroecorev.2026.105340", "date": "2026-04-15", "abstract": "", "summary_zh": "考察经高加索和中亚流入俄罗斯的贸易绕道现象，利用贸易流数据识别其路径与规模。", "title_zh": "欧亚迂回：经由高加索和中亚流入俄罗斯的贸易流", "abstract_zh": "", "tags": ["制裁", "贸易政策", "供应链"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "article", "doi": "10.1016/j.euroecorev.2026.105340"}}, {"uid": "oa:W7167784081", "source": "scholar", "title": "Sticky Gravity", "authors": "Mario Larch, Leandro Navarro, Dennis Novy", "venue": "CESifo", "url": "https://doi.org/10.65864/ldfvo7porn", "date": "2026-04-02", "abstract": "International trade flows show strong persistence over time. Standard static gravity models cannot rationalize this persistence and lack a micro-foundation for including lagged trade flows as a determinant of current trade. We develop a structural dynamic gravity framework in which persistence arises from firms' sluggish adjustment of destination-specific prices, analogous to sticky prices in macroeconomics but operating at the bilateral level. The model delivers a gravity equation with lagged trade flows as a structural feature rather than an ad hoc add-on. We propose a novel estimation approach for dynamic gravity models that explicitly accounts for persistence. Empirically, we show that ignoring persistence can lead standard gravity estimates to substantially understate the effects of trade policy changes. As an application, we find that the estimated trade impact of regional trade agreements can increase by 30 percent or more once persistence is taken into account.", "summary_zh": "构建结构动态引力模型刻画贸易流持续性，发现忽略持续性会低估贸易政策效应，RTA影响可提高30%以上。", "title_zh": "粘性引力", "abstract_zh": "国际贸易流量随时间表现出很强的持续性。标准静态引力模型无法解释这种持续性，也缺乏将滞后贸易流量作为当前贸易决定因素的微观基础。我们构建了一个结构性动态引力框架，其中持续性源于企业对目的地特定价格的缓慢调整，类似于宏观经济学中的黏性价格，但作用于双边层面。该模型给出一个引力方程，其中滞后贸易流量是结构性特征，而非临时附加项。我们提出了一种新的动态引力模型估计方法，该方法明确考虑持续性。在实证上，我们表明忽略持续性会使标准引力估计严重低估贸易政策变化的影响。作为一个应用，我们发现一旦考虑持续性，区域贸易协定估计的贸易影响可能增加30%或更多。", "tags": ["贸易政策", "贸易协定", "方法论"], "extra": {"scholar_name": "Dennis Novy", "work_type": "report", "doi": "10.65864/ldfvo7porn"}}, {"uid": "oa:W7148276988", "source": "scholar", "title": "The local-area incidence of exporting", "authors": "Christoph E. Boehm, Aaron B. Flaaen, Nitya Pandalai-Nayar, Jan Schlupp", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104257", "date": "2026-04-02", "abstract": "", "summary_zh": "研究出口对地方区域的影响，利用地方层面数据识别出口冲击的本地效应。", "title_zh": "出口的本地影响", "abstract_zh": "", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "Aaron Flaaen", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104257", "versions": ["scholar"]}}, {"uid": "oa:W7154021996", "source": "scholar", "title": "Tariffs in 2025: Short-Run Impacts on the U.S. Economy", "authors": "Pablo Fajgelbaum, Amit Khandelwal", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35064", "date": "2026-04-01", "abstract": "In 2025, the U.S. raised average tariff duties from 2.4% to 9.6%, bringing protectionism to its highest level in eighty years. We explore the structure of these tariffs, estimate their short-run impacts, and summarize the growing literature on their effects. Across trade partners, the tariffs are correlated with trade deficits but not with geopolitical or strategic industrial goals, other than targeting China. In our baseline estimate, 90% of the tariffs are passed through to tariff-inclusive prices paid by U.S. importers. Incorporating the estimated price and trade responses into a static trade framework, we find an overall welfare impact ranging from a loss of 0.13% of GDP to a gain of 0.10%. These small net welfare impacts reflect sizable consumption losses roughly offset by income and revenue gains, with their sign hinging on whether U.S. terms-of-trade adjusted (on which the data are inconclusive). Among their stated rationales, the tariffs have been effective at raising federal revenue and diverting trade from China. However, it remains uncertain whether they will reduce the trade deficit, lower prices set by foreign exporters, promote manufacturing jobs, increase “friend-shoring” among aligned countries, or reshore key sectors; evidence from 2018-19 and 2025 indicators suggests a narrow path towards achieving these goals. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "本文分析2025年美国关税结构并估算短期影响，发现净福利效应约在GDP的-0.13%至+0.10%之间。", "title_zh": "2025年关税：对美国经济的短期影响", "abstract_zh": "2025年，美国将平均关税税率从2.4%提高至9.6%，使保护主义达到八十年来的最高水平。我们考察这些关税的结构，估计其短期影响，并总结关于其效应的日益增多的文献。就各贸易伙伴而言，这些关税与贸易逆差相关，但与地缘政治或战略产业目标不相关，针对中国除外。在我们的基准估计中，90%的关税被转嫁到美国进口商支付的含关税价格中。将估计的价格和贸易反应纳入一个静态贸易框架后，我们发现总体福利影响介于GDP损失0.13%至收益0.10%之间。这些较小的净福利影响反映出相当大的消费损失被收入和财政收入收益大致抵消，其正负取决于美国贸易条件是否调整（数据对此尚无定论）。在其陈述的理由中，这些关税有效提高了联邦财政收入并使贸易从中国转移。然而，它们是否会减少贸易逆差、压低外国出口商设定的价格、促进制造业就业、增加结盟国家之间的“友岸外包”，或使关键部门回流，仍不确定；来自2018-19年和2025年指标的证据表明，实现这些目标的道路狭窄。NBER工作论文系列的机构订户以及发展中国家居民可在www.nber.org免费下载本文，无需额外付费。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Pablo Fajgelbaum", "work_type": "report", "doi": "10.3386/w35064", "versions": ["nber"]}}, {"uid": "oa:W7149251346", "source": "scholar", "title": "Global Imbalances, Industrial Policy and Tariffs", "authors": "Pierre‐Olivier Gourinchas, Gene Joseph Kindberg-Hanlon, Manasa Patnam, Lorenzo Rotunno, Michèle Ruta", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9781475563931.001", "date": "2026-04-01", "abstract": "Global imbalances denote the distribution of countries’ current account balances, identically equal to the difference between two forward-looking aggregate variables: national savings and domestic investment. Industrial and trade policies have traditionally not been considered important drivers of aggregate savings or investment, and therefore of current account balances. The former because most industrial policies are small in scope; the latter because permanent tariffs have no intertemporal effect in the textbook model, with an offsetting appreciation of the real exchange rate. The rapidly growing use of both industrial and trade policies in recent years calls for a reassessment. This paper presents a framework to think about the role of both policies. For industrial policy, we make the important distinction between the traditional sector-specific policies via subsidies or other targeted instruments (‘micro IP’) and broader policies (‘macro IP’) that aim to promote industrial developments and competitiveness through the deployment of more aggregate instruments such as financial repression, foreign reserve accumulation, or capital controls. A key finding is that ‘micro IP’ tends to increase external balances if it fails to raise aggregate productivity. By contrast, ‘macro IP’ can, under some conditions, boost the current account, forcing other countries to adjust. Yet, these policies often come at the cost of suppressed domestic consumption and possibly domestic welfare. Our analysis confirms that tariffs are a weak tool to improve current account balances. Finally, traditional macroeconomic drivers—such as fiscal policy, demographics or credit cycles—remain critical drivers of global imbalances, especially for the US and China.", "summary_zh": "构建框架分析产业政策与关税对全球失衡的影响，发现产业政策可扩大或改善外部失衡，关税改善经常账户作用有限。", "title_zh": "全球失衡、产业政策与关税", "abstract_zh": "全球失衡指各国经常账户余额的分布，其恒等于两个前瞻性总量变量之差：国民储蓄与国内投资。产业政策和贸易政策传统上未被视作总储蓄或总投资的重要驱动因素，因而也未被视为经常账户余额的重要驱动因素。前者是因为大多数产业政策范围较小；后者是因为在教科书模型中，永久性关税没有跨期效应，实际汇率升值会予以抵消。近年来，产业政策和贸易政策的使用都在迅速增长，这要求重新评估。本文提出一个框架来思考这两种政策的作用。就产业政策而言，我们作出一项重要区分：通过补贴或其他定向工具实施的传统部门特定政策（“微观产业政策”）与更广泛的政策（“宏观产业政策”），后者旨在通过运用金融抑制、外汇储备积累或资本管制等更为总量性的工具来促进产业发展和竞争力。一个关键发现是，如果‘微观产业政策’未能提高总体生产率，它往往会增加外部余额。相比之下，‘宏观产业政策’在某些条件下能够提振经常账户，迫使其他国家进行调整。然而，这些政策往往以国内消费受抑制、并可能以国内福利受损为代价。我们的分析证实，关税是改善经常账户余额的一种弱工具。最后，传统宏观经济驱动因素——如财政政策、人口结构或信贷周期——仍然是全球失衡的关键驱动因素，尤其是对美国和中国而言。", "tags": ["关税", "产业政策", "贸易政策"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.5089/9781475563931.001"}}, {"uid": "oa:W4406629894", "source": "scholar", "title": "Trade and the End of Antiquity", "authors": "Johannes Boehm, Thomas Chaney", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35156", "date": "2026-04-01", "abstract": "What was the role of trade, and how did economic activity evolve at the End of Antiquity, when political power shifts away from the Mediterranean towards northern Europe and the Middle East? To answer those questions, we assemble a database of hundreds of thousands of ancient coins from the fourth to the tenth century, estimate a dynamic model of trade and money where coins gradually diffuse along trade routes, and recover granular regional trade and real consumption time series. Our estimates suggest that: Mediterranean trade was disrupted by the newly formed border between Islam and Christianity; economic activity shifts away from the Mediterranean starting in the fifth century; real consumption peaks in the Middle East in the eighth century; and by the end of the ninth century, Atlantic regions from Islamic Spain to Frankish northwestern Europe have become the wealthiest regions of the ancient western world. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "利用数十万古钱币与动态贸易—货币模型，发现伊斯兰—基督教边界扰乱地中海贸易并推动经济重心转移。", "title_zh": "贸易与古代晚期的终结", "abstract_zh": "在政治权力从地中海转向北欧和中东的古典时代末期，贸易发挥了什么作用，经济活动又如何演变？为回答这些问题，我们构建了一个包含4世纪至10世纪数十万枚古钱的数据库，估计了一个贸易与货币的动态模型，其中硬币沿贸易路线逐渐扩散，并复原了细粒度的区域贸易和实际消费时间序列。我们的估计表明：地中海贸易因伊斯兰教与基督教之间新形成的边界而受到扰乱；经济活动自5世纪开始从地中海转移；实际消费在8世纪于中东达到峰值；到9世纪末，从伊斯兰西班牙到法兰克西北欧的大西洋地区已成为古代西方世界最富裕的地区。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["贸易史"], "extra": {"scholar_name": "Thomas Chaney", "work_type": "report", "doi": "10.3386/w35156"}}, {"uid": "nber:w35078", "source": "nber", "title": "The “Peace Dividend” of International Trade: A New Empirical Approach", "authors": "Ling Feng, Qiuyue Huang, Zhiyuan Li, Christopher M. Meissner", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35078", "date": "2026-04-01", "abstract": "This paper investigates the causal impact of international trade on interstate military conflicts using global bilateral data from 1962 to 2014. To address endogeneity concerns, we exploit exogenous spatial-temporal variation in international trade stemming from technological advances in air relative to maritime transport. Empirical results demonstrate a strong “peace dividend” of international trade: that is, increased trade significantly reduces the probability and intensity of conflicts between nations. This effect remains robust across specifications and withstands a wide range of potential confounders. Such findings highlight how economic interdependence shapes international conflict, a relationship that is especially relevant amid escalating geopolitical tensions and the global shift toward “decoupling”, “de-risking”, and greater trade protectionism. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "利用1962—2014年双边数据与航空相对海运技术进步的外生变异，发现贸易增加显著降低国家间冲突概率与强度。", "title_zh": "国际贸易的“和平红利”：一种新的实证方法", "abstract_zh": "本文利用1962年至2014年的全球双边数据，考察国际贸易对国家间军事冲突的因果影响。为处理内生性问题，我们利用国际贸易中由航空相对于海运的技术进步所产生的外生时空变化。实证结果表明，国际贸易存在显著的“和平红利”：也就是说，贸易增加会显著降低国家间冲突的概率和强度。这一效应在不同模型设定下保持稳健，并经受住一系列广泛的潜在混杂因素。此类发现凸显了经济相互依存如何塑造国际冲突，而这一关系在地缘政治紧张局势升级以及全球转向“脱钩”、“去风险”和更强贸易保护主义的背景下尤其具有相关性。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["其他"], "extra": {"nber_id": "W35078", "keyword_hit": "international trade"}}, {"uid": "nber:w35076", "source": "nber", "title": "Tariffs and the Term Structure of Inflation Expectations", "authors": "Stéphane Auray A, Michael B. Devereux, Anthony M. Diercks, Aurélien Eyquem, Joon Hwa Kim", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35076", "date": "2026-04-01", "abstract": "Inflation expectations derived from financial markets exhibited unprecedented dynamics in 2025: the correlation between one-year inflation swaps and one-year-ahead one-year forward rates turned significantly negative for the first time on record.We show that this decoupling occurred primarily on days when tariff news dominated market pricing, using a two-stage event classification validated by Bloomberg news trends.Standard small open-economy New Keynesian models in which tariffs generate a one-time price-level increase imply positive comovement across horizons and cannot explain this pattern.We explain these occurrences through the lens of an amended small open-economy New Keynesian model.Three ingredients prove critical for reproducing the observed negative conditional correlation between spot and forward inflation after tariff shocks: targeting year-on-year inflation, substantial interest-rate inertia, and persistent tariffs.Under empirically plausible calibrations, the model generates a negative correlation conditional on tariff shocks while preserving a positive unconditional correlation, suggesting that the 2025 twist in the term structure reflects expectations of a persistent policy response to trade shocks.", "summary_zh": "本文用事件分类和开放经济新凯恩斯模型，发现持续关税冲击可解释2025年通胀预期期限结构的负相关异象。", "title_zh": "关税与通胀预期的期限结构", "abstract_zh": "源自金融市场的通胀预期在2025年表现出前所未有的动态：一年期通胀互换与一年后的一年期远期利率之间的相关性首次在有记录以来转为显著负值。我们使用经Bloomberg新闻趋势验证的两阶段事件分类表明，这种脱钩主要发生在关税新闻主导市场定价的日子里。在关税产生一次性价格水平上升的标准小型开放经济新凯恩斯模型中，这意味着跨期限的正向共同变动，并且无法解释这一模式。我们通过一个修正的小型开放经济新凯恩斯模型来解释这些现象。三个要素被证明对于复现关税冲击后观察到的即期与远期通胀之间的负条件相关性至关重要：以同比通胀为目标、显著的利率惯性以及持续的关税。在经验上合理的校准下，该模型生成以关税冲击为条件的负相关性，同时保持正的无条件相关性，这表明期限结构中的2025年转折反映了对一种持续的……的预期t 对贸易冲击的政策应对。", "tags": ["关税", "贸易政策"], "extra": {"nber_id": "W35076", "keyword_hit": "tariff"}}, {"uid": "nber:w35056", "source": "nber", "title": "The Chinese Current Account Imbalances: Puzzles, Patterns, and Possible Causes", "authors": "Chang Ma, Shang-Jin Wei", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35056", "date": "2026-04-01", "abstract": "China's large current account surplus has been an irritant to its trading partners.While industrial and trade policies often lead to sector-level imbalances, they play a relatively limited role in the economy-wide surplus.Structural factors such as an unbalanced sex ratio and uneven access to financing by state-owned and non-state firms are more important determinants of the current account imbalance.While macroeconomic stimulus can boost imports and reduce the surplus in the short run, any long-term solution would need to involve reforms aiming at addressing the structural problems.", "summary_zh": "解析中国巨额经常账户顺差成因，指出结构性因素比产业贸易政策更关键，短期刺激难治本。", "title_zh": "中国经常账户失衡：谜题、模式与可能成因", "abstract_zh": "中国庞大的经常账户顺差一直是其贸易伙伴的困扰。尽管产业和贸易政策常常导致部门层面失衡，但它们在整体经济顺差中的作用相对有限。性别比失衡以及国有企业和非国有企业融资机会不均等等结构性因素，是经常账户失衡更重要的决定因素。尽管宏观经济刺激可以在短期提振进口并减少顺差，但任何长期解决方案都需要包括旨在解决结构性问题的改革。", "tags": ["贸易政策", "产业政策", "其他"], "extra": {"nber_id": "W35056", "keyword_hit": "import"}}, {"uid": "nber:w35023", "source": "nber", "title": "Tariffs, Global Value Chains, and the Incidence of Protection: Evidence from US Automobiles", "authors": "Luke Heeney, Christopher R. Knittel, Jasdeep Mandia", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35023", "date": "2026-04-01", "abstract": "In many modern industries, firms compete in differentiated-product markets while relying on complex global value chains for intermediate inputs. In such settings, trade policies such as tariffs on vehicles and parts operate not only through consumer substitution and firm pricing, but also through firms’ cost structures and sourcing decisions. We develop a structural model of the U.S. automobile market that integrates random-coefficients demand, multiproduct firm pricing, and a flexible supply-side framework in which shocks to the cost of imported parts transmit imperfectly into manufacturers’ marginal costs. The model is disciplined by novel model-level data on imported-parts exposure and exploits exchange-rate variation to identify cost pass-through. Our counterfactual analysis quantifies the effects of alternative tariff policies on prices, profits, and welfare. First, tariffs on imported vehicles alone reallocate demand toward domestically assembled products and increase U.S. producer surplus, generating a gain of approximately $1 billion for U.S.-headquartered firms, while reducing consumer surplus by about $14 billion. Second, extending tariffs to imported intermediate inputs fundamentally alters these effects: consumer surplus losses roughly double, and producer surplus for U.S.-headquartered firms declines by about $2.6 billion. These aggregate effects mask substantial heterogeneity: firms with greater exposure to imported parts experience losses, whereas those relying more on domestic inputs are better able to increase profits. Overall, the results show that tariff incidence depends critically on firms’ exposure to global value chains and cannot be inferred from final assembly locations alone. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "构建美国汽车市场结构模型，量化整车与零部件关税影响，发现关税归宿取决于全球价值链暴露。", "title_zh": "关税、全球价值链与保护的成本归宿：来自美国汽车业的证据", "abstract_zh": "在许多现代产业中，企业在差异化产品市场上竞争，同时依赖复杂的全球价值链获取中间投入品。在这种背景下，对整车和零部件征收关税等贸易政策，不仅通过消费者替代和企业定价发挥作用，还通过企业的成本结构和采购决策发挥作用。我们构建了一个美国汽车市场的结构模型，该模型整合了随机系数需求、多产品企业定价，以及一个灵活的供给侧框架；在该框架中，进口零部件成本冲击不完全传导至制造商的边际成本。该模型由关于进口零部件暴露度的新颖车型层面数据加以约束，并利用汇率变动来识别成本传导。我们的反事实分析量化了替代性关税政策对价格、利润和福利的影响。首先，仅对进口整车征收关税会使需求重新配置到国内组装产品，并提高美国生产者剩余，为总部位于美国的企业带来约10亿美元的收益，同时使消费者剩余减少约140亿美元。第二，将关税扩大至进口中间投入品会从根本上改变这些效应：消费者剩余损失大致翻倍，总部位于美国的企业生产者剩余下降约26亿美元。这些总体效应掩盖了显著的异质性：对进口零部件暴露程度更高的企业会遭受损失，而更多依赖国内投入品的企业则更有能力增加利润。总体而言，结果表明，关税归宿关键取决于企业对全球价值链的暴露程度，不能仅从最终组装地点推断。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org无需额外付费下载本文。", "tags": ["关税", "全球价值链", "贸易政策"], "extra": {"nber_id": "W35023", "keyword_hit": "tariff"}}, {"uid": "oa:W7147058446", "source": "scholar", "title": "Globalization and the gender gap in mental well-being", "authors": "Björn Thor Arnarson, Asker Nygaard David, Beata Smarzynska Javorcik, Jakob Roland Munch", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104253", "date": "2026-03-31", "abstract": "Working with business partners in distant countries often requires operating outside standard working hours, potentially harming workers’ mental well-being—especially for women balancing professional and family responsibilities. This hypothesis is investigated using matched employer-employee data from Denmark merged with information on workers’ use of prescription antidepressants (AD) and firms’ import and export transactions. The analysis exploits variation within job spells and controls for both unobservable firm-year heterogeneity and for the average differential in annual AD use among men and women. The results indicate that a decline in the business hour overlap between a Danish firm and its foreign trading partners leads to an increased AD use among women relative to men. This effect is economically meaningful, largest for college-educated workers under 45 and more pronounced for single mothers. In addition to the gender effect, workers in occupations requiring establishing relationships with others are more strongly affected than those in other occupations.", "summary_zh": "利用丹麦雇主-雇员及进出口数据，发现与外国伙伴营业时间重叠下降使女性抗抑郁药使用相对增加。", "title_zh": "全球化与心理健康中的性别差距", "abstract_zh": "与遥远国家的商业伙伴合作往往需要在标准工作时间之外工作，这可能损害劳动者的心理健康——对于平衡职业与家庭责任的女性尤其如此。本文使用丹麦匹配的雇主—雇员数据，并将其与劳动者处方抗抑郁药（AD）使用信息以及企业进出口交易信息合并，来研究这一假说。分析利用工作任期内的变异，并同时控制不可观察的企业—年份异质性以及男女年度AD使用量的平均差异。结果表明，一家丹麦企业与其外国贸易伙伴之间营业时间重叠的减少，会导致女性相对于男性的AD使用增加。这一效应具有经济意义，对45岁以下受过大学教育的劳动者最大，对单身母亲更为明显。除性别效应外，需要与他人建立关系的职业中的劳动者比其他职业中的劳动者受到更强影响。", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104253"}}, {"uid": "oa:W7142062546", "source": "scholar", "title": "The Environmental Consequences of Import Source: Theory and Evidence From Chinese Emissions", "authors": "Haichao Fan, Ling‐Yun He, Geng Huang, Xi Lin", "venue": "World Economy", "url": "https://doi.org/10.1111/twec.70082", "date": "2026-03-27", "abstract": "ABSTRACT Existing studies on trade and the environment typically distinguish only between exports and imports, overlooking the heterogeneity of trading partners. As global trade becomes more complex, standard theories fail to explain how trade wit
