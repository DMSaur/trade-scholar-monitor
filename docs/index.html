h different countries affects environmental outcomes. This paper develops a theoretical model and employs firm‐level data from Chinese manufacturing enterprises, using a Propensity Score Matching‐Difference in Differences (PSM‐DID) approach to identify how the source of imported intermediates affects firms' pollution emissions. We find that importing intermediates from high‐tech countries enhances productivity and promotes greater investment in pollution abatement, leading to a larger reduction in emission intensity compared to imports from low‐tech countries. However, the scale expansion associated with importing offsets these improvements, leaving total emissions largely unchanged. Our results highlight the importance of accounting for the heterogeneity of import source countries when assessing the environmental consequences of international trade.", "summary_zh": "用PSM-DID和企业数据研究进口中间品来源对污染排放的影响，发现高技来源降低排放强度，但规模扩张使总排放基本不变。", "title_zh": "进口来源的环境后果：基于中国排放的理论与证据", "abstract_zh": "摘要 现有关于贸易与环境的研究通常只在出口与进口之间作出区分，忽视了贸易伙伴的异质性。随着全球贸易日益复杂，标准理论无法解释与不同国家之间的贸易如何影响环境结果。本文构建了一个理论模型，并采用中国制造业企业的企业层面数据，使用倾向得分匹配-双重差分（PSM-DID）方法，识别进口中间品的来源如何影响企业的污染排放。我们发现，从高技术国家进口中间品会提高生产率，并促进对污染治理的更多投资，与从低技术国家进口相比，这会带来更大的排放强度下降。然而，与进口相关的规模扩张抵消了这些改善，使总排放基本保持不变。我们的结果凸显了在评估国际贸易的环境后果时考虑进口来源国异质性的重要性。", "tags": ["供应链", "企业异质性", "其他"], "extra": {"scholar_name": "樊海潮", "work_type": "article", "doi": "10.1111/twec.70082"}}, {"uid": "oa:W7162188908", "source": "scholar", "title": "An economic perspective on the ‘reciprocal tariffs’", "authors": "Gene M. Grossman, Alan O'Neil Sykes", "venue": "Journal of International Economic Law", "url": "https://doi.org/10.1093/jiel/jgag013", "date": "2026-03-26", "abstract": "Abstract This article considers the economic foundation for the Trump administration’s 2025 Executive Order imposing ‘reciprocal tariffs’ under the International Emergency Economic Powers Act (IEEPA). The analysis in the Executive Order rests on numerous historical and economic fallacies, some rather subtle. They undermine each step in the logic of the Executive Order. An understanding of the errors in its logic exposes important flaws in contemporary discourse about US trade and thus has implications that extend well beyond the dispute over the President’s powers under IEEPA. We also address and critique the use of Section 122 of the 1974 Trade Act as a substitute for the IEEPA tariffs.", "summary_zh": "文章分析2025年对等关税行政令的经济逻辑，指出其多重谬误并批评以《1974年贸易法》第122条替代IEEPA关税。", "title_zh": "对“对等关税”的经济学视角", "abstract_zh": "摘要 本文考察特朗普政府2025年依据《国际紧急经济权力法》（IEEPA）实施“对等关税”的行政令的经济基础。该行政令中的分析建立在大量历史与经济谬误之上，其中一些相当微妙。这些谬误削弱了该行政令逻辑的每一步。理解其逻辑中的错误，揭示了当代关于美国贸易的讨论中的重要缺陷，因而其影响远远超出关于总统在IEEPA下权力的争议。我们还讨论并批判了将1974年《贸易法》第122条用作IEEPA关税替代方案的做法。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Gene Grossman", "work_type": "article", "doi": "10.1093/jiel/jgag013"}}, {"uid": "oa:W7140161320", "source": "scholar", "title": "Trade in appliances, household production, and labor force participation", "authors": "Pamela Medina, Sebastian Sotelo, Daniel Velasquez-Cabrera", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104241", "date": "2026-03-24", "abstract": "We examine how trade influences female labor supply through reductions in the prices of household appliances that substitute for domestic labor. Using a comprehensive data set from 1981 to 2017, which includes four population censuses, household surveys, and customs records from Peru, we show that labor force participation rose at the same time that appliance import prices fell. We then develop and estimate a dynamic general equilibrium model of trade and household production, to quantitatively evaluate the aggregate impact of declining appliance prices. We find that the reduction in appliance prices during the sample period leads to an increase in female labor force participation that explains one-tenth of the total rise in female labor participation in Peru over the past 30 years. However, the gender wage gap widens by approximately 3 percentage points in response to these changes.", "summary_zh": "用秘鲁数据和动态一般均衡模型研究家电贸易，发现家电价格下降提高女性劳动参与，却扩大性别工资差距。", "title_zh": "家电贸易、家庭生产与劳动参与", "abstract_zh": "我们考察贸易如何通过降低替代家务劳动的家用电器的价格来影响女性劳动供给。我们使用1981年至2017年的一套综合数据集——其中包括秘鲁的四次人口普查、家庭调查和海关记录——表明在电器进口价格下降的同时，劳动力参与率上升。随后，我们构建并估计了一个贸易与家庭生产的动态一般均衡模型，以定量评估家电价格下降的总体影响。我们发现，样本期内家电价格的下降导致女性劳动参与率上升，这解释了过去30年秘鲁女性劳动参与率总升幅的十分之一。然而，性别工资差距因这些变化而扩大约3个百分点。", "tags": ["劳动力市场"], "extra": {"scholar_name": "Sebastian Sotelo", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104241"}}, {"uid": "oa:W7139969069", "source": "scholar", "title": "Agricultural imports, labor mobility, and welfare", "authors": "Guanzu Ding, Haichao Fan, Rui Li, Huanhuan Wang, Xican Xi", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104256", "date": "2026-03-21", "abstract": "", "summary_zh": "无摘要；据标题考察农业进口、劳动力流动与福利的关系。", "title_zh": "农业进口、劳动力流动与福利", "abstract_zh": "", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "樊海潮", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104256"}}, {"uid": "oa:W7138939878", "source": "scholar", "title": "Replication Package for: \"Firm-to-Firm Trade: Imports, Exports, and the Labor Market\"", "authors": "Samuel S. Kortum, Jonathan Eaton, Françis Kramarz", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "url": "https://doi.org/10.5281/zenodo.18987000", "date": "2026-03-17", "abstract": "\"Firm-to-Firm Trade: Imports, Exports, and the Labor Market\" by Jonathan Eaton, Samuel Kortum, and Francis Kramarz, conditionally accepted at Econometrica. This repository contains the replication package for \"Firm-to-Firm Trade: Imports, Exports, and the Labor Market\" by Jonathan Eaton, Samuel Kortum, and Francis Kramarz. Jingze Dong, Adaolisa Ezekobe, Etienne Guigue, Lorenzo Kaaks, Tanay Kondiparthy, Titouan Le Calvé, Gautier Lenfant, Lixing Liang, Jonathan Libgober, Alexis Maitre, Berengere Patault, Max Perez Leon, and Laurence Wicht provided excellent research assistance at different stages that allowed this package to be created. The code in this replication package constructs the analysis files from confidential firm-level data matched to individual customers in each country of the European Union (EU). The package includes all non-confidential data used in the analysis including non-confidential moments generated from the confidential CASD (Centre d’Accès Sécurisé aux Données) data.", "summary_zh": "该复制包基于欧盟企业-客户匹配数据构建分析文件，支撑企业间进出口与劳动力市场研究。", "title_zh": "《企业间贸易：进口、出口与劳动力市场》复制包", "abstract_zh": "《企业间贸易：进口、出口与劳动力市场》，作者 Jonathan Eaton、Samuel Kortum 和 Francis Kramarz，已被《Econometrica》有条件接受。该存储库包含 Jonathan Eaton、Samuel Kortum 和 Francis Kramarz 所著《企业间贸易：进口、出口与劳动力市场》的复现包。Jingze Dong、Adaolisa Ezekobe、Etienne Guigue、Lorenzo Kaaks、Tanay Kondiparthy、Titouan Le Calvé、Gautier Lenfant、Lixing Liang、Jonathan Libgober、Alexis Maitre、Berengere Patault、Max Perez Leon 和 Laurence Wicht 在不同阶段提供了出色的研究协助，使该复现包得以创建。该复现包中的代码使用匹配到欧洲联盟（EU）每个国家个体客户的机密企业层面数据构建分析文件。该包包含分析中使用的所有非机密数据，包括由机密 CASD（Centre d’Accès Sécurisé aux Données）数据生成的非机密矩。", "tags": ["企业异质性", "劳动力市场"], "extra": {"scholar_name": "Jonathan Eaton", "work_type": "software", "doi": "10.5281/zenodo.18987000"}}, {"uid": "oa:W7136749424", "source": "scholar", "title": "Shared Prosperity in a Fractured World", "authors": "Dani Rodrik", "venue": "Ekonomista", "url": "https://doi.org/10.52335/ekon/217695", "date": "2026-03-16", "abstract": "", "summary_zh": "在全球化碎片化背景下探讨共享繁荣的挑战与政策路径。", "title_zh": "碎片化世界中的共享繁荣", "abstract_zh": "", "tags": ["贸易政策", "产业政策"], "extra": {"scholar_name": "Dani Rodrik", "work_type": "article", "doi": "10.52335/ekon/217695", "versions": ["scholar"]}}, {"uid": "oa:W7135019850", "source": "scholar", "title": "Trade Partners’ Responses to US Tariffs", "authors": "Lorenzo Rotunno, Michèle Ruta", "venue": "IMF Economic Review", "url": "https://doi.org/10.1057/s41308-026-00304-6", "date": "2026-03-12", "abstract": "", "summary_zh": "考察贸易伙伴对美国关税的应对措施及其经济影响。", "title_zh": "贸易伙伴对美国关税的反应", "abstract_zh": "", "tags": ["关税", "贸易政策", "贸易战"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.1057/s41308-026-00304-6"}}, {"uid": "oa:W7134930921", "source": "scholar", "title": "Migrant Tastes and Merchandise Trade: Evidence From China", "authors": "Tiankuo Han, Yushan Hu, Maozhen Wu, Penglong Zhang", "venue": "World Economy", "url": "https://doi.org/10.1111/twec.70066", "date": "2026-03-10", "abstract": "ABSTRACT Existing studies on domestic trade tend to ignore differences in consumer taste. This study embeds migrant taste bias into a structural gravity model. Market tastes vary according to migrant taste biases. Using data on interprovincial manufacturing trade and migration in China, this study estimates home bias in migrants' tastes. The results indicate that, for each dollar of total expenditure, consumers spend 46 cents more on products from their home province than a hypothetical, unbiased consumer would, all else equal. The migrant taste bias is robust, even after controlling for assimilation effects and alternative non‐preference mechanisms. The taste bias could explain the trade bias more than the trade cost. Counterfactual experiments show that anti‐migration policies significantly impede trade with migrants' provinces of origin, and that migrants' taste assimilation improves local consumers' welfare.", "summary_zh": "将移民口味偏好嵌入结构引力模型，利用中国省际制造业贸易与迁移数据，发现移民家乡偏好显著影响贸易并评估反移民政策。", "title_zh": "移民口味与商品贸易：来自中国的证据", "abstract_zh": "摘要：关于国内贸易的现有研究往往忽视消费者口味的差异。本研究将迁移者口味偏误嵌入结构引力模型。市场口味随迁移者口味偏误而变化。利用中国省际制造业贸易和迁移数据，本研究估计迁移者口味中的家乡偏好。结果表明，在总支出每1美元中，消费者在来自其家乡省份的产品上的支出比一个假想的、无偏的消费者多46美分，其他条件不变。即使在控制同化效应和替代性非偏好机制之后，迁移者口味偏误仍然是稳健的。口味偏误对贸易偏误的解释力可能超过贸易成本。反事实实验表明，反迁移政策显著阻碍与迁移者原籍省份的贸易，并且迁移者的口味同化改善了本地消费者的福利。", "tags": ["劳动力市场", "方法论", "其他"], "extra": {"scholar_name": "张鹏龙", "work_type": "article", "doi": "10.1111/twec.70066"}}, {"uid": "oa:W7143474391", "source": "scholar", "title": "Using Global Shocks to Understand the Level and Structure of Executive Compensation", "authors": "David Hummels, Jakob Roland Munch, Huilin Zhang", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35004", "date": "2026-03-01", "abstract": "We build a model of CEO compensation that unites principal-agent and assignment models in the face of trade shocks that interact with CEO effort.The model predicts that trade shocks change CEO compensation through scale, volatility, and ability-magnification channels.Using Danish matched worker-firm data, we find empirical support for these channels: (1) Exogenous shocks to trade increase the size and value of the firm and CEO compensation; (2) the share of firm value paid to the CEO is increasing in the size and value of the firm and increasing in the volatility induced by global shocks;(3) Higher-ability CEOs generate increases in firm value that are more than 100 times greater than their compensation, through a combination of mitigating losses and maximizing the return to positive shocks.", "summary_zh": "构建委托代理与匹配模型，用丹麦数据发现贸易冲击通过规模、波动和能力放大渠道提高CEO薪酬。", "title_zh": "利用全球冲击理解高管薪酬的水平与结构", "abstract_zh": "我们构建了一个CEO薪酬模型，该模型在面对与CEO努力相互作用的贸易冲击时，将委托—代理模型与指派模型结合起来。该模型预测，贸易冲击通过规模、波动性和能力放大渠道改变CEO薪酬。使用丹麦工人—企业匹配数据，我们发现了对这些渠道的经验支持：（1）外生贸易冲击增加企业规模和企业价值以及CEO薪酬；（2）支付给CEO的企业价值份额随企业规模和企业价值上升而增加，并随全球冲击引发的波动性上升而增加；（3）能力更高的CEO所带来的企业价值增加超过其薪酬的100倍，这是通过减轻损失与最大化正向冲击回报的组合实现的。", "tags": ["企业异质性", "劳动力市场"], "extra": {"scholar_name": "David Hummels", "work_type": "report", "doi": "10.3386/w35004"}}, {"uid": "oa:W7140144868", "source": "scholar", "title": "An 'Austrian' Model of International Specialization", "authors": "Pol Antràs, Adrian Kulesza", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34983", "date": "2026-03-01", "abstract": "A previous version of this paper was entitled \"An 'Austrian' Model of Global Value Chains.\"We thank Robert Stehrer for recommending Janek Wasserman's \"The Marginal Revolutionaries: How Austrian Economists Fought the War of Ideas,\" which served as an initial inspiration for the paper.We are grateful to the Editor, three anonymous referees, and to participants at various institutions for their helpful comments.Carl Christian von Weizsacker and Ivan Werning were particularly instrumental in helping us better understand some of our results", "summary_zh": "构建“奥地利”模型刻画国际专业化与全球价值链分工，为贸易理论提供新解释。", "title_zh": "国际专业化的“奥地利”模型", "abstract_zh": "本文早先版本题为“一个‘奥地利’的全球价值链模型”。我们感谢 Robert Stehrer 推荐 Janek Wasserman 的《边际革命者：奥地利经济学家如何展开思想之战》，该书为本文提供了最初的灵感。我们感谢编辑、三位匿名审稿人以及各机构参与者的有益评论。Carl Christian von Weizsacker 和 Ivan Werning 在帮助我们更好地理解我们的一些结果方面尤其发挥了关键作用。", "tags": ["全球价值链"], "extra": {"scholar_name": "Pol Antras", "work_type": "report", "doi": "10.3386/w34983", "versions": ["scholar"]}}, {"uid": "oa:W7136098294", "source": "scholar", "title": "Quantifying the Trade Impact of SPS and TBTs with Product-level Structural Gravity", "authors": "Fabio Artuso, Julian Latimer Clarke, Lionel Fontagné, Mahdi Ghodsi, Santoni, Gianluca", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://openalex.org/W7136098294", "date": "2026-03-01", "abstract": "Non-tariff measures (NTMs), particularly sanitary and phytosanitary measures (SPS) and technical barriers to trade (TBTs), have become essential components of climate, industrial, and regulatory policies and affect the majority of global trade. However, it is generally challenging to quantify their effects on trade using a standard gravity model, due to their generally non-discriminatory nature. Using a multistage structural gravity estimation strategy combined with a control-function correction for endogeneity, we estimate the trade elasticities and ad valorem equivalents of NTMs at the HS6 level for over 5,000 products. Our results reveal significant heterogeneity in tariff-equivalent NTM effects, especially in environmentally relevant sectors, such as clean technologies and electric vehicles. These estimates can inform regulatory impact assessments and general-equilibrium analyses of climate-aligned trade policies.", "summary_zh": "基于HS6产品层面结构引力模型，估计SPS/TBT的贸易弹性与从价等值，发现环境相关行业异质性显著。", "title_zh": "用产品层面结构引力模型量化SPS与TBT的贸易影响", "abstract_zh": "非关税措施（NTMs），尤其是卫生与植物卫生措施（SPS）和技术性贸易壁垒（TBTs），已成为气候、产业和监管政策的重要组成部分，并影响全球贸易的多数。然而，由于其通常具有非歧视性质，使用标准引力模型量化其对贸易的影响通常具有挑战性。我们采用多阶段结构引力估计策略，并结合对内生性的控制函数校正，估计了超过5,000种产品在HS6层面的贸易弹性和非关税措施的从价等值。我们的结果揭示了关税等值非关税措施效应存在显著异质性，尤其是在环境相关部门，如清洁技术和电动汽车。这些估计可为监管影响评估以及对与气候目标一致的贸易政策的一般均衡分析提供信息。", "tags": ["贸易政策", "贸易弹性", "方法论"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "preprint", "doi": ""}}, {"uid": "oa:W7135160346", "source": "scholar", "title": "Air Service Agreements, Connectivity and Emissions", "authors": "Lionel Fontagné, Cristina Mitaritonna, Gianluca Orefice, Gianluca Santoni", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://openalex.org/W7135160346", "date": "2026-03-01", "abstract": "The average energy efficiency of the aviation sector has increased by 2.7 percent per year since 2012, falling short of the 6 percent increase in demand. Optimizing routes by reducing the number of legs per flight is one way to complement technological advances in aircraft and fuels to reduce aviation's environmental footprint. The signature of Air Service Agreements (ASAs) allows airlines to reorganize their flight routes. They reshape the international route network in a more efficient way and ultimately reduce CO 2 emissions per passenger. On the other hand, ASAs increase the demand for international flights, which may offset the reduction in overall CO 2 emissions by airlines. Using unique data on airline tickets and ASAs in force during the period 2012-2019, we show that the considerable reduction in per-passenger CO 2 emissions due to the re-organization of international flight routes induced by ASAs is overcompensated by the additional demand for less time-consuming and, hence, more comfortable international flights.", "summary_zh": "研究航空服务协定如何通过重组国际航线影响CO2排放，发现人均排放下降被新增国际航班需求抵消。", "title_zh": "航空服务协定、连通性与排放", "abstract_zh": "航空业的平均能源效率自2012年以来每年提高2.7%，低于需求6%的增长。通过减少每航班航段数来优化航线，是补充飞机和燃料技术进步以减少航空环境足迹的一种方式。航空服务协定（ASAs）的签署使航空公司能够重组其航班航线。它们以更高效的方式重塑国际航线网络，并最终减少每位乘客的CO2排放。另一方面，ASAs增加了对国际航班的需求，这可能抵消航空公司CO2总排放的减少。使用2012-2019年期间机票和生效的ASAs的独特数据，我们表明，由ASAs引致的国际航班航线重组所带来的每位乘客CO2排放的显著减少，被对耗时更短、因而更舒适的国际航班的额外需求所过度补偿。", "tags": ["贸易协定", "贸易政策"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "preprint", "doi": ""}}, {"uid": "oa:W7133255188", "source": "scholar", "title": "Online Appendix - The US-China Trade War Creates Jobs (Elsewhere)", "authors": "Pedro Molina Ogeda, Emanuel Ornelas, Tiago V. de V. Cavalcanti", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "url": "https://doi.org/10.5281/zenodo.18840018", "date": "2026-03-01", "abstract": "Online Appendix - The US-China Trade War Creates Jobs (Elsewhere)", "summary_zh": "研究美中贸易战对第三方国家就业的影响，发现贸易转移在别处创造就业。", "title_zh": "在线附录——美中贸易战在别处创造就业", "abstract_zh": "在线附录——中美贸易战创造就业（在其他地方）", "tags": ["贸易战", "劳动力市场", "贸易政策"], "extra": {"scholar_name": "Emanuel Ornelas", "work_type": "article", "doi": "10.5281/zenodo.18840018"}}, {"uid": "oa:W7133185139", "source": "scholar", "title": "Replication Package for \"The US-China Trade War Creates Jobs (Elsewhere)\"", "authors": "Pedro Molina Ogeda, Emanuel Ornelas, Tiago V. de V. Cavalcanti", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "url": "https://doi.org/10.5281/zenodo.18835501", "date": "2026-03-01", "abstract": "Replication files for paper \"The US-China Trade War Creates Jobs (Elsewhere)\" (Cavalcanti, Ogeda, and Ornelas).", "summary_zh": "复现包提供美中贸易战对他国就业影响的实证数据与代码，支撑贸易战创造他国就业的发现。", "title_zh": "《美中贸易战在他国创造就业》的复现包", "abstract_zh": "论文《美中贸易战创造了（别处的）就业》的复现文件（Cavalcanti、Ogeda 和 Ornelas）。", "tags": ["贸易战", "贸易政策", "劳动力市场"], "extra": {"scholar_name": "Emanuel Ornelas", "work_type": "article", "doi": "10.5281/zenodo.18835501"}}, {"uid": "oa:W7131846411", "source": "scholar", "title": "Tariffs as Fiscal Policy", "authors": "Kimberly A. Clausing, Maurice Obstfeld", "venue": "National Tax Journal", "url": "https://doi.org/10.1086/739420", "date": "2026-02-27", "abstract": "The year 2025 brought a historic shift in the role of tariffs in the US tax system, as the Trump administration imposed high broad tariffs while Congress simultaneously enacted large income tax cuts. This fiscal shift has important implications. While maintaining tariff rates at autumn 2025 levels would generate large government revenues, such broad tariffs have significant downsides: efficiency losses would approach one-third of revenues raised, the tax system would be less progressive, and tax administration would become more complex. Among their macroeconomic implications, broad tariffs generate a large negative supply shock, raising prices while dampening aggregate activity.", "summary_zh": "分析美国高关税与减税并行的财政影响，发现广泛关税虽增收，但效率损失近收入三分之一、税制累退性增强并形成负供给冲击。", "title_zh": "作为财政政策的关税", "abstract_zh": "2025年，关税在美国税收体系中的作用发生了历史性转变，因为特朗普政府实施了高额且覆盖面广的关税，而国会同时颁布了大规模所得税减税政策。这一财政转变具有重要影响。尽管将关税税率维持在2025年秋季水平将带来大量政府收入，但这种覆盖面广的关税具有显著弊端：效率损失将接近所筹集收入的三分之一，税制将更不具累进性，税收征管将变得更加复杂。在其宏观经济影响中，覆盖面广的关税会造成巨大的负向供给冲击，推高价格，同时抑制总体经济活动。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Maurice Obstfeld", "work_type": "article", "doi": "10.1086/739420"}}, {"uid": "oa:W7167732019", "source": "scholar", "title": "Trade Liberalization and Third-Market Effects", "authors": "Fabrice Defever A, Emanuel Ornelas", "venue": "CESifo", "url": "https://doi.org/10.65864/sduay4j9d2", "date": "2026-02-25", "abstract": "We study how the end of the quota system for textiles and clothing products in the American and European markets on January 1, 2005, affected China’s exports to third countries, where policy was unchanged. Using a difference-in-differences approach, we find that the number of Chinese firms exporting previously restricted products to third countries increased sharply after quota removal. The expansion involved many private firms that exported to neither US-EU markets before nor after 2005. This indicates that the policy shock enhanced China’s role as an export base. Conversely, protectionist shifts in large economies would likely generate sizeable negative third-market effects.", "summary_zh": "用双重差分法研究美欧取消纺织品配额对中国向第三国出口的影响，发现受限产品出口企业数激增、强化中国出口基地地位。", "title_zh": "贸易自由化与第三市场效应", "abstract_zh": "我们研究2005年1月1日美国和欧洲市场纺织品和服装产品配额制度的终止如何影响了中国对政策未发生变化的第三国的出口。使用双重差分方法，我们发现，取消配额后，向第三国出口先前受限产品的中国企业数量急剧增加。这一扩张涉及许多私营企业，这些企业在2005年前和2005年后均未向美欧市场出口。这表明，该政策冲击增强了中国作为出口基地的作用。相反，大型经济体的保护主义转向很可能会产生相当大的负向第三市场效应。", "tags": ["贸易政策", "企业异质性"], "extra": {"scholar_name": "Emanuel Ornelas", "work_type": "report", "doi": "10.65864/sduay4j9d2"}}, {"uid": "oa:W7130922635", "source": "scholar", "title": "US Poison Pills and the Limits of Dual Engagement By Its Trading Partners", "authors": "Simon J. Evenett", "venue": "Journal of World Trade", "url": "https://doi.org/10.54648/trad2026008", "date": "2026-02-23", "abstract": "Recent US-Cambodia and US-Malaysia trade agreements include ‘poison pills’ echoing an earlier precedent, United States-Mexico-Canada Agreement (USMCA). For trading partners navigating intensifying US-China geopolitical rivalry, these provisions complicate hedging strategies. In practice, the bite of these provisions may be less than their formal language suggests. The likely impact of these provisions on trade policy choice depends on country-specific factors including export dependence, alternative market access, and expected treatment by the United States after the termination of any agreement.", "summary_zh": "分析美柬、美马贸易协定“毒丸条款”对贸易伙伴对冲与贸易政策选择的影响，认为实际约束或弱于文本，取决于出口依赖等因素。", "title_zh": "美国“毒丸条款”与贸易伙伴双重接触的限度", "abstract_zh": "最近美国—柬埔寨和美国—马来西亚贸易协定包含“毒丸条款”，与早先的先例《美国—墨西哥—加拿大协定》（USMCA）相呼应。对于应对日益加剧的美中地缘政治竞争的贸易伙伴而言，这些条款使对冲策略复杂化。在实践中，这些条款的实际约束力可能小于其正式措辞所显示的。这些条款对贸易政策选择的可能影响取决于国别因素，包括出口依赖、替代市场准入以及任何协定终止后美国预期给予的待遇。", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Simon Evenett", "work_type": "article", "doi": "10.54648/trad2026008"}}, {"uid": "oa:W7167737199", "source": "scholar", "title": "Did Foreigners Pay America’s Tariffs? Quantity Discounts, Scale Economies and Incomplete Pass-Through", "authors": "Sharat Ganapati, Colin Hottman", "venue": "CESifo", "url": "https://doi.org/10.65864/hofzc2jybb", "date": "2026-02-20", "abstract": "Transaction-level quantity discounts are a pervasive feature of US trade, shaping both price variation and tariff incidence. Using administrative microdata, we show that these discounts reflect transaction-level scale economies rather than market power. Accounting for these micro-level economies resolves a key puzzle: while observed import prices rose one-for-one with 2018-2019 US tariffs, we show this was driven by the loss of scale economies as transaction sizes collapsed. Controlling for this scale effect, the strategic pass-through of tariffs to scale-free prices falls to 60 percent, implying foreign exporters absorbed a significant share of the burden through reduced markups.", "summary_zh": "基于美国交易级微观数据，发现数量折扣源于规模经济；控制交易规模效应后关税传递率约60%，出口商承担显著份额。", "title_zh": "外国人支付了美国的关税吗？数量折扣、规模经济与不完全传递", "abstract_zh": "交易层面的数量折扣是美国贸易的一个普遍特征，既塑造价格变动，也影响关税归宿。利用行政微观数据，我们表明这些折扣反映的是交易层面的规模经济，而非市场势力。将这类微观层面的规模经济纳入考量，解决了一个关键谜题：尽管观察到的进口价格与2018—2019年美国关税一比一上升，我们表明这是由交易规模骤降所导致的规模经济丧失所驱动的。控制这一规模效应后，关税向无规模效应价格的战略性传导降至60%，这意味着外国出口商通过降低加成率吸收了相当大一部分负担。", "tags": ["关税", "贸易政策", "贸易弹性"], "extra": {"scholar_name": "Sharat Ganapati", "work_type": "report", "doi": "10.65864/hofzc2jybb", "versions": ["scholar"]}}, {"uid": "oa:W7128688914", "source": "scholar", "title": "Who Is Paying for the 2025 U.S. Tariffs?", "authors": "Mary Amiti, Chris Flanagan, Sebastian Heise, David Weinstein", "venue": "报告", "url": "https://doi.org/10.59576/lse.20260212", "date": "2026-02-12", "abstract": "Over the course of 2025, the average tariff rate on U.S. imports increased from 2.6 to 13 percent. In this blog post, we ask how much of the tariffs were paid by the U.S., using import data through November 2025. We find that nearly 90 percent of the tariffs’ economic burden fell on U.S. firms and consumers.", "summary_zh": "基于截至2025年11月的进口数据，研究发现近90%的关税经济负担由美国企业和消费者承担。", "title_zh": "谁在为2025年美国关税买单？", "abstract_zh": "在2025年期间，美国进口商品的平均关税税率从2.6%上升到13%。在这篇博客文章中，我们利用截至2025年11月的进口数据，考察美国支付了多少关税。我们发现，近90%的关税经济负担落在了美国企业和消费者身上。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Mary Amiti", "work_type": "report", "doi": "10.59576/lse.20260212"}}, {"uid": "oa:W7202390364", "source": "scholar", "title": "Africa after COVID-19: De-globalisation and Recalibrating Nations’ Growth Prospects", "authors": "Dani Rodrik", "venue": "African Export-Import Bank Serials and Journals", "url": "https://doi.org/10.82529/ciat.6.1.002", "date": "2026-02-03", "abstract": "", "summary_zh": "无摘要；论文讨论新冠疫情后去全球化与非洲国家增长前景的重新校准。", "title_zh": "新冠疫情后的非洲：去全球化与重新校准国家增长前景", "abstract_zh": "", "tags": ["贸易政策", "其他"], "extra": {"scholar_name": "Dani Rodrik", "work_type": "article", "doi": "10.82529/ciat.6.1.002"}}, {"uid": "oa:W7127085665", "source": "scholar", "title": "Private Sanctions and Russia’s Imports", "authors": "Maxim Chupilkin, Beata Smarzynska Javorcik, Aleksandra Peeva, Alexander Plekhanov", "venue": "Comparative Economic Studies", "url": "https://doi.org/10.1057/s41294-025-00269-x", "date": "2026-02-02", "abstract": "", "summary_zh": "考察私人制裁对俄罗斯进口的影响，利用贸易数据识别其抑制效应。", "title_zh": "私人制裁与俄罗斯进口", "abstract_zh": "", "tags": ["制裁", "贸易政策"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "article", "doi": "10.1057/s41294-025-00269-x"}}, {"uid": "oa:W7133222969", "source": "scholar", "title": "The Economics of Tariffs", "authors": "Ralph Ossa, Stephen J. Redding", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34915", "date": "2026-02-01", "abstract": "A central insight from neoclassical economics is that international trade operates like an improvement in production technology. It generates mutual aggregate welfare gains for countries as a whole, but creates winners and losers within countries. Tariffs are a tax on this trading technology and distort the prices faced by domestic consumers and producers. Large countries can use tariffs to improve their terms of trade on world markets. But if all countries try to do so, they can end up with lower welfare than if they cooperated to liberalize trade. Tariffs can be used to redistribute income between the winners and losers from trade within countries. But there can be other more efficient ways to achieve redistribution. Policies to promote economic activity in critical industries can be rationalized based on externalities or national security. But these arguments typically rationalize targeted policies towards those industries and tariffs can be dominated by other policy interventions. Empirical findings from the recent waves of U.S. tariffs suggest that most of the incidence of these tariffs has been borne by U.S. importers, wholesalers, retailers and consumers rather than by foreign exporters. These tariffs have led to a large-scale reorganization of U.S. supply chains away from China to third countries. Although this reorganization has substantially reduced China's share of U.S. imports, the U.S. remains indirectly exposed to China through the imports of these third countries. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "综述关税的福利与分配效应及美国近期关税经验，发现关税多由美国进口商和消费者承担，并推动供应链从中国转移。", "title_zh": "关税经济学", "abstract_zh": "新古典经济学的一个核心洞见是，国际贸易的运行方式类似于生产技术的改进。它为国家整体带来相互的总体福利收益，但在一国内部制造赢家和输家。关税是对这种贸易技术征税，并扭曲国内消费者和生产者所面对的价格。大国可以利用关税改善其在世界市场上的贸易条件。但如果所有国家都试图这样做，它们最终可能比合作实现贸易自由化时拥有更低的福利。关税可用于在各国内部贸易的赢家和输家之间进行收入再分配。但可能存在其他更有效的实现再分配的方式。促进关键产业经济活动的政策可以基于外部性或国家安全而被合理化。但这些论点通常使针对这些产业的有针对性政策合理化，而关税可能被其他政策干预所支配。来自近期美国关税浪潮的经验发现表明，这些关税的大部分税负一直由美国承担。进口商、批发商、零售商和消费者，而非外国出口商。这些关税导致美国供应链大规模重组，从中国转向第三国。尽管这一重组大幅降低了中国在美国进口中的份额，但美国仍通过这些第三国的进口间接暴露于中国。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["关税", "贸易政策", "供应链"], "extra": {"scholar_name": "Stephen Redding", "work_type": "report", "doi": "10.3386/w34915"}}, {"uid": "oa:W7131081016", "source": "scholar", "title": "Industrial Policies for Multi-Stage Production: The Battle for Battery-Powered Vehicles", "authors": "Keith Charles Head, Thierry Mayer B, Marc Melitz, Chenying Yang", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34884", "date": "2026-02-01", "abstract": "We model a multi-stage supply chain for EVs from battery production to vehicle distribution. Given industrial policies, firms select where to open facilities at each stage. This is a difficult combinatorial choice problem that we solve with a fast mixed integer linear programming formulation. We estimate the variable and fixed costs parameters using SMM. Counterfactual simulations reveal a tension between boosting EV adoption and promoting domestic supply chains. Due to increasing returns, even unconditional subsidies raise the number of factories in the subsidizing region—by about 16% for EVs and 7% for cells in North America, and even more in Europe. Theoretically, local assembly requirements can push down delivered marginal costs relative to unconditional subsidies. Empirically, local content requirements quadruple the expansion of cell factories in America, but they drive up costs and reduce subsidy uptake, undoing more than half of the EV adoption stimulus coming from pure buyer subsidies. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "构建电动汽车多阶段供应链模型，量化产业政策对工厂布局、成本与采用的影响。", "title_zh": "多阶段生产的产业政策：电池驱动汽车之争", "abstract_zh": "我们构建了一个从电池生产到车辆分销的电动汽车多阶段供应链模型。给定产业政策，企业在每个阶段选择在何处开设设施。这是一个困难的组合选择问题，我们用一个快速的混合整数线性规划表述来求解。我们使用SMM估计可变成本和固定成本参数。反事实模拟揭示了促进电动汽车采用与促进国内供应链之间的张力。由于规模报酬递增，即使无条件补贴也会提高补贴地区的工厂数量——在北美，电动汽车约提高16%，电芯约提高7%，在欧洲甚至更高。理论上，与无条件补贴相比，本地组装要求可以压低交付边际成本。经验上，本地含量要求使美国电芯工厂的扩张增至四倍，但它们推高成本并降低补贴接受率，抵消了来自纯买方补贴的电动汽车采用刺激的一半以上。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org无需额外费用下载本文。", "tags": ["供应链", "产业政策", "全球价值链"], "extra": {"scholar_name": "Marc Melitz", "work_type": "report", "doi": "10.3386/w34884"}}, {"uid": "oa:W7130901115", "source": "scholar", "title": "Reassessing the benefits of European integration and the European Union's ability to achieve strategic autonomy", "authors": "Lionel Fontagné, Yoto V. Yotov", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://openalex.org/W7130901115", "date": "2026-02-01", "abstract": "European integration is now faced with the question of strategic autonomy. Against this backdrop, this paper has three objectives. First, it uses disaggregated trade data and established empirical methods to assess the benefits of European integration on trade among the members of the European Union (EU) as well as on trade between EU members and non-member countries, including non-members that are part of the Single Market. Second, it evaluates the costs of EU strategic autonomy -implying not trading with \"riskier\" partners. Third, it asks whether deeper integration within the EU can alleviate these costs. The paper shows that the gains from European integration are substantial, albeit heterogeneous across Member States, non-members, and sectors, and that the costs of strategic autonomy can be offset by deeper, but comparatively more modest, integration efforts within the European Union.", "summary_zh": "用细分贸易数据评估欧洲一体化收益与战略自主成本，发现收益显著且异质，深化一体化可部分抵消成本。", "title_zh": "重新评估欧洲一体化的收益与欧盟实现战略自主的能力", "abstract_zh": "欧洲一体化当前面临战略自主问题。在此背景下，本文有三个目标。第一，本文使用细分贸易数据和既有的实证方法，评估欧洲一体化对欧洲联盟（EU）成员国之间贸易以及欧盟成员国与非成员国（包括属于单一市场的非成员国）之间贸易的益处。第二，本文评估欧盟战略自主的成本——这意味着不与“风险较高”的伙伴开展贸易。第三，本文考察欧盟内部更深层次的一体化能否缓解这些成本。本文表明，欧洲一体化带来的收益十分可观，尽管在成员国、非成员国和部门之间具有异质性，并且战略自主的成本可以通过欧盟内部更深层次但相对更为温和的一体化努力予以抵消。", "tags": ["贸易政策", "贸易协定"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "preprint", "doi": ""}}, {"uid": "oa:W7133183603", "source": "scholar", "title": "Applications of Game Theory in the Political Economy of Trade Policy", "authors": "Gene M. Grossman", "venue": "Cambridge University Press eBooks", "url": "https://doi.org/10.1017/9781009686044.031", "date": "2026-01-31", "abstract": "Game theory has a long history in the political economy of trade policy. Beginning with work by Johnson in the 1950s, trade economists have used these tools to study strategic interactions between governments, interest groups representing industries or factors of production, political parties, and legislators representing different voting districts. Research has focused both on trade policies that have been set noncooperatively, sometimes in response to internal political pressures, and on the negotiation and features of cooperative trade agreements.", "summary_zh": "该文综述博弈论在贸易政策政治经济学中的应用，分析政府、利益集团等战略互动与贸易协定。", "title_zh": "博弈论在贸易政策政治经济学中的应用", "abstract_zh": "博弈论在贸易政策的政治经济学中有着悠久的历史。始于20世纪50年代Johnson的研究，贸易经济学家已使用这些工具来研究政府、代表产业或生产要素的利益集团、政党以及代表不同选区的议员之间的战略互动。研究既关注非合作设定的贸易政策——有时是回应国内政治压力——也关注合作性贸易协定的谈判及其特征。", "tags": ["贸易政策", "方法论", "贸易协定"], "extra": {"scholar_name": "Gene Grossman", "work_type": "book-chapter", "doi": "10.1017/9781009686044.031"}}, {"uid": "oa:W7126242545", "source": "top5", "title": "Take the Goods and Run: Contracting Frictions and Market Power in Supply Chains", "authors": "Felipe Brugués", "venue": "American Economic Review", "url": "https://doi.org/10.1257/aer.20230264", "date": "2026-01-30", "abstract": "This paper studies the efficiency of self-enforced relational agreements, a common solution to contracting frictions, when sellers have market power and contracts cannot be externally enforced. To this end, I develop a dynamic contracting model with limited enforcement in which buyers can default on their trade credit debt and estimate it using a novel dataset from the Ecuadorian manufacturing supply chain. The key empirical finding is that bilateral trade is inefficiently low in early periods of the relationship, but converges toward efficiency over time, despite sellers’ market power. Counterfactual simulations imply that both market power and enforcement contribute to inefficiencies in trade. (JEL D86, G32, K12, L14, L60, O14)", "summary_zh": "基于厄瓜多尔制造业供应链数据与动态契约模型，发现关系初期双边贸易低效，随关系发展趋近效率，市场势力与执行均致贸易低效。", "title_zh": "携货而逃：供应链中的契约摩擦与市场势力", "abstract_zh": "本文研究当卖方拥有市场势力且合同无法由外部强制执行时，自我实施的关系型协议的效率，而这是解决签约摩擦的一种常见方案。为此，我构建了一个具有有限执行力的动态签约模型，在该模型中买方可以对其贸易信贷债务违约，并利用来自厄瓜多尔制造业供应链的新颖数据集对该模型进行估计。关键实证发现是，在关系早期，双边贸易低效地偏低，但尽管卖方拥有市场势力，其仍会随时间推移趋近于效率。反事实模拟表明，市场势力和执行力度都会导致贸易无效率。（JEL D86, G32, K12, L14, L60, O14）", "tags": ["供应链"], "extra": {"journal_short": "AER", "keyword_hit": "supply chain", "doi": "10.1257/aer.20230264"}}, {"uid": "oa:W7126211954", "source": "top5", "title": "Consumer Credit and the Incidence of Tariffs: Evidence from the Auto Industry", "authors": "Kristine Watson Hankins, Morteza Momeni, David Sovich", "venue": "American Economic Review", "url": "https://doi.org/10.1257/aer.20230432", "date": "2026-01-30", "abstract": "Captive finance subsidiaries create a channel for trade policy to affect consumer credit. Examining the impact of the Trump administration's metal tariffs on captive automobile lenders, we find that consumers received higher interest rates from captive lenders after the tariffs relative to unaffected non-captive lenders. Further, we document a disparate impact on low-income borrowers and in areas with less lending competition. Our results suggest that tariffs may impact not only the price of goods but also the financing terms of purchases. Thus, focusing solely on directly affected product prices may underestimate tariff pass-through significantly.", "summary_zh": "研究特朗普金属关税对汽车专属信贷机构的影响，发现关税推高消费者贷款利率，尤其低收入者，表明关税转嫁被低估。", "title_zh": "消费者信贷与关税归宿：来自汽车行业的证据", "abstract_zh": "专属金融子公司为贸易政策影响消费信贷创造了一条渠道。考察特朗普政府金属关税对专属汽车贷款机构的影响，我们发现，与未受影响的非专属贷款机构相比，关税实施后消费者从专属贷款机构获得了更高的利率。此外，我们记录了其对低收入借款人和贷款竞争较弱地区产生的差异化影响。我们的结果表明，关税可能不仅影响商品价格，还影响购买行为的融资条款。因此，仅关注直接受影响的产品价格可能会显著低估关税传递。", "tags": ["关税", "贸易政策"], "extra": {"journal_short": "AER", "keyword_hit": "tariff", "doi": "10.1257/aer.20230432"}}, {"uid": "oa:W7121446678", "source": "scholar", "title": "Air pollution as comparative disadvantage", "authors": "Shi-Ting He, Liugang Sheng, Peng Zhang", "venue": "Journal of Public Economics", "url": "https://doi.org/10.1016/j.jpubeco.2025.105560", "date": "2026-01-10", "abstract": "", "summary_zh": "探讨空气污染是否构成比较劣势并影响贸易格局；无摘要，方法与发现未明。", "title_zh": "空气污染作为比较劣势", "abstract_zh": "", "tags": ["其他"], "extra": {"scholar_name": "盛柳刚", "work_type": "article", "doi": "10.1016/j.jpubeco.2025.105560"}}, {"uid": "oa:W7118695415", "source": "scholar", "title": "What Is a Carbon Tariff and Why Is the EU Imposing One?", "authors": "Pierre Coster, Julian di Giovanni, Isabelle Méjean", "venue": "报告", "url": "https://doi.org/10.59576/lse.20260107b", "date": "2026-01-07", "abstract": "The European Union has been an early adopter of carbon policies, with the introduction of the EU Emissions Trading System (ETS) in 2005. This scheme sets a common price for carbon and is applied to the most polluting manufacturing sectors. By increasing the cost of emissions-intensive production, the system incentivizes firms to decrease their use of fossil fuels. However, as we show in a companion post, the policy’s impact was moderated by firms increasing their reliance on high-emissions imports. To eliminate this workaround, the EU will expand the ETS to imports in 2026, through the Carbon Border Adjustment Mechanism (CBAM). The CBAM will essentially put a tariff on imported goods based on their carbon content. Our recent work provides a quantitative analysis of how the ETS and CBAM affect firms’ supply choice decisions, and the resulting changes in domestic prices and emissions.", "summary_zh": "解释碳关税及欧盟CBAM，并量化分析其对供应选择、国内价格与排放的影响。", "title_zh": "什么是碳关税，欧盟为何征收？", "abstract_zh": "欧盟一直是碳政策的早期采用者，并于2005年引入欧盟排放交易体系（ETS）。该体系为碳设定了统一价格，并适用于污染最严重的制造业部门。通过提高排放密集型生产的成本，该体系激励企业减少对化石燃料的使用。然而，正如我们在配套文章中所展示的，该政策的影响被企业日益依赖高排放进口品所削弱。为消除这一规避做法，欧盟将于2026年通过碳边境调节机制（CBAM）将ETS扩展至进口品。CBAM本质上将根据进口商品的碳含量对其征收关税。我们最近的工作对ETS和CBAM如何影响企业的供给选择决策，以及由此引起的国内价格和排放变化进行了定量分析。", "tags": ["关税", "贸易政策", "供应链"], "extra": {"scholar_name": "Isabelle Mejean", "work_type": "report", "doi": "10.59576/lse.20260107b"}}, {"uid": "oa:W7118520600", "source": "scholar", "title": "What Can Undermine a Carbon Tax?", "authors": "Pierre Coster, Julian di Giovanni, Isabelle Méjean", "venue": "报告", "url": "https://doi.org/10.59576/lse.20260107a", "date": "2026-01-07", "abstract": "Several countries have implemented a carbon tax or cap-and-trade system to establish high carbon prices and create a disincentive for the use of fossil fuels. Essentially, the tax encourages firms to substitute toward low carbon emission energy. Costs also rise for firms down the supply chain that use production inputs with high-emission content, so the total impact of a carbon tax can be large. In practice, however, firms also have an incentive to find an offset to a carbon tax. In this post, based on our recent work, we present evidence of one such adaptation strategy. We show that French firms increased their imports of high-emission inputs from suppliers outside the European Union’s cap-and-trade system, known as the EU Emissions Trading System (EU ETS), reducing the effectiveness of this approach to cutting carbon emissions—an adaptation strategy that leads to “carbon leakage.” To help stop this leakage, the EU is implementing a “carbon tariff” in 2026, which is the topic of a companion post.", "summary_zh": "利用法国企业证据发现，碳税促使企业从欧盟碳市场外进口高排放投入，造成碳泄漏并削弱减排效果。", "title_zh": "什么会削弱碳税？", "abstract_zh": "一些国家已实施碳税或总量管制与交易体系，以确立高碳价并对化石燃料的使用形成抑制。本质上，该税鼓励企业转向低碳排放能源。对于供应链下游使用高排放含量生产投入品的企业，成本也会上升，因此碳税的总影响可能很大。然而在实践中，企业也有动力寻找对碳税的抵消方式。在本文中，基于我们近期的工作，我们展示了一种此类适应策略的证据。我们表明，法国企业增加了从欧盟总量管制与交易体系（即欧盟排放交易体系，EU ETS）之外的供应商进口高排放投入品，降低了这一削减碳排放方法的有效性——这是一种导致“碳泄漏”的适应策略。为帮助阻止这种泄漏，欧盟将于2026年实施“碳关税”，这是另一篇配套文章的主题。", "tags": ["贸易政策", "关税", "供应链"], "extra": {"scholar_name": "Isabelle Mejean", "work_type": "report", "doi": "10.59576/lse.20260107a"}}, {"uid": "s2:287799657", "source": "scholar", "title": "US-China Cooperative Interdependence: Opportunities and Obstacles", "authors": "Marcus Noland, C. Bown, Mary E. Lovely, Warwick J. McKibbin", "venue": "Social Science Research Network", "url": "https://doi.org/10.2139/ssrn.6637279", "date": "2026-01-01", "abstract": "Growing distrust and strategic rivalry between the US and China have shifted their relationship from mutually beneficial cooperation to costly conflict. The papers in this PIIE Briefing explore ways the two countries can pursue a structured, negotiated approach to economic disengagement while still collaborating on shared goals to address climate change, public health, and demographic challenges. Failure to find ways to cooperate—even while competing—will continue to hurt both economies and the rest of the world and also slow progress on tackling urgent global problems.", "summary_zh": "探讨中美从合作转向冲突后如何以结构化谈判实现经济脱钩并保持气候等合作，指出不合作将损害两国与全球。", "title_zh": "中美合作性相互依存：机遇与障碍", "abstract_zh": "美中之间日益加剧的不信任和战略竞争已使两国关系从互利合作转向代价高昂的冲突。本 PIIE Briefing 中的文章探讨了两国如何采取结构化、经谈判的经济脱钩方式，同时仍在应对气候变化、公共卫生和人口挑战等共同目标上开展合作。未能找到合作方式——即使在竞争的同时——将继续损害两国经济和世界其他地区，并拖慢应对紧迫全球问题的进展。", "tags": ["贸易政策", "其他"], "extra": {"scholar_name": "Chad Bown", "versions": ["scholar"]}}, {"uid": "s2:284970157", "source": "scholar", "title": "Trade and Domestic Distortions: The Case of Informality", "authors": "Rafael Dix-Carneiro, P. Goldberg, C. Meghir, Gabriel Ulyssea", "venue": "Econometrica", "url": "https://doi.org/10.3982/ecta19378", "date": "2026-01-01", "abstract": "We examine the effects of international trade in the presence of a set of domestic distortions giving rise to informality, a prevalent phenomenon in developing countries. In our quantitative model, the informal sector arises from burdensome taxes and regulations that are imperfectly enforced by the government. In equilibrium, smaller, less productive firms face fewer distortions than larger, more productive ones, potentially leading to substantial misallocation. We show that in settings with a large informal sector, the gains from trade are significantly amplified, as reductions in trade barriers imply a reallocation of resources from initially less distorted to more distorted firms. We confirm findings from earlier reduced‐form studies that the informal sector mitigates the impact of negative labor demand shocks on unemployment. Nonetheless, the informal sector can exacerbate the adverse real income effects of economic downturns, amplifying misallocation. Last, our research sheds light on the relationship between trade openness and cross‐firm wage inequality.", "summary_zh": "构建定量模型研究非正规部门下的贸易收益，发现贸易收益被放大，非正规部门也放大衰退的负面收入效应。", "title_zh": "贸易与国内扭曲：非正规性案例", "abstract_zh": "我们考察在一组引发非正规性的国内扭曲存在时国际贸易的影响；非正规性是发展中国家一种普遍现象。在我们的量化模型中，非正规部门源于政府执行不完善的繁重税收和管制。在均衡中，规模较小、生产率较低的企业面临的扭曲少于规模较大、生产率较高的企业，这可能造成严重的资源错配。我们表明，在存在庞大非正规部门的背景下，贸易收益被显著放大，因为贸易壁垒的降低意味着资源从最初扭曲较少的企业重新配置到扭曲较多的企业。我们证实了早期简约式研究的发现，即非正规部门缓解负向劳动需求冲击对失业的影响。尽管如此，非正规部门可能加剧经济衰退对实际收入的不利效应，放大资源错配。最后，我们的研究有助于揭示贸易开放与企业间工资不平等之间的关系。", "tags": ["企业异质性", "劳动力市场"], "extra": {"scholar_name": "Pinelopi Goldberg", "versions": ["top5"]}}, {"uid": "oa:W7220936952", "source": "scholar", "title": "The Unequal Trade War", "authors": "Jinyuan Qiu, Shu Shen, Liugang Sheng, Hongyan Zhao", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.7576938", "date": "2026-01-01", "abstract": "", "summary_zh": "无摘要，标题显示研究贸易战的不平等影响，具体方法与发现未知。", "title_zh": "不平等的贸易战", "abstract_zh": "", "tags": ["贸易战", "关税", "贸易政策"], "extra": {"scholar_name": "盛柳刚", "work_type": "preprint", "doi": "10.2139/ssrn.7576938"}}, {"uid": "oa:W7220675622", "source": "scholar", "title": "The changing nature of international trade and its implications for development", "authors": "Pinelopi Koujianou Goldberg, Michèle Ruta", "venue": "Handbook of development economics", "url": "https://doi.org/10.1016/bs.hesde.2026.09.004", "date": "2026-01-01", "abstract": "", "summary_zh": "综述国际贸易性质变化及其对发展中国家发展影响。", "title_zh": "国际贸易性质的变化及其对发展的影响", "abstract_zh": "", "tags": ["全球价值链", "贸易政策", "其他"], "extra": {"scholar_name": "Pinelopi Goldberg", "work_type": "book-chapter", "doi": "10.1016/bs.hesde.2026.09.004"}}, {"uid": "oa:W7213750576", "source": "scholar", "title": "Trade Liberalization, Intermediate Input, and the Labor Share", "authors": "Jing Hang, Cui Hu, Chaoqun Zhan, Mohan Zhou", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.7493568", "date": "2026-01-01", "abstract": "", "summary_zh": "无摘要，无法确定方法与核心发现；主题为贸易自由化、中间投入与劳动收入份额。", "title_zh": "贸易自由化、中间投入与劳动份额", "abstract_zh": "", "tags": ["贸易政策", "劳动力市场"], "extra": {"scholar_name": "詹超群", "work_type": "preprint", "doi": "10.2139/ssrn.7493568"}}, {"uid": "oa:W7213090140", "source": "top5", "title": "The Role of Trade in Premature Deindustrialization and Industry Polarization", "authors": "Michael J. Sposi, Kei‐Mu Yi, Jing Zhang", "venue": "Econometrica", "url": "https://doi.org/10.3982/ecta20428", "date": "2026-01-01", "abstract": "We document two key patterns of structural change: premature deindustrialization and rising industry polarization. Using a dynamic open‐economy model with sector‐biased technological change (SBTC), we evaluate the role of trade in these shifts. Trade alone does not cause premature deindustrialization, but its interaction with SBTC—transmitting global technological change, amplifying the decline in manufacturing's relative price over time, and generating manufacturing trade imbalances across countries—deepens premature deindustrialization over time. Industry polarization, by contrast, emerges only through trade‐driven specialization, as countries diverge along lines of comparative advantage.", "summary_zh": "用动态开放经济模型评估贸易作用，发现贸易单独不致过早去工业化，但与偏向性技术进步交互加深之，产业极化源于贸易专业化。", "title_zh": "贸易在过早去工业化与产业极化中的作用", "abstract_zh": "我们记录了结构转型的两个关键模式：过早去工业化和产业极化加剧。我们使用一个包含部门偏向型技术变革（SBTC）的动态开放经济模型，评估贸易在这些变化中的作用。贸易本身不会导致过早去工业化，但它与SBTC的相互作用——传导全球技术变革、随时间推移放大制造业相对价格的下降，并造成各国间制造业贸易失衡——会随时间推移加深过早去工业化。相比之下，产业极化仅通过贸易驱动的专业化出现，因为各国沿着比较优势的方向分化。", "tags": ["其他"], "extra": {"journal_short": "ECMA", "keyword_hit": "comparative advantage", "doi": "10.3982/ecta20428"}}, {"uid": "oa:W7208619553", "source": "scholar", "title": "How to win a trade war was wir jetzt über den globalen Handel der Zukunft wissen müssen", "authors": "Soumaya Keynes, Chad P. Bown, Bernhard 1872-1947 Schmid, Ariston", "venue": "article", "url": "https://openalex.org/W7208619553", "date": "2026-01-01", "abstract": "", "summary_zh": "文章讨论贸易战制胜之道及未来全球贸易政策走向，属政策分析。", "title_zh": "如何赢得贸易战：我们现在需要了解的未来全球贸易", "abstract_zh": "", "tags": ["贸易战", "贸易政策"], "extra": {"scholar_name": "Chad Bown", "work_type": "article", "doi": ""}}, {"uid": "oa:W7204488702", "source": "scholar", "title": "The Unintended Decarbonization Effect of Exchange Rate Appreciation: Firm-Level Evidence from China", "authors": "Mi Dai, Jiashu Hu, Bing Lu", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.7360664", "date": "2026-01-01", "abstract": "", "summary_zh": "基于中国企业层面数据，研究汇率升值的非预期脱碳效应，发现升值有助于减排。", "title_zh": "汇率升值的意外脱碳效应：来自中国企业的证据", "abstract_zh": "", "tags": ["汇率", "企业异质性", "其他"], "extra": {"scholar_name": "戴觅", "work_type": "preprint", "doi": "10.2139/ssrn.7360664"}}, {"uid": "oa:W7203667300", "source": "scholar", "title": "Not wearing Prada: Do private sanctions reinforce official sanctions?", "authors": "Beata Smarzynska Javorcik, Maxim Chupilkin, Alexander Plekhanov, Aleksandra Peeva", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.7304021", "date": "2026-01-01", "abstract": "", "summary_zh": "研究私人制裁是否强化官方制裁；因无摘要，方法与发现未明。", "title_zh": "不穿Prada：私人制裁会强化官方制裁吗？", "abstract_zh": "", "tags": ["制裁", "贸易政策"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "preprint", "doi": "10.2139/ssrn.7304021"}}, {"uid": "oa:W7202275359", "source": "scholar", "title": "Made with China: Global Supply Chains and the Limits of US Decoupling", "authors": "Mary E. Lovely, Yuting (Christine) Wan", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.7273238", "date": "2026-01-01", "abstract": "", "summary_zh": "考察中国嵌入的全球供应链与美国对华脱钩限度；无摘要，方法及发现未明。", "title_zh": "中国制造：全球供应链与美国脱钩的限度", "abstract_zh": "", "tags": ["全球价值链", "供应链", "贸易政策"], "extra": {"scholar_name": "Mary Lovely", "work_type": "preprint", "doi": "10.2139/ssrn.7273238"}}, {"uid": "oa:W7161999152", "source": "scholar", "title": "Climate change, climate policy, and trade", "authors": "Farid Farrokhi, Samuel S. Kortum, Ishan Nath", "venue": "Elsevier eBooks", "url": "https://doi.org/10.1016/bs.hesecc.2026.02.001", "date": "2026-01-01", "abstract": "", "summary_zh": "探讨气候变化与气候政策对贸易的影响；无摘要，具体方法与核心发现不详", "title_zh": "气候变化、气候政策与贸易", "abstract_zh": "", "tags": ["贸易政策", "其他"], "extra": {"scholar_name": "Samuel Kortum", "work_type": "book-chapter", "doi": "10.1016/bs.hesecc.2026.02.001"}}, {"uid": "oa:W7160846905", "source": "scholar", "title": "Adapting Under Decoupling: U.S. Sanctions, Supply Chain Localization and the Rise of Domestic Suppliers in China", "authors": "Heiwai Tang Z, Shuzhong Ma, Yifan Chen, Hongsheng Zhang", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.6750217", "date": "2026-01-01", "abstract": "", "summary_zh": "考察美国制裁与脱钩背景下中国供应链本地化及本土供应商崛起，方法与发现需阅正文。", "title_zh": "脱钩下的适应：美国制裁、供应链本地化与中国国内供应商的崛起", "abstract_zh": "", "tags": ["制裁", "供应链", "产业政策"], "extra": {"scholar_name": "邓希炜", "work_type": "preprint", "doi": "10.2139/ssrn.6750217"}}, {"uid": "oa:W7160196930", "source": "scholar", "title": "The Transformation of Empirical International Trade in the 21st Century: The Rise of Data", "authors": "Andrew B. Bernard", "venue": "The International Economy", "url": "https://doi.org/10.5652/internationaleconomy/ie2026.29.03.ab", "date": "2026-01-01", "abstract": "", "summary_zh": "综述21世纪实证国际贸易研究的转型，指出数据兴起推动问题、方法与证据的革新。", "title_zh": "21世纪实证国际贸易的转型：数据的兴起", "abstract_zh": "", "tags": ["方法论", "其他"], "extra": {"scholar_name": "Andrew Bernard", "work_type": "article", "doi": "10.5652/internationaleconomy/ie2026.29.03.ab"}}, {"uid": "oa:W7160132669", "source": "scholar", "title": "A World Trading System For Whom? Evidence from Global Tariffs", "authors": "Rodrigo Adão, John Sturm, Arnaud Costinot, Dave Donaldson", "venue": "CESifo", "url": "https://doi.org/10.65864/u1y2bu7wdi", "date": "2026-01-01", "abstract": "We use global tariffs to reveal the weights that nations implicitly place on the welfare of their trading partners relative to their own. Our estimated welfare weights suggest that formal and informal rules of the world trading system make countries internalize the impact of their policies onto others to a substantial extent, though not fully. On average, countries place 25% less value on transfers to foreigners than transfers to their own residents. Across nations, we find that countries that put higher welfare weights on the welfare of foreigners also tend to receive higher weights from them, consistent with a general form of reciprocity among nations. Using our estimated welfare weights, we provide a first look at what countries stand to lose, or gain, fromthe dissolution of the world trading system as we know it.", "summary_zh": "利用全球关税估计各国对贸易伙伴福利的隐含权重，发现平均低估外国人转移支付25%，且存在互惠性。", "title_zh": "世界贸易体系为谁服务？来自全球关税的证据", "abstract_zh": "我们利用全球关税来揭示各国相对于本国福利而隐含赋予其贸易伙伴福利的权重。我们估计的福利权重表明，世界贸易体系的正式和非正式规则使各国在很大程度上将其政策对其他国家的影响内部化，尽管并非完全如此。平均而言，各国对向外国人的转移所赋予的价值比对向其本国居民的转移低25%。跨国来看，我们发现，对外国人福利赋予更高福利权重的国家，也往往从它们那里获得更高的权重，这与国家间一般形式的互惠相一致。利用我们估计的福利权重，我们初步考察了各国将从我们所熟知的世界贸易体系解体中获得什么损失或收益。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Arnaud Costinot", "work_type": "report", "doi": "10.65864/u1y2bu7wdi", "versions": ["scholar"]}}, {"uid": "oa:W7154926248", "source": "scholar", "title": "Verlagerung von CO2-Emissionen durch EU-Klimapolitik? Ein Überblick", "authors": "Harald Fadinger, Andreas Gerster, Philip U. Sauré, Joschka Wanner", "venue": "Econstor (Econstor)", "url": "https://openalex.org/W7154926248", "date": "2026-01-01", "abstract": "Emissionsverlagerung (Leakage) ist real, aber begrenzt: Studien zeigen, dass etwa 10-30 % der durch EU-Klimapolitik eingesparten Emissionen ins Ausland verlagert werden. Der Großteil der Emissionsreduktionen bleibt jedoch global wirksam, sodass die Politik insgesamt effektiv ist. • Kaum Evidenz für ein \"Grünes Paradoxon\": Die Befürchtung, dass Klimapolitik zu einem vorgezogenen Anstieg von Emissionen führt, wird empirisch nicht bestätigt. Stattdessen reagieren Unternehmen oft mit geringeren Investitionen in fossile Energien, was Emissionen eher senkt. • EU setzt Instrumente gegen Wettbewerbsnachteile ein: Dazu gehören kostenlose Emissionszertifikate sowie der CO₂-Grenzausgleich (CBAM), der Importe entsprechend ihrer Emissionen bepreist. Ziel ist es, Leakage zu reduzieren und gleiche Wettbewerbsbedingungen zu schaffen. • Wirksamkeit der Instrumente hängt stark vom Design ab: Der aktuelle CBAM erfasst nur wenige Sektoren und hat daher begrenzte Wirkung auf globale Emissionen. Eine Ausweitung auf mehr Sektoren könnte die Emissionsreduktion deutlich erhöhen. • Klimapolitik bringt zusätzliche Vorteile: Neben Emissionsreduktionen fördert sie Innovationen, verbessert die Luftqualität und stärkt Energie- sowie geopolitische Unabhängigkeit. Diese positiven Nebeneffekte erhöhen den Gesamtnutzen der Maßnahmen.", "summary_zh": "综述欧盟气候政策碳泄漏与CBAM效果，发现泄漏有限但CBAM覆盖不足。", "title_zh": "欧盟气候政策导致二氧化碳排放转移？一个综述", "abstract_zh": "排放转移（Leakage）是真实存在的，但程度有限：研究表明，由欧盟气候政策节约的排放中约10-30%被转移到国外。然而，大部分减排在全球范围内仍然有效，因此该政策总体上是有效的。• 几乎没有证据支持“绿色悖论”：对气候政策会导致排放提前上升的担忧未得到实证证实。相反，企业往往以减少对化石能源的投资作出反应，这更倾向于降低排放。• 欧盟采用工具应对竞争劣势：其中包括免费排放配额以及二氧化碳边境调节机制（CBAM），该机制根据进口产品的排放对其定价。目标是减少泄漏并创造公平的竞争条件。• 工具的有效性在很大程度上取决于设计：当前CBAM仅涵盖少数部门，因此对全球排放的影响有限。将其扩大到更多部门可能显著提高减排量。• 气候政策带来额外优势：除减排外，它还促进创新、改善空气质量，并增强能源以及地缘政治独立性。这些积极副作用提高了措施的总收益。", "tags": ["贸易政策", "关税"], "extra": {"scholar_name": "Harald Fadinger", "work_type": "report", "doi": ""}}, {"uid": "oa:W7134948106", "source": "scholar", "title": "Trade and Multinational Production Model", "authors": "Gabriel Nicolas Michelena, Jingting Fan, Lucio Castro", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.6184340", "date": "2026-01-01", "abstract": "", "summary_zh": "构建贸易与跨国生产模型，考察贸易成本与企业跨国生产决策；无摘要，核心发现未明。", "title_zh": "贸易与跨国生产模型", "abstract_zh": "", "tags": ["企业异质性", "方法论"], "extra": {"scholar_name": "樊静婷", "work_type": "preprint", "doi": "10.2139/ssrn.6184340"}}, {"uid": "oa:W7130402550", "source": "scholar", "title": "Reserves, Sanctions and Tariffs in a Time of Uncertainty", "authors": "Menzie Chinn, Jeffrey A. Frankel, Hiro Ito", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.6259416", "date": "2026-01-01", "abstract": "", "summary_zh": "无摘要，无法确认方法与发现；标题显示研究不确定性下外汇储备、制裁与关税的关联。", "title_zh": "不确定性时期的储备、制裁与关税", "abstract_zh": "", "tags": ["制裁", "关税", "汇率"], "extra": {"scholar_name": "Jeffrey Frankel", "work_type": "preprint", "doi": "10.2139/ssrn.6259416"}}, {"uid": "oa:W7128663471", "source": "scholar", "title": "Navigating industrial policy", "authors": "Beata Smarzynska Javorcik, Alexander Plekhanov", "venue": "Econstor (Econstor)", "url": "https://openalex.org/W7128663471", "date": "2026-01-01", "abstract": "Industrial policies can be effective where markets fail, including in supporting green transition. Industrial policies often pursue multiple conflicting objectives that must be prioritized. To counteract discrimination against foreign interests, industrial policies should include competitive elements and market tests. Industrial policies should include sunset clauses and evaluation mechanisms to help assess whether the policy should be extended. Evaluation units could be made of independent experts, particularly in cases where the administrative capacity of governments is limited.", "summary_zh": "文章讨论产业政策的设计原则，主张在市场失灵处使用，并加入竞争、日落条款与评估机制。", "title_zh": "驾驭产业政策", "abstract_zh": "产业政策在市场失灵之处可以是有效的，包括在支持绿色转型方面。产业政策往往追求多个相互冲突的目标，必须对这些目标进行优先排序。为了抵消对外国利益的歧视，产业政策应包含竞争性要素和市场检验。产业政策应包含日落条款和评估机制，以帮助评估该政策是否应被延长。评估单位可由独立专家组成，特别是在政府行政能力有限的情况下。", "tags": ["产业政策", "贸易政策"], "extra": {"scholar_name": "Beata Javorcik", "work_type": "article", "doi": ""}}, {"uid": "oa:W7128654513", "source": "scholar", "title": "The new era of industrial policy: Evidence and implications", "authors": "Adam Jakubik, Michèle Ruta, Samuel Pienknagura", "venue": "Econstor (Econstor)", "url": "https://openalex.org/W7128654513", "date": "2026-01-01", "abstract": "Industrial policy interventions have surged since 2020, increasingly driven by geopolitical concerns. The New Industrial Policy Observatory reveals over 36,000 interventions globally since 2009, enabling a systematic analysis of patterns and impacts. Industrial policies can improve products' competitiveness in some cases, but the impact is short-lived and there is no evidence of self-sustaining virtuous cycles. Effective industrial policy requires careful design, strong governance, and multilateral cooperation to manage spillover effects.", "summary_zh": "利用全球3.6万余项干预数据，分析产业政策模式与效果，发现竞争力提升短暂，需多边合作管理溢出。", "title_zh": "产业政策的新时代：证据与启示", "abstract_zh": "自2020年以来，产业政策干预激增，且日益受到地缘政治关切的驱动。新产业政策观察站显示，自2009年以来全球已有超过36,000项干预，从而使对模式与影响的系统分析成为可能。产业政策在某些情况下可以提高产品的竞争力，但其影响是短暂的，且没有证据表明存在自我维持的良性循环。有效的产业政策需要审慎设计、强有力的治理和多边合作，以管理溢出效应。", "tags": ["产业政策", "贸易政策"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": ""}}, {"uid": "oa:W7127179160", "source": "top5", "title": "Coordination and Commitment in International Climate Action: Evidence From Palm Oil", "authors": "Allan J. Hsiao", "venue": "Econometrica", "url": "https://doi.org/10.3982/ecta20608", "date": "2026-01-01", "abstract": "Weak environmental regulation has global consequences. When domestic regulation fails, the international community can target emitters with trade policy. I develop a dynamic empirical framework for evaluating trade policy as a substitute for domestic regulation, and I apply the framework to the market for palm oil, a major driver of deforestation and global CO 2 emissions. Relative to business as usual, a domestic production tax of 50% reduces CO 2 emissions by 7.4 Gt from 1988 to 2016, amounting to 0.26 Gt annually. Coordinated, committed import tariffs of similar magnitude reduce emissions by 5.4 Gt over the same period. The cost of these import tariffs is only $15 per ton of CO 2 , even accounting for compensating transfers that recognize welfare losses for producing countries. Without coordination and commitment, import tariffs have more limited effects. Alternative policies include domestic export taxes, which are fiscally appealing independent of emission concerns, and a carbon border adjustment mechanism, which encourages domestic regulation.", "summary_zh": "构建动态实证框架评估贸易政策替代国内环境监管，发现协调承诺的棕榈油进口关税可低成本减排。", "title_zh": "国际气候行动中的协调与承诺：来自棕榈油的证据", "abstract_zh": "薄弱的环境监管会产生全球性后果。当国内监管失灵时，国际社会可以通过贸易政策针对排放者。我构建了一个动态实证框架，用于评估贸易政策作为国内监管替代手段的作用，并将该框架应用于棕榈油市场，棕榈油是森林砍伐和全球CO2排放的主要驱动因素。相对于一切照常，50%的国内生产税在1988年至2016年间使CO2排放减少7.4 Gt，相当于每年减少0.26 Gt。协调且承诺实施的类似幅度进口关税在同一时期使排放减少5.4 Gt。这些进口关税的成本仅为每吨CO2 15美元，即便计入承认生产国福利损失的补偿性转移支付也是如此。若无协调与承诺，进口关税的效果更为有限。替代政策包括国内出口税，这类税即使与排放关切无关也具有财政吸引力；以及碳边境调节机制，该机制鼓励国内监管。", "tags": ["关税", "贸易政策"], "extra": {"journal_short": "ECMA", "keyword_hit": "trade policy", "doi": "10.3982/ecta20608"}}, {"uid": "oa:W7127175808", "source": "top5", "title": "A Framework for Geoeconomics", "authors": "Christopher Clayton, Matteo Maggiori, Jesse Schreger", "venue": "Econometrica", "url": "https://doi.org/10.3982/ecta23206", "date": "2026-01-01", "abstract": "Governments use their countries' economic strength from financial and trade relationships to achieve geopolitical and economic goals. We provide a model of the sources of geoeconomic power and how it is wielded. The source of this power is the ability of a hegemonic country to coordinate threats across disparate economic relationships as a means of enforcement on foreign entities. The hegemon wields this power to demand costly actions out of the targeted entities, including mark‐ups, import restrictions, tariffs, and political concessions. The hegemon uses its power to change targeted entities' activities to manipulate the global equilibrium in its favor and increase its power. A sector is strategic either in helping the hegemon form threats or in manipulating the world equilibrium via input‐output amplification. The hegemon acts a global enforcer, thus adding value to the world economy, but destroys value by distorting the equilibrium in its favor.", "summary_zh": "构建地缘经济权力模型，分析霸权国如何协调跨金融与贸易威胁，以关税和进口限制迫使目标让步并扭曲全球均衡。", "title_zh": "地缘经济学框架", "abstract_zh": "政府利用其国家在金融和贸易关系中的经济实力来实现地缘政治和经济目标。我们提供了一个关于地缘经济权力来源及其如何被运用的模型。这种权力的来源是一个霸权国家协调跨越不同经济关系的威胁的能力，以此作为对外国实体实施强制的手段。霸权国运用这种权力要求目标实体采取代价高昂的行动，包括加价、进口限制、关税和政治让步。霸权国运用其权力改变目标实体的活动，以操纵全球均衡使之有利于自己，并增强自身权力。一个部门之所以具有战略性，要么是因为它有助于霸权国形成威胁，要么是因为它通过投入产出放大来操纵世界均衡。霸权国充当全球执法者，从而为世界经济增加价值，但通过扭曲均衡使之有利于自己而破坏价值。", "tags": ["贸易政策", "制裁", "关税"], "extra": {"journal_short": "ECMA", "keyword_hit": "tariff", "doi": "10.3982/ecta23206"}}, {"uid": "oa:W7125904979", "source": "scholar", "title": "To Find Relative Earnings Gains After the China Shock, Look Upstream and Outside Manufacturing", "authors": "Justin R. Pierce, Peter K. Schott, Cristina J. Tello-Trillo", "venue": "International Finance Discussion Paper", "url": "https://doi.org/10.17016/ifdp.2026.1431", "date": "2026-01-01", "abstract": "We find that US workers outside manufacturing exhibit relative earnings increases after US trade liberalization with China. These relative gains cumulate over time as the beneficial effect of a worker’s upstream exposure—increased competition from China in input markets—more than offsets the detrimental impact of her own and downstream (customer) exposures. These relative gains are smaller for non-manufacturing workers with less ex ante firm tenure and lower initial earnings, and are absent among manufacturing workers due to a lack of upstream gains and stronger downstream losses.", "summary_zh": "利用工人上游暴露分析中国贸易自由化对收入影响，发现制造业外工人相对收入上升，上游收益抵消自身与下游损失。", "title_zh": "寻找中国冲击后的相对收入增长：关注上游与制造业之外", "abstract_zh": "我们发现，美国对华贸易自由化之后，制造业以外的美国工人表现出相对收入增加。这些相对收益随时间累积，因为工人上游暴露——投入品市场中来自中国的竞争加剧——的有利效应抵消其自身及下游（客户）暴露的不利影响而有余。对于事前企业任期较短且初始收入较低的非制造业工人，这些相对收益较小；而在制造业工人中，由于缺乏上游收益且下游损失更强，这些相对收益并不存在。", "tags": ["贸易政策", "劳动力市场", "全球价值链"], "extra": {"scholar_name": "Peter Schott", "work_type": "article", "doi": "10.17016/ifdp.2026.1431"}}, {"uid": "oa:W7125610536", "source": "scholar", "title": "Long-term impacts of trade liberalization: Treaty ports and firm export in China", "authors": "Larry Dongxiao Qiu, Xing Wei, Heiwai Tang Z", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.6127966", "date": "2026-01-01", "abstract": "", "summary_zh": "无摘要；论文主题为中国通商口岸贸易自由化对企业出口的长期影响，方法与核心发现未供。", "title_zh": "贸易自由化的长期影响：通商口岸与中国企业出口", "abstract_zh": "", "tags": ["贸易政策", "贸易史", "企业异质性"], "extra": {"scholar_name": "邓希炜", "work_type": "preprint", "doi": "10.2139/ssrn.6127966"}}, {"uid": "oa:W7124970828", "source": "scholar", "title": "How Restrictive is U.S. Trade Policy?", "authors": "Michael Waugh", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34687", "date": "2026-01-01", "abstract": "This short note computes Trade Restrictiveness Index measures for current U.S. trade policy.Building on the ideas of Anderson and Neary (1996, 2005), the Trade Restrictiveness Index is the uniform tariff that leaves the U.S. consumer as well off as under actual policy.As of October 2025, U.S. trade policy is twice as restrictive as headline tariff numbers suggest.The Trade Restrictiveness Index is 23 percent, which stands in contrast to the 11 percent average tariff rate.Trade policy towards Canada and Mexico is two to three times more restrictive than average tariff rates suggest.Sectoral analysis shows that the restrictiveness is concentrated in vehicles, machinery, and electrical equipment.", "summary_zh": "基于Anderson-Neary构建贸易限制指数，发现2025年10月美国贸易政策限制性为23%，约为平均关税11%的两倍。", "title_zh": "美国贸易政策限制性有多高？", "abstract_zh": "本简短说明计算了当前美国贸易政策的贸易限制指数指标。基于Anderson和Neary（1996，2005）的思想，贸易限制指数是使美国消费者与实际政策下同样福利水平的统一关税。截至2025年10月，美国贸易政策的限制性是指标题关税数字所显示的两倍。贸易限制指数为23%，这与11%的平均关税税率形成对比。对加拿大和墨西哥的贸易政策比平均关税税率所显示的限制性高出两到三倍。部门分析显示，限制性集中在车辆、机械和电气设备。", "tags": ["贸易政策", "关税"], "extra": {"scholar_name": "Michael Waugh", "work_type": "report", "doi": "10.3386/w34687", "versions": ["scholar"]}}, {"uid": "oa:W7123337072", "source": "scholar", "title": "World Trading System For Whom? Evidence from Global Tariffs", "authors": "Rodrigo Adão, John Sturm, Arnaud Costinot, Dave Donaldson", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34658", "date": "2026-01-01", "abstract": "We use global tariffs to reveal the weights that nations implicitly place on the welfare of their trading partners relative to their own.Our estimated welfare weights suggest that formal and informal rules of the world trading system make countries internalize the impact of their policies onto others to a substantial extent, though not fully.On average, countries place 25% less value on transfers to foreigners than transfers to their own residents.Across nations, we find that countries that put higher welfare weights on the welfare of foreigners also tend to receive higher weights from them, consistent with a general form of reciprocity among nations.Using our estimated welfare weights, we provide a first look at what countries stand to lose, or gain, from the dissolution of the world trading system as we know it.", "summary_zh": "利用全球关税估计各国对他国福利的隐含权重，发现平均对国外转移估值低25%且存在互惠，并评估体系瓦解得失。", "title_zh": "世界贸易体系为谁？基于全球关税的证据", "abstract_zh": "我们使用全球关税来揭示各国隐含赋予其贸易伙伴福利相对于自身福利的权重。我们估计的福利权重表明，世界贸易体系的正式与非正式规则使各国在很大程度上、尽管并非完全地将其政策对他国的影响内部化。平均而言，各国对向外国人的转移支付所赋予的价值比对向其本国居民的转移支付所赋予的价值低25%。在各个国家之间，我们发现，对外国人福利赋予更高福利权重的国家，也往往从外国人那里获得更高的权重，这与国家间一种一般形式的互惠相一致。使用我们估计的福利权重，我们初步考察了随着我们所知的世界贸易体系解体，各国可能损失或获得什么。", "tags": ["关税", "贸易政策", "贸易协定"], "extra": {"scholar_name": "Arnaud Costinot", "work_type": "report", "doi": "10.3386/w34658", "versions": ["scholar"]}}, {"uid": "oa:W7119027989", "source": "scholar", "title": "Employment Impacts of the CHIPS Act", "authors": "Bilge Erten, Joseph Eugène Stiglitz, Eric Verhoogen", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34625", "date": "2026-01-01", "abstract": "The CHIPS and Science Act, enacted in August 2022, is a key element of the revival of U.S. industrial policy.We examine the short-term employment effects of the act.Drawing on quarterly industry-by-county data from the Quarterly Census of Employment and Wages (QCEW), we implement two county-level difference-in-difference designs, the first comparing counties with pre-existing semiconductor facilities to other counties with high-tech industries and the second comparing counties with semiconductor fabrication facilities (which were targeted for the bulk of the CHIPS funding) to counties with non-fabrication semiconductor facilities.Using both approaches, we find robust, positive employment impacts in affected counties.The effects began at the time of the passage in the Senate of a precursor bill, in anticipation of the signing of the CHIPS Act.Our preferred estimates suggest an increase of 110 jobs per affected county in the first design and 180 jobs per affected county in the second design.We also find robust positive impacts on local construction employment.Evidence on total employment and GDP at the county level, as well as on employment in upstream input sectors, is mixed.Simple back-of-the-envelope calculations (which come with caveats) suggest national direct employment effects of approximately 15,000-16,000 jobs in the core semiconductor sector and indirect effects of 28,000-35,000 jobs in related sectors.", "summary_zh": "基于县级双重差分，评估CHIPS法案对半导体设施所在县就业的短期影响，发现就业显著增加。", "title_zh": "《芯片法案》的就业影响", "abstract_zh": "2022年8月颁布的《芯片与科学法案》是美国复兴的关键要素。产业政策。我们考察该法案的短期就业效应。利用《就业与工资季度普查》（QCEW）的季度行业—县数据，我们实施了两项县级双重差分设计：第一项将先前设有半导体设施的县与其他拥有高科技产业的县进行比较，第二项将拥有半导体制造设施（这些设施是《芯片法案》大部分资金的目标对象）的县与拥有非制造类半导体设施的县进行比较。使用这两种方法，我们发现受影响县的就业受到稳健且正向的影响。这些效应始于参议院通过一项前身法案之时，即预期《芯片法案》签署之际。我们偏好的估计表明，在第一项设计中每个受影响县增加110个就业岗位，在第二项设计中每个受影响县增加180个就业岗位。我们还发现对当地建筑就业具有稳健的正向影响。关于县级总就业和GDP、以及上游投入部门就业的证据则好坏参半。简单的粗略估算（附带保留意见）表明全国直接就业大约15,000-16,000个核心半导体部门就业岗位的ent效应，以及相关部门28,000-35,000个就业岗位的间接效应。", "tags": ["产业政策", "劳动力市场", "供应链"], "extra": {"scholar_name": "Eric Verhoogen", "work_type": "report", "doi": "10.3386/w34625", "versions": ["scholar"]}}, {"uid": "oa:W7118880642", "source": "scholar", "title": "Carbon Border Adjustment Mechanism and Trade Policy: A Quantitative Analysis", "authors": "Haichao Fan, Yuan Mei, Tong Ni, Huanhuan Wang", "venue": "SSRN Electronic Journal", "url": "https://doi.org/10.2139/ssrn.6003654", "date": "2026-01-01", "abstract": "", "summary_zh": "无摘要；标题显示其定量分析碳边境调节机制与贸易政策的互动及影响。", "title_zh": "碳边境调节机制与贸易政策：一项定量分析", "abstract_zh": "", "tags": ["贸易政策", "关税"], "extra": {"scholar_name": "樊海潮", "work_type": "preprint", "doi": "10.2139/ssrn.6003654"}}, {"uid": "oa:W7118393108", "source": "scholar", "title": "Quality Upgrading in Global Supply Chains: Evidence from Colombian Coffee", "authors": "Rocco Macchiavello, Josepa Miquel‐Florensa, Nicolas de Roux, Eric Verhoogen, Mario Bernasconi, Patrick Farrell", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w34610", "date": "2026-01-01", "abstract": "Do the returns to quality upgrading pass through supply chains to primary producers?We explore this question in the context of Colombia's coffee sector, in which market outcomes depend on interactions between farmers, exporters (which operate mills), and international buyers, and contracts are for the most part not legally enforceable.We formalize the hypothesis that quality upgrading is subject to a key hold-up problem: producing high-quality beans requires long-term investments by farmers, but there is no guarantee that an exporter will pay a quality premium when the beans arrive at its mills.An international buyer with sufficient demand for high-quality coffee can solve this problem by imposing a vertical restraint on the exporter, requiring the exporter to pay a quality premium to farmers.Combining internal records from two exporters, comprehensive administrative data, and the staggered rollout of a buyer-driven quality-upgrading program, we find empirical support for the key theoretical predictions, both the lack of pass-through of quality premia under normal circumstances and the possibility of a buyer-driven solution through a vertical restraint.Calibration of the model suggests that one-third to two-thirds of the (substantial) gains from the program accrue to farmers, with the vertical restraint playing a critical role.The results are consistent with the hypotheses that quality upgrading can provide a path to higher incomes for farmers, but also that it is unlikely to be viable under standard market conditions in the sector.", "summary_zh": "研究质量升级收益能否经全球供应链惠及农户，结合哥伦比亚咖啡出口商记录与买家驱动项目发现，纵向约束可使部分收益传导至农户。", "title_zh": "全球供应链中的质量升级：来自哥伦比亚咖啡的证据", "abstract_zh": "质量升级的收益会通过供应链传递给初级生产者吗？我们在哥伦比亚咖啡产业的背景下探讨这一问题。在该产业中，市场结果取决于农民、出口商（其经营加工厂）与国际买家之间的互动，而且合同在很大程度上不具有法律上的可执行性。我们形式化如下假说：质量升级受制于一个关键的套牢问题：生产高质量咖啡豆需要农民进行长期投资，但无法保证当咖啡豆运抵出口商的加工厂时，出口商会支付质量溢价。对高质量咖啡有足够需求的国际买家可以通过对出口商施加纵向约束来解决这一问题，要求出口商向农民支付质量溢价。结合两家出口商的内部记录、全面的行政数据，以及一项由买家驱动的质量升级项目的交错推出，我们为主要理论预测找到了实证支持：既包括正常情形下质量溢价缺乏传递，也包括通过纵向约束实现买家驱动解决方案的可能性。模型校准表明表明，该项目（可观的）收益的三分之一至三分之二归于农民，而纵向约束发挥了关键作用。这些结果与以下假设相一致：质量升级能够为农民提供一条通向更高收入的路径，但在该部门的标准市场条件下，这种升级不太可能可行。", "tags": ["全球价值链", "供应链"], "extra": {"scholar_name": "Eric Verhoogen", "work_type": "report", "doi": "10.3386/w34610", "versions": ["scholar"]}}, {"uid": "oa:W3189134921", "source": "scholar", "title": "Relationship Stickiness, International Trade, and Economic Uncertainty", "authors": "Martin, Julien, Isabelle Méjean, Mathieu Parenti", "venue": "HAL (Le Centre pour la Communication Scientifique Directe)", "url": "https://doi.org/10.1162/rest_a_01396", "date": "2026-01-01", "abstract": "International audience", "summary_zh": "研究关系粘性如何影响国际贸易，并考察经济不确定性在其中的作用与调整机制。", "title_zh": "关系粘性、国际贸易与经济不确定性", "abstract_zh": "国际读者", "tags": ["贸易弹性", "其他"], "extra": {"scholar_name": "Isabelle Mejean", "work_type": "article", "doi": "10.1162/rest_a_01396"}}, {"uid": "oa:W7117133024", "source": "scholar", "title": "Transitivity in International Trade: Evidence from Colombia-U.S. Firm Relationships", "authors": "Alejandra Martinez, Dennis Novy, Carlo Perroni", "venue": "arXiv (Cornell University)", "url": "https://doi.org/10.48550/arxiv.2512.18893", "date": "2025-12-21", "abstract": "A large literature has documented transitivity as a key feature of social networks: individuals are more likely connected with each other if they share common connections with other individuals. We take this idea to trading relationships between firms: firms are more likely to trade with each other if they share common trading partners. Transitivity leads to a clustered pattern of relationship formation and break-up. It is therefore important for understanding how firms meet and how shocks propagate through firm networks. We describe a method for detecting and quantifying transitivity in firm-to-firm transactions, based on systematic deviations from conditional independence across firm-to-firm relationships. We apply the method to Colombia-U.S. exporter-importer data and show in counterfactuals that transitivity is a significant and economically meaningful factor in how firm networks adjust to cost shocks.", "summary_zh": "研究企业间贸易关系的传递性，提出基于条件独立偏离的检测方法，并发现其对哥美企业网络应对成本冲击具有显著影响。", "title_zh": "国际贸易中的传递性：来自哥伦比亚—美国企业关系的证据", "abstract_zh": "大量文献已将传递性记录为社会网络的一个关键特征：如果个体与其他个体拥有共同联系，那么个体彼此相连的可能性更高。我们将这一思想引入企业间的贸易关系：如果企业拥有共同的贸易伙伴，那么企业彼此进行贸易的可能性更高。传递性导致关系形成和断裂呈现集聚模式。因此，它对于理解企业如何相遇以及冲击如何通过企业网络传播十分重要。我们描述了一种检测和量化企业间交易中传递性的方法，该方法基于企业间关系中相对于条件独立性的系统性偏离。我们将该方法应用于哥伦比亚—美国出口商—进口商数据，并在反事实分析中表明，传递性是企业网络对成本冲击作出调整时一个显著且具有经济意义的因素。", "tags": ["供应链", "方法论"], "extra": {"scholar_name": "Dennis Novy", "work_type": "preprint", "doi": "10.48550/arxiv.2512.18893"}}, {"uid": "oa:W4417450444", "source": "scholar", "title": "Playing with blocs: Quantifying decoupling", "authors": "Barthélémy Bonadio, Zhen Huo, Elliot Kang, Andrei A. Levchenko, Nitya Pandalai-Nayar, Hiroshi Toma", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2025.104204", "date": "2025-12-18", "abstract": "We adopt a data-driven approach to measure trade decoupling over 2015-2023. Countries are classified into three groups according to changes in their data-inferred trade costs with the US and China: those shifting toward the US bloc, those shifting toward the China bloc, and those with no change in alignment. We document that while cross-bloc trade costs rose, they were accompanied by falling within-bloc trade costs, with average trade costs falling marginally in line with global trade resilience. We use a quantitative model to compute the real income effects of this reconfiguration of trade costs. Model simulations suggest that real income in the median country in the world, and the median country within each bloc, rose by 0.4-0.6%. Finally, we find a modest amount of bloc misalignment: the median country would be better off switching blocs. These results suggest that trade decoupling may not follow trade-driven economic interests.", "summary_zh": "用2015—2023年数据推断贸易成本划分中美集团，量化脱钩的收入效应，发现集团内成本下降、收入略升且存在错配。", "title_zh": "与集团共舞：量化脱钩", "abstract_zh": "我们采用数据驱动的方法衡量2015-2023年期间的贸易脱钩。根据数据推断出的与美国和中国的贸易成本变化，将国家分为三组：向美国阵营转移的国家、向中国阵营转移的国家，以及阵营归属未发生变化的国家。我们记录到，虽然跨阵营贸易成本上升，但伴随而来的是阵营内贸易成本下降，平均贸易成本小幅下降，这与全球贸易韧性相一致。我们使用一个定量模型计算这种贸易成本重构的实际收入效应。模型模拟表明，世界的中位数国家以及每个阵营内的中位数国家的实际收入上升了0.4-0.6%。最后，我们发现存在适度的阵营错配：中位数国家如果转换阵营会变得更好。这些结果表明，贸易脱钩可能并不遵循贸易驱动的经济利益。", "tags": ["贸易政策", "全球价值链", "供应链"], "extra": {"scholar_name": "Andrei Levchenko", "work_type": "article", "doi": "10.1016/j.jinteco.2025.104204"}}, {"uid": "oa:W4417350931", "source": "scholar", "title": "New Industrial Policy", "authors": "Ahmad Lashkaripour, Po-Shyan Wu", "venue": "Oxford Research Encyclopedia of Economics and Finance", "url": "https://doi.org/10.1093/acrefore/9780190625979.013.1014", "date": "2025-12-16", "abstract": "Abstract Once dismissed as a relic of mercantilist economic thinking, industrial policy has made a notable comeback. The return of industrial policy is propelled by rising geopolitical tensions, escalating environmental crises, and growing doubts about the efficiency of unregulated markets. Proponents of industrial policy argue that government interventions can address market failures due to scale economies, market power, and environmental externalities. This resurgence, however, warrants critical examination. The conventional argument against industrial policy is grounded in the First Welfare Theorem, which asserts that in a neoclassical setting, marked by perfect competition, no externalities, and frictionless markets, market forces alone would yield efficient outcomes. In practice, however, the economy deviates markedly from this theoretical benchmark. Various frictions and externalities prevent real-world economies from operating on the production possibility frontier, thereby providing an economic rationale for industrial policy interventions. Nonetheless, the effectiveness of government efforts to correct these market failures remains a subject of ongoing debate. This is an opportune moment to pause and critically reevaluate industrial policy using a framework that captures the realities of modern economies. Today’s economies are internationally integrated and operate within complex and expansive supply chains. And industrial policies are no longer limited to domestic issues but also target international issues and global market failures, such as climate change. Policymakers must navigate a delicate balance between domestic welfare gains and unintended global consequences, even when policy measures are designed primarily to correct failures within the domestic economy. The theoretical framework provides a foundation for critically examining recent empirical evidence on the outcomes of industrial policy, such as South Korea’s Heavy and Chemical Industry (HCI) drive and the varied interventions pursued by China. A newer strand of research employs forward-looking, model-based methods. Structural models, grounded in empirically estimated parameters, can be used to forecast the potential gains from optimal or constrained-optimal policies. Overall, the existing literature presents a nuanced evaluation of industrial policy. Historical episodes like South Korea’s HCI drive are often cited as examples of success, with the balance of evidence providing some support for this view. However, when unintended consequences are fully accounted for, the overall effectiveness of such policies becomes more ambiguous. Moreover, today’s heightened global economic integration introduces new complexities for implementing industrial policy. In an era of heightened trade integration, it is increasingly uncertain whether unilateral policy actions can replicate the outcomes achieved in the past. Recent studies underscore the growing importance of coordinated efforts, at least at the regional level—a view reverberated by the ‘Draghi report’ on EU competitiveness, commissioned by the President of the European Commission and released by Mario Draghi in 2024.", "summary_zh": "综述产业政策回归的动因、理论框架与实证证据，强调国际一体化与供应链下政策效果及协调的重要性。", "title_zh": "新产业政策", "abstract_zh": "摘要 产业政策曾被视为重商主义经济思想的遗物而遭摒弃，如今却显著回归
