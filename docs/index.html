f", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Financial Cooperation in a Fragmented World", "title_zh": "", "authors": [{"name": "Javier Bianchi", "aff": "Federal Reserve Bank of Minneapolis"}, {"name": "Sebastian Horn", "aff": "University of Hamburg"}, {"name": "Giovanni Rosso", "aff": "University of Oxford"}, {"name": "César Sosa-Padilla", "aff": "University of Notre Dame and NBER"}], "discussants": [{"name": "Antonio Coppola", "aff": "The University of Chicago and NBER"}], "schedule": "2026-03-27 10:55 am", "tags": ["其他"], "abstract": "", "abstract_zh": "", "intro_zh": "本文基于1910—2020年双边官方贷款数据，研究地缘政治风险如何影响金融碎片化与国际风险分担，并在有限承诺模型中引入地缘政治外部性。核心发现是地缘政治紧张会促使官方贷款流向盟友并削弱风险分担。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232465/f232465.pdf", "slides_url": "https://conference.nber.org/conf_papers/f232465/f232465.slides.pdf", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Misallocation due to Incomplete Markets", "title_zh": "", "authors": [{"name": "David Baqaee", "aff": "University of California, Los Angeles and NBER"}, {"name": "Ariel Burstein", "aff": "University of California, Los Angeles and NBER"}], "discussants": [{"name": "Eduardo Dávila", "aff": "Yale University and NBER"}], "schedule": "2026-03-27 1:00 pm", "tags": [], "abstract": "", "abstract_zh": "", "intro_zh": "", "journal": "", "pdf_url": "https://baqaee.scholar.ss.ucla.edu/wp-content/uploads/sites/38/2026/03/Incomplete_markets_v3.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Industrial Policies, Global Imbalances and Technological Hegemony", "title_zh": "", "authors": [{"name": "Ambrogio Cesa-Bianchi", "aff": "Bank of England"}, {"name": "Andrea Ferrero", "aff": "University of Oxford"}, {"name": "Luca Fornaro", "aff": "Center for Research in International Economics"}, {"name": "Martin Wolf", "aff": "University of St. Gallen"}], "discussants": [{"name": "William Witheridge", "aff": "University of Maryland, College Park"}], "schedule": "2026-03-27 2:05 pm", "tags": ["产业政策", "贸易政策", "其他"], "abstract": "We provide a framework that connects industrial policies to global imbalances and technological hegemony, and describe some empirical facts consistent with our model. We study the international spillovers triggered by industrial policies promoting high-tech sectors. Since high-tech goods and services are typically traded internationally, these policies boost the supply of tradable goods. Moreover, industrial policies lead to trade surpluses if the government pursues an \\textit{unbalanced policy mix}, such that domestic demand does not rise as much as supply. These surpluses are absorbed by the rest of the world, which in response runs trade deficits. Absent policy interventions, trade deficits reduce the competitiveness of the domestic tradable sector, stifling innovation and productivity growth. Innovation policies can help the rest of the world to mitigate these negative spillovers.", "abstract_zh": "我们提供了一个将产业政策与全球失衡和技术霸权联系起来的框架，并描述了一些与我们的模型相一致的经验事实。我们研究促进高科技部门的产业政策所引发的国际溢出效应。由于高科技产品和服务通常在国际上交易，这些政策会提高可贸易品的供给。此外，如果政府推行不平衡的政策组合，使得国内需求的上升幅度不如供给那么大，产业政策就会导致贸易顺差。这些顺差被世界其他地区吸收，而世界其他地区则相应出现贸易逆差。在没有政策干预的情况下，贸易逆差会降低国内可贸易部门的竞争力，抑制创新和生产率增长。创新政策可以帮助世界其他地区缓解这些负面溢出效应。", "intro_zh": "本文构建框架连接产业政策、全球失衡与技术霸权，并给出与模型一致的实证事实。研究高科技产业政策的国际溢出：不平衡政策组合造成顺差与他国逆差，削弱可贸易部门竞争力并抑制创新；创新政策可缓解负面溢出。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f234057/f234057.pdf", "slides_url": "https://conference.nber.org/conf_papers/f234057/f234057.slides.pdf", "wp_num": "", "pub_url": "https://openalex.org/W7212465226", "state": "oa"}, {"title": "The Geopolitics of Industrial Policy: Evidence from Export Credits", "title_zh": "", "authors": [{"name": "Adrien Matray", "aff": "Federal Reserve Bank of Atlanta"}, {"name": "Karsten Müller", "aff": "National University of Singapore"}, {"name": "Zekai Shen", "aff": "Bocconi University"}, {"name": "Chenzi Xu", "aff": "University of California, Berkeley and NBER"}], "discussants": [{"name": "Laura Alfaro", "aff": "Harvard University and NBER"}], "schedule": "2026-03-27 3:10 pm", "tags": ["产业政策", "贸易政策"], "abstract": "We examine the role of geopolitical competition in officially supported export credits, one of the most widely used tools of industrial policy. We construct several new datasets and provide the following evidence that geopolitical factors in export credit markets play an important role for understanding global financial and trade flows: (i) export credits account for over 60% of developing countries' external debt and often over half of their imports; (ii) geopolitical alignment is a strong predictor of export credit allocation, both unconditionally and in response to country risk shocks; (iii) quasi-random rotation into the UN Security Council, which temporarily increases countries' geopolitical importance, leads to an inflow of export credits from permanent members; (iv) in recent years, China has provided more export credits than all OECD countries combined; and (v) the importance of geopolitical factors in export credits among OECD economies has increased over time and is now comparable to that of geopolitical competitors, particularly China. Taken together, our findings highlight how countries actively pursue their industrial policy in line with geopolitical goals.", "abstract_zh": "我们考察地缘政治竞争在官方支持的出口信贷中的作用，出口信贷是产业政策最广泛使用的工具之一。我们构建了若干新数据集，并提供以下证据表明出口信贷市场中的地缘政治因素对于理解全球金融与贸易流动具有重要作用：（i）出口信贷占发展中国家外债的60%以上，且常常占其进口的一半以上；（ii）地缘政治对齐是出口信贷配置的强预测因素，无论是在无条件情况下，还是在应对国家风险冲击时；（iii）准随机轮值进入联合国安理会会暂时提升国家的地缘政治重要性，并导致来自常任理事国的出口信贷流入；（iv）近年来，中国提供的出口信贷超过所有OECD国家之和；（v）在OECD经济体中，出口信贷中地缘政治因素的重要性随时间上升，如今已与地缘政治竞争对手（尤其是中国）的重要性相当。综上，我们的发现凸显了各国如何积极按照地缘政治目标推行其产业政策。", "intro_zh": "本文研究地缘政治竞争如何影响官方出口信贷。作者构建新数据集，发现出口信贷占发展中国家外债超60%，地缘政治对齐显著预测信贷配置；安理会轮值带来常任理事国信贷流入，中国规模已超OECD合计。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232422/f232422.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The Tariff Tax Cut: Tariffs as Revenue", "title_zh": "", "authors": [{"name": "George A. Alessandria", "aff": "University of Rochester and NBER"}, {"name": "Jiaxiaomei Ding", "aff": "University of Rochester"}, {"name": "Shafaat Y. Khan", "aff": "Syracuse University"}, {"name": "Carter B. Mix", "aff": "Federal Reserve Board of Governors"}], "discussants": [{"name": "Stephanie Schmitt-Grohé", "aff": "Columbia University and NBER"}], "schedule": "2026-03-27 4:15 pm", "tags": ["关税", "贸易政策"], "abstract": "We evaluate the aggregate effects of a change in tariffs on the US and world economies when tariff revenue is used to enact fiscal reform.Our model combines a standard international model of fiscal policy with taxes and a dynamic model of trade participation and tariffs that allows for uncertainty and transitions.We consider effects of permanent and temporary tariffs-with and without retaliation-when tariff revenue is used to reduce taxes on capital or labor or to subsidize investment.Compared to a lump sum redistribution, using tariff revenue for these reforms always boosts economic activity.Key to our analysis is the effect of trade dynamics on import substitution, such that tariff revenue after an increase in tariffs is higher in the short run than in the long run.When increasing the tariff by 20 percentage points, the revenue raised is largest when tariffs are temporary, unilateral, and used to subsidize investment, increasing by about 2 percent of GDP.This case also yields a large temporary increase in the trade balance.We find the welfaremaximizing unilateral tariff is close to 18 percent when tariff revenue is used to subsidize investment compared to 0 percent under a lump sum redistribution.We also find cutting capital taxes does not generate as much growth as introducing an investment subsidy since tariffs raise the price of investment substantially.", "abstract_zh": "当关税收入被用于实施财政改革时，我们评估关税变化对美国及世界经济的总体效应。我们的模型将一个含税收的标准国际财政政策模型与一个允许不确定性和转移动态的贸易参与及关税动态模型相结合。我们考察永久性和临时性关税——包括有报复和无报复——的影响，此时关税收入用于降低资本税或劳动税，或用于补贴投资。与一次性总额再分配相比，将关税收入用于这些改革总是会提振经济活动。我们分析的关键在于贸易动态对进口替代的影响，即提高关税后的关税收入在短期高于在长期。当关税提高20个百分点时，筹集的收入在关税为临时性、单边且用于补贴投资时最大，增加约GDP的2%。该情形还导致贸易余额大幅暂时增加。我们发现，当关税收入用于补贴投资时，福利最大化的单边关税接近18%，相比之下，在一次性总……下为0%……再分配。我们还发现，削减资本税所带来的增长不如引入投资补贴，因为关税大幅提高了投资价格。", "intro_zh": "论文研究将关税收入用于减税或投资补贴对美世界经济的影响。作者结合财政政策与动态贸易参与模型，考察永久/临时关税及报复情形，发现临时单边关税用于投资补贴增收最大，并能提升经济活动和福利。", "journal": "", "pdf_url": "https://drive.google.com/file/d/1TxWEXleQ9hWGgHPnVFeRmfFKg98ZFQRD/view", "slides_url": "", "wp_num": "w33784", "pub_url": "https://doi.org/10.3386/w33784", "state": "oa"}]}, {"conf_id": "n1047616", "title": "International Trade and Investment Program Meeting, Fall 2025", "type_name": "Program Meeting", "start_date": "2025-11-21", "end_date": "2025-11-22", "display_date": "November 21-22, 2025", "location": "SIEPR, Stanford University, 366 Galvez Street, Stanford, CA", "organizers": "Stephen J. Redding", "url": "https://www.nber.org/conferences/international-trade-and-investment-program-meeting-fall-2025", "agenda": "done", "papers": [{"title": "Geoeconomic Pressure", "title_zh": "", "authors": [{"name": "Christopher Clayton", "aff": "Yale University and NBER"}, {"name": "Antonio Coppola", "aff": "The University of Chicago and NBER"}, {"name": "Matteo Maggiori", "aff": "Stanford University and NBER"}, {"name": "Jesse Schreger", "aff": "Columbia University and NBER"}], "discussants": [], "schedule": "2025-11-21 9:30 am", "tags": ["贸易政策", "出口管制", "方法论"], "abstract": "Geoeconomic pressure-the use of existing economic relationships by governments to achieve geopolitical or economic goals-is a prominent feature of global power dynamics.This paper introduces a methodology using large language models (LLMs) to systematically identify the application of and response to geoeconomic pressure from large textual corpora.We classify which governments apply pressure to which foreign targets, using which instruments, firms, and products.We demonstrate that firms affected by tariffs respond primarily with price changes whereas firms affected by export controls respond disproportionately by investing in research and development.We document significant heterogeneity in how firms respond to pressure based on whether their home government is applying the pressure, whether their home country is the recipient of the pressure, or whether they are based in an affected third party country.Finally, we quantify the degree of measurement uncertainty generated by the LLM-based analysis by comparing the classifications across multiple open-weight models as well as considering a wide range of variations of our prompts.", "abstract_zh": "地缘经济压力——政府利用现有经济关系实现地缘政治或经济目标——是全球权力动态的一个突出特征。本文提出一种使用大语言模型（LLMs）的方法，以从大型文本语料库中系统识别地缘经济压力的施加与回应。我们归类哪些政府对哪些外国目标施加压力，使用哪些工具、企业和产品。我们证明，受关税影响的企业主要通过价格变化作出回应，而受出口管制影响的企业则不成比例地通过投资于研究与开发作出回应。我们记录了企业应对压力的显著异质性，依据是其母国政府是否为压力施加方、其母国是否为压力接受方，还是其位于受影响的第三方国家。最后，我们通过比较多个开放权重模型的分类结果，以及考虑我们的提示词的广泛变化，量化基于LLM的分析所产生的测量不确定性程度。", "intro_zh": "研究政府利用既有经济关系施压的地缘经济压力，用大语言模型从文本中识别施压与应对。发现关税主要引发价格调整，出口管制更多促研发，并量化测量不确定性。", "journal": "", "pdf_url": "https://globalcapitalallocation.s3.us-east-2.amazonaws.com/CCMS_AI_Draft.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34020", "state": "oa"}, {"title": "Multinational Production and Trade Policy", "title_zh": "", "authors": [{"name": "Agustin Gutierrez", "aff": "University of Wisconsin - Madison"}, {"name": "Sebastian Heise", "aff": "Federal Reserve Bank of New York"}, {"name": "Nicolo Rizzotti", "aff": "The University of Chicago"}, {"name": "Felix Tintelnot", "aff": "Duke University and NBER"}], "discussants": [], "schedule": "2025-11-21 10:45 am", "tags": ["关税", "贸易政策", "贸易弹性"], "abstract": "", "abstract_zh": "", "intro_zh": "本文用美国企业交易数据研究2018—2019对华关税下跨国生产对贸易流和最优关税的影响，发现关联方与独立贸易调整存在差异，价格效应随加总层次变化，并在模型中分析贸易弹性与最优关税。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f229959/f229959.pdf", "slides_url": "https://conference.nber.org/conf_papers/f229959/f229959.slides.pdf", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Trade Within Multinational Boundaries", "title_zh": "", "authors": [{"name": "Laura Alfaro", "aff": "Harvard University and NBER"}, {"name": "Paola Conconi", "aff": "University of Oxford"}, {"name": "Fariha Kamal", "aff": "Federal Reserve Board of Governors"}, {"name": "Zachary Kroff", "aff": "Analysis Group"}], "discussants": [], "schedule": "2025-11-21 12:00 pm", "tags": ["全球价值链", "供应链", "企业异质性"], "abstract": "Traditional theories of firm boundaries predict trade between vertically related units of the same firm. Using novel data that combine a comprehensive mapping of U.S. multinationals’ production networks with their customs filings, we uncover a strong positive relationship between input-output linkages and trade between parents and their affiliates. We also find that intrafirm trade is prevalent, particularly between geographically proximate units: three-quarters of affiliates in North America trade with their U.S. parent. These results overturn prior findings based on survey data on intrafirm trade. Administrative intrafirm records enable correcting measurement errors in survey data, reconciling traditional theories with empirical evidence. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "企业边界的传统理论预测同一企业纵向关联单位之间的贸易。使用将美国跨国公司生产网络的全面映射与其海关申报相结合的新数据，我们发现投入产出联系与母公司及其关联公司之间的贸易之间存在强正相关关系。我们还发现企业内部贸易很普遍，尤其是在地理上邻近的单位之间：北美四分之三的关联公司与它们的美国母公司进行贸易。这些结果推翻了此前基于企业内部贸易调查数据的发现。行政性的企业内部记录能够纠正调查数据中的测量误差，使传统理论与经验证据相协调。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "intro_zh": "本文结合美国跨国公司生产网络与海关申报数据，研究企业边界内贸易。发现投入产出联系显著促进母子公司贸易，内部贸易普遍且集中于地理邻近单位；行政记录可纠正调查误差，调和传统理论。", "journal": "CESifo", "pdf_url": "https://conconi.ulb.be/ACKK.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w33887", "state": "oa"}, {"title": "Tariffs and State Capacity: A Specific Example", "title_zh": "", "authors": [{"name": "Erik Madsen", "aff": "New York University"}, {"name": "Martin Rotemberg", "aff": "New York University"}, {"name": "Sharon Traiberman", "aff": "New York University and NBER"}, {"name": "Shizhuo Wang", "aff": "New York University"}], "discussants": [], "schedule": "2025-11-21 2:00 pm", "tags": ["关税", "贸易史", "贸易政策"], "abstract": "Evasion is a key obstacle to raising customs revenue.We study how improved administrative capacity enables governments to combat evasion by redesigning tariff codes.Using newly compiled historical records from the Early American Republic, we show that as Customs administration matured, the tariff code became more complex and more reliant on specific (quantity-based) tariffs in preference to ad valorem (value-based) ones.We develop an equilibrium model of tariff administration with costly verification of declared values that explains these twin trends: Administrative capacity allows Customs officials to disaggregate goods and assess tailored specific tariffs, obviating misvaluation while minimizing price distortions.The model successfully predicts several additional empirical patterns: Specific tariffs tend to be assessed on goods that are homogeneous, cheap, or lightly taxed.", "abstract_zh": "逃漏税是提高关税收入的一个关键障碍。我们研究改进行政能力如何使政府能够通过重新设计关税税则来打击逃漏税。利用新汇编的美国早期共和国历史记录，我们表明，随着海关管理日趋成熟，关税税则变得更加复杂，并更加依赖从量（按数量计征）关税而非从价（按价值计征）关税。我们构建了一个关税行政均衡模型，其中对申报价值进行核验是有成本的，该模型解释了上述两个趋势：行政能力使海关官员能够对商品进行细分并征收量身定制的从量关税，从而消除错误估值，同时使价格扭曲最小化。该模型成功预测了若干额外的经验模式：从量关税往往对同质、廉价或轻税商品征收。", "intro_zh": "研究早期美国海关行政能力如何通过重构关税编码打击逃税；发现行政成熟使税则更复杂并更依赖从量税，模型解释该趋势并预测从量税适用于同质、低价或轻税商品。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f228387/f228387.pdf", "slides_url": "", "wp_num": "w34143", "pub_url": "https://doi.org/10.2139/ssrn.5395429", "state": "oa"}, {"title": "The Spatial Distribution of Income in Cities: New Global Evidence and Theory", "title_zh": "", "authors": [{"name": "Peter Deffebach", "aff": "Boston University"}, {"name": "David Lagakos", "aff": "Boston University and NBER"}, {"name": "Yuhei Miyauchi", "aff": "Boston University and NBER"}], "discussants": [], "schedule": "2025-11-21 3:15 pm", "tags": ["劳动力市场", "其他"], "abstract": "We study how the spatial distribution of income and commuting patterns within cities vary across the development spectrum, drawing on new granular data from 50,000 neighborhoods in 121 cities across developed and developing countries. We document that in developing countries, poorer urban households are significantly more likely to live far from city centers, in hilly terrain, and near rivers. These patterns are absent or reversed in developed cities. Commuting shares decline more sharply with distance in less developed countries, indicating higher commuting costs that exacerbate spatial inequality in job access. Job-access measures are considerably worse for the urban poor than for the urban rich in developing countries, while the opposite is true in developed countries. We interpret these findings in a quantitative urban model and show that a parsimonious set of factors—nonhomothetic preferences over amenities, commuting costs, and the spatial concentration of jobs—helps explain most of the cross-country patterns we document. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "我们研究城市内部收入的空间分布和通勤模式如何随发展水平而变化，所用数据来自发达国家和发展中国家121个城市中50,000个社区的新细粒度数据。我们记录到，在发展中国家，较贫困的城市家庭显著更可能居住在远离市中心、山地地形以及河流附近。这些模式在发达城市中不存在或出现相反情况。在欠发达国家，通勤份额随距离下降得更急剧，表明更高的通勤成本加剧了就业可达性的空间不平等。在发展中国家，城市穷人的就业可达性指标明显差于城市富人，而在发达国家则相反。我们在一个量化城市模型中解释这些发现，并表明一组简约的因素——对便利设施的非位似偏好、通勤成本以及就业的空间集中——有助于解释我们记录的大多数跨国模式。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "intro_zh": "利用121个城市5万个社区的新细粒度数据，比较发达国家与发展中国家城市内收入空间分布和通勤模式。发现发展中国家穷人更远离市中心且通勤成本更高，就业可达性更差，并用定量城市模型解释这些跨国规律。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f229003/f229003.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34505", "state": "oa"}, {"title": "Market Distortion under Weak State: Evidence from China’s Millennia-Long Salt Administration", "title_zh": "", "authors": [{"name": "Ying Bai", "aff": "The University of Hong Kong (HKU)"}, {"name": "Ruixue Jia", "aff": "University of California, San Diego and NBER"}, {"name": "Xian Jiang", "aff": "University of California, Davis"}, {"name": "Runnan Wang", "aff": "Wuhan University"}, {"name": "Daniel Xu", "aff": "Duke University and NBER"}], "discussants": [], "schedule": "2025-11-21 4:30 pm", "tags": ["贸易史", "产业政策"], "abstract": "This paper examines the market consequences of weak fiscal capacity through the lens of China's salt administration system---a state-enforced monopoly that endured for over a thousand years. To facilitate tax collection, the state established rigid production and distribution districts that prohibited cross-district trade. We show that this administrative simplification, while easing taxation, resulted in persistent spatial misallocation and welfare losses. Drawing on novel county-level data on salt production from 960 to 1920 and exploiting temporal variation in salt district boundaries across five dynasties, we find that administrative market access shaped the locations of salt production. We then estimate a structural model of a state monopoly choosing production sites under administrative constraints. Counterfactual simulations indicate that removing district restrictions would lower salt prices, boost consumption, and raise fiscal revenue. Production would shift from inland to coastal areas, improving overall efficiency. More broadly, our analysis provides a framework for quantifying the costs of state simplification, a common response to limited fiscal capacity in both historical and contemporary developing economies.", "abstract_zh": "本文以中国盐政制度——一种国家强制实施并延续一千多年的垄断——为视角，考察财政能力薄弱的市场后果。为便利税收征缴，国家设立了严格固定的生产和运销区域，禁止跨区贸易。我们表明，这种行政简化虽然便利了征税，却导致了持续的空间错配和福利损失。基于960年至1920年关于食盐生产的新县级数据，并利用五个朝代盐区边界的时间变化，我们发现行政性市场准入塑造了食盐生产区位。随后，我们估计了一个在行政约束下选择生产地点的国家垄断结构模型。反事实模拟表明，取消盐区限制将降低盐价、促进消费并增加财政收入。生产将从内陆地区转向沿海地区，从而提高整体效率。更广泛地说，我们的分析提供了一个框架，用于量化国家简化的成本，而国家简化是历史上和当代发展中经济体对有限财政能力的常见应对。", "intro_zh": "论文利用960—1920年县级盐业数据及五个王朝盐区边界变动，研究弱财政能力下行政垄断造成的市场扭曲。结构模型与反事实表明，取消盐区限制会降低盐价、增加消费和财政收入，并使生产由内陆转向沿海、提升效率。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f229940/f229940.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Aggregate Efficiency with Heterogeneous Agents", "title_zh": "", "authors": [{"name": "David Baqaee", "aff": "University of California, Los Angeles and NBER"}, {"name": "Ariel Burstein", "aff": "University of California, Los Angeles and NBER"}], "discussants": [], "schedule": "2025-11-22 9:00 am", "tags": ["方法论", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "研究异质性家庭下的总效率，将成本收益分析与总TFP拓展到一般均衡，并考虑再分配限制。提出在保持每个主体不低于现状时资源可节省比例，将其转化为效用最大化问题，用支出和价格弹性等可观测量刻画效率变化。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f229875/f229875.pdf", "slides_url": "", "wp_num": "w34176", "pub_url": "https://doi.org/10.2139/ssrn.5404075", "state": "bare"}, {"title": "Global Networks, Monetary Policy and Trade", "title_zh": "", "authors": [{"name": "Ṣebnem Kalemli-Özcan", "aff": "Brown University and NBER"}, {"name": "Can Soylu", "aff": "Brown University"}, {"name": "Muhammed A. Yildirim", "aff": "Harvard University"}], "discussants": [], "schedule": "2025-11-22 10:15 am", "tags": ["关税", "全球价值链", "汇率"], "abstract": "We develop a novel framework to study the interaction between monetary policy and trade.Our New Keynesian open economy model incorporates international production networks, sectoral heterogeneity in price rigidities, and trade distortions.We decompose the general equilibrium response to trade shocks into distinct channels that account for demand shifts, policy effects, exchange rate adjustments, expectations, price stickiness, and input-output linkages.Tariffs act simultaneously as demand and supply shocks, leading to endogenous fragmentation through changes in trade and production network linkages.We show that the net impact of tariffs on domestic inflation, output, employment, and the dollar depends on the endogenous monetary policy response in both the tariff-imposing and tariff-exposed countries, within a global general equilibrium framework.Our quantitative exercise replicates the observed effects of the 2018 tariffs on the U.S. economy and predicts a 1.6 pp decline in U.S. output, a 0.8 pp rise in inflation, and a 4.8% appreciation of the dollar in response to a retaliatory trade war linked to tariffs announced on \"Liberation Day.\" Tariff threats, even in the absence of actual implementation, are self-defeatingleading to a 4.1% appreciation of the dollar, 0.6% deflation, and a 0.7 pp decline in output, as agents re-optimize in anticipation of future distortions.Dollar appreciates less or even can depreciate under retaliation, tariff threats, and increased global uncertainty.", "abstract_zh": "我们构建了一个新颖框架来研究货币政策与贸易之间的相互作用。我们的新凯恩斯主义开放经济模型纳入了国际生产网络、价格刚性的部门异质性以及贸易扭曲。我们将对贸易冲击的一般均衡响应分解为不同渠道，这些渠道分别涵盖需求变动、政策效应、汇率调整、预期、价格黏性和投入产出联系。关税同时充当需求冲击和供给冲击，并通过贸易与生产网络联系的变化导致内生碎片化。我们表明，在一个全球一般均衡框架内，关税对国内通胀、产出、就业和美元的净影响取决于征收关税国和受关税影响国的内生货币政策反应。我们的定量分析复现了2018年关税对美国经济观察到的效应，并预测美国出现1.6个百分点的下降。产出、通胀上升0.8个百分点，以及美元升值4.8%，作为对与“解放日”宣布的关税相关的报复性贸易战的反应。关税威胁，即使没有实际实施，也是自败的，导致美元升值4.1%、0.6%的通缩和产出下降0.7个百分点，因为经济主体在预期未来扭曲的情况下重新优化。在报复、关税威胁和全球不确定性上升的情况下，美元升值幅度较小，甚至可能贬值。", "intro_zh": "本文构建含国际生产网络、部门价格刚性与贸易扭曲的新凯恩斯开放经济模型，研究货币政策与贸易互动并分解贸易冲击渠道。量化显示关税兼具需求与供给冲击，其产出、通胀、就业和美元效应取决于各国货币政策反应。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f229897/f229897.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w33686", "state": "oa"}, {"title": "Unbalanced Financial Globalization", "title_zh": "", "authors": [{"name": "Damien Capelle", "aff": "International Monetary Fund"}, {"name": "Bruno Pellegrino", "aff": "Columbia University and NBER"}], "discussants": [], "schedule": "2025-11-22 11:30 am", "tags": ["其他", "方法论"], "abstract": "We use a dynamic spatial general equilibrium model of international investment and production to investigate the real implications of the last five decades of financial globalization. We introduce a wedge accounting framework to estimate country- and time-varying measures of outward and inward Revealed Financial Openness (RFO). These wedges are meant to capture all impediments to cross-border investment, rather than explicit policy measures alone. We show how to identify these wedges for a large panel of countries using limited publicly available data on national accounts and external asset and liability positions since the 1970s. Our analysis reveals striking cross-country differences in the pace and direction of financial opening: wealthier countries have become relatively more open to foreign capital inflows, while poorer countries have become relatively more open to capital outflows, a phenomenon we call “Unbalanced Financial Globalization.” Counterfactual simulations show that this unbalanced financial globalization has worsened capital allocation, resulting in a 5.9% decrease in world GDP, a 3.4% rise in cross-country income inequality, lower wages in poorer countries, and a decline in rates of return on capital in richer countries. In contrast, if financial integration had been uniform, the improved allocation of capital would have reduced income inequality, and increased global GDP. These findings underscore the crucial role of spatial heterogeneity in shaping the real impact of international capital markets integration.", "abstract_zh": "我们使用一个国际投资与生产的动态空间一般均衡模型，考察过去五十年金融全球化的实际影响。我们引入一个楔子核算框架，以估计随国家和时间变化的对外和对内显示性金融开放度（Revealed Financial Openness，RFO）指标。这些楔子旨在捕捉跨境投资的所有障碍，而不仅仅是显性政策措施。我们展示了如何在自20世纪70年代以来关于国民账户以及对外资产和负债头寸的有限公开可得数据基础上，为一大组国家识别这些楔子。我们的分析揭示了各国在金融开放的速度和方向上存在显著差异：较富裕的国家对外国资本流入已变得相对更加开放，而较贫穷的国家对资本流出已变得相对更加开放，我们将这一现象称为“不平衡的金融全球化”。反事实模拟表明，这种不平衡的金融全球化恶化了资本配置，导致世界GDP下降5.9%、跨国收入不平等上升3.4%、较贫穷国家的工资下降，以及较富裕国家的资本回报率下降。相反，如果金融一体化是均等的，资本配置的改善本会降低收入不平等，并提高全球GDP。这些发现凸显了空间异质性在塑造国际资本市场一体化实际影响中的关键作用。", "intro_zh": "本文构建国际投资与生产的动态空间一般均衡模型，估算各国金融开放楔子，发现富国更开放资本流入、穷国更开放资本流出，这种不平衡金融全球化恶化资本配置并使全球GDP下降5.9%。", "journal": "CESifo", "pdf_url": "https://conference.nber.org/conf_papers/f228184/f228184.pdf", "slides_url": "", "wp_num": "w34121", "pub_url": "https://doi.org/10.65864/0rgfwmrlao", "state": "oa"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('page-data').textContent);
const SOURCES = [
  {key:'all',    label:'全部'},
  {key:'top5',   label:'Top-5 期刊'},
  {key:'nber',   label:'NBER'},
  {key:'scholar',label:'学者论文'},
  {key:'tweet',  label:'推文'},
  {key:'event',  label:'NBER 会议'},
];
const RECIPIENT = '21300680261@m.fudan.edu.cn';
const state = {tab:'all', range:30, q:'', scholar:'', rosterField:'', theme:''};

const WEEK = ['日','一','二','三','四','五','六'];
function fmtDate(d){
  if(!d) return '日期未知';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return `${dt.getMonth()+1}月${dt.getDate()}日 星期${WEEK[dt.getDay()]}`;
}
function daysAgo(dateStr){
  const dt = new Date(dateStr + 'T00:00:00');
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}

/* 顶部统计与学者下拉（计数随筛选联动，在 render 里更新） */
(function init(){
  const meta = document.getElementById('metaRow');
  meta.innerHTML = `
    <span class="chip">数据截至 <b>${DATA.generated_at}</b></span>
    <span class="chip"><span class="dot top5"></span>Top-5 <b id="c-top5">0</b></span>
    <span class="chip"><span class="dot nber"></span>NBER <b id="c-nber">0</b></span>
    <span class="chip"><span class="dot scholar"></span>学者论文 <b id="c-scholar">0</b></span>
    <span class="chip"><span class="dot tweet"></span>推文 <b id="c-tweet">0</b></span>
    <span class="chip"><span class="dot event"></span>NBER 会议 <b id="c-event">0</b></span>
    <button id="rosterBtn" aria-pressed="false">学者名单</button>`;

  const names = new Map();
  DATA.items.forEach(it => {
    const n = it.extra && it.extra.scholar_name;
    if(n) names.set(n, (names.get(n)||0)+1);
  });
  const sel = document.getElementById('scholarFilter');
  [...names.keys()].sort((a,b)=>a.localeCompare(b,'zh')).forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = `${n} (${names.get(n)})`;
    sel.appendChild(opt);
  });
})();

/* 学者名单独立视图（非分类）：页头按钮切换 */
function setRoster(on){
  state.tab = on ? 'roster' : 'all';
  const btn = document.getElementById('rosterBtn');
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  document.querySelector('.toolbar').style.display = on ? 'none' : 'flex';
  document.querySelectorAll('#tabs .tab').forEach(b =>
    b.setAttribute('aria-pressed', (!on && b.dataset.tab==='all') ? 'true' : 'false'));
  render();
}
document.getElementById('metaRow').addEventListener('click', e => {
  if(e.target.id === 'rosterBtn') setRoster(state.tab !== 'roster');
});

/* 板块 tab（计数随筛选联动） */
(function initTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = SOURCES.map(s => `
    <button class="tab" role="tab" data-tab="${s.key}"
      aria-pressed="${s.key===state.tab}">
      ${s.label}<span class="n"></span></button>`).join('');
  tabs.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    if(state.tab === 'roster') setRoster(false);
    state.tab = btn.dataset.tab;
    tabs.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'));
    render();
  });
})();

document.getElementById('rangeSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  state.range = +btn.dataset.range;
  document.querySelectorAll('#rangeSeg button').forEach(b =>
    b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'));
  render();
});
document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase(); render();
});
document.getElementById('scholarFilter').addEventListener('change', e => {
  state.scholar = e.target.value; render();
});

function matchBase(it){
  /* 时间范围 + 主题 + 搜索 + 学者筛选（不含板块） */
  const d = daysAgo(it.date);
  if(isNaN(d) || d > state.range || d < 0) return false;
  // 主题过滤与顶部计数同口径：只看论文，且必须带该标签
  if(state.theme && (it.source === 'tweet' || !(it.tags||[]).includes(state.theme))) return false;
  if(state.scholar && (!it.extra || it.extra.scholar_name !== state.scholar)) return false;
  if(state.q){
    const e = it.extra || {};
    const hay = [it.title, it.title_zh || '', it.authors, it.venue,
                 it.summary_zh, it.abstract || '', it.abstract_zh || '',
                 (it.tags||[]).join(' '),
                 e.scholar_name || '', e.handle || '', e.nber_id || '',
                 e.journal_short || ''].join(' ').toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function matchEvent(ev){
  /* 会议过滤：未来会议不受时间窗限制（就是要盯的），已开会的走常规窗口；
     搜索覆盖会议信息与全部议程论文字段；主题筛选要求会议带有该标签的论文。 */
  const d = daysAgo(ev.start_date || '');
  if(!isNaN(d) && d >= 0 && d > state.range) return false;
  if(state.theme && !(ev.papers||[]).some(p => (p.tags||[]).includes(state.theme))) return false;
  if(state.q){
    const parts = [ev.title, ev.display_date, ev.location, ev.organizers,
                   ev.type_name];
    (ev.papers||[]).forEach(p => {
      parts.push(p.title, p.title_zh || '', p.intro_zh || '',
                 p.abstract || '', p.abstract_zh || '', p.journal || '',
                 p.wp_num || '',
                 (p.tags||[]).join(' '),
                 (p.authors||[]).map(a => (a.name||'') + ' ' + (a.aff||'')).join(' '),
                 (p.discussants||[]).map(a => a.name||'').join(' '));
    });
    if(!parts.join(' ').toLowerCase().includes(state.q)) return false;
  }
  return true;
}

function paperRowHTML(p){
  const zh = p.title_zh || '';
  const title = zh || p.title || '(无标题)';
  const wpLink = p.wp_num ? `https://www.nber.org/papers/${p.wp_num}` : '';
  const link = p.pub_url || wpLink || p.pdf_url || '';
  const authors = (p.authors||[]).map(a =>
    a.aff ? `${esc(a.name)}<i class="eaff">（${esc(a.aff)}）</i>` : esc(a.name)
  ).join('，');
  const disc = (p.discussants||[]).map(a => esc(a.name)).join('，');
  const pub = p.journal
    ? `<span class="epub journal">已发表 · ${esc(p.journal)}</span>`
    : (p.wp_num ? `<span class="epub wp">NBER ${esc(p.wp_num)}</span>`
                : (p.pdf_url ? `<span class="epub none">会议版</span>`
                             : `<span class="epub none">暂无全文</span>`));
  const links =
    (p.pdf_url ? ` <a class="elink" href="${esc(p.pdf_url)}" target="_blank" rel="noopener">论文 PDF</a>` : '') +
    (p.slides_url ? ` <a class="elink" href="${esc(p.slides_url)}" target="_blank" rel="noopener">幻灯片</a>` : '');
  const absZh = String(p.abstract_zh||'').trim();
  const absEn = String(p.abstract||'').trim();
  const absBlock = (absZh || absEn)
    ? `<details class="abs"><summary>摘要</summary><div class="abs-body">` +
      (absZh ? `<span class="abs-lang">中文翻译</span><p class="abs-zh">${esc(absZh)}</p>` : '') +
      (absEn ? `<span class="abs-lang">英文原文</span><p class="abs-en">${esc(absEn)}</p>` : '') +
      `</div></details>` : '';
  const tags = (p.tags||[]).length
    ? `<div class="tags">${p.tags.map(t =>
        `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : '';
  return `<div class="epaper">
    <p class="eptitle">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title)}</p>
    ${zh && p.title && zh !== p.title ? `<p class="title-en">${esc(p.title)}</p>` : ''}
    ${authors ? `<p class="authors">${authors}</p>` : ''}
    ${disc ? `<p class="sub-info"><span>点评：${disc}</span></p>` : ''}
    ${p.intro_zh ? `<p class="summary-zh">${esc(p.intro_zh)}</p>` : ''}
    ${absBlock}${tags}
    <p class="sub-info"><span>${pub}</span>${p.schedule ? `<span>${esc(p.schedule)}</span>` : ''}${links ? `<span>${links}</span>` : ''}</p>
  </div>`;
}

function eventCardHTML(ev){
  const d = daysAgo(ev.start_date || '');
  const upcoming = isNaN(d) || d < 0;
  const papers = ev.papers || [];
  const badges = `<span class="badge event">NBER 会议</span>` +
    (upcoming ? `<span class="estatus">即将举行</span>` : '') +
    (ev.type_name ? `<span class="venue">${esc(ev.type_name)}</span>` : '');
  const meta = `<p class="sub-info">` +
    (ev.display_date ? `<span>${esc(ev.display_date)}</span>` : '') +
    (ev.location ? `<span>📍 ${esc(ev.location)}</span>` : '') +
    (ev.organizers ? `<span>组织：${esc(ev.organizers)}</span>` : '') +
    `</p>`;
  const body = papers.length
    ? `<details class="papers"><summary>汇报论文 ${papers.length} 篇</summary>` +
      `<div class="plist">${papers.map(paperRowHTML).join('')}</div></details>`
    : `<p class="sub-info"><span>议程未公开（闭门会或尚未放出）</span>` +
      (ev.url ? `<span><a class="elink" href="${esc(ev.url)}" target="_blank" rel="noopener">NBER 页面</a></span>` : '') + `</p>`;
  return `<article class="card">
    <div class="card-top">${badges}</div>
    <h2>${ev.url ? `<a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.title)}</a>` : esc(ev.title)}</h2>
    ${meta}${body}
  </article>`;
}

function renderEvents(evs){
  /* 即将举行的排最前（按开始日期升序），已开会的按开始日期倒序走日/月分组 */
  const today = new Date(); today.setHours(0,0,0,0);
  const isUp = ev => !ev.start_date || new Date(ev.start_date + 'T00:00:00') >= today;
  const up = evs.filter(isUp).sort((a,b) => (a.start_date||'').localeCompare(b.start_date||''));
  const past = evs.filter(e => !isUp(e)).sort((a,b) => (b.start_date||'').localeCompare(a.start_date||''));
  let html = '';
  if(up.length){
    html += `<div class="datehead">即将举行</div>` + up.map(eventCardHTML).join('');
  }
  let lastGroup = '';
  past.forEach(ev => {
    const g = groupLabel(ev.start_date);
    if(g !== lastGroup){ lastGroup = g; html += `<div class="datehead">${g}</div>`; }
    html += eventCardHTML(ev);
  });
  return html || '<p class="empty">该筛选条件下暂无会议。</p>';
}

function cardHTML(it){
  const e = it.extra || {};
  let badges = '';
  let venueInfo = '';
  if(it.source === 'top5'){
    const js = e.journal_short || '';
    badges = `<span class="badge top5">${js}</span>`;
    venueInfo = `<span class="venue">${it.venue||''}</span>`;
  }else if(it.source === 'nber'){
    badges = `<span class="badge nber">NBER</span>`;
    venueInfo = `<span class="venue">NBER Working Paper ${e.nber_id||''}</span>`;
  }else if(it.source === 'scholar'){
    const who = e.scholar_name || '';
    badges = `<span class="badge scholar">学者论文</span>` +
      (who ? `<span class="who">${who}</span>` : '');
    venueInfo = `<span class="venue">${it.venue||e.work_type||''}</span>`;
  }else{
    const rt = e.is_retweet ? ' <span class="rt-mark">转发</span>' : '';
    badges = `<span class="badge tweet">@${e.handle||''}</span>${rt}`;
    venueInfo = `<span class="who">${e.name||''}</span>`;
  }
  const stats = it.source === 'tweet'
    ? `<div class="sub-info"><span>赞 ${e.likes||0}</span><span>转 ${e.retweets||0}</span><span>浏览 ${e.views||0}</span></div>`
    : '';
  let text = '', mediaHTML = '', linkCards = '';
  if(it.source === 'tweet'){
    const clean = esc((it.abstract||'').replace(/https?:\/\/t\.co\/\w+/g, ''))
      .replace(/[ \t]+\n/g, '\n').trim();
    text = clean ? `<p class="tweet-text">${clean}</p>` : '';
    const medias = (e.media||[]).filter(m => m.url).slice(0,4);
    if(medias.length){
      mediaHTML = `<div class="tweet-media">${medias.map(m =>
        `<img src="${esc(m.url)}" loading="lazy" alt="" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    const links = (e.links||[]).filter(l => !l.skip && (l.url || l.title || l.domain)).slice(0,3);
    if(links.length){
      linkCards = `<div class="lcards">` + links.map(l => {
        const host = l.domain || '链接';
        const title = l.title ||
          (l.url||'').replace(/^https?:\/\//,'').replace(/^www\./,'') ||
          '外部链接';
        const href = l.url || l.tco || '#';
        return `<a class="lcard" href="${esc(href)}" target="_blank" rel="noopener">` +
          (l.image ? `<img class="lcard-img" src="${esc(l.image)}" loading="lazy" alt="" onerror="this.remove()">` : '') +
          `<span class="lcard-body"><span class="lcard-host">${esc(host)}</span>` +
          `<span class="lcard-title">${esc(title)}</span></span></a>`;
      }).join('') + `</div>`;
    }
  }
  // 推文正文已经完整展示；论文标题有中文翻译时中文为主、原文为副
  const showTitle = !(it.source === 'tweet' && it.abstract);
  const zh = it.title_zh || '';
  const mainTitle = showTitle ? (zh || it.title || it.summary_zh || '(无标题)') : '';
  const titleHTML = !mainTitle ? '' : (it.url
    ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(mainTitle)}</a>`
    : esc(mainTitle));
  const titleEn = (showTitle && zh && it.title && zh !== it.title)
    ? `<p class="title-en">${it.url
        ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
        : esc(it.title)}</p>` : '';
  const summary = it.summary_zh && it.summary_zh !== '（非贸易领域）'
    ? `<p class="summary-zh">${esc(it.summary_zh)}</p>` : '';
  // 中英摘要折叠块：论文有任一版本摘要才渲染，推文正文本来就完整展示
  const absZh = String(it.abstract_zh||'').trim();
  const absEn = String(it.abstract||'').trim();
  const absBlock = (it.source !== 'tweet' && (absZh || absEn))
    ? `<details class="abs"><summary>中英摘要</summary><div class="abs-body">` +
      (absZh ? `<span class="abs-lang">中文翻译</span><p class="abs-zh">${esc(absZh)}</p>` : '') +
      (absEn ? `<span class="abs-lang">英文原文</span><p class="abs-en">${esc(absEn)}</p>` : '') +
      `</div></details>` : '';
  const authors = it.authors && it.source !== 'tweet'
    ? `<p class="authors">${esc(it.authors)}</p>` : '';
  const tags = (it.tags||[]).length
    ? `<div class="tags">${it.tags.map(t =>
        `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : '';
  return `<article class="card">
    <div class="card-top">${badges}${venueInfo}</div>
    ${titleHTML ? `<h2>${titleHTML}</h2>` : ''}
    ${titleEn}
    ${authors}${text}${mediaHTML}${linkCards}${summary}${absBlock}${stats}${tags}
  </article>`;
}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function rangeLabel(r){
  return r === 365 ? '近一年' : (r === 180 ? '近半年' : (r === 7 ? '近 7 天' : '近 30 天'));
}

function groupLabel(dateStr){
  /* 半年视图按月分组，其余按日分组 */
  if(!dateStr) return '日期未知';
  if(state.range > 60){
    const dt = new Date(dateStr + 'T00:00:00');
    return `${dt.getFullYear()}年${dt.getMonth()+1}月`;
  }
  return fmtDate(dateStr);
}

function rosterHTML(){
  const fields = [...new Set(DATA.scholars.map(s => s.field).filter(Boolean))];
  const chips = [''].concat(fields).map(f =>
    `<button class="fchip" data-field="${esc(f)}" aria-pressed="${state.rosterField===f}">${f||'全部领域'}</button>`).join('');
  const shown = DATA.scholars.filter(s => !state.rosterField || s.field === state.rosterField);
  const rows = shown.map(s => {
    const links = [];
    if(s.homepage) links.push(`<a class="slink" href="${esc(s.homepage)}" target="_blank" rel="noopener">主页</a>`);
    if(s.twitter) links.push(`<a class="slink" href="https://x.com/${esc(s.twitter)}" target="_blank" rel="noopener">@${esc(s.twitter)}</a>`);
    if(s.openalex) links.push(`<a class="slink" href="https://openalex.org/${esc(s.openalex)}" target="_blank" rel="noopener">OpenAlex</a>`);
    if(s.s2) links.push(`<a class="slink" href="https://www.semanticscholar.org/author/${esc(s.s2)}" target="_blank" rel="noopener">S2</a>`);
    const fchip = s.field ? `<span class="field-chip">${esc(s.field)}</span>` : '';
    return `<tr>
      <td class="roster-name">${esc(s.name)}</td>
      <td class="roster-aff">${esc(s.affiliation)}</td>
      <td>${fchip}</td>
      <td class="roster-num">${s.items}</td>
      <td><div class="roster-links">${links.join('')}</div></td>
    </tr>`;
  }).join('');
  return `<p class="roster-note">共收录 ${DATA.scholars.length} 位学者，点上方领域标签可筛选。「动态」为近一年条目数。</p>
    <div class="roster-filter">${chips}</div>
    <div class="roster-table-wrap"><table class="roster-table">
      <thead><tr><th>学者</th><th>机构</th><th>领域</th><th class="roster-num-h">动态</th><th>链接</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="suggest">
      <h3>建议新增学者</h3>
      <p class="sg-hint">填写后点「打开邮件」发到维护者邮箱，或点「复制内容」粘贴到任意渠道。</p>
      <div class="sform">
        <input id="sg-name" placeholder="学者姓名（必填）">
        <input id="sg-org" placeholder="所在机构">
        <input id="sg-tw" placeholder="X 账号（如 @ChadBown）">
        <input id="sg-hp" placeholder="个人主页">
        <textarea id="sg-why" rows="2" placeholder="推荐理由（可选）"></textarea>
        <div class="sg-btns">
          <button class="sbtn" id="sg-send">打开邮件</button>
          <button class="sbtn sbtn-ghost" id="sg-copy">复制内容</button>
        </div>
        <p class="sg-ok" id="sg-ok" hidden>已复制到剪贴板。</p>
      </div>
    </div>`;
}

function suggestText(){
  const v = id => (document.getElementById(id).value || '').trim();
  const line = (label, val) => val ? `${label}：${val}\n` : '';
  return line('学者姓名', v('sg-name')) + line('所在机构', v('sg-org')) +
    line('X 账号', v('sg-tw')) + line('个人主页', v('sg-hp')) +
    line('推荐理由', v('sg-why')) + '\n来自「贸易学者最近在做什么？」页面的建议';
}

function bindRoster(root){
  root.addEventListener('click', e => {
    const fchip = e.target.closest('.fchip');
    if(fchip){
      state.rosterField = fchip.dataset.field;
      root.querySelectorAll('.fchip').forEach(b =>
        b.setAttribute('aria-pressed', b===fchip ? 'true' : 'false'));
      renderRoster();
      return;
    }
    if(e.target.id === 'sg-send'){
      const name = (document.getElementById('sg-name').value || '').trim();
      const subject = `建议新增贸易学者：${name || '（未填姓名）'}`;
      window.location.href =
        `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(suggestText())}`;
    }else if(e.target.id === 'sg-copy'){
      const done = () => {
        const ok = document.getElementById('sg-ok');
        ok.hidden = false;
        setTimeout(() => { ok.hidden = true; }, 2500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(suggestText()).then(done).catch(() => {});
      }else{
        const ta = document.createElement('textarea');
        ta.value = suggestText();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    }
  });
}

function renderRoster(){
  const list = document.getElementById('list');
  list.innerHTML = rosterHTML();
  bindRoster(list);
}

function render(){
  const list = document.getElementById('list');
  if(state.tab === 'roster'){
    document.getElementById('footMeta').textContent =
      `学者名单共 ${DATA.scholars.length} 人（不含已停用条目）。`;
    renderRoster();
    return;
  }
  const base = DATA.items.filter(matchBase);
  const evs = (DATA.events || []).filter(matchEvent);

  /* 板块 tab 计数与顶部统计随筛选联动 */
  const perSource = {top5:0, nber:0, scholar:0, tweet:0};
  base.forEach(it => perSource[it.source]++);
  document.querySelectorAll('#tabs .tab').forEach(btn => {
    const k = btn.dataset.tab;
    const n = k === 'all' ? base.length : (k === 'event' ? evs.length : perSource[k]);
    btn.querySelector('.n').textContent = n;
  });
  ['top5','nber','scholar','tweet'].forEach(k => {
    document.getElementById('c-'+k).textContent = perSource[k];
  });
  document.getElementById('c-event').textContent = evs.length;
  document.getElementById('footMeta').textContent =
    `当前筛选 ${rangeLabel(state.range)}，共 ${base.length} 条、会议 ${evs.length} 场；数据共覆盖近一年。`;

  if(state.tab === 'event'){
    list.innerHTML = renderEvents(evs);
    return;
  }
  const items = state.tab === 'all' ? base
    : base.filter(it => it.source === state.tab);
  if(!items.length){
    list.innerHTML = '<p class="empty">该筛选条件下暂无条目。</p>';
    return;
  }
  let html = '', lastGroup = '';
  items.forEach(it => {
    const g = groupLabel(it.date);
    if(g !== lastGroup){
      lastGroup = g;
      html += `<div class="datehead">${g}</div>`;
    }
    html += cardHTML(it);
  });
  list.innerHTML = html;
}

document.getElementById('list').addEventListener('click', e => {
  const tag = e.target.closest('.tag');
  if(!tag) return;
  const input = document.getElementById('search');
  input.value = tag.dataset.tag;
  state.q = tag.dataset.tag.toLowerCase();
  render();
});

/* 顶部「近 30 日关注主题」：点击按标签过滤论文（与计数同口径），再点一次取消 */
(function renderThemes(){
  const box = document.getElementById('themes');
  const themes = DATA.themes || [];
  if(!themes.length){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="themes-label">近 30 日关注主题</span>' +
    themes.map(t =>
      `<button class="theme-chip" data-tag="${esc(t.tag)}" aria-pressed="false">${esc(t.tag)}<b>${t.n}</b></button>`
    ).join('');
  box.addEventListener('click', e => {
    const chip = e.target.closest('.theme-chip');
    if(!chip) return;
    state.theme = state.theme === chip.dataset.tag ? '' : chip.dataset.tag;
    box.querySelectorAll('.theme-chip').forEach(c =>
      c.setAttribute('aria-pressed', c.dataset.tag === state.theme ? 'true' : 'false'));
    render();
  });
})();

render();
</script>
</body>
</html>
