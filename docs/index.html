ute Workshop", "start_date": "2026-07-14", "end_date": "2026-07-16", "display_date": "July 14-16, 2026", "location": "Charles AB, Royal Sonesta Hotel, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-international-finance-macroeconomics", "agenda": "done", "papers": [{"title": "Unequal Decoupling", "title_zh": "", "authors": [{"name": "Federica Romei", "aff": "University of Oxford"}, {"name": "Sergio de Ferra", "aff": "University of Oxford"}, {"name": "Gabriel Fritsch", "aff": "University of Oxford"}, {"name": "Kurt Mitman", "aff": "Institute for International Economic Studies"}], "discussants": [{"name": "Matthew Rognlie", "aff": "Northwestern University and NBER"}], "schedule": "2026-07-14 8:30 am", "tags": ["贸易政策", "全球价值链"], "abstract": "Who gains and who loses from geopolitical fragmentation in a world of heterogeneous countries? We develop a quantitative general-equilibrium, multi-country heterogeneous-agent framework that incorporates cross-country differences in income risk, wealth inequality, aggregate wealth, capital stocks, and net foreign asset positions, while also capturing rich non-Gaussian income dynamics in both advanced and emerging economies. We use the model to study two fragmentation scenarios: the closure of the United States and the closure of China to trade and financial flows with the rest of the world. We find that the welfare effects are heterogeneous across countries and within countries, depending on initial external positions and domestic wealth distributions. In the United States, only households at the top of the wealth distribution gain in both scenarios, while most households lose. Outside the United States, average welfare is generally positive when the United States closes, as capital becomes more abundant in other economies, whereas the effects are broadly reversed when China ceases lending. Overall, our results show that geopolitical fragmentation has unequal consequences across heterogeneous countries and across workers and capital owners within each country.", "abstract_zh": "在一个国家异质性的世界中，谁从地缘政治碎片化中获益、谁受损？我们构建了一个定量的一般均衡、多国异质性代理人框架，该框架纳入了各国在收入风险、财富不平等、总财富、资本存量和净国外资产头寸方面的差异，同时捕捉了发达经济体和新兴经济体中的丰富非高斯收入动态。我们使用该模型研究两种碎片化情景：美国对与世界其他地区贸易和金融流动的关闭，以及中国对与世界其他地区贸易和金融流动的关闭。我们发现，福利效应在国家之间和国家内部均具有异质性，取决于初始对外头寸和国内财富分布。在美国，只有财富分布顶端的家庭在两种情景下均获益，而大多数家庭受损。在美国以外，当美国关闭时，平均福利通常为正，因为资本在其他经济体中变得更加充裕，而当中国停止放贷时，这些效应大体上逆转。总体而言，我们的结果表明，地缘政治碎片化对异质性国家之间以及各国内部的工人和资本所有者之间具有不平等的影响。", "intro_zh": "论文构建多国异质性主体一般均衡模型，量化美国或中国与全球脱钩的福利分配效应，发现国家间与国内家庭间影响高度不均，美国仅最富裕家庭受益。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f241927/f241927.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Unbalanced Financial Globalization", "title_zh": "", "authors": [{"name": "Damien Capelle", "aff": "International Monetary Fund"}, {"name": "Bruno Pellegrino", "aff": "Columbia University and NBER"}], "discussants": [{"name": "Felipe Saffie", "aff": "University of Virginia and NBER"}], "schedule": "2026-07-14 9:45 am", "tags": ["其他", "方法论"], "abstract": "We use a dynamic spatial general equilibrium model of international investment and production to investigate the real implications of the last five decades of financial globalization. We introduce a wedge accounting framework to estimate country- and time-varying measures of outward and inward Revealed Financial Openness (RFO). These wedges are meant to capture all impediments to cross-border investment, rather than explicit policy measures alone. We show how to identify these wedges for a large panel of countries using limited publicly available data on national accounts and external asset and liability positions since the 1970s. Our analysis reveals striking cross-country differences in the pace and direction of financial opening: wealthier countries have become relatively more open to foreign capital inflows, while poorer countries have become relatively more open to capital outflows, a phenomenon we call “Unbalanced Financial Globalization.” Counterfactual simulations show that this unbalanced financial globalization has worsened capital allocation, resulting in a 5.9% decrease in world GDP, a 3.4% rise in cross-country income inequality, lower wages in poorer countries, and a decline in rates of return on capital in richer countries. In contrast, if financial integration had been uniform, the improved allocation of capital would have reduced income inequality, and increased global GDP. These findings underscore the crucial role of spatial heterogeneity in shaping the real impact of international capital markets integration.", "abstract_zh": "我们使用一个国际投资与生产的动态空间一般均衡模型，考察过去五十年金融全球化的实际影响。我们引入一个楔子核算框架，以估计随国家和时间变化的对外与对内显示性金融开放度（RFO）指标。这些楔子旨在捕捉跨境投资的所有障碍，而不仅仅是显性政策措施。我们展示如何利用自20世纪70年代以来关于国民账户以及对外资产与负债头寸的有限公开可得数据，为一个大型国家面板识别这些楔子。我们的分析揭示了金融开放的速度和方向存在显著的跨国差异：较富裕的国家相对而言已更加对外开放外国资本流入，而较贫穷的国家相对而言已更加对外开放资本流出，我们将这一现象称为“不平衡的金融全球化”。反事实模拟表明，这种不平衡的金融全球化恶化了资本配置，导致世界GDP下降5.9%、跨国收入不平等上升3.4%、较贫穷国家的工资下降，以及较富裕国家的资本回报率下降。相比之下，如果金融一体化是均等的，资本配置的改善本会降低收入不平等，并提高全球GDP。这些发现凸显了空间异质性在塑造国际资本市场一体化的实际影响方面的关键作用。", "intro_zh": "论文构建动态空间一般均衡与楔子核算，估算各国时变金融开放度，评估五十年金融全球化的实际影响。发现富国更开放流入、穷国更开放流出，失衡恶化资本配置，使世界GDP降5.9%、国家间不平等升3.4%。", "journal": "CESifo", "pdf_url": "https://conference.nber.org/conf_papers/f236856/f236856.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.65864/0rgfwmrlao", "state": "oa"}, {"title": "A Model of U.S. Monetary Policy and the Global Financial Cycle", "title_zh": "", "authors": [{"name": "Rohan Kekre", "aff": "University of California, Berkeley and NBER"}, {"name": "Moritz Lenel", "aff": "Princeton University and NBER"}], "discussants": [{"name": "Andreas Stathopoulos", "aff": "University of North Carolina at Chapel Hill"}], "schedule": "2026-07-14 11:00 am", "tags": [], "abstract": "", "abstract_zh": "", "intro_zh": "", "journal": "", "pdf_url": "https://drive.google.com/file/d/1vJ_0IPb_hLO-72dUPd_KGYm8P4b5IGqd/view?usp=sharing", "slides_url": "", "wp_num": "w35902", "pub_url": "", "state": "bare"}, {"title": "Borrowing in the Shadow of China", "title_zh": "", "authors": [{"name": "Illenin O. Kondo", "aff": "Federal Reserve Bank of Minneapolis"}, {"name": "César Sosa-Padilla", "aff": "University of Notre Dame and NBER"}, {"name": "Zachary J. Swaziek", "aff": "University of Minnesota"}], "discussants": [{"name": "Christoph Trebesch", "aff": "Kiel Institute for the World Economy"}], "schedule": "2026-07-15 8:30 am", "tags": ["其他"], "abstract": "China’s rise as a major lender to emerging economies since the early 2000s has also introduced a unique form of lender power: borrowers cannot default on the subsidized loans they receive, but may still face sudden rollover demands outside their control. We argue this distinctive structure—bilateral rollover risk without default risk—disciplines recipient countries’ borrowing on international markets. In a quantitative long-term sovereign debt model, we show that such rollover-prone non-defaultable Chinese loans expose market debt to dilution risk: governments may need to tap international lenders when repayment to China comes due, and therefore choose to deleverage from private markets when Chinese inflows arrive. Market debt and bond yield dynamics in the data are consistent with this disciplining effect. We then use the model to study two geopolitical scenarios: a bloc-formation exercise in which China offers take-it-or-leave-it loans to induce the borrower’s exit from international debt markets, and an optimal exposure to China problem under the risk of a permanent and sudden retrenchment of Chinese funding. Together, these results show how official finance a la China can simultaneously improve market borrowing conditions, and become a new destabilizing source to the global sovereign debt architecture as geopolitical alliances shift.", "abstract_zh": "自21世纪初以来，中国作为新兴经济体主要贷款方的崛起，也引入了一种独特的贷款方权力：借款人不能对其获得的补贴贷款违约，但仍可能面临不受其控制的突然展期要求。我们认为，这一独特结构——没有违约风险的双边展期风险——约束了受援国在国际市场上的借款。在一个量化长期主权债务模型中，我们表明，这种易展期、不可违约的中国贷款使市场债务面临稀释风险：当对中国的还款到期时，政府可能需要求助于国际贷款方，因此在来自中国的资金流入到来时选择从私人市场去杠杆。数据中的市场债务和债券收益率动态与这种约束效应一致。然后，我们使用该模型研究两个地缘政治情景：一个集团形成练习，其中中国提供要么接受、要么放弃的贷款，以诱使借款方退出国际债务市场；以及在中国资金永久且突然收缩风险下的对华最优敞口问题。总之，这些结果表明，中国式官方融资如何能够同时改善市场借款条件，并随着地缘政治联盟的转变而成为全球主权债务架构的一个新的不稳定来源。", "intro_zh": "本文研究中国贷款“不可违约但可能突然展期”如何约束新兴经济体市场借贷。作者构建长期主权债定量模型，发现中国资金流入会引发去杠杆与稀释风险，且数据与模型一致；并模拟集团化与断供情景。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f246834/f246834.pdf", "slides_url": "", "wp_num": "w35767", "pub_url": "https://doi.org/10.3386/w35767", "state": "oa"}, {"title": "The Great Game: A Model of Geoeconomic Competition", "title_zh": "", "authors": [{"name": "Christopher Clayton", "aff": "Yale University and NBER"}, {"name": "Matteo Maggiori", "aff": "Stanford University and NBER"}, {"name": "Jesse Schreger", "aff": "Columbia University and NBER"}], "discussants": [{"name": "John Sturm Becko", "aff": "Princeton University"}], "schedule": "2026-07-15 9:45 am", "tags": ["贸易政策", "出口管制", "其他"], "abstract": "We build a model of two hegemons that have valuable trading relationships with eachother and at the same time compete in exerting geoeconomic power over countries inthe rest of the world. When the hegemons trade with each other their optimal policy isshaped both by classic economic considerations - the profitability of that specific trade- and by geoeconomic competition - how the trade affects the power of each hegemonvis-a-vis the rest of the world. We show that containment, a policy mix in which anhegemon attempts to limits sales of its inputs to the rival hegemon and uses its powerto demand that the rest of the world shifts away from sourcing from the rival hegemon,arises when the two hegemons offer relatively substitutable exports since a stronger rivalwould offer a better outside option to the targeted countries. Accommodation betweenthe hegemons, instead, occurs when power motives are small and the two hegemonsfocus on purely economic profit motives. We characterize how the rest of the countrieswelfare depends on the contain/accommodate regime of the hegemons.", "abstract_zh": "我们构建了一个两个霸权国的模型，这两个霸权国彼此拥有有价值的贸易关系，同时又在向世界其他地区国家施加地缘经济权力方面展开竞争。当两个霸权国彼此贸易时，它们的最优政策既由经典经济考量——该具体贸易的盈利能力——所塑造，也由地缘经济竞争——该贸易如何影响每个霸权国相对于世界其他地区的权力——所塑造。我们表明，遏制——一种政策组合，其中霸权国试图限制其投入品向竞争对手霸权国的销售，并利用其权力要求世界其他地区不再从竞争对手霸权国采购——会在两个霸权国提供相对可替代的出口品时出现，因为更强的竞争对手会为目标国家提供更好的外部选项。相反，霸权国之间的迁就则会在权力动机较小且两个霸权国专注于纯粹经济利润动机时发生。我们刻画了其余国家的福利如何取决于霸权国的遏制/迁就制度。", "intro_zh": "构建两个霸权国家模型，分析彼此贸易与对世界其他国家的经济权力竞争。发现双方出口替代性高时出现遏制，权力动机弱时转向包容，并评估对其他国家福利的影响。", "journal": "", "pdf_url": "https://globalcapitalallocation.s3.us-east-2.amazonaws.com/CMS_multiple_hegemons.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.6460778", "state": "oa"}, {"title": "Tariff Uncertainty and the U.S. Dollar", "title_zh": "", "authors": [{"name": "Ṣebnem Kalemli-Özcan", "aff": "Brown University and NBER"}, {"name": "Can Soylu", "aff": "Brown University"}, {"name": "Muhammed A. Yildirim", "aff": "Harvard University"}], "discussants": [{"name": "Dmitry Mukhin", "aff": "London School of Economics and Political Science (LSE)"}], "schedule": "2026-07-15 11:00 am", "tags": ["关税", "汇率", "贸易政策"], "abstract": "Standard models predict that a unilateral tariff appreciates the implementing country's currency; in 2025, U.S. tariffs rose and the dollar fell. We show that tariff uncertainty can reverse the textbook prediction. In a two-country general equilibrium model with risk-averse agents and segmented financial markets, tariff volatility enters the UIP condition as a risk-premium wedge and the Euler equation as a precautionary-savings wedge, so that uncertainty depreciates the currency even as the tariff level pushes toward appreciation. The model delivers an identifying sign pattern: among the model's sign-normalized shocks, only an uncertainty shock pairs currency depreciation and falling equity prices with an unchanged interest-rate differential---a pattern that neither tariff-level nor convenience-yield shocks reproduce. To measure the policy signal agents actually faced, we build TiRADE, a timestamped database of every U.S. tariff rate communicated between January 2025 and May 2026 — speeches, social media posts, and executive actions — of which 71 percent never appear in the statutory record. In high-frequency windows around these announcements, a one-standard-deviation rise in tariff uncertainty depreciates the dollar by 0.24 percent, lowers equities by 0.67 percent, and moves the interest differential by a precisely estimated zero; the covered (CIP) component of the dollar's convenience yield does not reprice in these windows, and generic risk-off episodes outside them move the dollar the opposite way, the safe-haven direction. Estimating the model on the event-study responses, with the steady state disciplined by U.S. external-balance-sheet and trade data, we find markets priced the announced tariffs as largely transitory, so the uncertainty channel — not the tariff level, valuation effects, or covered convenience-yield erosion — accounts for the dollar's depreciation at announcement frequencies.", "abstract_zh": "标准模型预测，单边关税会使实施国的货币升值；2025年，美国关税上升而美元下跌。我们表明，关税不确定性可能逆转教科书式预测。在一个包含风险厌恶主体和分割金融市场的两国一般均衡模型中，关税波动性以风险溢价楔子的形式进入UIP条件，并以预防性储蓄楔子的形式进入欧拉方程，因此在关税水平推动货币趋向升值的同时，不确定性却使货币贬值。该模型给出一个可识别的符号模式：在模型经符号标准化的冲击中，只有不确定性冲击将货币贬值、股票价格下跌与利率差保持不变配对在一起——这一模式既不能由关税水平冲击复制，也不能由便利收益冲击复制。为衡量主体实际面对的政策信号，我们构建了TiRADE，一个带时间戳的数据库，收录2025年1月至2026年5月间传达的每一项美国关税税率——包括演讲、社交媒体帖子和行政行动——其中71%从未出现在法定记录中。在这些公告周围的高频窗口中，关税不确定性上升一个标准差会使美元贬值0.24%，使股票下跌0.67%，并使利差变动被精确估计为零；美元便利收益的抛补（CIP）成分在这些窗口中并未重新定价，而在这些窗口之外的普通风险规避事件则使美元朝相反方向变动，即避险方向。基于事件研究响应估计模型，并以美国对外资产负债表和贸易数据约束稳态，我们发现市场将已宣布的关税大体定价为暂时性的，因此不确定性渠道——而非关税水平、估值效应或抛补便利收益侵蚀——解释了公告频率下美元的贬值。", "intro_zh": "研究关税不确定性为何能使美元贬值。构建两国一般均衡模型并建立TiRADE关税公告数据库，事件研究发现关税不确定性上升使美元贬值、股价下跌而利差不变，该渠道解释2025年美元走弱。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f246128/f246128.pdf", "slides_url": "", "wp_num": "w34728", "pub_url": "", "state": "oa"}, {"title": "Financial Interdependence and Currency Internationalization", "title_zh": "", "authors": [{"name": "Zhengyang Jiang", "aff": "Northwestern University and NBER"}], "discussants": [{"name": "Chenzi Xu", "aff": "University of California, Berkeley and NBER"}], "schedule": "2026-07-16 8:30 am", "tags": ["制裁", "其他"], "abstract": "Does financial opening necessarily lead to currency internationalization? To study the competition between incumbent and rising powers under financial interdependence, we develop a model of asset demand with microfounded network effects.Search frictions with currency-specialized intermediaries generate distinct notions of liquidity at asset-market and currency-area levels, which jointly shape the trajectory of currency competition.In the U.S.-China context, China at early stages of financial development benefits from pooling its assets with the dollar area, which reinforces the status quo.As China's financial markets deepen, RMB issuance allows China to internalize network effects and erode the dollar's dominance, triggering a discrete shift toward fragmentation.This transition is further shaped by sanctions, financial repression, and thirdcountry responses, highlighting how financial interdependence transforms cooperation into rivalry in the evolution of the international financial order.", "abstract_zh": "金融开放是否必然导致货币国际化？为了研究金融相互依赖下在位强国与崛起强国之间的竞争，我们构建了一个具有微观基础网络效应的资产需求模型。货币专业化中介所面临的搜寻摩擦，在资产市场层面和货币区层面产生了不同的流动性概念，二者共同塑造了货币竞争的轨迹。在中美情境下，处于金融发展早期阶段的中国受益于将其资产与美元区汇集，这强化了现状。随着中国金融市场深化，人民币发行使中国能够内部化网络效应并侵蚀美元的主导地位，引发向碎片化的离散式转变。这一转变进一步受到制裁、金融抑制和第三国反应的影响，凸显了在国际金融秩序演变中，金融相互依赖如何将合作转变为竞争。", "intro_zh": "研究金融开放是否必然推动货币国际化，构建含网络效应的资产需求模型分析中美货币竞争。发现中国早期与美元区资产池化会强化现状；随着金融市场深化，人民币发行可内化网络效应、侵蚀美元主导，并触发向碎片化的离散转变。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f241687/f241687.pdf", "slides_url": "https://conference.nber.org/conf_papers/f241687/f241687.slides.pdf", "wp_num": "w35541", "pub_url": "https://www.nber.org/papers/w35541", "state": "matched"}, {"title": "Tariffs, Automation, and Business Dynamism", "title_zh": "", "authors": [{"name": "Stéphane Auray", "aff": "École Nationale de la Statistique et de l'Analyse de l'Information (ENSAI)"}, {"name": "Michael B. Devereux", "aff": "University of British Columbia and NBER"}, {"name": "Aurélien Eyquem", "aff": "University of Lausanne"}], "discussants": [{"name": "Lukas Freund", "aff": "Boston College"}], "schedule": "2026-07-16 9:45 am", "tags": ["关税", "企业异质性", "劳动力市场"], "abstract": "Can protectionism revive domestic production, slow automation, and help routine work- ers? We address this question in a dynamic open-economy model with heterogeneous firms, endogenous entry, and task-based production in which routine tasks can be performed by workers or robots. Import tariffs reallocate demand toward domestic goods, reshape markups and entry incentives, and generate fiscal revenues rebated to households. As a result, tariffs raise GDP and consumption measured at market prices and temporarily slow automation, even though intermediate output at factor prices and trade volumes decline. The gains are unevenly distributed: routine workers benefit robustly through transfers and reduced train- ing, non-routine workers face opposing wage and rebate effects, and firm owners gain in aggregate as higher domestic demand and entry expand total profits despite lower per-firm values. Aggregate welfare gains hinge critically on key assumptions (automation, training, endogenous entry) and on how tariff revenues are rebated. In the baseline with uniform transfers, the welfare-maximizing tariff lies below the classical monopoly formula, while al- ternative rebate schemes can shift it substantially. Overall, the results caution against viewing tariffs as a simple tool for reindustrialization and highlight the role of technology adoption and fiscal incidence in evaluating protectionist policies.", "abstract_zh": "保护主义能否重振国内生产、减缓自动化并帮助常规工人？我们在一个包含异质性企业、内生进入和基于任务的生产的动态开放经济模型中研究这一问题，其中常规任务可由工人或机器人完成。进口关税使需求重新配置到国内商品，重塑加成率和进入激励，并产生返还给家庭的财政收入。因此，关税提高了以市场价格衡量的GDP和消费，并暂时减缓自动化，尽管按要素价格衡量的中间产出和贸易量下降。收益分配不均：常规工人通过转移支付和培训减少而显著受益，非常规工人面临方向相反的工资效应和返还效应，企业所有者总体上获益，因为尽管每个企业的价值下降，更高的国内需求和进入扩大了总利润。总福利收益关键取决于关键假设（自动化、培训、内生进入）以及关税收入如何返还。在统一转移支付的基准情形中，福利最大化关税低于经典垄断公式，而替代性返还方案可能大幅改变这一关税。总体而言，这些结果提醒人们不要将关税视为再工业化的简单工具，并凸显了技术采用和财政归宿在评估保护主义政策中的作用。", "intro_zh": "本文构建含异质性企业、内生进入和任务型生产的动态开放经济模型，研究关税对生产、自动化与福利的影响。关税提高市场价格GDP和消费并暂时放缓自动化，但收益分配不均，福利取决于技术采纳、培训、进入与税收返还。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f236791/f236791.pdf", "slides_url": "", "wp_num": "w34935", "pub_url": "https://doi.org/10.3386/w34935", "state": "oa"}, {"title": "Tariffs and Trade Deficits", "title_zh": "", "authors": [{"name": "Samuel S. Kortum", "aff": "Yale University"}, {"name": "Lorenzo Caliendo", "aff": "Yale University and NBER"}, {"name": "Fernando Parro", "aff": "University of Rochester and NBER"}], "discussants": [{"name": "Fabrizio Perri", "aff": "Federal Reserve Bank of Minneapolis"}], "schedule": "2026-07-16 11:00 am", "tags": ["关税", "贸易政策", "方法论"], "abstract": "We develop a dynamic multi-country Ricardian trade model with aggregate uncertainty, where trade imbalances emerge as countries exchange goods and assets. We introduce a method for computing counterfactuals in this setting, which doesn't require specifying the stochastic process of shocks or solving for asset prices. Applying the model to tariff shocks, we quantify their effects on prices, income, spending, and trade imbalances. We find that higher U.S. tariffs reduce the U.S. trade deficit through general equilibrium adjustments, but raise domestic prices and lower real consumption. Our findings highlight that movements in trade imbalances are shaped by the structure of global trade and finance, and that attempts to influence external balances through changes in trade barriers carry significant implications for real economic outcomes.", "abstract_zh": "我们构建了一个具有总体不确定性的动态多国李嘉图贸易模型，其中贸易失衡随着各国交换商品和资产而出现。我们引入了一种在此设定下计算反事实情形的方法，该方法不需要设定冲击的随机过程，也不需要求解资产价格。将该模型应用于关税冲击，我们量化了其对价格、收入、支出和贸易失衡的影响。我们发现，提高美国关税通过一般均衡调整减少了美国贸易逆差，但提高了国内价格并降低了实际消费。我们的发现强调，贸易失衡的变动由全球贸易和金融结构所塑造，而通过改变贸易壁垒来影响外部平衡的尝试会对实际经济结果产生重要影响。", "intro_zh": "本文构建含总体不确定性的动态多国李嘉图模型，研究关税对贸易失衡的影响，并提出无需设定冲击过程或资产价格的反事实算法。发现美国提高关税可经一般均衡缩小逆差，但推高价格、降低实际消费。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245463/f245463.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34003", "state": "oa"}]}, {"conf_id": "n1231443", "title": "SI 2026 International Trade & Macroeconomics", "type_name": "Summer Institute Workshop", "start_date": "2026-07-14", "end_date": "2026-07-14", "display_date": "July 14, 2026", "location": "Parkview, Royal Sonesta Hotel, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-international-trade-macroeconomics", "agenda": "done", "papers": [{"title": "Shipping to America", "title_zh": "运往美国", "authors": [{"name": "Xiwen Bai", "aff": "Tsinghua University"}, {"name": "Jesús Fernández-Villaverde", "aff": "University of Pennsylvania and NBER"}, {"name": "Yiliang Li", "aff": "Peking University"}, {"name": "Ricardo Marto", "aff": "Federal Reserve Bank of St. Louis"}, {"name": "Francesco Zanetti", "aff": "University of Oxford"}], "discussants": [{"name": "Simon Fuchs", "aff": "Federal Reserve Bank of Atlanta"}], "schedule": "2026-07-14 12:45 pm", "tags": ["供应链", "关税", "贸易政策"], "abstract": "We study the macroeconomic and trade-policy implications of disruptions to U.S.-bound shipping routes.Standard models treat them as iceberg-cost shocks, conflating the shock with the response to it.Using satellite vessel-tracking data, we construct route-level measures of potential and effective capacity for all U.S.-bound container ships from 2016 to 2025.Utilization losses in recent disruptions ran 20 to 40 percentage points, and began months before port congestion became visible.We embed these measures in a general equilibrium model in which firms reallocate a common fleet without internalizing the congestion they create and price above marginal cost, while importers' sourcing responds to route profitability.The reallocation triggered by a disruption then has first-order welfare effects, and the route's Domar weight is not a sufficient statistic for its welfare cost.The 2021 West Coast crisis and the 2023-2024 Red Sea attacks cost 0.69% and 0.35% of output.Naval protection of Red Sea shipping generated benefits of 0.04-0.08% of output at a fiscal cost of 0.02%.Tariffs decongest the routes they tax, offsetting or even reversing their conventional welfare cost.", "abstract_zh": "我们研究驶往美国的航运路线中断的宏观经济与贸易政策影响。标准模型将其视为冰山成本冲击，把冲击与其响应混为一谈。利用卫星船舶追踪数据，我们构建了2016年至2025年所有驶往美国的集装箱船的航线层面潜在运力与有效运力指标。近期中断中的利用率损失达20至40个百分点，并且在港口拥堵显现之前数月便已开始。我们将这些指标嵌入一个一般均衡模型；在该模型中，企业重新配置共同船队时并未内部化其造成的拥堵，且定价高于边际成本，同时进口商的采购来源会对航线盈利能力作出反应。于是，中断引发的再配置具有一阶福利效应，而该航线的多马权重并非其福利成本的充分统计量。2021年西海岸危机和2023—2024年红海袭击分别造成相当于产出0.69%和0.35%的成本。对红海航运的海军保护产生了相当于产出0.04—0.08%的收益，财政成本为0.02%。关税会缓解其征税航线的拥堵，从而抵消甚至逆转其常规福利成本。", "intro_zh": "利用卫星船舶数据构建美线运力指标并嵌入一般均衡模型，发现航运中断福利成本显著，关税可缓解拥堵并改变福利。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f238192/f238192.pdf", "slides_url": "", "wp_num": "w35808", "pub_url": "https://www.nber.org/papers/w35808", "state": "matched"}, {"title": "A Quantitative Theory of Trade in Services", "title_zh": "", "authors": [{"name": "Benny Kleinman", "aff": "Stanford University and NBER"}, {"name": "Tamar Yerushalmi", "aff": "Stanford University"}], "discussants": [{"name": "Lorenzo Caliendo", "aff": "Yale University and NBER"}], "schedule": "2026-07-14 1:45 pm", "tags": ["其他", "贸易政策"], "abstract": "Trade in services accounts for a large and growing share of global trade, with recent growth driven entirely by ``modern services'' (information, communication, financial, and professional services). We revisit classic questions in trade theory in an environment that captures a defining feature of these sectors: their intensive use of non-rival assets (e.g., software, data, and intellectual property). We develop a dynamic multi-sector model in which sectors differ in their intensity of non-rival assets, and measure this intensity by computing sectoral expenditure on non-rival asset production. We show that non-rivalry is central to understanding trade patterns and the gains from trade. First, it helps rationalize the observed specialization of rich countries in modern services through its interaction with heterogeneous demand patterns. Second, non-rivalry increases the gains from integration through an amplified capital multiplier, while tilting those gains toward high-income countries. Third, it gives rise to heterogeneous timing of consumption gains following global shocks, rationalizing the observed relationship between sectoral specialization and current account imbalances. Finally, we illustrate the importance of non-rival assets for evaluating barriers to services trade by applying our framework to a leading example: China's Great Firewall.", "abstract_zh": "服务贸易占全球贸易的很大且不断上升的份额，而近期增长完全由“现代服务”（信息、通信、金融和专业服务）推动。我们在一个刻画这些部门一项决定性特征的环境中重新审视贸易理论中的经典问题：它们对非竞争性资产（如软件、数据和知识产权）的密集使用。我们构建一个动态多部门模型，其中各部门在非竞争性资产强度上存在差异，并通过计算各部门在非竞争性资产生产上的支出衡量这一强度。我们表明，非竞争性对于理解贸易模式与贸易收益至关重要。第一，它通过与异质性需求模式的相互作用，有助于合理解释所观察到的富裕国家在现代服务上的专业化。第二，非竞争性通过放大的资本乘数增加一体化收益，同时使这些收益向高收入国家倾斜。第三，它在全球冲击之后引致消费收益时点的异质性，从而合理解释所观察到的部门专业化与经常账户失衡之间的关系。最后，我们通过将我们的框架应用于一个典型例子——中国的防火长城，来说明非竞争性资产对于评估服务贸易壁垒的重要性。", "intro_zh": "研究服务贸易中非竞争性资产（如软件、数据、知识产权）的作用，构建动态多部门模型并以非竞争资产支出度量其强度。核心发现是：非竞争性有助于解释富国在现代服务上的专业化、放大并偏向高收入国家的贸易收益，以及全球冲击后消费收益的异质性时点；并用于评估中国防火墙等服务业贸易壁垒。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245635/f245635.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The Dynamics of Technology Transfer: Multinational Investment in China and Rising Global Competition", "title_zh": "", "authors": [{"name": "Jaedo Choi", "aff": "University of Texas at Austin"}, {"name": "George Cui", "aff": "International Monetary Fund"}, {"name": "Younghun Shim", "aff": "International Monetary Fund"}, {"name": "Yongseok Shin", "aff": "Washington University in St. Louis and NBER"}], "discussants": [{"name": "Swapnika Rachapalli", "aff": "University of British Columbia"}], "schedule": "2026-07-14 3:15 pm", "tags": ["全球价值链", "其他"], "abstract": "Weinstein, and many seminar participants for helpful comments.We thank Justin Pierce for sharing the NTR gap data", "abstract_zh": "Weinstein，以及许多研讨会参与者，感谢他们的有益评论。我们感谢 Justin Pierce 分享 NTR 差额数据", "intro_zh": "论文关注跨国公司在华投资中的技术转移动态及其在全球竞争加剧背景下的变化。现有摘要仅含致谢，无法概括方法与核心发现。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f239440/f239440.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34284", "state": "oa"}, {"title": "Tariff Front-Running", "title_zh": "", "authors": [{"name": "Maria Jose Carreras Valle", "aff": "The Pennsylvania State University"}, {"name": "Sang Min Lee", "aff": "University of South Carolina - Columbia"}], "discussants": [{"name": "George A. Alessandria", "aff": "University of Rochester and NBER"}], "schedule": "2026-07-14 4:15 pm", "tags": ["关税", "贸易弹性", "企业异质性"], "abstract": "We examine US firms’ responses to future tariff increases and their macroeconomic implications. We build a novel firm-level import dataset and use it to study the 2018–2019 tariffs on steel, aluminum, and Chinese imports. We find that firms front-run tariffs by exploiting the roughly one-year lag between the initiation of the investigation into foreign trade practices and tariff implementation: Firms’ imports, inventories, and number of product-country partners begin to rise a year before the tariff increase. Moreover, firms increase imports not only from the targeted product-country but also from the same product in countries unaffected by the tariff, along both the intensive and extensive margins. We then develop a dynamic trade model in which forward-looking firms hold inventories and choose their set of trade partners. We find that tariff front-running puts downward pressure on aggregate prices and expands output prior to the tariff and that these anticipatory responses generate a smoother and longer transition to the new steady state. Last, we find that anticipatory responses lead to short- and long-run trade elasticities roughly twice as large as those in the unanticipated case.", "abstract_zh": "我们考察了美国企业对未来关税上调的反应及其宏观经济影响。我们构建了一个新的企业层面进口数据集，并用其研究2018—2019年对钢铁、铝和中国进口品征收的关税。我们发现，企业利用对外贸易做法调查启动与关税实施之间约一年的时滞来抢跑关税：企业的进口、存货以及产品—国家贸易伙伴数量在关税上调前一年就开始上升。此外，企业不仅从被针对的产品—国家增加进口，还沿着集约边际和扩展边际，从不受到关税影响的国家增加同一产品的进口。随后，我们构建了一个动态贸易模型，其中前瞻性企业持有存货并选择其贸易伙伴集合。我们发现，抢跑关税会对总体价格形成下行压力，并在关税实施前扩大产出；这些预期性反应使向新稳态的过渡更加平滑且持续时间更长。最后，我们发现，预期性反应导致短期和长期贸易弹性大约是未预期情形下的两倍。", "intro_zh": "利用美国企业进口数据，研究2018—2019年钢铝及中国商品关税前的企业抢跑。企业提前一年增加进口、库存和贸易伙伴；动态模型显示抢跑压低价格、扩张产出，并使短长期贸易弹性约翻倍。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f241608/f241608.pdf", "slides_url": "https://conference.nber.org/conf_papers/f241608/f241608.slides.pdf", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.6471019", "state": "oa"}]}, {"conf_id": "n1231441", "title": "SI 2026 International Finance and Macroeconomics Data Session", "type_name": "Summer Institute Workshop", "start_date": "2026-07-13", "end_date": "2026-07-13", "display_date": "July 13, 2026", "location": "Skyline DE, Royal Sonesta Hotel, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-international-finance-and-macroeconomics-data-session", "agenda": "done", "papers": [{"title": "A Unified US Tariff Database: Tariff Rates and Imports Since 1789", "title_zh": "", "authors": [{"name": "Miguel Acosta", "aff": "University of Wisconsin - Madison"}, {"name": "Lydia Cox", "aff": "University of Wisconsin - Madison and NBER"}, {"name": "Andrew N. Greenland", "aff": "North Carolina State University"}, {"name": "John W. Lopresti", "aff": "William & Mary"}, {"name": "Christopher M. Meissner", "aff": "University of California, Davis and NBER"}, {"name": "Martin Rotemberg", "aff": "New York University"}, {"name": "Sharon Traiberman", "aff": "New York University and NBER"}], "discussants": [], "schedule": "2026-07-13 1:00 pm", "tags": ["关税", "贸易史", "贸易政策"], "abstract": "We use a newly assembled, tariff-line-level dataset spanning the full history of US trade policy to revisit the evolution of tariffs since 1789. We document the institutional shift from Congressional setting to multilateral negotiation, the steady growth in granularity of the tariff code alongside expanding administrative capacity, and the under-appreciated role of specific tariffs, which feature prominently throughout US history and whose ad valorem equivalent moves mechanically with prices. We discuss the implications of this relationship for how we interpret past liberalization episodes and for empirical identification of tariff effects. Finally, we outline how the new data can advance research on the political economy of tariff-setting and on the macroeconomic and distributional consequences of trade policy.", "abstract_zh": "我们使用一个新汇编的、覆盖美国贸易政策全史的关税细目层面数据集，重新审视自1789年以来关税的演变。我们记录了从国会设定关税到多边谈判的制度性转变，关税税则细度随行政能力扩展而稳步提高，以及从量关税被低估的作用——从量关税在美国历史上始终占据突出地位，其从价税等值随价格机械变动。我们讨论这一关系对于我们如何解释过去的自由化事件以及对于关税效应的实证识别所具有的含义。最后，我们概述新数据如何推进关于关税设定的政治经济学以及贸易政策的宏观经济和分配后果的研究。", "intro_zh": "构建1789年以来美国关税税则级长历史数据集，重审关税演变；记录从国会设定转向多边谈判、税则日益细化及特定关税的重要作用，并讨论其对自由化解读与实证识别的影响。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f248255/f248255.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The AI-GPR Index: Measuring Geopolitical Risk using Artificial Intelligence", "title_zh": "", "authors": [{"name": "Matteo Iacoviello", "aff": "Federal Reserve Board of Governors"}, {"name": "Jonathan Tong", "aff": "University of Wisconsin - Madison"}], "discussants": [], "schedule": "2026-07-13 2:15 pm", "tags": ["方法论", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "论文用GPT-4o mini阅读近500万篇报纸文章，构建AI-GPR指数及威胁/行动、石油供应、双边国家风险指标；发现股市对威胁与行动定价不同，地缘政治石油冲击推高通胀、压低产出，双边风险上升后贸易下降。", "journal": "", "pdf_url": "https://www.matteoiacoviello.com/research_files/AI_GPR_PAPER.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Geopolitical Barriers to Globalization", "title_zh": "", "authors": [{"name": "Tianyu Fan", "aff": "Princeton University"}, {"name": "Mai Wo", "aff": "Yale University"}, {"name": "Wei Xiang", "aff": "University of Michigan"}], "discussants": [], "schedule": "2026-07-13 2:45 pm", "tags": ["贸易政策", "关税", "方法论"], "abstract": "We show that since the mid-1990s, the trade-promoting effects of tariff liberalization have been increasingly offset by deteriorating geopolitical alignment, slowing trade globalization after 2007. To quantify this barrier, we use large language models to compile 833,485 geopolitical events across 193 countries, 1950--2024, and construct a bilateral geopolitical alignment score. Using local projections, we estimate that a one-standard-deviation permanent improvement in alignment raises bilateral trade by 22 percent in the long run. In an Armington framework, tariff reductions raised 2021 global trade by about 7.5 percent, while geopolitical deterioration reduced it by about 5.3 percent, with uneven welfare effects.", "abstract_zh": "我们表明，自20世纪90年代中期以来，关税自由化的贸易促进效应日益被恶化的地缘政治对齐以及2007年后贸易全球化放缓所抵消。为量化这一障碍，我们使用大语言模型汇编了1950—2024年间193个国家的833,485起地缘政治事件，并构建了双边地缘政治对齐得分。使用局部投影法，我们估计对齐度永久提高一个标准差会使双边贸易在长期内提高22%。在阿明顿框架中，关税削减使2021年全球贸易提高约7.5%，而地缘政治恶化使其降低约5.3%，且福利效应不均衡。", "intro_zh": "本文研究地缘政治壁垒如何阻碍全球化。作者用大语言模型整理193国1950—2024年83万余起事件，构建双边对齐指数，以局部投影估计其贸易效应，并在Armington框架下量化关税与地缘政治恶化的影响及不均福利后果。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f248078/f248078.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.5489906", "state": "oa"}, {"title": "Five Facts About Stablecoins", "title_zh": "", "authors": [{"name": "Lin William Cong", "aff": "Nanyang Technological University and NBER"}, {"name": "Gordon Y. Liao", "aff": "Circle"}, {"name": "Eswar S. Prasad", "aff": "Cornell University and NBER"}, {"name": "Tony Zhang", "aff": "Arizona State University"}], "discussants": [], "schedule": "2026-07-13 3:30 pm", "tags": ["其他", "方法论"], "abstract": "We document five facts about payment stablecoins using granular blockchain data from 2020 to 2025. First, stablecoins are functioning as a transaction currency: their onchain transaction volume now exceeds Bitcoin’s despite a far smaller outstanding supply, their velocity has risen sharply, and their transaction-size distribution has shifted toward small-value transfers. Second, we develop a Bayesian refinement of the standard visitor-share attribution methodology that uses transaction-timing data to help geolocate individual wallets. This approach shows that stablecoin activity is distributed broadly across the Americas, Europe, and Asia, but that standard methods substantially overstate the cross-regional share of flows. Third, we estimate a structural model of cash management on stablecoin transaction data and find that the typical stablecoin wallet operates on quantitative terms comparable to traditional cash holdings in terms of wallet replenishment opportunities and estimated transaction costs. Fourth, stablecoins are becoming the settlement currency for a rapidly expanding onchain credit market in which lending terms are enforced by rule-based smart contracts rather than by intermediary discretion; balance-sheet accounting disciplined by reserve and currency data indicates that stablecoins’ growth reallocates rather than destroys credit. Fifth, stablecoins support programmable, machine-initiated payments: smart contracts participate in roughly a third of stablecoin transactions and over two-thirds of transfer volume on Ethereum, and early agentic-payment protocols such as x402 demonstrate machine-to-machine commerce at sub-cent transaction sizes. Together, these facts suggest that stablecoins are behaving as tokenized money. We discuss implications for traditional financial markets and the design of regulatory frameworks.", "abstract_zh": "我们利用2020年至2025年的细粒度区块链数据，记录了关于支付稳定币的五个事实。第一，稳定币正在发挥交易货币的功能：尽管其未偿供应量远小于比特币，其链上交易量现已超过比特币，其流通速度已大幅上升，其交易规模分布已转向小额转账。第二，我们开发了一种对标准访客份额归因方法的贝叶斯改进，该方法利用交易时点数据帮助对单个钱包进行地理定位。这一方法表明，稳定币活动广泛分布于美洲、欧洲和亚洲，但标准方法大幅高估了跨区域资金流份额。第三，我们基于稳定币交易数据估计了一个现金管理的结构模型，并发现典型稳定币钱包在钱包补充机会和估计交易成本方面的数量特征与传统现金持有相当。第四，稳定币正成为快速扩张的链上信贷市场的结算货币，在该市场中，贷款条款由基于规则的智能合约执行，而非由中介机构酌情决定；受准备金和货币数据约束的资产负债表会计表明，稳定币的增长会重新配置而非摧毁信贷。第五，稳定币支持可编程、机器发起的支付：智能合约参与大约三分之一的稳定币交易以及以太坊上超过三分之二的转账量，而 x402 等早期代理支付协议展示了交易规模低于一美分的机器对机器商业。这些事实共同表明，稳定币正表现为代币化货币。我们讨论其对传统金融市场以及监管框架设计的影响。", "intro_zh": "利用2020—2025年区块链微观数据，本文记录支付稳定币的五个事实：交易量超比特币、跨区域广泛使用、钱包现金管理、链上信贷结算和可编程机器支付，表明稳定币正表现为代币化货币。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f241324/f241324.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}]}, {"conf_id": "n1231442", "title": "SI 2026 International Trade & Investment", "type_name": "Summer Institute Workshop", "start_date": "2026-07-13", "end_date": "2026-07-15", "display_date": "July 13-15, 2026", "location": "Serrano Ballroom, Hotel Marlowe, 25 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/si-2026-international-trade-investment", "agenda": "done", "papers": [{"title": "De Minimis as a Constraint on Local Retail Market Power", "title_zh": "", "authors": [{"name": "David Argente", "aff": "Yale University and NBER"}, {"name": "Esteban Méndez", "aff": "Central Bank of Costa Rica"}, {"name": "Diana Van Patten", "aff": "Yale University and NBER"}], "discussants": [{"name": "Monica Morlacco", "aff": "University of Southern California"}], "schedule": "2026-07-13 10:00 am", "tags": ["关税", "贸易政策"], "abstract": "Trade policy can affect consumers not only through border prices but also by shifting the market power of domestic retailers in segmented local markets. We study this channel using Costa Rica’s elimination of its de minimis exemption, which raised the delivered price of direct-to-consumer imports while leaving domestic retailers’ cost structure unchanged. We link shipment-level customs records for individual parcels to the universe of retail electronic invoices and to customers’ locations and earnings. These data allow us to construct retailer-specific catchment areas and observe domestic and foreign expenditure shares in the relevant markets---the collection of neighborhoods each retailer actually serves. We find that more exposed retailer-product cells raise prices and sales, while import and purchase prices, wages, and employment do not respond, consistent with higher markups rather than cost pass-through. We then develop a catchment-area model with variable markups and strategic complementarities, in which market shares are defined over retailer-specific catchment areas, and discipline its key elasticities using \\textit{observed} share changes instrumented by the tariff shock. Guided by the model, we show that price responses are sharply nonlinear in market shares, steepening in the upper tail. Crucially, de minimis exposure is highest in richer neighborhoods (where direct importing was common), but retail concentration is systematically higher in poorer neighborhoods where households have the fewest local alternatives. Therefore, a reform that appears progressive when judged by exposure can be regressive in equilibrium. Welfare losses are elusive on average but large in low-competition, lower-income areas. The results show how the de minimis reform---and tariffs more broadly---can amplify local market power and shift incidence toward consumers in low-competition local markets.", "abstract_zh": "贸易政策不仅可以通过边境价格影响消费者，还可以通过改变国内零售商在分割的地方市场中的市场势力来影响消费者。我们利用哥斯达黎加取消其最低限额免税（de minimis）豁免这一政策来研究这一渠道，该政策提高了直接面向消费者的进口产品的到货价格，同时使国内零售商的成本结构保持不变。我们将单个包裹的装运级海关记录与零售电子发票全库以及客户所在地和收入数据相连接。这些数据使我们能够构建特定零售商的辐射区，并观察相关市场——即每个零售商实际服务的社区集合——中的国内和国外支出份额。我们发现，暴露程度更高的零售商-产品单元提高了价格和销售量，而进口价格和采购价格、工资和就业没有反应，这与更高加成率而非成本传导相一致。随后，我们建立了一个具有可变加成和策略互补性的辐射区模型，其中市场份额在特定零售商的辐射区上定义，并用由关税冲击作为工具变量的观测到的份额变化来约束其关键弹性。在模型的引导下，我们表明，价格反应对市场份额呈显著非线性，并在上尾端变得更陡。关键的是，受最低免税额影响的程度在较富裕社区最高（这些社区直接进口很普遍），但零售集中度在较贫困社区系统性更高，而这些社区的家庭拥有的本地替代选择最少。因此，一项以受最低免税额影响程度判断显得具有累进性的改革，在均衡中却可能具有累退性。福利损失平均而言难以察觉，但在竞争程度较低、收入较低的地区却很大。结果表明，最低免税额改革——以及更广泛意义上的关税——如何能够放大本地市场势力，并将负担归宿转向低竞争本地市场中的消费者。", "intro_zh": "研究哥斯达黎加取消小额进口免税门槛如何经由本地零售市场势力影响消费者。利用包裹海关、电子发票与消费者位置收入数据，发现高暴露商品组提价增销、利润率上升；福利损失集中于低竞争低收入地区，改革在均衡中可能累退。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f243881/f243881.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Trade and Technology Compatibility in General Equilibrium", "title_zh": "", "authors": [{"name": "Weili Chen", "aff": "Jinan University"}, {"name": "Jingting Fan", "aff": "Cheung Kong Graduate School of Business"}, {"name": "Wenlan Luo", "aff": "Tsinghua University"}], "discussants": [{"name": "Lorenzo Caliendo", "aff": "Yale University and NBER"}], "schedule": "2026-07-13 11:15 am", "tags": ["贸易政策", "出口管制", "供应链"], "abstract": "", "abstract_zh": "", "intro_zh": "构建一般均衡贸易模型，将企业与其供应商技术的横向接近度纳入投入效率，并用专利文本相似度检验。量化美国对华电子和半导体禁运，发现其引发技术脱钩与全球重组，使全球福利损失翻倍。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f242721/f242721.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.4647210", "state": "bare"}, {"title": "Do Foreigners Pay for Tariffs?", "title_zh": "", "authors": [{"name": "Rodrigo Adão", "aff": "The University of Chicago and NBER"}, {"name": "Keelan Beirne", "aff": "Massachusetts Institute of Technology"}, {"name": "Arnaud Costinot", "aff": "Massachusetts Institute of Technology and NBER"}, {"name": "Dave Donaldson", "aff": "Massachusetts Institute of Technology and NBER"}], "discussants": [{"name": "Mary Amiti", "aff": "Federal Reserve Bank of New York"}], "schedule": "2026-07-13 1:15 pm", "tags": ["关税", "贸易政策", "贸易弹性"], "abstract": "In this paper, we provide empirical evidence that foreigners pay for tariffs to a substantial extent. Motivated by a large theoretical literature, our hypothesis is that a country's overall exposure to tariffs drives movements in the average price of its entire export basket, a macro effect, whereas its direct exposure on one of its products moves only this product's price, a micro effect. Using data on the near universe of worldwide export prices and tariff changes between 1995 and 2023, we estimate a small and statistically insignificant micro effect, in line with recent empirical studies, but a large and significant macro effect. Quantitatively, the macro effect that we estimate implies annual tariff-induced transfers across countries over the sample period that range from -1.4% of GDP at the 10th percentile of the distribution to 3.1% of GDP at the 90th percentile. The same exercise using our estimates of micro effects implies transfers of -0.2% and 0.1%, respectively.", "abstract_zh": "在本文中，我们提供了经验证据，表明外国人在很大程度上承担了关税。受大量理论文献启发，我们的假说是，一国对关税的总体暴露会驱动其整个出口篮子平均价格的变动，这是一种宏观效应；而其对某一产品的直接暴露只会推动该产品的价格变动，这是一种微观效应。使用1995年至2023年间全球出口价格和关税变化的近乎全集数据，我们估计出一个较小且在统计上不显著的微观效应，这与近期实证研究一致，但估计出一个较大且显著的宏观效应。在数量上，我们估计的宏观效应意味着，在样本期内各国之间每年由关税引致的转移从分布第10百分位的GDP的-1.4%到第90百分位的GDP的3.1%不等。使用我们对微观效应的估计进行同样的测算，则意味着转移分别为GDP的-0.2%和0.1%。", "intro_zh": "本文利用1995—2023年全球出口价格与关税变化，区分关税的整体宏观暴露与产品微观暴露，估计外国承担关税的程度。发现微观效应小且不显著，宏观效应大且显著，并量化其引发的跨国收入转移。", "journal": "", "pdf_url": "https://www.dropbox.com/scl/fi/dqb6584di4lm1wj8ezmrd/DFPT_071026.pdf?rlkey=qqnmcpgks3w5gcpr9991nrfei&dl=0", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Tariff Pass-through into Retail Prices: Measurement, Replacement, and Shrink-flation", "title_zh": "", "authors": [{"name": "Liang Bai", "aff": "King's College London"}, {"name": "Torsten S. Jaccard", "aff": "University of British Columbia"}, {"name": "Sebastian Stumpner", "aff": "Banque de France"}], "discussants": [{"name": "Ina Simonovska", "aff": "University of California, Davis and NBER"}], "schedule": "2026-07-13 2:30 pm", "tags": ["关税", "贸易战", "方法论"], "abstract": "To what extent do import tariffs pass-through into retail prices? Existing estimates for the U.S.-China trade war present a puzzle: pass-through into U.S. border prices was complete, with seemingly no effect on retail prices. We combine barcode country-of-origin data with retail scanner data to address this apparent discrepancy in the context of consumer goods. Within barcodes, the tariff elasticity of retail prices is 0.14, yet the tariff elasticity of aggregated prices per unit weight, a measure similar to the unit values recovered from customs data, is 0.29. This discrepancy is attributable to product replacement bias: pass-through occurs predominantly via product turn-over towards barcodes with higher price per unit weight, half of which is achieved via smaller package size. We estimate a foreign cost share of U.S. retail imports consistent with high, if not complete, pass-through into retail prices. U.S. consumers therefore bore almost the entire incidence of tariffs levied on consumer goods.", "abstract_zh": "进口关税在多大程度上传导至零售价格？现有关于中美贸易战的估计呈现出一个谜题：传导至美国边境价格是完全的，但似乎对零售价格没有影响。我们将条码原产国数据与零售扫描数据相结合，在消费品背景下解释这一表面上的差异。在条码内，零售价格的关税弹性为0.14，但按单位重量计的总价格的关税弹性——这一指标类似于从海关数据中还原出的单位价值——为0.29。这一差异可归因于产品替换偏差：传导主要通过产品更替转向单位重量价格更高的条码来实现，其中一半是通过更小的包装规格实现的。我们估计了美国零售进口的外国成本份额，该份额与向零售价格的高传导相一致，甚至可能是完全传导。因此，美国消费者几乎承担了对消费品征收的关税的全部税负。", "intro_zh": "本文结合条码原产地与零售扫描数据，研究美中贸易战关税向零售价格的传导。同产品内弹性仅0.14，按单位重量加总为0.29，差异源于产品替换和缩小包装。校正后传导率高，美国消费者几乎承担全部关税。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f243685/f243685.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Did Foreigners Pay America's Tariffs? Quantity Discounts, Scale Economies and Incomplete Pass-Through", "title_zh": "外国人支付了美国的关税吗？数量折扣、规模经济与不完全传递", "authors": [{"name": "Sharat Ganapati", "aff": "Georgetown University and NBER"}, {"name": "Colin J. Hottman", "aff": "Federal Reserve Board of Governors"}], "discussants": [{"name": "Teresa C. Fort", "aff": "Dartmouth College and NBER"}], "schedule": "2026-07-13 3:45 pm", "tags": ["关税", "贸易政策", "贸易弹性"], "abstract": "Transaction-level quantity discounts are a pervasive feature of US trade, shaping both price variation and tariff incidence. Using administrative microdata, we show that these discounts reflect transaction-level scale economies rather than market power. Accounting for these micro-level economies resolves a key puzzle: while observed import prices rose one-for-one with 2018-2019 US tariffs, we show this was driven by the loss of scale economies as transaction sizes collapsed. Controlling for this scale effect, the strategic pass-through of tariffs to scale-free prices falls to 60 percent, implying foreign exporters absorbed a significant share of the burden through reduced markups.", "abstract_zh": "交易层面的数量折扣是美国贸易的一个普遍特征，既塑造价格变动，也影响关税归宿。利用行政微观数据，我们表明这些折扣反映的是交易层面的规模经济，而非市场势力。将这类微观层面的规模经济纳入考量，解决了一个关键谜题：尽管观察到的进口价格与2018—2019年美国关税一比一上升，我们表明这是由交易规模骤降所导致的规模经济丧失所驱动的。控制这一规模效应后，关税向无规模效应价格的战略性传导降至60%，这意味着外国出口商通过降低加成率吸收了相当大一部分负担。", "intro_zh": "基于美国交易级微观数据，发现数量折扣源于规模经济；控制交易规模效应后关税传递率约60%，出口商承担显著份额。", "journal": "CESifo", "pdf_url": "https://conference.nber.org/conf_papers/f238247/f238247.pdf", "slides_url": "", "wp_num": "w34901", "pub_url": "https://doi.org/10.65864/hofzc2jybb", "state": "matched"}, {"title": "Granular Origins of Agglomeration", "title_zh": "", "authors": [{"name": "Daniel G. O'Connor", "aff": "University of Michigan"}, {"name": "Shinnosuke Kikuchi", "aff": "University of California, San Diego"}], "discussants": [{"name": "Jonathan I. Dingel", "aff": "Columbia University and NBER"}], "schedule": "2026-07-14 9:30 am", "tags": ["企业异质性", "劳动力市场", "产业政策"], "abstract": "A few large firms dominate many local labor markets. How does that granularity affect the geography of economic activity and optimal place-based policy? To answer this question, we propose a new economic geography model featuring granular firms subject to idiosyncratic shocks. We show that average wages increase with the size of the local labor market due to that granularity, and we derive the optimal place-based policy. Using Japanese administrative data on manufacturing, we estimate our model and provide evidence consistent with our mechanism. Our mechanism implies that the smallest commuting zones have an elasticity of wages to population of 0.005. In large markets like Tokyo, the elasticity is around 0.001. Enacting optimal place-based industrial and wage policy would increase the number of people in the smallest cities, but the effect on the number of firms depends on firm conduct.", "abstract_zh": "少数大企业主导着许多地方劳动力市场。这种颗粒度如何影响经济活动的空间分布和最优的地方导向政策？为回答这一问题，我们提出一个新的经济地理模型，其特征是受特质性冲击影响的颗粒型企业。我们表明，由于这种颗粒度，平均工资随地方劳动力市场规模扩大而上升，并推导出最优的地方导向政策。利用日本制造业行政数据，我们估计了模型，并提供了与我们的机制相一致的证据。我们的机制意味着，最小通勤区的工资对人口的弹性为0.005。在东京等大市场，该弹性约为0.001。实施最优的地方导向产业和工资政策会增加最小城市的人口数量，但对企数量的影响取决于企业行为。", "intro_zh": "论文构建含颗粒企业的经济地理模型，考察大企业主导本地劳动力市场如何影响工资、集聚与最优地方政策，并用日本制造业行政数据估计。工资对人口弹性在最小通勤区约0.005、东京约0.001；最优产业与工资政策会改变城市人口和企业数。", "journal": "", "pdf_url": "http://oconnordanny.github.io/files/KIKUCHI-OCONNOR-granular-spatial.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.5454735", "state": "oa"}, {"title": "Zoning and the Dynamics of Urban Redevelopment", "title_zh": "", "authors": [{"name": "Vincent Rollet", "aff": "Stanford University"}], "discussants": [{"name": "Rebecca Diamond", "aff": "Harvard University and NBER"}], "schedule": "2026-07-14 10:45 am", "tags": ["其他"], "abstract": "Cities increasingly grow through redevelopment—demolishing old buildings to make way for new ones. This paper studies this process and how it is influenced by zoning, which regulates the size and uses of new buildings, using New York City as a case study. I build the first parcel-level panel of a city’s buildings, zoning, and floorspace prices. This data allows me to estimate a new dynamic spatial equilibrium model of floorspace supply and demand. I validate the model using quasi-experimental variation from recent zoning reforms and apply it to evaluate the effects of relaxing regulation on construction and affordability. While zoning strongly constrains city growth, the effects of relaxing regulation take decades to materialize and are limited in inexpensive or densely built areas. This is due to the large fixed costs of redevelopment, which rise sharply with the size of existing buildings. These costs generate considerable persistence in city structure and substantially lower the expected gains from relaxing zoning. Furthermore, due to migration, the affordability benefits of zoning reform largely accrue to households outside the rezoned neighborhoods.", "abstract_zh": "城市日益通过再开发来实现增长——拆除旧建筑为新建建筑腾出空间。本文研究这一过程以及它如何受到区划的影响，区划规制新建筑的规模和用途，并以纽约市为案例研究。我构建了首个包含城市建筑、区划和楼面空间价格的地块层面面板数据。该数据使我能够估计一个全新的楼面空间供给与需求的动态空间均衡模型。我利用近期区划改革带来的准实验变异来验证该模型，并将其应用于评估放松管制对建设和可负担性的影响。虽然区划强烈约束城市增长，但放松管制的效果需要数十年才能显现，并且在低价或建筑密集地区较为有限。这是由于再开发存在巨大的固定成本，而这些成本随现有建筑规模急剧上升。这些成本使城市结构具有相当大的持久性，并大幅降低放松区划的预期收益。此外，由于迁移，区划改革的可负担性收益在很大程度上归于被重新区划社区之外的家庭。", "intro_zh": "本文以纽约市为例，构建地块面板并估计动态空间均衡模型，评估放松区划对建设与住房可负担性的影响。发现区划约束城市增长，但再开发固定成本使放松管制需数十年见效，且可负担性收益多流向区划外家庭。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f237559/f237559.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Geopolitical Risk and Foreign Dependence in Global Shipping", "title_zh": "", "authors": [{"name": "Simon Fuchs", "aff": "Federal Reserve Bank of Atlanta"}, {"name": "Fernando Leibovici", "aff": "Federal Reserve Bank of St. Louis"}, {"name": "Woan Foong Wong", "aff": "University of Oregon and NBER"}], "discussants": [{"name": "Theodore Papageorgiou", "aff": "Boston College"}], "schedule": "2026-07-15 9:00 am", "tags": ["供应链", "贸易政策"], "abstract": "We study countries' dependence on foreign-built and foreign-operated containerships, the vulnerability this dependence creates to shipping and geopolitical disruptions, and the potential for policy to mitigate these risks. We document that global shipbuilding is highly concentrated in China and South Korea, with South Korea specializing in larger vessels and China accounting for a growing share of newer capacity. In contrast, vessel operation is substantially more dispersed: most Chinese-built ships are operated by non-Chinese carriers, highlighting the deep integration of Chinese-built capacity into global shipping networks. Using ship-level registry data matched to the universe of U.S. import shipments, we show that the United States mirrors this global structure: U.S. trade relies overwhelmingly on vessels from East Asia while the operators serving U.S. routes are considerably more diversified. To quantify how such dependence shapes trade costs and vulnerability, we develop a quantitative shipping model with endogenous fleet investment, rental markets, route assembly by operators, and spatial general equilibrium trade. The framework provides a tractable mapping from fleet-specific shocks, whether arising from geopolitical disruptions or policy interventions, to shipping prices, routing patterns, bilateral trade costs, and aggregate welfare. By combining observed exposure to different fleets with shipping cost shares and trade patterns, the model allows us to evaluate how disruptions propagate and how policies that target particular fleets reshape trade outcomes in equilibrium. Applied to recent Section 301-style surcharges, the model implies welfare losses concentrated on highly exposed routes, with additional spillovers operating through fleet substitution and routing adjustment.", "abstract_zh": "我们研究各国对外国建造和外国运营的集装箱船的依赖、这种依赖对航运中断和地缘政治中断所形成的脆弱性，以及政策缓解这些风险的潜力。我们记录到，全球造船业高度集中于中国和韩国，其中韩国专业化于较大型船舶，而中国在较新运力中所占份额不断上升。相比之下，船舶运营则分散得多：大多数中国建造的船舶由非中国承运人运营，凸显出中国建造的运力已深度融入全球航运网络。使用与美国进口货运全集相匹配的船舶层面登记数据，我们表明美国反映了这一全球结构：美国贸易绝大多数依赖来自东亚的船舶，而服务美国航线的运营商则更加多元化。为了量化这种依赖如何塑造贸易成本和脆弱性，我们构建了一个定量航运模型，包含内生船队投资、租赁市场、由运营商进行的航线组装以及空间一般均衡贸易。该框架提供了一种可处理的映射，将特定船队冲击——无论其源于地缘政治中断还是政策干预——映射到航运价格、航线模式、双边贸易成本和总福利。通过将观测到的对不同船队的暴露度与航运成本份额和贸易模式相结合，该模型使我们能够评估中断如何传播，以及针对特定船队的政策如何在均衡中重塑贸易结果。将该模型应用于近期的301条款式附加费，模型意味着福利损失集中于高暴露航线，并存在通过船队替代和航线调整发挥作用的额外溢出效应。", "intro_zh": "研究各国对外国建造和运营集装箱船的依赖及其地缘政治脆弱性。结合船舶登记与美国进口数据及量化航运模型，发现301式附加费使福利损失集中于高暴露航线，并经船队替代与路由调整产生溢出。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f246040/f246040.pdf", "slides_url": "https://conference.nber.org/conf_papers/f246040/f246040.slides.pdf", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Strategic Trade Infrastructure: Understanding China's Belt and Road Initiative", "title_zh": "", "authors": [{"name": "Pablo D. Fajgelbaum", "aff": "University of California, Los Angeles and NBER"}, {"name": "Amit Khandelwal", "aff": "Yale University and NBER"}, {"name": "Theodore Naff", "aff": "University of California, Los Angeles"}, {"name": "Edouard Schaal", "aff": "Universitat Pompeu Fabra"}], "discussants": [{"name": "Michele Ruta", "aff": "International Monetary Fund"}], "schedule": "2026-07-15 10:15 am", "tags": ["贸易政策", "产业政策", "方法论"], "abstract": "Since 2000, through its Belt and Road Initiative (BRI), China has invested $320.1 billion in transportation infrastructure across 143 countries. Are these investments economically justified for China? What are trade and welfare impacts for host and third countries? How should major economies respond? First, we examine the economic and geopolitical drivers of Chinese overseas infrastructure investments and estimate their impacts on trade. Second, we derive theoretical predictions for strategic trade infrastructure investments among competing countries. Surprisingly, we find that a foreign country has stronger incentives to invest in a transportation hub than private investors and the host country and that private investors, which in may be fully crowded out. The equilibrium trade infrastructure may be efficient for the world; when it is not, a host country would like to restrict foreign investment. Third, we embed these forces in a multi-country framework with a transport network over land, sea, and air featuring congestion in transport hubs. We back out political weights that rationalize the observed BRI investments and compute the optimal economic investments that China would have implemented absent those weights. Computationally, we tackle high-dimensionality and complex non-linearities using piecewise linear approximations that allow us to apply standard optimal-transport methods. Our preliminary results suggest positive net economic returns for China and gains for most of the world including the U.S., even though China’s political weights appear biased against the U.S.", "abstract_zh": "自2000年以来，中国通过其“一带一路”倡议（BRI），在143个国家投资了3201亿美元于交通基础设施。这些投资对中国而言在经济上是否合理？对东道国和第三国的贸易与福利影响是什么？主要经济体应如何应对？首先，我们考察中国海外基础设施投资的经济与地缘政治驱动因素，并估计其对贸易的影响。其次，我们推导竞争国家间战略性贸易基础设施投资的理论预测。令人惊讶的是，我们发现，与私人投资者和东道国相比，外国更有动机投资于交通枢纽，而且私人投资者可能被完全挤出。均衡贸易基础设施可能对世界是有效的；当其并非有效时，东道国将希望限制外国投资。第三，我们将这些力量嵌入一个多国框架，该框架具有涵盖陆路、海运和空运的交通网络，并以交通枢纽拥堵为特征。我们反推出能够使所观察到的“一带一路”投资合理化的政治权重，并计算在不存在这些权重时中国本应实施的最优经济投资。在计算上，我们使用分段线性近似来处理高维性和复杂非线性，这使我们能够应用标准最优传输方法。我们的初步结果表明，中国获得正的经济净回报，包括美国在内的世界大多数地区也从中获益，尽管中国的政治权重似乎对美国存在不利偏倚。", "intro_zh": "研究中国“一带一路”交通基础设施投资的经济合理性、贸易福利效应及他国应对。构建多国运输网络与战略投资模型，估计投资驱动并反推政治权重；发现中国净经济回报为正、多数国家含美国获益，但政治权重偏向反美。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f245761/f245761.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The Macroeconomic Effects of Supply Chain Shocks: Evidence from Global Shipping Disruptions", "title_zh": "", "authors": [{"name": "Diego R. Känzig", "aff": "Northwestern University and NBER"}, {"name": "Ramya Raghavan", "aff": "Northwestern University"}], "discussants": [{"name": "Joaquin Blaum", "aff": "Boston University"}], "schedule": "2026-07-15 11:30 am", "tags": [], "abstract": "", "abstract_zh": "", "intro_zh": "", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f241200/f241200.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Credit Constraints, Learning, and Spatial Misallocation", "title_zh": "", "authors": [{"name": "Elena Aguilar", "aff": "Princeton University"}], "discussants": [{"name": "Levi Crews", "aff": "University of California, Los Angeles"}], "schedule": "2026-07-15 1:30 pm", "tags": ["劳动力市场", "其他"], "abstract": "Human capital is a critical determinant of productivity in modern economies, and we have long understood credit market frictions to be a critical barrier for its accumulation. In this paper, I study location decisions as a particular form of human capital investment, where individuals trade long-term benefits for high upfront costs, most notably in the form of housing. I show that when locations differ in the learning opportunities they offer and agents are heterogeneous in their learning ability, credit frictions not only weaken positive sorting of learning ability across space but, under empirically relevant conditions, they will induce negative sorting among individuals that are credit constrained. That is, marginally better learners will optimally choose to reside in locations offering worse learning opportunities. I document the key mechanisms of the theory relying on a novel source of administrative data from Spain. I then build a dynamic heterogeneous agent spatial model to quantify the losses associated with the effect of credit frictions on the spatial distribution of labor. Importantly, these losses arise from distortions in the composition of skill in each city: the dominant source of inefficiency is the spatial misallocation of individuals with high learning-ability. In the presence of negative sorting, standard place-based policies strictly aimed to expand the size of productive cities may have limited effects, making it important to design policy that can better target the composition of heterogeneous workers across space.", "abstract_zh": "人力资本是现代经济中生产率的关键决定因素，而我们长期以来一直认为信贷市场摩擦是其积累的关键障碍。在本文中，我将区位决策作为人力资本投资的一种特定形式进行研究，其中个体以高额前期成本换取长期收益，最显著的是以住房形式体现的成本。我表明，当不同区位所提供的学习机会存在差异，且主体的学习能力存在异质性时，信贷摩擦不仅会削弱学习能力在空间上的正向排序，而且在实证相关条件下，还会在受信贷约束的个体中引发负向排序。也就是说，学习能力略强的人将最优地选择居住在学习机会更差的区位。我利用来自西班牙的一种新颖行政数据来源，记录了该理论的关键机制。然后，我构建一个动态异质性主体空间模型，以量化信贷摩擦对劳动力空间分布的影响所导致的损失。重要的是，这些损失源于每个城市技能构成的扭曲：无效率的主要来源是高学习能力个体的空间错配。在存在负向排序的情况下，严格旨在扩大生产性城市规模的标准区位导向型政策可能效果有限，因此设计能够更好地针对异质性工人在空间上的构成的政策十分重要。", "intro_zh": "研究信贷摩擦如何通过住房成本与地区学习机会影响人力资本的空间配置。结合西班牙行政数据与动态异质主体空间模型，发现信贷约束会削弱甚至逆转高学习能力者的空间排序，造成以高学习能力者错配为主的效率损失。", "journal": "", "pdf_url": "https://www.elena-aguilar.net/files/papers/aguilar_jmp.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "Learning in Firm-to-Firm Trade", "title_zh": "", "authors": [{"name": "Xianglong Kong", "aff": "The University of Chicago"}, {"name": "Emmanuel Dhyne", "aff": "National Bank of Belgium"}], "discussants": [{"name": "Ana Cecília Fieler", "aff": "Yale University and NBER"}], "schedule": "2026-07-15 2:45 pm", "tags": ["企业异质性", "供应链", "全球价值链"], "abstract": "", "abstract_zh": "", "intro_zh": "研究企业从供应商和买方生产率中学习及其总量与福利含义。用比利时企业间交易数据构建内生网络与议价的一般均衡模型。发现学习价值约占消费19%，忽略学习会低估贸易参与成本下降的福利收益。", "journal": "", "pdf_url": "https://xlkong96.github.io/website/working_papers/DK_Learning/jmp_kong_live.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}]}, {"conf_id": "n1055912", "title": "International Trade and Investment Program Meeting, Spring 2026", "type_name": "Program Meeting", "start_date": "2026-04-10", "end_date": "2026-04-11", "display_date": "April 10-11, 2026", "location": "Somerset, Royal Sonesta Hotel, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "Stephen J. Redding", "url": "https://www.nber.org/conferences/international-trade-and-investment-program-meeting-spring-2026", "agenda": "done", "papers": [{"title": "Trade and Welfare under Oligopolistic Competition: Reciprocal Dumping or Pro-Competitive Effects?", "title_zh": "", "authors": [{"name": "Pol Antràs", "aff": "Harvard University and NBER"}, {"name": "Eduardo Morales", "aff": "Princeton University and NBER"}, {"name": "Daniel Ramos", "aff": "Johns Hopkins SAIS"}], "discussants": [], "schedule": "2026-04-10 9:30 am", "tags": ["贸易政策", "贸易弹性", "方法论"], "abstract": "", "abstract_zh": "", "intro_zh": "研究贸易成本下降在寡头竞争一般均衡模型中的福利效应，基于嵌套CES框架推导不同竞争模式的福利公式，发现贸易成本下降通常提高福利，但当部门内替代弹性较高且企业数较少时可能降低福利。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f233022/f233022.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "bare"}, {"title": "Optimal Dynamic Spatial Policy", "title_zh": "", "authors": [{"name": "Eric Donald", "aff": "University of Pittsburgh"}, {"name": "Masao Fukui", "aff": "Boston University and NBER"}, {"name": "Yuhei Miyauchi", "aff": "Boston University and NBER"}], "discussants": [], "schedule": "2026-04-10 10:45 am", "tags": ["劳动力市场", "其他"], "abstract": "", "abstract_zh": "", "intro_zh": "研究动态空间一般均衡中人口与消费的最优配置，在迁移偏好冲击为私人信息下刻画约束有效配置；校准美国经济发现，对低生产率地区应减少人口但提高平均消费，并通过动态激励兼顾效率与空间再分配。", "journal": "", "pdf_url": "https://masaofukui.github.io/DFM_ODSP_paper.pdf", "slides_url": "", "wp_num": "w34290", "pub_url": "", "state": "bare"}, {"title": "Tariff Wars and Net Foreign Assets", "title_zh": "", "authors": [{"name": "Mark A. Aguiar", "aff": "Princeton University and NBER"}, {"name": "Manuel Amador", "aff": "University of Minnesota and NBER"}, {"name": "Doireann Fitzgerald", "aff": "Federal Reserve Bank of Minneapolis"}], "discussants": [], "schedule": "2026-04-10 12:00 pm", "tags": ["关税", "贸易战", "汇率"], "abstract": "This paper examines whether and how international financial claims accumulated during a period of relatively free trade can be settled once a trade war erupts. We identify the conditions under which net claims can be honored even under balanced trade – or, in the extreme, autarky. The analysis also reveals a potential equilibrium multiplicity in which a trade war impoverishes one country while enriching its trading partner, with the identity of the winner and loser determined by a sunspot. The key adjustment mechanism is the tariff-induced shift in the terms of trade (and the corresponding real exchange rate), which revalues the relative gross asset positions to ensure that any residual trade is consistent with the inherited financial claims. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "本文考察在相对自由贸易时期积累的国际金融索取权一旦贸易战爆发是否以及如何能够清偿。我们识别了即使在平衡贸易——或在极端情况下，自给自足——下净索取权仍能得到履行的条件。分析还揭示了一种潜在的多重均衡：贸易战使一个国家贫困化，同时使其贸易伙伴富裕化，而赢家和输家的身份由太阳黑子决定。关键调整机制是关税引致的贸易条件（以及相应的实际汇率）变动，它重新估值相对总资产头寸，以确保任何残余贸易与继承的金融索取权相一致。NBER working paper series的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文，无需额外付费。", "intro_zh": "研究自由贸易时期积累的国际金融债权在贸易战后能否及如何清偿。论文给出在平衡贸易甚至自给自足下净债权仍可履约的条件，并揭示由太阳黑子决定赢家的多重均衡；关键机制是关税通过贸易条件与真实汇率重估资产头寸。", "journal": "", "pdf_url": "https://doireannfitzgerald.wordpress.com/wp-content/uploads/2026/04/tariff_wars_net_foreign_assets.pdf", "slides_url": "", "wp_num": "w33743", "pub_url": "https://doi.org/10.3386/w33743", "state": "oa"}, {"title": "Elsewhere in North America: How U.S. Tariffs on China Boosted Mexico's Manufacturing Employment and Output", "title_zh": "", "authors": [{"name": "Hâle Utar", "aff": "Grinnell College"}], "discussants": [], "schedule": "2026-04-10 2:00 pm", "tags": ["关税", "贸易政策", "全球价值链"], "abstract": "Using administrative longitudinal firm- and plant-level data from Mexico that links manufacturing firms to their customs records and covers the period 2014--2023, I examine whether US tariffs targeting China have contributed to a manufacturing revival in the southern part of North America. Leveraging the abrupt shift in US trade policy as a natural experiment, and constructing firm-level trade policy exposure measures based on firms’ pre-shock trade portfolios at the product level, I show that higher US tariffs on China significantly increased manufacturing output and employment. Adjustment occurs along both intensive and extensive margins, through expansion of existing plants and the establishment of new manufacturing plants by incumbent firms. Foreign multinationals and their domestic affiliates operating under Mexico’s export platform, IMMEX, drive these gains in manufacturing output and jobs, with U.S.-headquartered firms making a particularly notable contribution. The employment response is concentrated among production workers and technicians, particularly in technology-intensive industries embedded in North American supply-chains. These findings provide firm-level evidence that heightened import protection in the United States has stimulated manufacturing activity elsewhere in North America--- namely, in Mexico.", "abstract_zh": "使用来自墨西哥的行政纵向企业层面和工厂层面数据，这些数据将制造业企业与其海关记录相连接，并覆盖2014—2023年期间，我考察美国针对中国的关税是否推动了北美南部地区的制造业复兴。利用美国贸易政策的突然转变作为自然实验，并基于企业在产品层面的冲击前贸易组合构建企业层面的贸易政策暴露度指标，我表明美国对中国加征更高关税显著提高了制造业产出和就业。调整沿集约边际和广延边际发生，途径包括现有工厂的扩张以及在位企业新建制造工厂。在墨西哥出口平台IMMEX下运营的外国跨国企业及其国内附属机构推动了制造业产出和就业岗位的这些增长，其中总部位于美国的企业贡献尤为突出。就业反应集中在生产工人和技术人员中，尤其是在嵌入北美供应链的技术密集型行业。这些发现提供了企业层面的证据，表明美国加强进口保护刺激了北美其他地区——即墨西哥——的制造业活动。", "intro_zh": "利用墨西哥2014—2023年企业—工厂数据匹配海关记录，以美国对华关税为自然实验，构建企业级政策暴露，发现对华高关税显著提升墨西哥制造业产出与就业，主要来自IMMEX外资及美资企业的工厂扩张与新厂进入。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232738/f232738.pdf", "slides_url": "", "wp_num": "", "pub_url": "", "state": "oa"}, {"title": "The Local Root of Wage Inequality", "title_zh": "", "authors": [{"name": "Hugo Lhuillier", "aff": "Columbia University"}], "discussants": [], "schedule": "2026-04-10 3:15 pm", "tags": ["劳动力市场", "方法论"], "abstract": "", "abstract_zh": "", "intro_zh": "利用法国行政数据研究城市规模工资不平等，发现高薪岗位向大城市集聚而低薪岗位遍布各地，工作流动推动大城市工资增长；构建并估计模型，量化住房调整失业救济的空间差异与福利效应。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f231557/f231557.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.5285666", "state": "bare"}, {"title": "Trade and Industrial Policy in Supply Chains: Directed Technological Change in Rare Earths", "title_zh": "", "authors": [{"name": "Laura Alfaro", "aff": "Harvard University and NBER"}, {"name": "Harald Fadinger", "aff": "University of Vienna"}, {"name": "Jan S. Schymik", "aff": "University of Mannheim"}, {"name": "Gede Virananda", "aff": "New York University"}], "discussants": [], "schedule": "2026-04-10 4:30 pm", "tags": ["出口管制", "产业政策", "供应链"], "abstract": "Trade and industrial policies restricting critical inputs can inadvertently promote foreign downstream industries via a directed technological response. We provide evidence for this mechanism by examining rare earth elements (REEs) – critical manufacturing inputs with highly concentrated production and low substitutability. We show that China’s REE export restrictions in 2010 induced a surge in global innovation increasing REE input-efficiency and exports in REE-intensive industries. A quantitative trade model with Heckscher-Ohlin-based comparative advantage, directed technological change and input-output linkages rationalizes how input-supply restrictions induce REE-enhancing innovation and expand REE-intensive industries abroad. This directed technological response substantially mitigates foreign welfare losses.", "abstract_zh": "限制关键投入品的贸易与产业政策可能通过定向技术反应无意中促进国外下游产业。我们通过考察稀土元素（REEs）——生产高度集中且可替代性低的关键制造业投入品——为这一机制提供证据。我们表明，中国2010年的稀土出口限制引发了全球创新激增，提高了稀土密集型产业的稀土投入效率和出口。一个具有基于赫克歇尔—俄林比较优势、定向技术变迁和投入产出关联的定量贸易模型，合理化了投入供给限制如何引致稀土增强型创新并在国外扩张稀土密集型产业。这种定向技术反应大幅缓解了外国福利损失。", "intro_zh": "本文研究关键投入出口限制如何经由有向技术变迁影响外国下游产业。基于2010年中国稀土出口限制，发现其促进全球稀土效率创新和稀土密集型出口，并用含H-O比较优势、有向技术变迁与投入产出联系的量化模型解释，该响应显著缓解外国福利损失。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f231196/f231196.pdf", "slides_url": "", "wp_num": "w33877", "pub_url": "https://doi.org/10.3386/w33877", "state": "oa"}, {"title": "Using Global Shocks to Understand the Level and Structure of Executive Compensation", "title_zh": "利用全球冲击理解高管薪酬的水平与结构", "authors": [{"name": "David Hummels", "aff": "Purdue University and NBER"}, {"name": "Jakob Munch", "aff": "University of Copenhagen"}, {"name": "Huilin Zhang", "aff": "Purdue University"}], "discussants": [], "schedule": "2026-04-11 8:30 am", "tags": ["企业异质性", "劳动力市场"], "abstract": "We build a model of CEO compensation that unites principal-agent and assignment models in the face of trade shocks that interact with CEO effort.The model predicts that trade shocks change CEO compensation through scale, volatility, and ability-magnification channels.Using Danish matched worker-firm data, we find empirical support for these channels: (1) Exogenous shocks to trade increase the size and value of the firm and CEO compensation; (2) the share of firm value paid to the CEO is increasing in the size and value of the firm and increasing in the volatility induced by global shocks;(3) Higher-ability CEOs generate increases in firm value that are more than 100 times greater than their compensation, through a combination of mitigating losses and maximizing the return to positive shocks.", "abstract_zh": "我们构建了一个CEO薪酬模型，该模型在面对与CEO努力相互作用的贸易冲击时，将委托—代理模型与指派模型结合起来。该模型预测，贸易冲击通过规模、波动性和能力放大渠道改变CEO薪酬。使用丹麦工人—企业匹配数据，我们发现了对这些渠道的经验支持：（1）外生贸易冲击增加企业规模和企业价值以及CEO薪酬；（2）支付给CEO的企业价值份额随企业规模和企业价值上升而增加，并随全球冲击引发的波动性上升而增加；（3）能力更高的CEO所带来的企业价值增加超过其薪酬的100倍，这是通过减轻损失与最大化正向冲击回报的组合实现的。", "intro_zh": "论文构建融合委托代理与匹配模型的CEO薪酬模型，用丹麦匹配数据研究贸易冲击如何通过规模、波动与能力放大渠道影响薪酬。发现外生贸易冲击提升企业规模、价值与CEO薪酬，高能力CEO创造的价值增量远超其薪酬。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f233080/f233080.pdf", "slides_url": "", "wp_num": "w35004", "pub_url": "https://doi.org/10.3386/w35004", "state": "matched"}, {"title": "Geopolitical Barriers to Globalization", "title_zh": "", "authors": [{"name": "Tianyu Fan", "aff": "Princeton University"}, {"name": "Mai Wo", "aff": "Yale University"}, {"name": "Wei Xiang", "aff": "University of Michigan"}], "discussants": [], "schedule": "2026-04-11 9:45 am", "tags": ["贸易政策", "关税", "方法论"], "abstract": "We show that, since the mid-1990s, the trade-promoting effects of tariff liberalization have been increasingly offset by deteriorating geopolitical relations, stalling trade globalization after 2007. To quantify this barrier, we compile a database of 833,485 geopolitical events across 193 countries from 1950 to 2024 using large language models and construct a bilateral geopolitical alignment index. Local projections estimate that a one-standard-deviation permanent improvement in alignment raises bilateral trade by 20 percent in the long run. From 1995 to 2021, tariff reductions added 9.5 percentage points to trade growth, while geopolitical deterioration subtracted 6.8 percentage points and produced more uneven welfare effects.", "abstract_zh": "我们表明，自20世纪90年代中期以来，关税自由化的贸易促进作用日益被地缘政治关系恶化所抵消，贸易全球化在2007年后陷入停滞。为量化这一障碍，我们使用大语言模型编制了1950年至2024年间覆盖193个国家的833,485个地缘政治事件数据库，并构建了双边地缘政治对齐指数。局部投影估计显示，对齐程度一个标准差的永久性改善会在长期使双边贸易增加20%。从1995年到2021年，关税削减为贸易增长增加了9.5个百分点，而地缘政治恶化则减去了6.8个百分点，并产生了更不均衡的福利效应。", "intro_zh": "本文用大语言模型构建193国双边地缘政治对齐指数，考察地缘政治恶化如何抵消关税自由化的促贸效应。局部投影显示，对齐改善一个标准差使长期双边贸易增20%；1995—2021年关税下降贡献9.5个百分点，地缘政治恶化拖累6.8个百分点。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232516/f232516.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.2139/ssrn.5489906", "state": "oa"}, {"title": "How Globalization Unravels: A Ricardian Model of Endogenous Trade Policy", "title_zh": "", "authors": [{"name": "Jesús Fernández-Villaverde", "aff": "University of Pennsylvania and NBER"}, {"name": "Tomohide Mineyama", "aff": "International Monetary Fund"}, {"name": "Dongho Song", "aff": "Johns Hopkins University"}], "discussants": [], "schedule": "2026-04-11 11:00 am", "tags": ["贸易政策", "全球价值链", "企业异质性"], "abstract": "We study how uneven gains from globalization can endogenously generate protectionism as a political equilibrium. Using U.S. data, we document that regions more exposed to import competition display stronger opposition to globalization, especially among households with little financial wealth, and that firms in trade-exposed sectors sharply increase lobbying expenditures. To interpret these patterns, we develop and quantify a general equilibrium Ricardian model with heterogeneous households, input-output linkages, and endogenous trade policy shaped by voting and lobbying. Distributional shocks reallocate political support among voters, while lobbying propagates through production networks, generating strategic complementarities that sustain protectionism. Calibrated to U.S.-China sectoral data from 1991--2019, the model accounts for rising inequality, declining support for globalization, and key aggregate trends in consumption and trade. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "abstract_zh": "我们研究全球化收益不均如何能够内生地产生作为一种政治均衡的保护主义。使用美国数据，我们记录到，受进口竞争影响更大的地区表现出更强烈的反全球化倾向，尤其是在金融财富很少的家庭中；同时，受贸易影响行业的企业大幅增加游说支出。为解释这些模式，我们构建并量化了一个包含异质性家庭、投入产出联系以及由投票和游说塑造的内生贸易政策的一般均衡李嘉图模型。分配冲击在选民之间重新配置政治支持，而游说通过生产网络传播，产生维持保护主义的策略互补性。以1991—2019年美中部门数据校准，该模型解释了不平等加剧、对全球化的支持下降以及消费和贸易的关键总量趋势。NBER工作论文系列的机构订户和发展中国家居民可在www.nber.org免费下载本文。", "intro_zh": "研究全球化收益不均如何内生催生保护主义。用美国数据发现进口竞争暴露地区及低财富家庭更反全球化、贸易暴露企业加大游说；构建量化李嘉图模型，纳入异质家庭、投入产出与投票游说，解释不平等上升和全球化支持下降。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f231997/f231997.pdf", "slides_url": "", "wp_num": "", "pub_url": "https://doi.org/10.3386/w34672", "state": "oa"}]}, {"conf_id": "n1109475", "title": "International Finance and Macroeconomics Program Meeting, Spring 2026", "type_name": "Program Meeting", "start_date": "2026-03-27", "end_date": "2026-03-27", "display_date": "March 27, 2026", "location": "Royal Sonesta Hotel, Skyline AB, 40 Edwin H. Land Blvd., Cambridge, MA", "organizers": "", "url": "https://www.nber.org/conferences/international-finance-and-macroeconomics-program-meeting-spring-2026", "agenda": "done", "papers": [{"title": "Financial Hedging and Optimal Currency of Invoicing", "title_zh": "", "authors": [{"name": "Oliver H. Xie", "aff": "Massachusetts Institute of Technology"}], "discussants": [{"name": "Charles Engel", "aff": "University of Wisconsin - Madison and NBER"}], "schedule": "2026-03-27 9:00 am", "tags": ["汇率", "其他"], "abstract": "I develop a theory of the optimal currency choice for invoicing goods for international trade in the presence of imperfect financial hedging of currency risk. I demonstrate that the classic irrelevance result--that the cost of financial hedging does not impact the choice of currency invoicing--rests on the assumption that sellers set prices ex-ante and fulfill any order size ex-post. I show that when quantities are also sticky, in the sense that the order quantity is in part pre-specified, then financial hedging affects the optimal currency of invoicing choice. My theory incorporates the cost of FX financial hedging into the classic theory of optimal currency choice, which relies on real hedging. I show that the optimal currency choice takes into account the relative ability of buyers and sellers to bear exchange rate risk. This financial hedging channel generates feedback between macroprudential policies, such as capital controls, and the optimal currency of invoicing. I highlight a \"dollarization dilemma\": capital control policies that aim to reduce dollar borrowing are partially offset by an endogenous substitution into dollar-invoiced trade, which amplifies the local economy's exposure to the dollar's movements.", "abstract_zh": "我构建了一个理论，用于分析在货币风险的金融对冲不完美的情况下，国际贸易中商品计价的最优货币选择。我证明，经典无关性结果——即金融对冲成本不影响计价货币选择——依赖于卖方事前设定价格并在事后满足任意订单规模的假设。我表明，当数量也具有粘性，即订单数量部分被预先指定时，金融对冲会影响最优计价货币选择。我的理论将外汇金融对冲成本纳入依赖实际对冲的经典最优货币选择理论。我表明，最优货币选择考虑了买卖双方承担汇率风险的相对能力。这一金融对冲渠道在宏观审慎政策（如资本管制）与最优计价货币之间产生了反馈。我强调一个“美元化困境”：旨在减少美元借贷的资本管制政策，会被向美元计价贸易的内生性替代部分抵消，而这会放大本地经济对美元变动的风险敞口。", "intro_zh": "研究不完全金融对冲下国际贸易的最优计价货币选择，构建理论模型，发现当订单数量部分预先指定时，金融对冲成本会影响计价货币，并形成资本管制与美元计价的反馈及“美元化困境”。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232252/f232252.pdf", "slides_url": "https://conference.nber.org/conf_papers/f232252/f232252.slides.pdf", "wp_num": "", "pub_url": "https://doi.org/10.31235/osf.io/v8zdk", "state": "oa"}, {"title": "What does it Take? Quantifying Within and Cross-Country Transfers in the Eurozone", "title_zh": "", "authors": [{"name": "Yi-Li Chien", "aff": "Federal Reserve Bank of St. Louis"}, {"name": "Zhengyang Jiang", "aff": "Northwestern University and NBER"}, {"name": "Matteo Leombroni", "aff": "Boston College"}, {"name": "Hanno Lustig", "aff": "Stanford University and NBER"}], "discussants": [{"name": "Marco Bassetto", "aff": "Federal Reserve Bank of Minneapolis"}], "schedule": "2026-03-27 10:05 am", "tags": ["其他"], "abstract": "We compute the cross-country transfers that result from unconventional monetary policy in the Eurozone. The ECB funds the expansion of its aggregate balance sheet mostly by issuing bank reserves and cash in core countries. The national central banks (NCBs) in periphery countries then borrow from the core NCBs at below-market rates to fund the asset purchases and bank lending. In addition, NCBs in the periphery lend more to their own banks at belowmarket rates. To compute the cross-country transfers, we compare the resulting cross-country distribution of NCB income to a counterfactual scenario without the ECB and without nonmarketable intra-Eurozone debt. We document significant and persistent transfers from the core to the periphery.", "abstract_zh": "我们计算欧元区非常规货币政策所产生的跨国转移。欧洲央行主要通过向核心国家发行银行准备金和现金，为其总资产负债表的扩张提供资金。外围国家的各国中央银行（NCBs）随后以低于市场的利率向核心国家央行借款，为资产购买和银行放贷提供资金。此外，外围国家的各国央行以低于市场的利率向本国银行发放更多贷款。为计算跨国转移，我们将由此形成的各国央行收入的跨国分布与一个没有欧洲央行且没有欧元区内部不可交易债务的反事实情景进行比较。我们记录到从核心国家到外围国家的显著且持续的转移。", "intro_zh": "本文研究欧元区非常规货币政策引发的跨国转移。作者比较各国央行收入分布与无欧洲央行、无非市场化欧元区债务的反事实情景，发现从核心国向边缘国的显著且持久转移。", "journal": "", "pdf_url": "https://conference.nber.org/conf_papers/f232234/f232234.pd
