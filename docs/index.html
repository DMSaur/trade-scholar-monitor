e capacity for all U.S.-bound container ships from 2016 to 2025.Utilization losses in recent disruptions ran 20 to 40 percentage points, and began months before port congestion became visible.We embed these measures in a general equilibrium model in which firms reallocate a common fleet without internalizing the congestion they create and price above marginal cost, while importers' sourcing responds to route profitability.The reallocation triggered by a disruption then has first-order welfare effects, and the route's Domar weight is not a sufficient statistic for its welfare cost.The 2021 West Coast crisis and the 2023-2024 Red Sea attacks cost 0.69% and 0.35% of output.Naval protection of Red Sea shipping generated benefits of 0.04-0.08% of output at a fiscal cost of 0.02%.Tariffs decongest the routes they tax, offsetting or even reversing their conventional welfare cost.", "summary_zh": "利用卫星船舶数据构建美线运力指标并嵌入一般均衡模型，发现航运中断福利成本显著，关税可缓解拥堵并改变福利。", "title_zh": "运往美国", "abstract_zh": "我们研究驶往美国的航运路线中断的宏观经济与贸易政策影响。标准模型将其视为冰山成本冲击，把冲击与其响应混为一谈。利用卫星船舶追踪数据，我们构建了2016年至2025年所有驶往美国的集装箱船的航线层面潜在运力与有效运力指标。近期中断中的利用率损失达20至40个百分点，并且在港口拥堵显现之前数月便已开始。我们将这些指标嵌入一个一般均衡模型；在该模型中，企业重新配置共同船队时并未内部化其造成的拥堵，且定价高于边际成本，同时进口商的采购来源会对航线盈利能力作出反应。于是，中断引发的再配置具有一阶福利效应，而该航线的多马权重并非其福利成本的充分统计量。2021年西海岸危机和2023—2024年红海袭击分别造成相当于产出0.69%和0.35%的成本。对红海航运的海军保护产生了相当于产出0.04—0.08%的收益，财政成本为0.02%。关税会缓解其征税航线的拥堵，从而抵消甚至逆转其常规福利成本。", "tags": ["供应链", "关税", "贸易政策"], "extra": {"nber_id": "W35808", "keyword_hit": "tariff"}}, {"uid": "oa:W7210264610", "source": "scholar", "title": "Financial repression and the currency market under sanctions", "authors": "Oleg Itskhoki, D. A. Mukhin", "venue": "London School of Economics and Political Science Theses Online (London School of Economics and Political Science)", "url": "https://doi.org/10.1093/epolic/eiag013", "date": "2026-08-31", "abstract": "Tariffs, trade wars, and financial sanctions have become a common feature of the global economy. In response, many governments consider departing from the Washington Consensus and adding unconventional tools such as foreign exchange interventions, capital controls, and financial repression. This paper asks when, and how, financial repression can be used in the currency market, and how it compares with foreign exchange (FX) interventions and conventional monetary and fiscal policy. We show that although the use of financial repression is welfare-reducing in response to international shocks, even when FX interventions are fully constrained, it can be effectively used for redistributive and fiscal reasons. Greater international financial isolation makes financial repression more potent in extracting fiscal surplus from the private sector.", "summary_zh": "研究制裁下金融抑制在货币市场的运用，比较外汇干预与常规政策，发现其虽损福利但可用于财政再分配，金融孤立会增强其效果。", "title_zh": "制裁下的金融抑制与货币市场", "abstract_zh": "关税、贸易战和金融制裁已成为全球经济的常见特征。作为回应，许多政府考虑背离华盛顿共识，并加入外汇干预、资本管制和金融抑制等非常规工具。本文探讨金融抑制何时以及如何可用于外汇市场，以及它与外汇（FX）干预和常规货币与财政政策相比如何。我们表明，尽管在应对国际冲击时使用金融抑制会降低福利，即使外汇（FX）干预受到完全约束，它仍可有效地用于再分配和财政原因。更高程度的国际金融孤立使金融抑制在从私人部门提取财政盈余方面更为有效。", "tags": ["制裁", "汇率"], "extra": {"scholar_name": "Oleg Itskhoki", "work_type": "article", "doi": "10.1093/epolic/eiag013"}}, {"uid": "oa:W7161917171", "source": "scholar", "title": "Connectivity and Selective Rural Migration", "authors": "Lin MA, Yuan Mei, Qunfeng WU, Mingzhi XU", "venue": "International Economic Review", "url": "https://doi.org/10.1111/iere.70102", "date": "2026-08-28", "abstract": "ABSTRACT How does infrastructure shape rural development? Using household panel data from a nationally representative sample of Chinese villages, matched to high‐resolution highway maps, we find that road expansion between 2000 and 2015 operates mainly through reallocation, with less productive farmers scaling down or exiting and more productive farmers remaining and expanding. We quantify the aggregate and distributional consequences in a dynamic spatial equilibrium model with heterogeneous households and endogenous migration. Improved connectivity not only accelerates urbanization but also increases aggregate rural output by 2.2%–5.3% in the long run, even as the rural workforce declines.", "summary_zh": "利用中国村级面板与公路地图，构建动态空间均衡模型，发现道路扩张通过选择性迁移提高农村产出并加速城镇化。", "title_zh": "连通性与选择性农村迁移", "abstract_zh": "摘要 基础设施如何塑造农村发展？使用来自中国村庄全国代表性样本的家庭面板数据，并将其与高分辨率公路地图匹配，我们发现，2000年至2015年间的道路扩张主要通过再配置发挥作用：生产率较低的农民缩减经营规模或退出，而生产率较高的农民则留存并扩大经营。我们利用一个包含异质性家庭和内生迁移的动态空间均衡模型，量化其总量与分布后果。连通性的改善不仅加速了城镇化，还在农村劳动力下降的情况下，于长期使农村总产出增加2.2%–5.3%。", "tags": ["劳动力市场", "其他"], "extra": {"scholar_name": "梅源", "work_type": "article", "doi": "10.1111/iere.70102"}}, {"uid": "oa:W7204248239", "source": "scholar", "title": "Replication package for: Why is Trade Not Free? A Revealed Preference Approach", "authors": "Rorigo Adao, John Sturm, Arnaud Costinot, Dave Donaldson", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "url": "https://doi.org/10.5281/zenodo.22117008", "date": "2026-08-26", "abstract": "Adao, Rodrigo, John Sturm Becko, Arnaud Costinot, and Dave Donaldson. Why is trade not free? A revealed preference approach.", "summary_zh": "提供该文复制材料，基于显示偏好方法识别政府贸易政策目标并解释贸易为何不自由。", "title_zh": "为什么贸易不自由？显示偏好方法的复制包", "abstract_zh": "Adao, Rodrigo, John Sturm Becko, Arnaud Costinot, and Dave Donaldson. 为什么贸易不自由？一种显示偏好方法。", "tags": ["贸易政策", "方法论"], "extra": {"scholar_name": "Arnaud Costinot", "work_type": "software", "doi": "10.5281/zenodo.22117008"}}, {"uid": "oa:W7204246081", "source": "scholar", "title": "How Did Trump's 2025 Trade War Affect the Decoupling of US –China Supply Chains?", "authors": "Chad P. Bown", "venue": "Asian Economic Policy Review", "url": "https://doi.org/10.1111/aepr.70048", "date": "2026-08-26", "abstract": "ABSTRACT Are foreign supply chains that service the US market still decoupling from China? If so, where are the new chains forming, how quickly is the process happening, and why is it unfolding the way it is? This article provides an initial empirical assessment of the changing nature of product‐level sourcing of US imports in the wake of the tariffs President Donald J. Trump imposed in 2018–19 and 2025. It establishes numerous stylized facts. For example, US imports of many consumer electronics—including smartphones, laptops, monitors, and video game consoles—did not decline sharply in 2025 despite US tariffs hitting Chinese production for the first time. Multinational firms had established alternative supply chains in India and Vietnam which they quickly sourced from instead. In contrast, US importers of clothing and footwear did not reorient their supply chains, in part perhaps because the resulting difference between US tariff increases on China and on third countries for those products was too small to motivate them to do so. Finally, much of the longer‐term shift of US import sourcing toward Taiwan and Mexico reflected the increasing economic importance of imported inputs for the data center buildout for artificial intelligence and not strictly decoupling supply chains with China.", "summary_zh": "考察2018—19及2025年关税后美国进口产品采购变化，发现消费电子转至印度越南，服装鞋类未明显调整。", "title_zh": "特朗普2025年贸易战如何影响美中供应链脱钩？", "abstract_zh": "摘要 服务于美国市场的外国供应链仍在与中国脱钩吗？如果是，新的供应链正在哪里形成，这一过程发生得多快，以及它为何以这种方式展开？本文对2018—19年和2025年唐纳德·J·特朗普总统加征关税之后美国进口产品层面采购来源性质的变化提供了初步的实证评估。本文确立了许多典型化事实。例如，尽管美国关税首次打击中国生产，2025年美国对许多消费电子产品的进口——包括智能手机、笔记本电脑、显示器、视频游戏机——并未大幅下降。跨国企业已在印度和越南建立替代供应链，并迅速转而从这些地方采购。相比之下，美国服装和鞋类进口商并未重新调整其供应链，部分原因或许在于，美国对中国加征关税与对第三国加征关税对这些产品造成的税率差太小，不足以促使它们这样做。最后，美国进口采购向台湾和墨西哥的长期转变，很大程度上反映了为人工智能数据中心建设而进口的投入品日益增加的经济重要性，而并非严格意义上与中国供应链脱钩。", "tags": ["关税", "贸易战", "供应链"], "extra": {"scholar_name": "Chad Bown", "work_type": "article", "doi": "10.1111/aepr.70048", "versions": ["scholar"]}}, {"uid": "oa:W7204116598", "source": "scholar", "title": "The U.S.–China Trade War and the Geography of Global Production", "authors": "Harald Fadinger, Lei Li, Sophia Praetorius, Jan Schymik", "venue": "CESifo", "url": "https://doi.org/10.65864/z9x6vf377j", "date": "2026-08-21", "abstract": "We study how the U.S.-China trade war affected manufacturing activity in third countries using a novel plant-level dataset covering millions of establishments in 50 major economies, including affiliates of more than 200,000 multinational enterprises (MNEs). Combining establishment-level data with detailed tariff information, we estimate the effects of U.S. and Chinese punitive bilateral output and input tariffs on sales, employment, and establishments across countries, industries, and stages of production. We find that third-country effects of the trade war are highly heterogeneous and largely offsetting, yielding moderately negative net effects overall. Most of the adjustment is driven by multinational enterprises reallocating activity across affiliate networks, while domestic firms respond much less.", "summary_zh": "研究美中贸易战对第三国制造业的影响，用工厂级数据估计关税效应，发现异质且大致抵消、净效应温和为负，跨国公司主导调整。", "title_zh": "美中贸易战与全球生产地理", "abstract_zh": "我们使用一个覆盖50个主要经济体中数百万家经营场所的新颖工厂层面数据集，其中包括20多万家跨国公司（MNEs）的附属机构，研究美中贸易战如何影响第三国的制造业活动。我们将经营场所层面数据与详细关税信息相结合，估计美国和中国的惩罚性双边产出关税与投入品关税对各国、各行业和各生产阶段的销售额、就业和经营场所的影响。我们发现，贸易战的第三国效应高度异质且在很大程度上相互抵消，总体上产生温和的负面净效应。大部分调整由跨国公司在附属网络中重新配置活动所驱动，而国内企业的反应则小得多。", "tags": ["贸易战", "关税", "全球价值链"], "extra": {"scholar_name": "Harald Fadinger", "work_type": "report", "doi": "10.65864/z9x6vf377j"}}, {"uid": "tweet:2086166451707142238", "source": "tweet", "title": "RT @MFRProgram: Closing out the 2026 MFR Summer Session is Oleg @itskhoki (Harvard) presenting \"Exchange Rates and Financial Markets.\" #MFR…", "authors": "@itskhoki", "venue": "X (Twitter)", "url": "https://x.com/itskhoki/status/2086166451707142238", "date": "2026-08-08", "abstract": "RT @MFRProgram: Closing out the 2026 MFR Summer Session is Oleg @itskhoki (Harvard) presenting \"Exchange Rates and Financial Markets.\" #MFR…", "summary_zh": "RT @MFRProgram：为2026年MFR暑期课程（MFR Summer Session）收官的是哈佛大学（Harvard）的Oleg @itskhoki，他将发表题为“汇率与金融市场”（Exchange Rates and Financial Markets）的演讲。#MFR…", "title_zh": "", "abstract_zh": "", "tags": ["汇率"], "extra": {"handle": "ItsKhoki", "name": "Oleg Itskhoki", "is_retweet": true, "is_reply": false, "likes": 0, "retweets": 5, "views": 53, "created_at": "2026-08-08T19:03:35+00:00", "scholar_name": "Oleg Itskhoki"}}, {"uid": "oa:W7202142905", "source": "scholar", "title": "Reproducibility package for Unpacking Depth: Deep Trade Agreements And The Potential Of A Deeper Afcfta", "authors": "Jean–Christophe Maur, Lionel Fontagné, Anthonin Levelu, Nadia Rocha, Gianluca Santoni", "venue": "Reproducibility catalog", "url": "https://doi.org/10.60572/r7f3-4r81", "date": "2026-08-07", "abstract": "", "summary_zh": "该可复现包围绕深度贸易协定与深化AfCFTA潜力，公开数据与代码以复现研究结果。", "title_zh": "深度贸易协定与深化AfCFTA潜力的可复现包", "abstract_zh": "", "tags": ["贸易协定", "贸易政策", "方法论"], "extra": {"scholar_name": "Lionel Fontagne", "work_type": "other", "doi": "10.60572/r7f3-4r81"}}, {"uid": "oa:W7204802756", "source": "scholar", "title": "A Deep Case for Shallow Integration", "authors": "John Becko, Arnaud Costinot", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35685", "date": "2026-08-01", "abstract": "We study international cooperation in a general environment with pecuniary and non-pecuniary externalities across countries. We derive two main theorems, each demonstrating that market-access commitments, a form of shallow integration, are sufficient to implement globally efficient policies. When all cross-border externalities are pecuniary, the first theorem provides a new and unifying perspective on a series of results by Bagwell and Staiger. When some cross-border externalities are non-pecuniary, the second theorem shows that market-access commitments, properly extended, still sustain global efficiency. These extended market-access commitments reinterpret cross-border externalities as additional goods that are traded and priced at their social values. We discuss the implications for international cooperation on climate change and geopolitics. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "研究跨境外部性下的国际合作，证明市场准入承诺足以实现全球效率，并可扩展至非货币外部性。", "title_zh": "浅层一体化的深层理由", "abstract_zh": "我们研究在存在跨国货币外部性和非货币外部性的一般环境中的国际合作。我们推导出两个主要定理，每个定理都表明，市场准入承诺作为一种浅层一体化形式，足以实施全球有效政策。当所有跨境外部性都是货币外部性时，第一个定理为Bagwell和Staiger的一系列结果提供了一个新的、具有统一性的视角。当一些跨境外部性是非货币外部性时，第二个定理表明，经过适当扩展的市场准入承诺仍然能够维持全球效率。这些扩展后的市场准入承诺将跨境外部性重新解释为额外商品，这些商品按其社会价值进行交易和定价。我们讨论这对气候变化和地缘政治方面国际合作的含义。NBER工作论文系列的机构订阅者以及发展中国家居民可以在www.nber.org免费下载本文。", "tags": ["贸易协定", "贸易政策"], "extra": {"scholar_name": "Arnaud Costinot", "work_type": "report", "doi": "10.3386/w35685"}}, {"uid": "oa:W7204148991", "source": "scholar", "title": "The Data Revolution, and Its Uses, in International Trade", "authors": "David Atkin, Benjamin Faber", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35657", "date": "2026-08-01", "abstract": "In recent decades, economists studying international trade have gained access to an unprecedented volume and variety of data.These data have provided new insights and a more granular understanding of the mechanics of trade.Analyzing a large corpus of papers, we document that the nature of research has also shifted.Previously, the typical trade paper was either purely theoretical or an empirical paper testing theoretical predictions.More recently, scholarship has shifted toward a more integrated approach, particularly quantitative modeling.This development is surprising.We might have expected the data revolution (and contemporaneous credibility revolution) to increase the share of primarily empirical papers-although the markers of these revolutions are clearly evident in the rise of causal inference within empirical work.This article reviews these developments, assessing the strengths and limitations of different modes of inquiry, and plotting a path forward to harness the growing richness of data within the field.", "summary_zh": "分析大量文献，梳理国际贸易研究因数据革命转向定量建模，评估不同研究范式优劣并提出展望。", "title_zh": "国际贸易中的数据革命及其应用", "abstract_zh": "近几十年来，研究国际贸易的经济学家获得了前所未有的数量和种类的数据。这些数据提供了新的洞见，并使人们对贸易机制有了更为细粒度的理解。通过分析大量论文，我们记录到研究的性质也发生了变化。以往，典型的贸易论文要么是纯理论性的，要么是检验理论预测的实证论文。较近时期，学术研究已转向更为整合的方法，尤其是定量建模。这一发展令人意外。我们原本可能预期，数据革命（以及同时期的可信性革命）会提高以实证为主的论文所占比重——尽管这些革命的标志在实证研究中因果推断的兴起中已清晰可见。本文回顾这些发展，评估不同研究模式的优势与局限，并规划一条前进路径，以利用该领域日益丰富的数据。", "tags": ["方法论", "其他"], "extra": {"scholar_name": "David Atkin", "work_type": "report", "doi": "10.3386/w35657", "versions": ["nber"]}}, {"uid": "oa:W7203596055", "source": "scholar", "title": "Dynamic Effects of Trade", "authors": "Benny Kleinman, Ernest Liu, Stephen J. Redding", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35595", "date": "2026-08-01", "abstract": "The existence of aggregate welfare gains from trade is one of the classic insights from international economics.However, these conventional welfare gains are static, in the sense that they take existing factor supplies and production technologies at a point in time as given.Recent research has highlighted dynamic effects of trade through endogenous factor accumulation and technological innovation over time, although there remains less consensus about the quantitative magnitude of these dynamic effects than about their static counterparts.Key insights from this research are that short-run and long-run responses to trade liberalization differ; capital accumulation amplifies the impact of international trade shocks; trade can facilitate technology adoption and the diffusion of ideas by changing the composition of suppliers; effects on lifetime welfare differ substantially from those on steady-state welfare, once transition dynamics are taken into account; and market failures can either magnify the overall welfare gains from trade or rationalize activist trade and industrial policies.", "summary_zh": "梳理贸易动态效应，分析资本积累、技术创新与市场失灵如何改变贸易自由化的短期和长期福利。", "title_zh": "贸易的动态效应", "abstract_zh": "贸易带来的总福利收益的存在，是国际经济学中的经典洞见之一。然而，这些传统福利收益是静态的，因为它们将某一时点上的既有要素供给和生产技术视为给定。近期研究强调了贸易通过随时间推移的内生要素积累和技术创新所产生的动态效应，尽管关于这些动态效应量化幅度的共识仍少于关于其静态对应效应的共识。这项研究的关键洞见包括：对贸易自由化的短期反应和长期反应不同；资本积累放大国际贸易冲击的影响；贸易可以通过改变供应商构成促进技术采用和思想扩散；一旦将转移动态纳入考虑，对终身福利的影响与对稳态福利的影响存在显著差异；市场失灵既可能放大贸易带来的总体福利收益，也可能使积极的贸易和产业政策合理化。", "tags": ["贸易政策", "产业政策"], "extra": {"scholar_name": "Stephen Redding", "work_type": "report", "doi": "10.3386/w35595", "versions": ["nber"]}}, {"uid": "oa:W7201883733", "source": "scholar", "title": "Tariffs, Investment, and the Missing Trade Collapse", "authors": "Francesco Ferrante, Andrea Prestipino, Andrea Raffo, Michael Waugh", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35630", "date": "2026-08-01", "abstract": "U.S. tariff rates in 2025 rose to levels not seen since the Great Depression, yet imports increased.To account for the missing trade collapse, we develop an open-economy New Keynesian model with tariff heterogeneity, inventories, and shocks to investment that capture the AI-driven boom.The model matches the untargeted paths of imports, output, and inflation; we use it to decompose the effects of tariffs and the investment boom.Absent the investment boom, imports would have fallen by 10 percent and activity would have contracted by 0.7 percent.The effects of tariffs depend on which goods are tariffed: tariffs on consumption and intermediates act like shocks to supply; tariffs on capital goods act like shocks to demand.The concentration of the 2025 tariff increases on consumption goods and the relative sparing of capital goods limited the damage to output while amplifying the inflationary impulse.", "summary_zh": "构建开放经济新凯恩斯模型，分解2025年美国关税与AI投资繁荣影响，发现投资繁荣掩盖了关税导致的进口下降。", "title_zh": "关税、投资与缺失的贸易崩溃", "abstract_zh": "2025年美国关税税率升至大萧条以来未见的水平，但进口却增加了。为解释未发生的贸易崩溃，我们构建了一个包含关税异质性、存货以及捕捉AI驱动繁荣的投资冲击的开放经济新凯恩斯模型。该模型与进口、产出和通胀的未目标化路径相匹配；我们用它分解关税和投资繁荣的影响。如果没有投资繁荣，进口将下降10%，经济活动将收缩0.7%。关税的影响取决于哪些商品被征收关税：对消费品和中间品的关税类似于供给冲击；对资本品的关税类似于需求冲击。2025年关税上调集中于消费品以及资本品相对少受波及，限制了对产出的损害，同时放大了通胀冲动。", "tags": ["关税", "贸易政策", "贸易弹性"], "extra": {"scholar_name": "Michael Waugh", "work_type": "report", "doi": "10.3386/w35630", "versions": ["nber"]}}, {"uid": "oa:W7201881105", "source": "scholar", "title": "From Social Savings to Spatial Equilibrium: Evaluating Transportation Improvements in Quantitative Spatial Models", "authors": "Treb Allen, Simon Fuchs, Woan Foong Wong", "venue": "Regional Science and Urban Economics", "url": "https://doi.org/10.1016/j.regsciurbeco.2026.104271", "date": "2026-08-01", "abstract": "How do we evaluate the welfare gains from transport infrastructure investment? We present a quantitative spatial framework that integrates traffic and economic responses to infrastructure improvements and derives the elasticity of aggregate welfare to changes in the transportation network. The resulting formula extends the traditional ``social savings'' method to incorporate route and mode choice, agglomeration and dispersion externalities, and traffic congestion. We apply the formula to the U.S. freight network and assess the benefits of reducing costs on each segment of the U.S. Interstate Highway System. The traditional and extended measures are closely related overall, but they differ in the level of estimated gains and in the ranking of some highly valued links. Where the rankings differ, network position determines how congestion and spatial adjustment alter a link's measured benefit. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "构建整合交通与经济响应的量化空间框架，评估美国货运网络改善的福利收益并比较传统与扩展方法。", "title_zh": "从社会储蓄到空间均衡：量化空间模型中交通改善的评估", "abstract_zh": "我们如何评估交通基础设施投资的福利收益？我们提出了一个定量空间框架，该框架将交通与经济对基础设施改善的反应整合起来，并推导出总福利对交通网络变化的弹性。由此得到的公式扩展了传统的“社会节约”方法，以纳入路线与运输方式选择、集聚与分散外部性以及交通拥堵。我们将该公式应用于美国货运网络，并评估降低美国州际公路系统每一路段成本所带来的收益。传统衡量方法与扩展衡量方法在总体上密切相关，但它们在估计收益的水平上以及在一些高价值路段的排名上存在差异。在排名存在差异之处，网络位置决定了拥堵与空间调整如何改变某一被衡量路段的收益。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["方法论", "其他"], "extra": {"scholar_name": "Treb Allen", "work_type": "article", "doi": "10.1016/j.regsciurbeco.2026.104271"}}, {"uid": "oa:W7172317233", "source": "scholar", "title": "The Incidence of Tariffs: Rates and Reality", "authors": "Gita Gopinath, Brent Neiman", "venue": "The Journal of Economic Perspectives", "url": "https://doi.org/10.1257/jep.20251486", "date": "2026-08-01", "abstract": "In 2025, statutory tariff rates on US imports rose to levels not seen in over one hundred years. What were the implications for prices? On the one hand, shipping lags, exemptions, and enforcement gaps kept the actual implemented rates at only half of the statutory rates, moderating the tariffs' impact. On the other hand, tariff pass-through to US import prices reached 92 percent, so the United States bore a large share of the costs. We study the incidence of the 2018-2019 and 2025 US tariffs and discuss implications for US sourcing, domestic manufacturing costs, and the dollar.", "summary_zh": "研究2018—2019与2025年美国关税归宿，发现实际执行率约为法定一半，进口价格转嫁率达92%，美国承担较大成本。", "title_zh": "关税归宿：税率与现实", "abstract_zh": "2025年，美国进口的法定关税税率升至一百多年来未见的水平。这对价格意味着什么？一方面，运输滞后、豁免和执行缺口使实际实施税率仅为法定税率的一半，从而缓和了关税的影响。另一方面，关税向美国进口价格的传导率达到92%，因此美国承担了很大一部分成本。我们研究2018—2019年和2025年美国关税的归宿，并讨论其对美国采购来源、国内制造成本和美元的影响。", "tags": ["关税", "贸易政策", "供应链"], "extra": {"scholar_name": "Brent Neiman", "work_type": "article", "doi": "10.1257/jep.20251486", "versions": ["scholar"]}}, {"uid": "oa:W7172288609", "source": "scholar", "title": "Global Imbalances, Tariffs, and Industrial Policy", "authors": "Pierre‐Olivier Gourinchas, Gene Joseph Kindberg-Hanlon, Manasa Patnam, Lorenzo Rotunno, Michèle Ruta", "venue": "The Journal of Economic Perspectives", "url": "https://doi.org/10.1257/jep.20261507", "date": "2026-08-01", "abstract": "Global imbalances denote the distribution of countries' current account balances, identically equal to the difference between two forward-looking aggregate variables: national saving and domestic investment. Industrial and trade policies have traditionally not been considered important drivers of aggregate saving or investment, and therefore of current account balances. The former because most industrial policies are small in scope; the latter because permanent tariffs have no intertemporal effect in the textbook model, with an offsetting appreciation of the real exchange rate. The rapidly growing use of both industrial and trade policies in recent years calls for a reassessment. This paper presents a framework to think about the role of both policies. For industrial policy, we make the important distinction between the traditional sector-specific policies via subsidies or other targeted instruments (“micro industrial policy”) and broader policies (“macro industrial policy”) that aim to promote industrial developments and competitiveness through the deployment of more aggregate instruments such as financial repression, foreign reserve accumulation, or capital controls. A key finding is that micro industrial policy tends to increase external balances if it fails to raise aggregate productivity. By contrast, macro industrial policy can, under some conditions, boost the current account, forcing other countries to adjust. Yet, these policies often come at the cost of suppressed domestic consumption and possibly domestic welfare. Our analysis confirms that tariffs are a weak tool to improve current account balances. Finally, traditional macroeconomic drivers—such as fiscal policy, demographics or credit cycles—remain critical drivers of global imbalances, especially for the United States and China.", "summary_zh": "构建框架评估产业政策与关税对全球失衡的影响，发现关税作用有限，宏观产业政策可推高经常账户但代价高。", "title_zh": "全球失衡、关税与产业政策", "abstract_zh": "全球失衡指各国经常账户余额的分布，其恒等于两个前瞻性总量变量之差：国民储蓄和国内投资。产业政策和贸易政策传统上不被视为总储蓄或总投资的重要驱动因素，因而也不被视为经常账户余额的重要驱动因素。前者是因为大多数产业政策范围较小；后者是因为在教科书模型中永久性关税没有跨期效应，实际汇率会升值以抵消其影响。近年来产业政策和贸易政策的使用都迅速增长，这要求重新评估。本文提出一个框架来思考这两类政策的作用。对于产业政策，我们作出重要区分：通过补贴或其他针对性工具实施的传统行业特定政策（“微观产业政策”），以及旨在通过运用金融抑制、外汇储备积累或资本管制等更具总量性的工具来促进产业发展和竞争力的更广泛政策（“宏观产业政策”）。一个关键发现是，如果微观产业政策未能提高总体生产率，它往往会增加外部平衡。相比之下，宏观产业政策在某些条件下可以提振经常账户，迫使其他国家进行调整。然而，这些政策往往以国内消费受抑制、并可能以国内福利为代价。我们的分析证实，关税是改善经常账户余额的一种薄弱工具。最后，传统宏观经济驱动因素——如财政政策、人口结构或信贷周期——仍然是全球失衡的关键驱动因素，尤其是对美国和中国而言。", "tags": ["关税", "产业政策", "汇率"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.1257/jep.20261507"}}, {"uid": "oa:W7172282955", "source": "scholar", "title": "Labor Market Responses to Tariffs: Frictions, Dynamics, and Policy Responses", "authors": "Rafael Dix-Carneiro, Brian K. Kovak", "venue": "The Journal of Economic Perspectives", "url": "https://doi.org/10.1257/jep.20251489", "date": "2026-08-01", "abstract": "This article introduces the evidence and associated modeling frameworks contemporary economists use to understand the effects of trade and trade policy on labor markets, with a particular emphasis on labor-market frictions and adjustment dynamics. The effects of trade shocks differ across industries, regions, and occupations, implying the presence of important adjustment frictions in labor markets, and these effects evolve slowly over time, implying the need for dynamic frameworks rationalizing slow transitions. After reviewing the key insights from this literature, we discuss policies aimed at mitigating costs to workers and ensuring that the gains from trade are shared more equitably.", "summary_zh": "综述贸易与关税冲击对劳动力市场的影响，指出调整摩擦导致影响跨行业地区不均且缓慢，并讨论缓解成本与公平分配政策。", "title_zh": "劳动力市场对关税的反应：摩擦、动态与政策应对", "abstract_zh": "本文介绍当代经济学家用来理解贸易和贸易政策对劳动力市场影响所使用的证据及相关建模框架，特别强调劳动力市场摩擦与调整动态。贸易冲击的影响在不同行业、地区和职业之间存在差异，这意味着劳动力市场存在重要的调整摩擦；这些影响随时间缓慢演变，这意味着需要能够解释缓慢转型的动态框架。在回顾该文献的关键洞见之后，我们讨论旨在减轻工人成本并确保贸易收益更公平分享的政策。", "tags": ["关税", "贸易政策", "劳动力市场"], "extra": {"scholar_name": "Rafael Dix-Carneiro", "work_type": "article", "doi": "10.1257/jep.20251489", "versions": ["nber", "scholar"]}}, {"uid": "oa:W7172279813", "source": "scholar", "title": "Should We Tax Trade? A Pigouvian Perspective", "authors": "Arnaud Costinot, Iván Werning", "venue": "The Journal of Economic Perspectives", "url": "https://doi.org/10.1257/jep.20251491", "date": "2026-08-01", "abstract": "We develop a simple and intuitive Pigouvian perspective on optimal trade policy. Our approach unifies a wide range of rationales for taxing trade, from the classical optimal tariff argument to contemporary debates about global carbon emissions and geopolitics. We also clarify when trade policy intervention is warranted and when alternative domestic instruments should be used instead.", "summary_zh": "构建最优贸易政策的庇古视角，统一关税、碳与地缘政治等征税理由，并辨明贸易干预与国内工具的适用条件。", "title_zh": "是否应对贸易征税？一个庇古视角", "abstract_zh": "我们提出了一个关于最优贸易政策的简单而直观的庇古视角。我们的方法统一了对贸易征税的广泛理由，从经典的最优关税论点一直到当代关于全球碳排放和地缘政治的争论。我们还阐明了何时需要贸易政策干预，以及何时应改用替代性国内工具。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Arnaud Costinot", "work_type": "article", "doi": "10.1257/jep.20251491", "versions": ["nber", "scholar"]}}, {"uid": "nber:w35669", "source": "nber", "title": "Fool's Gold? How the USD lost its Shine", "authors": "Kai Arvai, Nuno Coimbra, Marco Pinchetti", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35669", "date": "2026-08-01", "abstract": "This paper investigates the determinants of international investors’ portfolio choices between gold and sovereign bonds in an environment shaped by economic and geopolitical shocks. We develop an endogenous portfolio choice model where reserve safety has a political dimension — sovereign bonds issued by the dominant reserve country are more liquid but exposed to the issuer’s sanctions authority, while gold offers sanctions protection at the cost of lower liquidity. Our model implies that US convenience yields fall during periods of high sanction risk, as safe-asset demand fragments along geopolitical lines. Empirically, periods of elevated geopolitical risk coincide with higher gold prices and 10-year Treasury yields. In such periods, the average composition of official reserves shifts toward gold, with countries less aligned with the US increasing their holdings to a greater extent. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "构建内生组合选择模型并结合经验证据，发现制裁风险上升削弱美元便利收益，推动官方储备转向黄金。", "title_zh": "愚人金？美元如何失去光芒", "abstract_zh": "本文研究了在经济与地缘政治冲击所塑造的环境中，国际投资者在黄金与主权债券之间进行投资组合选择的决定因素。我们构建了一个内生投资组合选择模型，其中储备安全性具有政治维度——占主导地位的储备国发行的主权债券流动性更高，但会暴露于发行国的制裁权力之下；而黄金以较低流动性为代价提供制裁保护。我们的模型意味着，在制裁风险较高的时期，美国便利收益率会下降，因为安全资产需求会沿地缘政治界线分化。经验上，地缘政治风险升高的时期与黄金价格和10年期美国国债收益率上升同时出现。在此类时期，官方储备的平均构成转向黄金，与美国立场较不一致的国家会更大程度地增加其持有量。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["制裁"], "extra": {"nber_id": "W35669", "keyword_hit": "sanctions"}}, {"uid": "nber:w35661", "source": "nber", "title": "Tariff-Dispersion Shocks: The Mean is the Variance", "authors": "Stephanie Schmitt‐Grohé, Martı́n Uribe", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35661", "date": "2026-08-01", "abstract": "This paper studies the joint behavior over time of the mean and dispersion of U.S. import tariff rates across goods at the HTS 6-digit level, as well as the macroeconomic consequences of the shocks that drive these two moments. We document that the cross-sectional mean and the cross-sectional dispersion of import tariffs move closely together over time. Using a state-space model, we find that both are driven primarily by common shocks, while mean- and dispersion-specific tariff shocks play a negligible role. Thus, effectively, there are no separate mean-tariff shocks or tariff-dispersion shocks; there are only mean-dispersion tariff shocks. These common shocks account for a sizable share of movements in imports and the trade balance but only a small fraction of movements in output. A positive transitory mean-dispersion tariff shock reduces the import-to-output ratio and improves the trade-balance-to-output ratio; a positive permanent mean-dispersion tariff shock also reduces the import-to-output ratio but has a muted effect on the trade-balance-to-output ratio. Positive transitory mean-dispersion tariff shocks are expansionary, whereas positive permanent mean-dispersion tariff shocks are contractionary in the short run and expansionary in the medium run. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "研究美国进口关税均值与离散度的共同波动及宏观影响，发现二者由共同冲击驱动，显著影响进口与贸易余额，对产出影响小。", "title_zh": "关税离散度冲击：均值即方差", "abstract_zh": "本文研究在HTS 6位编码水平上，美国各商品进口关税税率的均值与离散度随时间的共同行为，以及驱动这两个矩的冲击所带来的宏观经济后果。我们记录到，进口关税的横截面均值与横截面离散度随时间紧密共同变动。使用状态空间模型，我们发现二者主要都是由共同冲击驱动的，而均值特异的和离散度特异的关税冲击作用可忽略不计。因此，实际上不存在单独的均值关税冲击或关税离散度冲击；只存在均值—离散度关税冲击。这些共同冲击解释了进口和贸易余额变动中的相当大一部分，但仅解释了产出变动中的一小部分。一个正向暂时性均值—离散度关税冲击会降低进口—产出比并改善贸易余额—产出比；一个正向永久性均值—离散度关税冲击也会降低进口—产出比，但对贸易余额—产出比的影响较弱。正向暂时性均值-离散度关税冲击具有扩张性，而正向永久性均值-离散度关税冲击在短期内具有收缩性、在中期内具有扩张性。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org无需额外付费下载本文。", "tags": ["关税", "贸易政策"], "extra": {"nber_id": "W35661", "keyword_hit": "tariff"}}, {"uid": "nber:w35654", "source": "nber", "title": "Critical Minerals, Geopolitics, and the Green Transition", "authors": "Tomás Domínguez-Iino, Jonathan Elliott, Allan J. Hsiao", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35654", "date": "2026-08-01", "abstract": "The green energy transition will be powered by the mining and processing of lithium, nickel, and cobalt, which are critical for the production of advanced batteries.These minerals are concentrated geographically but traded globally, allowing key mining countries to exercise market power through policy intervention.Advanced batteries use multiple minerals in combination, and this joint use creates interdependence across mineral markets.We study the geopolitical implications of these forces and their consequences for green technology adoption worldwide.We quantify supply chain vulnerability, international policy spillovers, and the potential for mineral cartels.", "summary_zh": "研究关键矿产全球贸易与政策干预的地缘政治影响，量化供应链脆弱性、政策溢出与卡特尔潜力。", "title_zh": "关键矿产、地缘政治与绿色转型", "abstract_zh": "绿色能源转型将由锂、镍和钴的开采与加工提供动力，这些矿物对先进电池的生产至关重要。这些矿物在地理上集中分布，但在全球范围内进行贸易，使主要采矿国能够通过政策干预行使市场势力。先进电池组合使用多种矿物，而这种联合使用造成了各矿物市场之间的相互依赖。我们研究这些力量的地缘政治影响及其对全球绿色技术采用的影响。我们量化供应链脆弱性、国际政策溢出效应以及矿物卡特尔的可能性。", "tags": ["供应链", "贸易政策", "全球价值链"], "extra": {"nber_id": "W35654", "keyword_hit": "supply chain"}}, {"uid": "nber:w35609", "source": "nber", "title": "Exchange Rates, Structural Change, and Productivity Growth", "authors": "Paul R. Bergin, Woo Jin Choi, Ju Hyun Pyun", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35609", "date": "2026-08-01", "abstract": "Macroeconomics tends to view exchange rate movements as transitory.However, persistent exchange rate realignments and the associated capital flows can have long-run implications for structural change and productivity growth.We provide empirical evidence that policies of reserve accumulation and currency undervaluation have had significant effects on manufacturing productivity, as well as on manufacturing share, product varieties, and domestic orientation of production chains.We develop a dynamic two-country model with two sectors, firm dynamics, and trade hysteresis to demonstrate a novel mechanism by which exchange rate policy reorients global supply chains and industrial structure.The model identifies conditions under which such a policy raises productivity and welfare in the home country.It also identifies conditions under which the policy leads to either permanent or reversable deindustrialization in a trading partner.Findings have implications for the long-run relationship between China and the U.S.", "summary_zh": "结合实证与两国动态模型，发现储备积累和汇率低估通过重塑全球供应链提升本国制造业生产率，并影响贸易伙伴去工业化。", "title_zh": "汇率、结构变迁与生产率增长", "abstract_zh": "宏观经济学往往将汇率变动视为暂时性的。然而，持续性的汇率重估及与之相关的资本流动可能对结构变迁和生产率增长产生长期影响。我们提供的经验证据表明，储备积累和货币低估政策对制造业生产率，以及对制造业份额、产品种类和生产链的国内导向，都产生了显著影响。我们构建了一个包含两个部门、企业动态和贸易迟滞的动态两国模型，以展示汇率政策重新调整全球供应链和产业结构的一种新机制。该模型识别了此类政策提高母国生产率和福利的条件。它还识别了该政策导致贸易伙伴出现永久性或可逆性去工业化的条件。研究结果对中美之间的长期关系具有启示。", "tags": ["汇率", "全球价值链", "供应链"], "extra": {"nber_id": "W35609", "keyword_hit": "global supply chain"}}, {"uid": "oa:W7171931391", "source": "top5", "title": "From Heterogeneous Firms to Heterogeneous Trade Elasticities: The Aggregate Implications of Firm Export Decisions", "authors": "Rodrigo Adão, Costas Arkolakis, Sharat Ganapati", "venue": "Journal of Political Economy", "url": "https://doi.org/10.1086/743331", "date": "2026-07-31", "abstract": "", "summary_zh": "基于异质性企业框架，研究出口决策如何形成异质性贸易弹性及其总体影响。", "title_zh": "从异质性企业到异质性贸易弹性：企业出口决策的总体含义", "abstract_zh": "", "tags": ["贸易弹性", "企业异质性"], "extra": {"journal_short": "JPE", "keyword_hit": "export", "doi": "10.1086/743331"}}, {"uid": "oa:W7171485853", "source": "top5", "title": "Capital Services in Global Value Chains", "authors": "Xiang Ding", "venue": "The Quarterly Journal of Economics", "url": "https://doi.org/10.1093/qje/qjag041", "date": "2026-07-28", "abstract": "Abstract This article constructs the first global data set on intersectoral capital service expenditures. I use these data to disaggregate capital services and intermediate inputs in a dynamic multisector trade model. Steady-state allocations and responses to shocks are determined by a capital-augmented global input-output matrix. Two properties of the measured network deliver larger long-run consumption gains from globalization than existing estimates, as well as larger gains in more capital-intensive countries. First, more trade-exposed sectors supply capital to more consumption-influential producers. Second, heterogeneity in the network reallocates sectoral expenditures toward producers with larger declines in capital rental prices. These reallocations raise capital incomes and lower consumption price indices.", "summary_zh": "构建全球跨部门资本服务数据集并嵌入动态多部门贸易模型，发现全球化长期消费收益更大且资本密集国获益更多。", "title_zh": "全球价值链中的资本服务", "abstract_zh": "摘要 本文构建了首个关于部门间资本服务支出的全球数据集。我利用这些数据在动态多部门贸易模型中细分资本服务和中间投入。稳态配置以及对冲击的响应由资本增强型全球投入产出矩阵决定。测度网络的两个属性带来了比现有估计更大的全球化长期消费收益，并在资本更密集的国家带来更大收益。第一，更多暴露于贸易的部门向对消费更具影响力的生产商供给资本。第二，网络中的异质性将部门支出重新配置给资本租赁价格下降幅度更大的生产商。这些再配置提高了资本收入并降低了消费价格指数。", "tags": ["全球价值链", "方法论"], "extra": {"journal_short": "QJE", "keyword_hit": "global value chain", "doi": "10.1093/qje/qjag041"}}, {"uid": "oa:W7168151185", "source": "scholar", "title": "Trade disruptions and early US industrialization", "authors": "Joseph H. Davis, Douglas A. Irwin", "venue": "The Economic History Review", "url": "https://doi.org/10.1111/ehr.70134", "date": "2026-07-13", "abstract": "Abstract Between 1807 and 1815, US imports of manufactured goods were slashed dramatically by a trade embargo, non‐importation measures, and the War of 1812. These disruptions are commonly believed to have promoted the growth of nascent domestic manufacturers and thereby spurred early US industrialization. This paper uses disaggregated data on US industrial production to investigate how this interruption of foreign competition affected domestic manufacturing. On balance, the trade disruptions did not accelerate US industrialization, as trend growth in industrial output was little changed over this period. However, the disruptions may have played a role in shifting resources, at least temporarily, from trade‐dependent industries (such as shipbuilding) to domestic infant industries (such as cotton textiles).", "summary_zh": "利用美国工业产出细分数据，考察1807—1815年贸易中断对早期工业化的影响，发现未加速工业化，但促使资源暂时转向幼稚产业。", "title_zh": "贸易中断与早期美国工业化", "abstract_zh": "摘要 1807年至1815年间，美国的制成品进口因贸易禁运、禁止进口措施以及1812年战争而急剧削减。人们通常认为，这些中断促进了新兴国内制造商的成长，从而推动了美国早期工业化。本文使用美国工业生产的分类数据，考察这种外国竞争的中断如何影响国内制造业。总体而言，贸易中断并未加速美国工业化，因为这一时期工业产出的趋势增长几乎没有变化。然而，这些中断可能至少暂时在将资源从贸易依赖型产业（如造船业）转向国内幼稚产业（如棉纺织品）方面发挥了一定作用。", "tags": ["贸易史", "贸易政策"], "extra": {"scholar_name": "Douglas Irwin", "work_type": "article", "doi": "10.1111/ehr.70134"}}, {"uid": "oa:W7167787246", "source": "scholar", "title": "Counting the costs: a quantitative assessment of the effects of Brexit on UK regions and sectors", "authors": "Ningyuan Jia, Swati Dhingra, Emily Fry, Sophie Hale", "venue": "Economica", "url": "https://doi.org/10.1111/ecca.70065", "date": "2026-07-08", "abstract": "Abstract This paper examines the implications of the EU–UK Trade and Cooperation Agreement (TCA) using a dynamic spatial general equilibrium model. Unlike previous studies that primarily projected potential impacts of Brexit based on uncertain scenarios, this analysis introduces new estimates of tariffs and non‐tariff measures specified by the TCA. The findings show that while the TCA will necessitate substantial adjustments for some sectors, Brexit will not fundamentally alter the overall structure of the UK economy. However, the main impacts will manifest as significant hits to real wages and productivity, exacerbating the long‐standing economic challenges faced by the UK.", "summary_zh": "本文用动态空间一般均衡模型评估英欧TCA，发现脱欧将显著冲击实际工资与生产率，但不改变英国经济总体结构。", "title_zh": "计算成本：英国脱欧对英国各地区和行业影响的定量评估", "abstract_zh": "摘要 本文使用动态空间一般均衡模型考察欧盟—英国贸易与合作协定（TCA）的影响。与以往主要基于不确定情景预测英国脱欧潜在影响的研究不同，本分析引入了TCA所规定的关税与非关税措施的新估计。研究结果表明，尽管TCA将要求一些部门进行重大调整，但英国脱欧不会从根本上改变英国经济的整体结构。然而，主要影响将表现为对实际工资和生产率的显著冲击，加剧英国长期面临的经济挑战。", "tags": ["贸易协定", "贸易政策", "关税"], "extra": {"scholar_name": "Swati Dhingra", "work_type": "article", "doi": "10.1111/ecca.70065"}}, {"uid": "oa:W7167676924", "source": "scholar", "title": "More Tariff Pass‑Through Is in the Pipeline", "authors": "Jaison R. Abel, Mary Amiti, Richard Deitz, Sebastian Heise, Nick Montalbano", "venue": "报告", "url": "https://doi.org/10.59576/lse.20260708", "date": "2026-07-08", "abstract": "The past year brought dramatic changes to U.S. trade policy, including sweeping new tariffs, as well as a Supreme Court decision that further reshaped the tariff landscape. Many businesses saw their costs increase significantly and faced complex decisions about whether to absorb the tariffs through lower profit margins, raise their prices to recover the higher costs, or some combination of the two. Last year, we found that most businesses had passed on at least some of these higher costs to their customers through higher prices. Now, over a year later, have businesses finished adjusting prices, or do further tariff-induced price increases lie ahead? Our latest regional business surveys reveal that nearly half of firms that have paid tariffs still plan additional price increases to offset these costs, with some expecting to raise prices six months or more in the future.", "summary_zh": "基于区域企业调查，考察关税成本转嫁是否结束，发现近半企业仍计划未来提价。", "title_zh": "更多关税成本转嫁仍待发生", "abstract_zh": "过去一年给美国贸易政策带来了剧烈变化，包括全面实施的新关税，以及一项进一步重塑关税格局的最高法院裁决。许多企业发现其成本显著上升，并面临复杂抉择：是通过降低利润率来吸收关税，还是提高价格以收回更高成本，抑或采取两者某种组合。去年，我们发现大多数企业已通过提高价格将至少部分更高成本转嫁给客户。如今，一年多过去了，企业已经完成价格调整，还是未来还会有更多由关税引发的价格上涨？我们最新的地区企业调查显示，近一半已支付关税的企业仍计划进一步提价以抵消这些成本，其中一些企业预计将在未来六个月或更长时间内提价。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Mary Amiti", "work_type": "report", "doi": "10.59576/lse.20260708"}}, {"uid": "oa:W4400166753", "source": "scholar", "title": "Industrial Policy in the Global Semiconductor Sector", "authors": "Pinelopi Koujianou Goldberg, Réka Juhász, Nathaniel Lane, Giulia Lo Forte, Jeff Thurk", "venue": "CESifo", "url": "https://doi.org/10.65864/7t6d1j8rm7", "date": "2026-07-08", "abstract": "The resurgence of subsidies and industrial policy has raised concerns about their efficiency and compatibility with multilateral principles. Critics argue that such policies may divert resources toward less efficient firms and trigger retaliation by other countries, potentially generating a wasteful “subsidy race.” At the same time, subsidies may generate global benefits in sectors characterized by dynamic economies of scale and cross-border effects. Assessing these competing arguments requires accurate measurement of the policies governments actually pursue. This paper undertakes that task for the semiconductor industry – a key driver of economic growth and innovation, with potentially important dynamic economies of scale and strategic significance arising from its dual-use applications. We document and quantify recent industrial policies in the global semiconductor sector and examine the economic rationale underlying them. Combining historical analysis, natural language processing, and a model-based approach, we measure the extent and composition of government support across countries and over time. We find that government support has played an important role in the industry’s development, with subsidies constituting its predominant form. Although China provides substantial subsidies to its semiconductor sector, the scale of its support is not exceptional relative to that of other countries once differences in market size are taken into account.", "summary_zh": "结合历史分析、自然语言处理与模型量化全球半导体产业政策，发现补贴为主，中国补贴规模按市场规模调整后并不突出。", "title_zh": "全球半导体行业的产业政策", "abstract_zh": "补贴与产业政策的重新抬头引发了人们对其效率以及与多边原则兼容性的担忧。批评者认为，此类政策可能将资源导向效率较低的企业，并引发其他国家的报复，从而可能产生一种浪费性的“补贴竞赛”。与此同时，在具有动态规模经济和跨境效应的行业中，补贴可能产生全球性收益。评估这些相互竞争的观点，需要准确衡量各国政府实际推行的政策。本文针对半导体产业开展这一工作——半导体产业是经济增长和创新的关键驱动力，因其两用应用而可能具有重要的动态规模经济和战略意义。我们记录并量化全球半导体行业近期的产业政策，并考察其背后的经济逻辑。结合历史分析、自然语言处理和基于模型的方法，我们衡量了不同国家以及不同时期政府支持的程度和构成。我们发现，政府支持在该产业的发展中发挥了重要作用，其中补贴构成其主要形式。尽管中国为其半导体产业提供了大量补贴，但一旦考虑到市场规模差异，其支持规模相对于其他国家而言并不突出。", "tags": ["产业政策", "供应链", "贸易政策"], "extra": {"scholar_name": "Pinelopi Goldberg", "work_type": "report", "doi": "10.65864/7t6d1j8rm7"}}, {"uid": "oa:W3139942384", "source": "scholar", "title": "Heterogeneous Globalization: Offshoring and Reorganization", "authors": "Andrew B. Bernard, Teresa Fort, Valérie Smeets, Frederic Warzynski C", "venue": "CESifo", "url": "https://doi.org/10.65864/unupiqcab1", "date": "2026-07-08", "abstract": "This paper uses a unique offshoring survey to show that firms import the same goods they manufacture at home after they relocate production to low-wage countries. Instead of ceasing domestic production, offshorers produce higher-priced domestic varieties and increase both the shares and levels of their employment in innovation-related occupations. These responses highlight an under-explored aspect of globalization: the opportunity to offshore production of low-end varieties and focus domestic activities on the development, production, and marketing of high-quality or technologically advanced versions.", "summary_zh": "基于离岸外包调查，发现企业外迁低端生产后仍进口同类品，并转向高价位品种、增加创新岗位。", "title_zh": "异质性全球化：离岸外包与重组", "abstract_zh": "本文利用一项独特的离岸外包调查表明，企业在将生产转移至低工资国家后，会进口其在国内制造的相同商品。离岸外包企业并未停止国内生产，而是生产价格更高的国内品种，并提高其在创新相关职业中的就业份额和就业水平。这些反应突显了全球化一个尚未得到充分探讨的方面：将低端品种的生产离岸外包，并将国内活动集中于高质量或技术先进版本的开发、生产和营销的机会。", "tags": ["全球价值链", "企业异质性", "劳动力市场"], "extra": {"scholar_name": "Andrew Bernard", "work_type": "report", "doi": "10.65864/unupiqcab1"}}, {"uid": "oa:W7172272046", "source": "scholar", "title": "The Anatomy of Tariff Pass-Through into Consumer Prices", "authors": "Mary Amiti, Sebastian Heise, David E. Weinstein", "venue": "Staff reports", "url": "https://doi.org/10.3386/w35561", "date": "2026-07-01", "abstract": "Tariffs raise the prices of goods made at home, not just the imports they tax-an effect that standard pass-through estimates largely miss.Studying the 2025 U.S. tariffs, we find that about 26 percent of the tariff increase passes through to consumer prices.These estimates are measured relative to lessexposed goods and hold aggregate conditions fixed.The direct effect accounts for 64 percent of this increase, as tariffs raise the consumer prices of foreign varieties of a good.The remaining 36 percent arises indirectly-tariffs raise the cost of imported inputs used by U.S. producers, and domestic producers raise their markups because they face less competition from higher-priced imports.The direct effect passes through quickly, since tariffs raise import prices almost immediately, but the indirect effect takes nine to twelve months to work its way through supply chains.As a result, tariffs have a larger and more drawn-out impact on consumers than the direct effect alone would suggest.", "summary_zh": "研究2025年美国关税，发现约26%关税上涨传导至消费价格，直接效应占64%，间接效应经供应链耗时9至12个月。", "title_zh": "关税向消费者价格传导的机制剖析", "abstract_zh": "关税会提高国内生产的商品价格，而不仅是它们所征税的进口品价格——这一效应在很大程度上被标准的传导估计所遗漏。研究2025年美国关税，我们发现约26%的关税上调传导至消费者价格。这些估计是相对于暴露程度较低的商品衡量的，并保持总体条件不变。直接效应占这一增幅的64%，因为关税提高了某一商品外国品种的消费者价格。其余36%间接产生——关税提高了美国生产商使用的进口投入品成本，而国内生产商因来自价格更高进口品的竞争减弱而提高其加成率。直接效应传导迅速，因为关税几乎立即提高进口价格，但间接效应需要九到十二个月才能沿供应链逐步传导。因此，关税对消费者的影响比仅直接效应所显示的更大且持续时间更长。", "tags": ["关税", "贸易政策", "供应链"], "extra": {"scholar_name": "Mary Amiti", "work_type": "report", "doi": "10.3386/w35561"}}, {"uid": "oa:W7170672276", "source": "scholar", "title": "Industrial Policy and Trade Tensions in Strategic Sectors", "authors": "Lorenzo Rotunno, Michèle Ruta, Priyam Verma", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9798229053495.001", "date": "2026-07-01", "abstract": "This paper examines the global trade and welfare effects of industrial subsidies, employing a multi-country, multi-sector general equilibrium trade model with economies of scale. We first estimate the magnitude of industrial subsidies across countries relying on a novel approach that exploits information on subsidy counts during the period 2015-23. We then quantify the impact of the implied subsidy rates on trade flows and find that subsidies boost net exports in strategic sectors especially for China, while causing export declines in competing economies. Subsidies by the EU and the US produce qualitatively similar but smaller effects, as these economies target relatively more non-strategic sectors. A decomposition of the trade effects highlights the role of economies of scale and productivity changes in explaining sectoral specialization in response to subsidies. Tariff actions in 2018-19 and since 2025 partly offset these trade patterns. While targeting strategic sectors, recent subsidies and import tariffs lower global welfare by creating distortions and negative cross-border externalities.", "summary_zh": "本文构建多国多部门规模经济一般均衡模型，估计产业补贴并量化其贸易与福利效应，发现补贴扭曲出口且关税部分抵消但降低全球福利。", "title_zh": "战略部门的产业政策与贸易紧张", "abstract_zh": "本文考察产业补贴的全球贸易与福利效应，采用一个具有规模经济的多国、多部门一般均衡贸易模型。我们首先依赖一种新方法估计各国产业补贴的规模，该方法利用了2015—23年期间补贴项数的信息。然后，我们量化隐含补贴率对贸易流量的影响，并发现补贴促进了战略部门的净出口，尤其是对中国而言，同时在竞争经济体造成出口下降。欧盟和美国的补贴产生性质相似但较小的效应，因为这些经济体针对相对更多的非战略部门。对贸易效应的分解凸显了规模经济和生产率变化在解释部门专业化对补贴的响应中的作用。2018—19年以及2025年以来的关税行动部分抵消了这些贸易模式。近期补贴和进口关税虽然瞄准战略部门，却通过造成扭曲和负面的跨境外部性降低了全球福利。", "tags": ["产业政策", "贸易政策", "关税"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.5089/9798229053495.001"}}, {"uid": "oa:W7169590457", "source": "scholar", "title": "Tariff Pass-Through and Import Reallocation", "authors": "JaeBin Ahn, Lorenzo Rotunno, Michèle Ruta", "venue": "IMF Working Paper", "url": "https://doi.org/10.5089/9798229054171.001", "date": "2026-07-01", "abstract": "We study how U.S. tariff hikes in 2025 have transmitted to import prices. Consistent with recent evidence, we find that duty-exclusive import prices at the variety (country-product) level do not adjust to tariffs, implying full pass-through to duty-inclusive prices at the border. At the product level, however, duty-exclusive aggregate import prices decline significantly with tariff increases. We show that this product-level decline is driven by within-product reallocation toward lower-priced sources—stronger in products facing larger tariff hikes—and operates primarily through the entry of lower-priced varieties and the exit of higher-priced ones. Estimates of variety appeal indicate that part of this reallocation reflects shifts toward lower-quality varieties, a channel that is also present in the 2018–19 U.S.–China tariff episode. These reallocation effects carry implications for consumer welfare and productivity through the quality of imported goods and inputs.", "summary_zh": "研究美国2025年加征关税对进口价格的传导，发现产品内进口向低价来源再配置，并影响福利与生产率。", "title_zh": "关税传导与进口再配置", "abstract_zh": "我们研究2025年美国关税上调如何传导至进口价格。与近期证据一致，我们发现，在品种（国家-产品）层面，不含关税的进口价格不随关税调整，这意味着对边境含税价格存在完全传导。然而，在产品层面，不含关税的总进口价格随关税上升而显著下降。我们表明，这一产品层面的下降由产品内转向更低价格来源的再配置所驱动——在面临更大幅度关税上调的产品中更强——并且主要通过更低价格品种的进入和更高价格品种的退出而发挥作用。对品种吸引力的估计表明，这种再配置的一部分反映了转向更低质量品种，这一渠道在2018—19年美中关税事件中也存在。这些再配置效应通过进口商品和投入品的质量，对消费者福利和生产率产生影响。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Michele Ruta", "work_type": "article", "doi": "10.5089/9798229054171.001"}}, {"uid": "oa:W7169588120", "source": "scholar", "title": "Kinship in Crisis: Clan-Based Informal Institutions and Export Resilience in China", "authors": "Yongbing Chen, Jialin Du, Chaoqun Zhan, Muxuan Wei", "venue": "Academy of Management Proceedings", "url": "https://doi.org/10.5465/amproc.2026.350bp", "date": "2026-07-01", "abstract": "Global disruptions pose profound challenges to the continuity of firms’ international operations, underscoring the strategic importance of organizational resilience. We conceptualize export resilience as a firm’s capacity not only to withstand performance deterioration during a disruption (resistance) but also to restore export growth in its aftermath (recovery). Drawing on institutional theory, we theorize clan culture as a historically embedded informal institution that enhances both dimensions of export resilience by by mobilizing trust-based networks for collective action, informal financing, and knowledge sharing. We find that Chinese exporting firms headquartered in regions characterized by stronger clan cultures experience less severe export contractions during a major global disruption and achieve more robust post-disruption recoveries than firms located in less clan-oriented regions. These effects are particularly pronounced where formal institutions are weaker and among firms with stronger diaspora connections. This study advances international business research by demonstrating how locally embedded informal institutions shape firms’ capacity to navigate global crises; extends organizational resilience theory by identifying clan culture as a critical external, institutional driver of resilience; and enriches institutional theory by quantifying informal institutions and examining their interaction with formal institutional environments.", "summary_zh": "研究宗族文化如何通过信任网络等提升中国出口企业在全球冲击中的抵抗与恢复能力。", "title_zh": "危机中的宗族：宗族型非正式制度与中国出口韧性", "abstract_zh": "全球性冲击对企业的国际经营连续性构成严峻挑战，凸显了组织韧性的战略重要性。我们将出口韧性概念化为企业不仅能够在冲击期间抵御绩效恶化（抵抗力），而且能够在冲击后恢复出口增长（恢复力）的能力。基于制度理论，我们将宗族文化理论化为一种历史嵌入的非正式制度，它通过动员基于信任的网络来促进集体行动、非正规融资和知识共享，从而增强出口韧性的两个维度。我们发现，总部位于宗族文化较强地区的中国出口企业，在重大全球性冲击期间经历的出口收缩较不严重，并且在冲击后实现的恢复较位于宗族文化导向较弱地区的企业更为强劲。这些效应在正式制度较薄弱的地方以及侨民联系较强的企业中尤为显著。本研究通过展示地方嵌入的非正式制度如何塑造企业应对全球危机的能力，推进了国际商务研究；通过将宗族文化识别为韧性的关键外部制度驱动因素，拓展了组织韧性理论；并通过量化非正式制度及考察其与正式制度环境的互动，丰富了制度理论。", "tags": ["贸易弹性", "企业异质性", "其他"], "extra": {"scholar_name": "詹超群", "work_type": "conference-abstract", "doi": "10.5465/amproc.2026.350bp"}}, {"uid": "oa:W7168127881", "source": "scholar", "title": "Financial Sanctions and the Global Payments Network", "authors": "Gregor Matvos, Brent Neiman", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35453", "date": "2026-07-01", "abstract": "Financial sanctions are widely viewed as a powerful tool of economic statecraft, yet direct evidence on their effects remains limited.We study how sanctions affect access to global payment networks using data on correspondent banking relationships, which link banks across countries and currencies to enable cross-border transactions.We first show that the dollar and euro networks offer the broadest global connectivity, supported by a small number of key hubs in the U.S. and Europe.Sanctions that restrict access to these hubs are therefore potentially powerful.We then show how financial sanctions imposed during 2021-2025 -a period of rapid growth in sanctions -reduced targeted banks' access to major-currency networks by severing correspondent relationships.Sanctioned institutions often retained access but only through longer, indirect, and more fragile chains of intermediaries.Finally, in countries where sanctions expanded sharply, non-sanctioned banks also lost connectivity to Western networks, likely reflecting de-risking.These banks reoriented toward alternatives, particularly the Chinese yuan.Outside these heavily sanctioned economies, shifts away from the dollar and toward the yuan remain minimal on average.", "summary_zh": "利用代理行关系数据，研究金融制裁如何削弱目标银行接入全球支付网络并促其转向人民币。", "title_zh": "金融制裁与全球支付网络", "abstract_zh": "金融制裁被广泛视为经济治国方略的一种有力工具，但关于其效果的直接证据仍然有限。我们利用代理行关系数据研究制裁如何影响对全球支付网络的准入，代理行关系将不同国家和货币的银行连接起来以实现跨境交易。我们首先表明，美元网络和欧元网络提供最广泛的全球连通性，并得到美国少数关键枢纽的支撑。以及欧洲。限制进入这些枢纽的制裁因此可能具有强大效力。接着，我们说明2021-2025年——制裁快速增长的一段时期——实施的金融制裁如何通过切断代理行关系，减少了目标银行对主要货币网络的接入。受制裁机构往往保留了接入，但只能通过更长、更间接且更脆弱的中间机构链条。最后，在制裁急剧扩大的国家，未受制裁的银行也失去了与西方网络的连接，这可能反映了去风险化。这些银行转向替代选择，尤其是人民币。在这些受到严厉制裁的经济体之外，从美元转向人民币的转变平均而言仍然很小。", "tags": ["制裁", "其他"], "extra": {"scholar_name": "Brent Neiman", "work_type": "report", "doi": "10.3386/w35453", "versions": ["nber", "scholar"]}}, {"uid": "oa:W7167460166", "source": "scholar", "title": "International Trade in an Uncertain World", "authors": "Benny Kleinman, Ernest Liu, Stephen J. Redding, David Xu", "venue": "National Bureau of Economic Research", "url": "https://doi.org/10.3386/w35416", "date": "2026-07-01", "abstract": "We develop a tractable quantitative model of international trade in which agents make bilateral investments in resilience under general equilibrium uncertainty.Under both complete and incomplete financial markets, we show that these bilateral investments solve a portfolio problem of choosing trade partners.Countries' risk profiles become determinants of trade flows, income and welfare, whose first moments are affected by the second moments of productivity and trade costs.Changes in global economic uncertainty have heterogeneous effects across countries, depending on how they affect real hedging opportunities.The opening of trade can raise or reduce income volatility, but is revealed-preferred to autarky.", "summary_zh": "构建一般均衡不确定性下的贸易模型，考察双边韧性投资与贸易伙伴选择，发现风险轮廓影响贸易流与福利。", "title_zh": "不确定世界中的国际贸易", "abstract_zh": "我们构建了一个易于处理的国际贸易量化模型，其中经济主体在一般均衡不确定性下进行双边韧性投资。在完全金融市场和不完全金融市场下，我们表明，这些双边投资求解的是一个选择贸易伙伴的投资组合问题。国家的风险状况成为贸易流、收入和福利的决定因素，其一阶矩受到生产率和贸易成本二阶矩的影响。全球经济不确定性的变化对各国产生异质性影响，这取决于其如何影响实际对冲机会。贸易开放可能提高或降低收入波动性，但在显示性偏好意义上优于自给自足。", "tags": ["供应链", "方法论"], "extra": {"scholar_name": "Stephen Redding", "work_type": "report", "doi": "10.3386/w35416", "versions": ["nber"]}}, {"uid": "nber:w35560", "source": "nber", "title": "Long-Run Effects of H-1B Immigration on the U.S. Economy", "authors": "Ran Abramitzky, Leah Platt Boustan, Ahmet Gulek, Jens Hainmueller", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35560", "date": "2026-07-01", "abstract": "We study the effects of H-1B immigration on U.S. industries that employ H-1B workers and their trading partners. Using a novel cross-industry design and the 1999–2003 expansion of the H-1B visa cap for identification, we find that H-1B exposure raised incomes for natives and pre-existing immigrants, with gains concentrated in non-STEM occupations. Income gains propagate forward through supply chains to downstream industries but not backward to upstream industries, consistent with a productivity shock rather than a labor supply shock. We find no direct effect on patenting, suggesting that productivity gains arise from better task execution rather than patentable invention. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "利用H-1B配额扩张识别，发现H-1B暴露提高本土及既有移民收入，并沿供应链向下游传导。", "title_zh": "H-1B移民对美国经济的长期影响", "abstract_zh": "我们研究H-1B移民对美国雇用H-1B工人的行业及其贸易伙伴的影响。利用一种新颖的跨行业设计，并以1999–2003年H-1B签证配额的扩张作为识别，我们发现，H-1B暴露度提高了本土出生者和既有移民的收入，且收益集中于非STEM职业。收入增长沿供应链向前传导至下游产业，但不向后传导至上游产业，这与生产率冲击而非劳动供给冲击相一致。我们发现对专利活动没有直接影响，这表明生产率提升源于更好的任务执行，而非可专利的发明。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org无需额外费用下载本文。", "tags": ["供应链", "劳动力市场"], "extra": {"nber_id": "W35560", "keyword_hit": "supply chain"}}, {"uid": "nber:w35512", "source": "nber", "title": "The Environmental Costs of Sanctions: Flaring and Venting in Venezuela", "authors": "Michele Fioretti, Kavanaugh FitzPatrick, Alessandro Iaria", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35512", "date": "2026-07-01", "abstract": "Economic sanctions on oil-producing autocracies change not only the quantity of oil but also how it is produced.Combining field-level production data with satellite measurements of gas flaring and atmospheric methane across six Latin American countries from 2012 to 2024, we study the U.S. sanctions on Venezuela.Per-barrel gas flaring in Venezuela rose about two-and-a-half-fold even as production fell by two-thirds, a pattern no unsanctioned neighbor shows, so environmental damage under sanctions is about two and a half times what a proportional decline in output would predict.Three channels generate this gap: the exit of small, dirty fields (composition) is more than offset by surviving fields running their infrastructure past design capacity (strain) and cutting their operating budgets (maintenance).We identify strain from the response of satellitemeasured methane to the world price of naphtha, the imported diluent Venezuela's extraheavy crude requires, and maintenance from a November 2022 U.S. Treasury license that allowed only Chevron to resume operations at its Venezuelan fields.A similar pattern of rising per-barrel emissions despite falling output appears under the sanctions on Iran (after 2018).", "summary_zh": "结合油田产量与卫星排放数据研究美国对委内瑞拉制裁，发现产量降约三分之二而每桶放空燃烧升约2.5倍。", "title_zh": "制裁的环境成本：委内瑞拉的火炬燃烧与放空", "abstract_zh": "对产油威权政体的经济制裁不仅改变石油数量，也改变石油的生产方式。我们结合2012年至2024年六个拉丁美洲国家的油田级生产数据与卫星对天然气火炬燃烧和大气甲烷的测量，研究美国对委内瑞拉的制裁。即便产量下降了三分之二，委内瑞拉每桶石油的火炬燃烧量仍约为原来的2.5倍，而未受制裁的邻国均未出现这一模式，因此制裁下的环境损害约为产量按比例下降所预测水平的2.5倍。三个渠道造成这一差距：小型、高污染油田的退出（构成效应）被存续油田使基础设施超设计产能运行（压力效应）以及削减运营预算（维护效应）所抵消，且后两者的抵消作用超过前者。我们从卫星测得的甲烷对石脑油世界价格的响应中识别出压力效应，石脑油是委内瑞拉超重质原油所需的进口稀释剂；并从2022年11月美国财政部许可证只允许雪佛龙恢复其委内瑞拉油田的运营。尽管产量下降但每桶排放量上升的类似模式，在针对伊朗的制裁（2018年后）下也出现了。", "tags": ["制裁", "其他"], "extra": {"nber_id": "W35512", "keyword_hit": "sanctions"}}, {"uid": "nber:w35496", "source": "nber", "title": "Supply Chain Risk, Trade and Economic Fragility", "authors": "Juanma Castro-Vincenzi, Adry Gracio, Gaurav Khanna, Nitya Pandalai-Nayar", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35496", "date": "2026-07-01", "abstract": "We study how equilibrium patterns of production, trade, and input sourcing in complex supply chains are shaped by aggregate risk.We develop a quantitative multi-country model with multisourcing across stages.We show that sourcing shares equal an input's expected output elasticityits expected marginal contribution to output across states of the world.Risk has a positional effect on sourcing and welfare, operating through offsetting cross-stage complementarity and withinstage substitutability; which one dominates is a quantitative question.An increase in a country's own risk always lowers its welfare; risk elsewhere has ambiguous, sometimes positive, effects through relative prices.We also show analytically that risk attenuates comparative advantage, as countries shift sourcing away from their most productive suppliers.Quantifying the model for 50 countries and 3 production stages, we show that supply-chain complexity lowers volatility for the riskiest countries, and rising Chinese-origin risk reallocates production and lowers welfare unevenly across the chain.", "summary_zh": "构建多国多阶段模型研究供应链风险对生产、贸易与福利的影响，发现风险削弱比较优势并重配生产。", "title_zh": "供应链风险、贸易与经济脆弱性", "abstract_zh": "我们研究复杂供应链中生产、贸易和投入品采购的均衡模式如何由总体风险塑造。我们构建了一个具有跨阶段多源采购的定量多国模型。我们表明，采购份额等于某投入品的预期产出弹性，即其在各种世界状态下对产出的预期边际贡献。风险对采购和福利具有位置效应，其作用通过相互抵消的跨阶段互补性与阶段内替代性发挥；哪一者占主导是一个定量问题。一国自身风险的上升总是降低其福利；其他地方的风险通过相对价格产生不确定的、有时是正向的效应。我们还通过解析表明，风险会削弱比较优势，因为各国将采购从生产率最高的供应商处转移开。对50个国家和3个生产阶段进行模型量化后，我们表明供应链复杂性降低了风险最高国家的波动性，而中国来源风险的上升会在整条供应链上不均衡地重新配置生产并降低福利。", "tags": ["全球价值链", "供应链"], "extra": {"nber_id": "W35496", "keyword_hit": "supply chain"}}, {"uid": "nber:w35466", "source": "nber", "title": "What Do Asset Prices in April 2025 Say About Demand for the Dollar?", "authors": "Rohan Kekre, Moritz Lenel", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35466", "date": "2026-07-01", "abstract": "We interpret exchange rate and yield curve responses to the April 2, 2025 U.S. tariff announcement through the lens of an equilibrium model capturing the portfolio balance mechanism.Disciplined by price elasticities from QE announcements, a 3-12% decline in the demand for dollar bonds (relative to annual U.S. GDP) accounts for the dollar depreciation and rise in dollar yields during this episode.News of a gradual rebalancing out of dollar bonds is consistent with immediate price impact since asset prices are forward-looking.Lower dollar bond demand was accompanied by higher risk aversion, which explains the cross-section of responses across currencies.", "summary_zh": "本文用组合平衡模型解读2025年4月美国关税公告后的汇率与收益率反应，发现美元债券需求下降解释了美元贬值与收益率上升。", "title_zh": "2025年4月资产价格对美元需求意味着什么？", "abstract_zh": "我们通过一个刻画资产组合平衡机制的均衡模型，来解读汇率和收益率曲线对2025年4月2日美国关税公告的反应。以来自量化宽松公告的价格弹性为约束，美元债券需求（相对于美国年度GDP）下降3%至12%，解释了这一时期美元贬值和美元收益率上升。有关逐步从美元债券中再平衡流出的消息与即时价格影响相一致，因为资产价格是前瞻性的。美元债券需求下降伴随着风险厌恶上升，这解释了不同货币反应的横截面差异。", "tags": ["关税", "汇率"], "extra": {"nber_id": "W35466", "keyword_hit": "tariff"}}, {"uid": "nber:w35446", "source": "nber", "title": "The Uneven Impact of Industrial Zones on Formal Job Creation in Vietnam", "authors": "Brian McCaig, Margaret McMillan, Marina Mavungu Ngoma, Anh Pham", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35446", "date": "2026-07-01", "abstract": "Industrial zones are a widely used industrial policy tool, yet their effects vary enormously.Matching the timing and location of zone establishment to firm-level data in Vietnam, we estimate that a new zone raises formal employment by 2,000 workers within seven years.This average masks extreme skewness: a handful of zones generate the gains while the rest produce almost none.Zones near major trade hubs account for most of the effect, driven by export-oriented foreign manufacturers.Accounting for spillovers, domestic firms face agglomeration shadows nearby but gain farther out, while foreign manufacturers operate as enclaves, generating few local linkages.", "summary_zh": "匹配越南工业区设立时空与企业数据，发现新工业区七年内平均增2000正规岗位，但效应高度偏斜且集中于贸易枢纽。", "title_zh": "越南工业区对正规就业创造的不均衡影响", "abstract_zh": "工业园区是一种广泛使用的产业政策工具，但其效果差异巨大。将越南工业园区设立的时间与地点同企业层面数据进行匹配，我们估计，一个新园区会在七年内使正规就业增加2000名工人。这一平均值掩盖了极端的偏斜：少数园区产生了收益，而其余园区几乎未产生任何收益。靠近主要贸易枢纽的园区贡献了大部分效应，其驱动因素是出口导向型外国制造商。考虑溢出效应后，国内企业在附近面临集聚阴影，但在更远处获益，而外国制造商作为飞地运营，产生的本地联系很少。", "tags": ["产业政策", "劳动力市场", "其他"], "extra": {"nber_id": "W35446", "keyword_hit": "export"}}, {"uid": "nber:w35402", "source": "nber", "title": "Importing Aggregate Demand", "authors": "Chen Lian, D. A. Mukhin, Christian K. Wolf", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35402", "date": "2026-07-01", "abstract": "How exposed are open economies to global demand shocks? In equilibrium, foreign booms can be absorbed either by domestic consumption (\"quantities\") or by real exchange rate appreciation (\"prices\"). We show that failures of Ricardian equivalence and global financial market imperfections, two frictions popular in much recent work, have opposite effects on the split: while elevated marginal propensities to consume push towards quantities, financial frictions instead increase price adjustment. As the flexible-price equilibrium generally features a mix of quantity and price responses, policy needs to be contractionary to achieve flexible-price outcomes if the spending effect dominates, and vice-versa if financial frictions are severe. In our quantitative explorations the spending effect tends to win the race, necessitating aggressive domestic policy action. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "研究开放经济如何吸收外国需求冲击，发现消费倾向与金融摩擦对数量/价格调整作用相反，支出效应常占优。", "title_zh": "输入总需求", "abstract_zh": "开放经济对全球需求冲击的暴露程度有多大？在均衡中，国外繁荣既可以通过国内消费（“数量”）被吸收，也可以通过实际汇率升值（“价格”）被吸收。我们表明，李嘉图等价失效和全球金融市场不完美——近期大量文献中流行的两种摩擦——对上述分解具有相反影响：较高的边际消费倾向推动向数量调整，而金融摩擦反而增加价格调整。由于弹性价格均衡通常兼具数量反应与价格反应，如果支出效应占主导，则政策需要是紧缩性的才能实现弹性价格结果；反之，如果金融摩擦严重，则政策需要是扩张性的。在我们的定量考察中，支出效应往往在竞争中胜出，因而需要强有力的国内政策行动。NBER工作论文系列的机构订阅者以及发展中国家居民可在 www.nber.org 无需额外付费下载本文。", "tags": ["汇率", "其他"], "extra": {"nber_id": "W35402", "keyword_hit": "import"}}, {"uid": "nber:w35398", "source": "nber", "title": "The Pass-through of Tariffs and Exchange Rates", "authors": "Stéphane Auray A, Michael B. Devereux, Aurélien Eyquem", "venue": "NBER Working Paper", "url": "https://www.nber.org/papers/w35398", "date": "2026-07-01", "abstract": "This paper shows that the currency in which traded goods are invoiced has a first-order implication for the short-run impact of tariffs on the economy. If prices are set in terms of producer’s currency (PCP), a unilateral tariff is contractionary on impact, reducing GDP, and causing a deterioration in the trade balance. By contrast, with prices pre-set in buyers currency (LCP), the same tariff shock is expansionary, and improves the trade balance. The key difference between the two regimes lies in the differential exchange rate pass- through under PCP relative to LCP. In welfare terms however, the situation is reversed. A tariff under LCP leads to a fall in short-run welfare, as consumption and investment fall sharply, while the same tariff may be welfare enhancing under PCP. Under dollar currency pricing (DCP), we find results intermediate between the two invoicing regimes. With retaliation, the stark difference in pricing regimes is attenuated. Institutional subscribers to the NBER working paper series, and residents of developing countries may download this paper without additional charge at www.nber.org.", "summary_zh": "本文分析贸易品计价货币如何影响关税的短期效应，发现PCP下关税紧缩且恶化贸易余额，LCP下扩张且改善，福利效应相反。", "title_zh": "关税与汇率的传递效应", "abstract_zh": "本文表明，贸易品以何种货币计价，对关税对经济的短期影响具有一阶重要性。若价格以生产者货币设定（PCP），单边关税在冲击当期是收缩性的，会降低GDP，并导致贸易收支恶化。相反，若价格以买方货币预先设定（LCP），同样的关税冲击则是扩张性的，并会改善贸易收支。这两种制度的关键区别在于，PCP相对于LCP下的汇率传递不同。然而，从福利角度看，情况则相反。LCP下的关税会导致短期福利下降，因为消费和投资急剧下降，而同样的关税在PCP下可能提高福利。在美元货币定价（DCP）下，我们发现结果介于两种计价制度之间。若存在报复，定价制度之间的鲜明差异会被削弱。NBER工作论文系列的机构订阅者以及发展中国家居民可在www.nber.org免费下载本文。", "tags": ["关税", "汇率", "贸易政策"], "extra": {"nber_id": "W35398", "keyword_hit": "tariff"}}, {"uid": "oa:W7167847062", "source": "scholar", "title": "Tariff Confusion", "authors": "Kalina B. Manova, Dennis Novy, Thomas Sampson, Aaron Tang", "venue": "CESifo", "url": "https://doi.org/10.65864/rofnwa3dzu", "date": "2026-06-30", "abstract": "US trade policy in 2025 was unprecedented in the frequency, complexity and volatility of tariff announcements. We show that this environment reduced trade flows because of confusion over current tariffs. We build a new US Tariff Announcement Database for 2025 from presidential executive orders and proclamations. We calculate US statutory tariffs, and propose novel indicators of tariff confusion by country-product-month: number of relevant announcements, number of possible tariff calculations, and bounds on tariff miscalculation. Both tariff increases and tariff confusion reduced US imports during 2025, with confusion more than doubling the impact of tariffs. Moreover, tariff confusion was (i) persistent, and more damaging at higher tariff levels; (ii) mediated through lower import quantities, with little effect on import prices; and (iii) less detrimental for relationship-specific goods and origin countries with stronger trust in foreigners. Our results highlight previously unexplored consequences of the manner in which trade policy changes are implemented.", "summary_zh": "基于2025年美国关税公告数据库构建困惑指标，发现关税混乱显著抑制进口且影响超过关税本身。", "title_zh": "关税困惑", "abstract_zh": "2025年美国贸易政策在关税公告的频率、复杂性和波动性方面前所未有。我们表明，这种环境因对现行关税的困惑而减少了贸易流量。我们根据总统行政令和公告构建了一个新的2025年美国关税公告数据库。我们计算了美国法定关税，并提出了按国家—产品—月份衡量的关税混乱的新指标：相关公告数量、可能的关税计算方式数量，以及关税误算的边界。关税上调和关税混乱都减少了2025年美国进口，而关税混乱使关税的影响扩大了一倍以上。此外，关税混乱（i）具有持续性，且在更高关税水平下损害更大；（ii）通过更低的进口数量传导，对进口价格影响很小；（iii）对关系专用性商品以及对外国人信任更强的原产国而言不利影响较小。我们的结果凸显了贸易政策变化的实施方式所带来的此前未被探讨的后果。", "tags": ["关税", "贸易政策"], "extra": {"scholar_name": "Kalina Manova", "work_type": "report", "doi": "10.65864/rofnwa3dzu"}}, {"uid": "oa:W4410002065", "source": "scholar", "title": "Trade policy and its impact on limited partnership commitments in private equity", "authors": "Simon J. Evenett, Stefan Morkoetter, Jan Niclas Mueller, Tobias Schori", "venue": "Review of Corporate Finance", "url": "https://doi.org/10.1108/rcf-03-2025-0011", "date": "2026-06-27", "abstract": "We examine how US public pension funds’ capital allocation to foreign private equity markets is associated with trade policy changes. By studying commitments of limited partners to private equity funds, we isolate investor responses to trade policy changes and mitigate confounds often present in corporate foreign direct investments. Using a novel data set of 1,824 foreign fund-level investments made by 129 US public pension funds between 2009 and 2022, we link institutional capital allocation to trade distortions. Consistent with tariff-jumping behavior, US public pension fund commitments are lower when US protectionist trade distortions are higher, and higher when protectionist trade distortions in the recipient country are higher. We find limited evidence that industrial policies are associated with capital allocation decisions by US public pension funds.", "summary_zh": "基于美国公共养老金海外私募股权承诺数据，发现美国保护性贸易扭曲降低承诺，符合关税跳跃行为。", "title_zh": "贸易政策及其对私募股权有限合伙人承诺的影响", "abstract_zh": "我们考察美国公共养老基金对外国私募股权市场的资本配置如何与贸易政策变化相关联。通过研究有限合伙人对私募股权基金的承诺出资，我们分离出投资者对贸易政策变化的反应，并缓解企业对外直接投资中常存在的混杂因素。利用2009年至2022年间129家美国公共养老基金进行的1,824项境外基金层面投资的新颖数据集，我们将机构资本配置与贸易扭曲联系起来。与关税跳跃行为相一致，当美国保护主义贸易扭曲较高时，美国公共养老基金的承诺出资较低；当受资国保护主义贸易扭曲较高时，承诺出资较高。我们发现，产业政策与美国公共养老基金资本配置决策相关的证据有限。", "tags": ["贸易政策", "关税"], "extra": {"scholar_name": "Simon Evenett", "work_type": "article", "doi": "10.1108/rcf-03-2025-0011"}}, {"uid": "oa:W4413212132", "source": "scholar", "title": "Equity financing and exports: Evidence from IPO approvals in China", "authors": "Robin Kaiji Gong, Yao Amber Li, Stephen Teng Sun, Shang‐Jin Wei", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104292", "date": "2026-06-14", "abstract": "", "summary_zh": "基于中国IPO核准考察股权融资对出口的因果影响，发现IPO核准带来的股权融资促进企业出口。", "title_zh": "股权融资与出口：来自中国IPO核准的证据", "abstract_zh": "", "tags": ["企业异质性", "其他"], "extra": {"scholar_name": "魏尚进", "work_type": "article", "doi": "10.1016/j.jinteco.2026.104292", "versions": ["scholar"]}}, {"uid": "oa:W7164049601", "source": "scholar", "title": "Firm-to-firm financial linkages and dollar risk transmission", "authors": "Bryan Hardy, Felipe Saffie, Ina Simonovska", "venue": "Journal of Financial Economics", "url": "https://doi.org/10.1016/j.jfineco.2026.104311", "date": "2026-06-09", "abstract": "We study how U.S. dollar fluctuations transmit through domestic supply chains in emerging markets. Large firms borrow in foreign currency and extend trade credit to domestic partners, exposing the supply chain to exchange rate risk. We develop a model where financially constrained suppliers pass through shocks to buyers, while unconstrained firms absorb them. Using quarterly firm-level data from 19 emerging markets, we provide empirical evidence consistent with the model’s predictions. We find that even highly exposed firms reduce trade credit only modestly following a depreciation, while accepting large profit losses, suggesting that firm-to-firm credit relationships partially shield downstream firms from financial shocks.", "summary_zh": "研究美元波动经新兴市场国内供应链传导，构建模型并用19国企业数据验证，发现企业间信贷仅部分缓冲下游冲击。", "title_zh": "企业间金融关联与美元风险传导", "abstract_zh": "我们研究美元波动如何通过新兴市场的国内供应链传导。大型企业以外币借款，并向国内合作伙伴提供贸易信贷，使供应链暴露于汇率风险。我们构建了一个模型，其中受到融资约束的供应商将冲击传递给买方，而未受融资约束的企业则吸收冲击。我们使用来自19个新兴市场的季度企业层面数据，提供了与模型预测一致的实证证据。我们发现，即使是风险暴露程度很高的企业在货币贬值后也仅小幅减少贸易信贷，同时承受大幅利润损失，这表明企业间信贷关系在一定程度上使下游企业免受金融冲击。", "tags": ["供应链", "汇率", "企业异质性"], "extra": {"scholar_name": "Ina Simonovska", "work_type": "article", "doi": "10.1016/j.jfineco.2026.104311", "versions": ["scholar"]}}, {"uid": "oa:W3200618645", "source": "scholar", "title": "Firm Heterogeneity and Imperfect Competition in Global Production Networks", "authors": "Hanwei Huang, Kalina B. Manova, Oscar Perelló, Frank Pisch", "venue": "CESifo", "url": "https://doi.org/10.65864/cwg7uw48vx", "date": "2026-06-08", "abstract": "How do production networks and market structure interact to shape the effects of trade and competition policy? We develop a model with two-sided firm heterogeneity, matching frictions, and imperfect supplier competition. More productive buyers match with more suppliers, inducing tougher supplier competition, lower input costs, and higher profits. Entry upstream thus benefits high-productivity buyers, while lower trade or matching costs favor mid-productivity buyers. Empirical evidence confirms that larger French and Chilean firms import higher quantities at lower prices as more Chinese suppliers enter, and that suppliers charge diversified buyers lower markups. We adapt methods for combinatorial, discrete-choice problems to estimate the model and perform counterfactuals. The interaction of endogenous networks and markups significantly amplifies the gains from policies that facilitate supplier entry or firm matching, and from deep trade agreements that combine tariff cuts with such policies. Fixed networks dampen while fixed markups amplify the gains from traditional tariff liberalization.", "summary_zh": "构建含双向异质性、匹配摩擦与供应商竞争模型，发现内生网络与加成率互动显著放大贸易政策收益。", "title_zh": "全球生产网络中的企业异质性与不完全竞争", "abstract_zh": "生产网络与市场结构如何相互作用，从而塑造贸易与竞争政策的效果？我们构建了一个包含双边企业异质性、匹配摩擦和不完全供应商竞争的模型。生产率更高的买方会与更多供应商匹配，从而引发更激烈的供应商竞争、更低的投入成本和更高的利润。因此，上游进入有利于高生产率买方，而更低的贸易成本或匹配成本则有利于中等生产率买方。实证证据证实，随着更多中国供应商进入，规模较大的法国和智利企业以更低价格进口更大量，并且供应商对供应商多元化的买方收取更低的加成。我们调整用于组合离散选择问题的方法来估计模型并进行反事实分析。内生网络与加成的相互作用显著放大了促进供应商进入或企业匹配的政策的收益，以及将关税削减与此类政策相结合的深度贸易协定的收益。固定网络会削弱而固定加成会放大传统关税自由化的收益。", "tags": ["全球价值链", "供应链", "企业异质性"], "extra": {"scholar_name": "Kalina Manova", "work_type": "report", "doi": "10.65864/cwg7uw48vx"}}, {"uid": "oa:W7167825235", "source": "scholar", "title": "From Trade War to Green Transition: Optimal Electric Vehicle Tariffs with Revenue-Funded Subsidies", "authors": "Panle Jia, Jack Collison, Pinelopi Koujianou Goldberg, Shanjun Li, Yucheng Wang", "venue": "CESifo", "url": "https://doi.org/10.65864/gtlvqdh2cd", "date": "2026-06-05", "abstract": "We study the optimal design of trade and industrial policy when governments pursue environmental objectives alongside traditional welfare goals. Motivated by the global transition to electric vehicles (EVs) and growing concerns about competitiveness, energy security, and climate change, we develop a framework in which policymakers choose tariffs and domestic production subsidies to maximize welfare, defined as the sum of consumer surplus, domestic profits, environmental benefits, and tariff revenue. We combine a theoretical model of differentiated-product oligopoly with a structural demand model estimated using vehicle-level data from 13 countries that together account for the vast majority of global EV sales. Our central finding is that the optimal policy combines a moderate tariff on imported EVs with a subsidy to domestic EV production financed through tariff revenue. This policy substantially outperforms both outright protectionism and laissez-faire. Relative to current policies, it preserves consumer access to affordable EVs, accelerates fleet electrification, supports domestic producers, and remains budget-neutral. For the United States, the optimal policy more than doubles EV market share, generates over $45 billion in annual welfare gains, and avoids approximately 95 million tons of lifetime CO2 emissions. A key mechanism underlying these results is the pass-through of tariffs and subsidies to prices, which depends critically on demand curvature, product substitution, and market structure. More broadly, our results suggest that effective industrial policy requires careful attention to market structure and country-specific conditions, balancing consumer, producer, fiscal, and environmental objectives rather than adhering to ideological prescriptions.", "summary_zh": "构建寡头与结构需求模型研究电动汽车最优关税与补贴，发现适度关税加收入融资生产补贴优于保护主义和自由放任。", "title_zh": "从贸易战到绿色转型：收入融资补贴下的最优电动汽车关税", "abstract_zh": "我们研究当政府在传统福利目标之外还追求环境目标时，贸易与产业政策的最优设计。受全球向电动汽车（EVs）转型以及对竞争力、能源安全和气候变化日益增长的担忧启发，我们构建了一个框架，其中政策制定者选择关税和国内生产补贴以最大化福利，福利被定义为消费者剩余、国内利润、环境收益和关税收入之和。我们将一个差异化产品寡头垄断的理论模型与一个结构需求模型相结合，该需求模型使用来自13个国家的车辆层面数据估计，这些国家合计占全球电动汽车销量的绝大多数。我们的核心发现是，最优政策将对进口电动汽车征收适度关税与通过关税收入融资的国内电动汽车生产补贴相结合。该政策显著优于完全保护主义和自由放任。相对于当前政策，它保障消费者能够获得可负担的电动汽车，加速车队电动化，支持国内生产商，并保持预算中性。对美国而言，最优政策使电动汽车市场份额提高一倍以上，每年产生超过450亿美元的福利收益，并避免约9500万吨全生命周期二氧化碳排放。这些结果背后的一个关键机制是关税和补贴向价格的传导，而这关键取决于需求曲率、产品替代和市场结构。更广泛地说，我们的结果表明，有效的产业政策需要审慎关注市场结构和国别条件，在消费者、生产者、财政和环境目标之间取得平衡，而不是遵循意识形态化的政策处方。", "tags": ["关税", "贸易政策", "产业政策"], "extra": {"scholar_name": "Pinelopi Goldberg", "work_type": "report", "doi": "10.65864/gtlvqdh2cd", "versions": ["nber", "scholar"]}}, {"uid": "oa:W4411960135", "source": "scholar", "title": "How to grow an invoicing currency: Micro evidence from Argentina", "authors": "Felipe Benguria, Dennis Novy", "venue": "Journal of International Economics", "url": "https://doi.org/10.1016/j.jinteco.2026.104290", "date": "2026-06-05", "abstract": "How can a currency achieve more widespread international use? We study the internationalization of the Chinese renminbi (RMB) through the lens of a unique policy experiment in Argentina. In 2023, amid a severe dollar shortage, Argentina expanded a currency swap line with the People’s Bank of China. Within the next few months, the share of imports fro
